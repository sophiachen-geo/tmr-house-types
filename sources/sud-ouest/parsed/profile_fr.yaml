    title_fr: Le bâtiment résidentiel transformé en immeuble à vocation mixte
    description_fr: La transformation des rez-de-chaussée est particulièrement fréquente sur les bâtiments
      résidentiels situés aux intersections. La vitrine commerciale occupe alors une partie seulement
      de la façade principale ainsi qu’environ 2 mètres de la façade latérale. La composition du rez-de-chaussée
      commercial est similaire à celle du type de base. Le reste du rez-de-chaussée peut présenter des
      ouvertures qui ne sont généralement pas alignées verticalement à celles des étages supérieurs. Lorsque
