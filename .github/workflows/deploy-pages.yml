name: Publish website to GitHub Pages

# GitHub Pages for this repository serves the gh-pages branch. This workflow
# keeps that branch in sync with the generated site in docs/: every time the
# site changes on the main development branches, the new version is force-pushed
# to gh-pages as a fresh snapshot and Pages redeploys it automatically.
#
# docs/ is what `python build.py` writes. Until Part 6a this workflow published
# pages/ instead — the hand-written single-page Town of Mount Royal site the
# project started from — so the live site stayed at that first version while the
# repository grew to nine places. pages/ is kept as the historical original;
# nothing generates into it any more.

on:
  push:
    branches:
      - main
      - claude/website-responsive-github-pages-qnvdpq
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push docs/ to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
