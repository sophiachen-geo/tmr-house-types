summary_en: >-
  A village of 300 people in 1875 that doubled its population every fifteen years and was built out,
  almost entirely, between 1903 and 1930: homogeneous streets of semi-detached single-family houses
  and paired duplexes in the north and east, and detached "résidences cossues" climbing the mountain
  flank in every historicist and then every modern idiom of the century. Its planning control rests
  on a 2020 typo-morphological study that cut the territory into four landscape areas and
  twenty-nine landscape units, and on a 1992 inventory that graded every building.
