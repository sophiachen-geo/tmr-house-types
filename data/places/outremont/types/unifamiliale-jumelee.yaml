name_fr: Résidence unifamiliale jumelée
blurb_en: 'The house that built Outremont: paired, two storeys, brick, flat-roofed, with its own front door.'
origin_en: The dominant form of the 1903–1920 build-out. The 2005 evaluation reads the sector's homogeneity as
  an effect of speed — most of the stock went up inside seventeen years — and of a narrow palette of materials,
  not of a repeated plan; the houses vary stylistically while the street reads as one thing.
