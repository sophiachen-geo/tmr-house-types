blurb_en: The bourgeois house on the mountain flank, in whichever past the owner preferred.
origin_en: 'Édouard Gohier''s Northmount Land Company began subdividing the flank in 1906, and the 1920s and 1930s
  filled it. The 2005 evaluation makes no attempt to reduce the result to a type: it records a sampling of revival
  styles on lots whose shape the slope dictated. 728 avenue Pratt, néoclassique, 1937, is one documented example.'
