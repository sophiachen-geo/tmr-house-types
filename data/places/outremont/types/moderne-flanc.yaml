origin_en: 'Outremont''s modern houses have no separate district. The 2005 evaluation puts them inside the mountain
  sector''s list of styles, between the historicist revivals and the picturesque streets — which is a real statement
  about the place: the flank went on being built through the middle of the century without changing its plan, only
  its idiom.'
