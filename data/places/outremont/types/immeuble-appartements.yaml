name_en: Apartment building (conciergerie)
name_fr: Immeuble d'appartements — conciergerie
blurb_en: Three or four storeys of flats over the shops, and the reason avenue Bernard looks like one thing.
origin_en: The conciergerie is what avenue Bernard is made of. The 2005 evaluation attributes the street's harmony
  to a single fact — three-quarters of its buildings went up in the 1920s — and names the multi-family walk-up
  with commerce in the half-basement and ground floor as the dominant architectural type. The cinéma Outremont,
  given municipal heritage status in 2000 and since fully restored, stands on the same street.
