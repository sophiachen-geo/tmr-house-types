blurb_en: Two dwellings stacked, paired with the neighbour, both front doors on the ground.
origin_en: Outremont's version of the Montréal duplex, and the point where it separates from the Plateau's. The
  2005 text describes « des duplex jumelés aux accès indépendants » — the pairing is with the adjoining house
  and the second dwelling is reached from inside the front door, so the exterior stair that defines the Plateau
  plex is absent here. Both sit under the same canonical form; the difference is exactly what that page is for.
