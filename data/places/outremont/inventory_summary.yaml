title_en: The 1992 Bisson inventory
source: Ville de Montréal / arrondissement d'Outremont, « Patrimoine architectural de l'arrondissement
  Outremont — Fiches d'immeubles de l'inventaire Bisson », donnees.montreal.ca, licence CC BY 4.0.
note_en: Pierre-Richard Bisson's 1992 inventory graded Outremont's buildings; the open dataset publishes
  the two retained grades with a link to each building's fiche. The data reflect the state of knowledge
  in 1992 and have not been updated since. The 2025 column records which of them were retained in the
  agglomeration's pre-1940 heritage inventory, adopted 28 August 2025.
