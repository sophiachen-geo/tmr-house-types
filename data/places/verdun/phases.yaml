# Phases read out of chapter 2 (Historique) and §3.1 (Mise en situation) of the Évaluation du
# patrimoine urbain — arrondissement de Verdun (2005). The cahier dates the residential take-off to
# « au début du XXe siècle, après la mise en place de la digue », gives its own wave — « la vague de
# 1900 à 1920 » — in three separate sector fiches, and closes the build-out « à la fin des années
# 1950 ». The phase boundaries below follow those sentences; they are not a scheme the cahier prints.
