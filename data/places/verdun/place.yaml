id: verdun
name_en: Verdun (borough of Montréal)
name_fr: Arrondissement de Verdun
sections: [borough-vernacular]
region: Ville de Montréal
borough_of: montreal                       # borough since 1 January 2002
founded: 1875                              # village de la Rivière-Saint-Pierre 1 Jan 1875; renamed Verdun 1876; ville 1907; cité 1912; borough 2002 — see the date note in ## notes
settlement_mode: >-
  working-class city built behind a flood dike, on land that could not be developed until the river
  was held back; annexed to Montréal in 2002 after ninety-five years as a separate municipality
