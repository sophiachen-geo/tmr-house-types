typology_document:
  title: "Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Verdun (2005, ISBN 2-7647-0464-X)"
  year: 2005
  format: sector-characterisation
  note: >-
    The cahier characterises territory, not building types: it describes the fabric of each sector in
    a paragraph and publishes no per-type table, no five-column profile and no type codes. Every type
    record below is therefore assembled from sector paragraphs, and each carries a profile_note
    naming the sectors its columns were read out of. Verdun has no typo-morphological study of the
    kind Le Sud-Ouest, Gatineau or Outremont have; when one is produced it will supersede these
    records rather than supplement them.
map_layer: null
built_fabric_statistics:
  area_km2: 9.7
  area_note: >-
    9.7 km² is the figure carried in the Part 10 research memo. The fr.wikipedia infobox gives
    983 ha = 9.83 km². Both are printed rather than averaged; no municipal source giving a superficie
    was retrieved.
  dwellings_1946: 18000
  dwellings_1946_source: >-
    « Pendant la Seconde Guerre, de nombreux logements y sont construits et, en 1946, les 18 000
    logements disponibles sont occupés. » — Évaluation du patrimoine urbain, ch. 2 Historique.
  rank_1920s: >-
    « Ayant obtenu son statut de ville en 1909, Verdun, très densément peuplée, devient dans les
    années 1920 la troisième ville en importance au Québec, après Montréal et Québec. » — same
    chapter. The 1909 date is the cahier's own and disagrees with the municipal record; see ## notes.
  ile_des_soeurs_1968: >-
    « En 1968, plus de 800 unités de logement accueillent au-delà de 3 000 résidants sur l'île et,
    actuellement, plus de 13 000 personnes y vivent … tandis que l'ensemble de l'arrondissement
    compte environ 60 000 habitants. »
summary_en: >-
  A separate city for ninety-five years — ville from 1907, cité from 1912, borough of Montréal from
  2002 — built almost entirely between 1900 and 1960 on land that a dike had to make habitable first.
  Verdun was the third-largest city in Québec by the 1920s and by 1946 every one of its eighteen
  thousand dwellings was occupied. Its housing is plex from end to end: three-storey brick fronts
  with the stair climbing the outside in the north, two-storey duplexes with deep balconies and
  stained glass in the south, row duplexes after 1950. Two things interrupt that: Crawford Park, an
  award-winning National Housing Act subdivision of 1½-storey brick houses laid out against the grid,
  and île des Sœurs, planned with Mies van der Rohe, who left three residential slabs and a filling
  station on it.
