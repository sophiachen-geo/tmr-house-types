blurb_en: >-
  Three flats stacked behind a brick front, one to a floor, each reached by its own door and the upper
  two by a stair climbing the outside. Built through the 1900–1920 wave on lanes laid out in an H, it is
  what most of northern Verdun is made of, and the cahier disposes of it in five words: typically
  Montréal.
origin_en: >-
  Verdun's plex is the Montréal plex, arriving late and all at once. The 2005 cahier dates the fabric to
  « la vague de 1900 à 1920 » in three separate sector fiches and links it directly to the dike: residential
  development « prend son envol au début du XXe siècle, après la mise en place de la digue protégeant le
  territoire des fortes inondations printanières ». The mechanism that puts the stair outside is not
  explained here — for that see the shared explainer at /topics/escalier-exterieur/ and the Sud-Ouest
  synthèse, which traces it to the compulsory front setback. What Verdun adds is the counter-case: the
  cahier's fiche 21.I.7 records that south of avenue Desmarchais « il y a peu d'escaliers extérieurs, mais
  la présence des balcons avant s'affirme ». One borough, one form, and a line across it where the stair
  goes back indoors.
