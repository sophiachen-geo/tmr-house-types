profile:
  siting_landscape:
  - Dense continuous street frontage on lots of conventional width served by back lanes; 21.I.6 records
    lanes laid out in an "H" and lots of more restricted depth than the Montréal standard.
  - The 1900–1920 wave filled the ground the dike had made buildable, working outward from the water plant
    and Vieux-Verdun.
  massing:
  - Three storeys, one dwelling to a floor, flat roofed, with the stair to the upper doors climbing the
    outside of the building. 21.I.5 records the same form at two storeys as well.
  articulation:
  - Elaborate cornices and worked masonry detail; alcoves recessed into the façade composition rather than
    balconies projecting from it.
  - The cahier's verdict on the whole group is one sentence — « Ces constructions sont typiquement montréalaises. »
  openings:
  - Vertical windows carrying stained glass.
  materials:
  - Brick, with stone façades on a minority of buildings.
profile_fr:
  description:
  - « Constitué généralement d'immeubles de trois étages avec escalier extérieur pour l'accès aux étages,
    il s'est développé au cours de la vague de 1900 à 1920. On y observe surtout des bâtiments en brique
    avec des corniches élaborées et des détails de maçonnerie. Les fenêtres sont verticales et possèdent
    des vitraux. Les façades comportent souvent des alcôves dans la composition. Ces constructions sont
    typiquement montréalaises. » (21.I.2, le voisinage Nord)
  - « Principalement constitué d'immeubles de trois étages avec escalier extérieur pour l'accès aux étages,
    il s'est développé à partir du début du XXe siècle sur un lotissement de largeur conventionnelle mais
    de profondeur plus restreinte et comprenant des ruelles en « H ». Le secteur est dense; il s'agit en
    général de bâtiments en brique avec des corniches élaborées et des détails de maçonnerie. Quelques immeubles
    ont des façades de pierre. » (21.I.6, le secteur des Avenues)
  volumetrie:
  - « Le cadre bâti, assez hétérogène, est constitué d'immeubles de deux ou trois étages avec escalier extérieur
    pour l'accès aux étages; il s'est développé au cours de la vague de 1900 à 1920. » (21.I.5)
  implantation:
  - « … érigés sur des lots de largeur conventionnelle, assez profonds et dotés de ruelles. » (21.I.5)
  ouvertures:
  - « Les fenêtres sont verticales et comportent des vitraux. » (21.I.5, 21.I.6)
profile_note: >-
  The Évaluation is a sector characterisation, not a type table, so this record is assembled rather than
  transcribed. Every column is read out of three sector fiches that describe the same building in the same
  words — 21.I.2 (le voisinage Nord), 21.I.5 (le secteur Rielle et de Verdun) and 21.I.6 (le secteur des
  Avenues) — plus 21.I.1, which calls the same fabric « le cadre bâti le plus ancien de Verdun … d'une
  agréable uniformité ». All four are secteurs de valeur intéressante, so `sectors` is left null rather
  than pointing at an exceptional-value code the type does not belong to; the ten 21.I sectors are Part 10b.
  Lot width, setback and dwelling count are not given anywhere in the cahier and are left null; "triplex"
  is entered as the tenure plan because the fiches say three storeys with one access per storey, not because
  the document uses the word. The cahier never uses "plex", "duplex avec escalier extérieur" or "triplex"
  at all.
