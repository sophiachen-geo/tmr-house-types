profile:
  siting_landscape:
  - Free-standing on open ground, oriented so that views through to the river are kept open. Building tall
    is the means, not the end — the plan builds up in order to free ground for parks and community space.
  - Pedestrian and vehicle circulation separated; the shoreline developed as public space.
  massing:
  - Slab blocks. Three of them by Mies van der Rohe, at 100 and 200 rue De Gaspé and 201 rue Corot.
  articulation:
  - Not described by the cahier, which treats the sector as an urban-planning object and says so — « Ce sont
    ces éléments urbains qui caractérisent ce secteur. »
  openings: []
  materials: []
profile_fr:
  description:
  - « La planification urbaine de ce secteur de l'île des Sœurs a été élaborée en collaboration avec
    l'architecte de réputation internationale Ludwig Mies van der Rohe. On y retrouve aussi trois tours
    d'habitation de l'architecte ainsi que la station d'essence de la pétrolière Esso. Van der Rohe est
    aussi l'auteur, à Montréal, du complexe Westmount Square et du Centre Saidye Bronfman. » (21.E.6)
  implantation:
  - « La planification urbaine de l'île des Sœurs repose sur la construction en hauteur dégageant de plus
    grands espaces au sol (parcs, espaces communautaires, etc.), l'aménagement public de la berge, une
    séparation entre la circulation piétonne et la circulation automobile, et une orientation des bâtiments
    permettant les percées visuelles sur le fleuve. Ce sont ces éléments urbains qui caractérisent ce secteur. »
    (21.E.6)
  contexte:
  - « En 1956, l'île des Sœurs jusque là exclusivement agricole est définitivement annexée à la ville de
    Verdun. Les Sœurs de la Congrégation de Notre-Dame quittent les lieux. » (ch. 2, Historique)
  - « Les années 1960 transformeront l'île, jusqu'alors vouée à l'agriculture, en un vaste projet de
    développement urbain planifié. Sous l'influence de l'architecte Mies van de Rohe et d'urbanistes, une
    nouvelle ville sera planifiée selon des règles strictes dont l'influence est encore ressentie et dont
    l'esprit supporte les orientations actuelles. » (§3.1, Mise en situation — the source's own spelling
    « van de Rohe » is reproduced here and corrected everywhere else on this page)
profile_note: >-
  The thinnest record on this page, and deliberately so. The Évaluation characterises 21.E.6 as an
  urban-planning proposition and describes no building: it gives no storey count, no structural or cladding
  description, no dates and no dimensions for the three towers. Storeys, window proportion, openings and
  materials, garage and setbacks are therefore null or empty. `principal_cladding` is the one field entered
  from the photographs rather than from the text — continuous glazed bands with spandrel panels, visible in
  both — and should be read as observation, not source. What the cahier does
  give with certainty is identity and address, from its own list of immeubles de valeur patrimoniale
  exceptionnelle — « 201, rue Corot — Habitations multiples – Mies van der Rohe » and « 100 et 200, rue De
  Gaspé — Habitations multiples – Mies van der Rohe » — and those are recorded as example_addresses. The
  filling station at 201 rue Berlioz is in related_buildings, not here, because it is not housing.
