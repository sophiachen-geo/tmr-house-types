blurb_en: >-
  Three residential slabs on an island that was farmland until 1956, set on open ground so the river stays
  visible between them, in a plan Mies van der Rohe worked on. The evaluation ranks the sector exceptional
  for the plan rather than for the buildings, and describes no building at all.
origin_en: >-
  Île des Sœurs belonged to the Congrégation de Notre-Dame from 1769 and was farmed until the Sainte-Famille
  farm was abandoned in 1957; the island was annexed to the ville de Verdun in 1956 and the sisters left.
  What replaced the farm is the only planned town on this site laid out on modernist principles rather than
  garden-city ones — building tall in order to free the ground, the shoreline made public, pedestrians
  separated from cars, and the blocks turned so the river shows between them. The cahier is unusually
  candid that this, and not the architecture, is what it is protecting: « Ce sont ces éléments urbains qui
  caractérisent ce secteur. » It also records that the plan's authority outlasted its authors — « une
  nouvelle ville sera planifiée selon des règles strictes dont l'influence est encore ressentie et dont
  l'esprit supporte les orientations actuelles » — which is why the Pointe-Nord de l'Île-des-Sœurs is one of
  the three territories Verdun's PIIA singles out for review of new construction. Set this beside the
  Westmount modern tower and the Outremont apartment blocks: same decade, same idiom, three different
  reasons for being there.
