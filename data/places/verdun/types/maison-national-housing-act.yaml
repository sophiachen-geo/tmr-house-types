profile:
  siting_landscape:
  - Detached houses on individual lots, set back behind a planted front yard, on a street layout that
    abandons the city's orthogonal grid — the cahier's last sentence for the sector is « On abandonne ici
    la trame de rues orthogonale. »
  - The homogeneity of the siting mode and of the landscaping is named, alongside the buildings, as a reason
    the ensemble is of exceptional value.
  massing:
  - One and a half storeys throughout. Uniform heights and uniform roof pitches across the whole
    development.
  articulation:
  - Not described. The cahier's interest is in the ensemble, not the elevation, and it names no ornament,
    no porch and no door treatment.
  openings:
  - Not described.
  materials:
  - Brick cladding, uniform across the development. 21.I.10 records the same "War Time" typology elsewhere
    in the borough with brick and/or stone.
profile_fr:
  description:
  - « Quelques années avant la Seconde Guerre mondiale, le gouvernement promulgue le « National Housing Act ».
    De nouvelles typologies d'habitation prendront forme dans ce cadre, et plus particulièrement l'habitation
    unifamiliale de masse. Le voisinage Crawford offre un exemple exceptionnel de ce nouveau type d'intervention
    urbaine, constitué d'immeubles d'un étage et demi recouverts d'un parement de brique. Ces immeubles ont
    été construits sur la base de plans d'architecture primés. » (21.E.5, le voisinage Crawford)
  elements_caracteristiques:
  - « L'homogénéité des hauteurs, des matériaux, des pentes de toit, du mode d'implantation et du paysagement
    contribue à la qualité de l'ensemble. On abandonne ici la trame de rues orthogonale. » (21.E.5)
  contexte:
  - « Suivant les mêmes typologies que dans le secteur Crawford, ce projet urbain est aménagé autour d'un
    parc, mais cette fois, inscrit dans la trame de rues orthogonale de la ville. » (21.I.9, un projet
    « National Housing Act »)
  - « La typologie « War Time » dans un projet intégré décrite précédemment s'est aussi implantée dans ce
    secteur, sur des terrains lotis préalablement selon une trame conventionnelle. Les immeubles sont
    généralement de bonne facture, avec parement de brique et(ou) de pierre et toiture plate avec mansardes
    ou toit à pignon. » (21.I.10, le voisinage Sud)
profile_note: >-
  Assembled from sector paragraphs; the Évaluation publishes no type table. 21.E.5 gives storeys, cladding,
  roof-pitch uniformity, siting and street layout, and is the only place the cahier states the National
  Housing Act connection. 21.I.9 and 21.I.10 are quoted because they record the same house twice more in
  the borough and are what allow the roof form to be entered at all: 21.E.5 mentions « pentes de toit »
  without naming a form, and 21.I.10 says « toiture plate avec mansardes ou toit à pignon » of a mixed
  fabric that includes the War Time houses among others. `roof.form` is therefore entered as gabled with a
  null pitch, on 21.E.5's roof-pitch uniformity plus 21.I.10's « toit à pignon », and should be treated as
  the weakest field in this record. Articulation and openings are left empty rather than inferred from
  Wartime Housing Limited's standard plans, which the cahier does not cite. The « plans d'architecture
  primés » are not identified in the document and no architect is named; the Commons uploader of the
  photograph below attributes the Crawford Park layout to Samuel Gitterman at the NHA, which is not in any
  municipal source consulted here and is not asserted.
