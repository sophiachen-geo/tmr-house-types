blurb_en: >-
  A storey and a half, brick, detached on its own lot, one of several hundred built to the same handful of
  award-winning plans on streets that curve away from Verdun's grid. The 2005 evaluation ranks the result
  among the borough's seven sectors of exceptional value — for the ensemble, not for the house.
origin_en: >-
  Crawford Park is Verdun's one piece of planned suburb, and the cahier treats it as an event in the history
  of housing policy rather than as architecture: the federal National Housing Act « quelques années avant la
  Seconde Guerre mondiale » produced « de nouvelles typologies d'habitation … et plus particulièrement
  l'habitation unifamiliale de masse », and Crawford is « un exemple exceptionnel de ce nouveau type
  d'intervention urbaine ». What is exceptional, in the document's own reasoning, is uniformity plus the
  abandoned grid — heights, materials, roof pitches, siting and landscaping all held constant on curving
  streets, in a borough otherwise laid out in blocks. The same house recurs twice more in Verdun and the
  cahier separates the three occurrences by street plan alone: 21.I.9 puts it back on the orthogonal grid
  around a park, and 21.I.10 finds it dropped onto conventionally subdivided lots in the south. This is the
  same form as the Lévis wartime housing and the Sud-Ouest's maison de vétérans, and it is also the only
  house type anywhere on this site that a municipal fee schedule names: Verdun's 2020 tariff by-law sets a
  PIIA study fee reserved for enlarging the roof volume of a "wartime"-type house to add habitable space.
