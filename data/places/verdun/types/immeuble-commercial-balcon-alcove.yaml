blurb_en: >-
  Shops on the ground, flats above, three storeys, built flush to the lot line so there is nowhere for a
  balcony to project — so the balcony is cut back into the wall instead. The 2005 evaluation calls that
  alcove balcony an original typology, and it is the one thing in this document that is Verdun's own.
origin_en: >-
  Two streets meeting at right angles carry the whole of Verdun's commercial fabric: rue Wellington, its
  commercial axis end to end, and rue de l'Église, one of the two tracés fondateurs — the old chemin de la
  côte Saint-Paul — with the oldest shops in the borough. Both were built to the property line, which is
  where the interesting part comes from. The setback that pushed the stair outdoors in the residential
  streets does not exist here, so there is no room for a projecting balcony; the response was to hollow one
  out of the wall. The cahier states the causation plainly: « Les immeubles étant construits à la limite de
  la propriété, une typologie originale s'est développée pour doter les logements de balcons en alcôve. » It
  spread — fiche 21.I.5 finds the same section repeated on rue de Verdun. Both streets, together with the
  Pointe-Nord de l'Île-des-Sœurs, are the territory the borough's PIIA singles out for review of new
  construction, streetward enlargements and signage.
