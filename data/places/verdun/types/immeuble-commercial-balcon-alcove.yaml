profile:
  siting_landscape:
  - Built hard to the property line on both sides of the street, with no setback. Rue de l'Église is fifty
    feet wide, and the cahier says the result « projette une image très urbaine ».
  - Rue Wellington runs the length of the borough as its commercial axis; rue de l'Église is one of Verdun's
    two founding routes and carries its oldest commercial buildings.
  massing:
  - Three storeys generally — shops at ground level, dwellings above. Ground floors are at street level and
    entered without steps.
  articulation:
  - The commercial storey is separated from the residential storeys by an elaborate cornice.
  - Because there is no setback to project into, the balconies serving the upper dwellings are cut back into
    the wall plane instead. The cahier calls this « une typologie originale ».
  - On rue de l'Église the frontage is deliberately various — « une grande variété de caractéristiques,
    créant une composition éclectique » — and the façades are generally ornamented.
  openings:
  - Tall shopfront windows with a transom over.
  materials:
  - Brick, with worked stone inserted at lintels, jambs and sills; stone façades on rue de l'Église.
profile_fr:
  description:
  - « On y retrouve un ensemble de bâtiments généralement de trois étages, occupés au rez-de-chaussée par
    des commerces et aux étages par des logements. L'accès aux espaces commerciaux est de plain-pied. »
    (21.E.1B, la rue Wellington)
  traitement_des_facades:
  - « Les vitrines commerciales sont hautes et dotées d'un tympan, et l'étage commercial est démarqué des
    étages résidentiels par une corniche élaborée. Les immeubles étant construits à la limite de la propriété,
    une typologie originale s'est développée pour doter les logements de balcons en alcôve. » (21.E.1B)
  revetement:
  - « Les façades sont généralement en brique avec des insertions de pierre travaillée aux linteaux, jambages
    et allèges. » (21.E.1B)
  - « Les parements de façade sont la brique ou la pierre, et les façades sont généralement ornementées.
    La hauteur générale des bâtiments est de trois étages et les rez-de-chaussée sont au niveau du sol. »
    (21.E.1C, la rue de l'Église)
  contexte:
  - « La rue de Verdun reprend un peu la typologie commerciale de la rue Wellington, avec ses immeubles de
    trois étages, ses hautes vitrines de façade, ses corniches et ses balcons en alcôve aux étages supérieurs
    (résidentiels). » (21.I.5, le secteur Rielle et de Verdun)
profile_note: >-
  Assembled from sector paragraphs, not from a type table: the Évaluation publishes none. 21.E.1B supplies
  the massing, the articulation and the materials; 21.E.1C confirms the height, the ground-floor level and
  the cladding for the second street; 21.E.1A supplies the institutional context and is listed because the
  three lettered parts are one sector in the document. 21.I.5 is quoted as context because it records the
  same building repeated on a third street. The record is kept as residential (`is_residential` left at its
  default) because the cahier defines the type by what is above the shop — « aux étages par des logements » —
  and because the alcove balcony, the one feature the document calls an original Verdun typology, is a
  dwelling feature. No dwelling count, lot width or date is given anywhere in the cahier for this form and
  those fields are left null.
