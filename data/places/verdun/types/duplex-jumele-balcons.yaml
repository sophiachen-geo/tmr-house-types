blurb_en: >-
  Two storeys of brick, tall stained-glass windows in twos and threes, and a deep front balcony with
  carpentry worth describing — either two duplexes built as a pair or one building of three flats with the
  largest below. It is the form the 2005 evaluation twice calls exceptional, and the only Verdun housing it
  says that about.
origin_en: >-
  These are the two residential sectors Verdun's evaluation ranks as exceptional, and they sit in the
  southern half of the borough, where the cahier says the fabric changes: from avenue Desmarchais southward
  the space opens up, heights settle at two storeys, exterior stairs become few and the front balcony takes
  over. That is a genuine typological boundary inside one small borough, and the document draws it in a
  single sentence. What is protected at Desmarchais and Moffat is not a rare building but an unbroken one:
  21.E.3 is judged exceptional « en raison de sa grande uniformité de typologie et d'état de conservation »
  — the value is in the run, not the unit. Both sectors are inside the territory the 2019– PIIA modernisation
  brought under review.
