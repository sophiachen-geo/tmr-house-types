profile:
  siting_landscape:
  - Buildings paired two by two along the street; on avenue Desmarchais a broad landscaped median runs
    between the two frontages and, in the cahier's words, opens the atmosphere out.
  - Ground-floor level is held almost constant along the whole avenue, which is what produces the homogeneity
    the fiche singles out.
  massing:
  - Two storeys. Either two duplexes built as a semi-detached pair, or a single building of three dwellings
    in which the largest is on the ground floor.
  - Deep balconies across the front. The cahier records no exterior stair here.
  articulation:
  - Deep balconies with refined woodwork ("boiseries raffinées") adorning the façades — the phrase is repeated
    word for word in both sectors.
  - Elaborate cornices and masonry detail (21.I.7, for the same fabric continuing south).
  openings:
  - Tall vertical windows ornamented with stained glass, often combined in groups of two or three.
  materials:
  - Brick cladding.
profile_fr:
  description:
  - « De chaque côté, on trouve des habitations de deux étages de diverses typologies, notamment des ensembles
    de deux duplex jumelés ou à trois logements dont le plus vaste est au rez-de-chaussée. L'ensemble présente
    une belle homogénéité. Le niveau du rez-de-chaussée est sensiblement uniforme sur toute l'avenue. »
    (21.E.2, l'avenue Desmarchais)
  - « Ce secteur est exceptionnel en raison de sa grande uniformité de typologie et d'état de conservation.
    Les bâtiments sont, ici aussi, à parement de brique … » (21.E.3, le voisinage Moffat)
  revetement:
  - « Les bâtiments sont à parement de brique avec de hautes fenêtres verticales et ornées de vitraux, souvent
    combinées en groupes de deux ou trois. » (21.E.2; the same sentence recurs at 21.E.3 and 21.I.7)
  ornementation:
  - « Des balcons profonds aux boiseries raffinées ornent les façades. » (21.E.2, 21.E.3 and 21.I.7 — three
    times, unchanged)
  contexte:
  - « À partir de l'avenue Desmarchais, le cadre bâti prend une composition différentiée des développements
    précédents. En évoluant vers le sud, l'espace se dégage et la hauteur des bâtiments se généralise à deux
    étages. Il y a peu d'escaliers extérieurs, mais la présence des balcons avant s'affirme. » (21.I.7, le
    secteur Woodland et de Verdun)
profile_note: >-
  The Évaluation publishes no per-type table, so this record is assembled from sector paragraphs. Its two
  exceptional-value sectors, 21.E.2 avenue Desmarchais and 21.E.3 le voisinage Moffat, carry one building
  description between them: 21.E.3 is four lines long and describes the buildings only by back-reference,
  « ici aussi ». The columns are therefore filled from 21.E.2, checked against 21.E.3, and extended with
  21.I.7 (le secteur Woodland et de Verdun), whose fabric the cahier explicitly begins « à partir de l'avenue
  Desmarchais » and which repeats the balcony sentence verbatim. Dwelling count is deliberately left as the
  source has it — the fiche allows either two duplexes paired or one building of three dwellings, and gives
  no way to tell which is commoner — so the canonical link is to the plex family rather than to one of its
  seven children. Stair position is not stated in either E fiche; 21.I.7 says of the same fabric that
  exterior stairs are few, and that is recorded as context rather than promoted into the massing column.
