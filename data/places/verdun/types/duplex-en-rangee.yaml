blurb_en: >-
  Two flats stacked and built in a row, on the strip between the aqueduct canal and rue Bannantyne that was
  the last ground left. Post-1950, from a handful of repeated designs, and valued by the evaluation for the
  quality of what it was originally made of.
origin_en: >-
  Verdun ran out of land in the late 1950s — the cahier says the development « se poursuivra de façon
  constante pour atteindre les limites du territoire à la fin des années 1950 », after which « l'expansion
  se poursuivra alors sur le seul territoire encore vierge, l'île des Sœurs ». The voisinage Ouest is the
  end of that sequence on the mainland, and it shows the plex having quietly changed shape: no longer three
  storeys with a stair on the front, but two stacked dwellings repeated in a row from a short catalogue of
  models. Nothing about the transition is explained by the document, which is the honest state of the
  record; what it does say is that the value lies in the materials and in the harmony, and that where the
  original subdivision survived it produced public green space. Read alongside the exterior-stair plex of
  the 1900–1920 wave and the balcony duplex of the south, it completes the borough's three-stage plex
  sequence within one small territory.
