profile:
  siting_landscape:
  - In rows, on the last buildable ground in the borough — between the aqueduct canal and rue Bannantyne —
    filled in mainly after 1950.
  - Some blocks keep the shape of the original subdivision, and the cahier credits that shape with having
    forced public green space into the plan.
  massing:
  - Two dwellings stacked, built in a row rather than paired or free-standing. The cahier says the row
    works « quelques modèles originaux » — a small number of repeated designs.
  articulation: []
  openings: []
  materials:
  - The cahier's stated reason for the sector's interest is the quality of the original materials and the
    general harmony, not any particular feature.
profile_fr:
  description:
  - « Ce secteur situé entre le canal de l'aqueduc et la rue Bannantyne s'est construit principalement après
    1950. Ce sont majoritairement des duplex en rangée reprenant quelques modèles originaux. L'intérêt de
    ce secteur découle de la qualité des matériaux d'origine et de l'harmonie générale. Certains îlots
    bénéficient aussi de la morphologie des lotissements d'origine, qui ont entraîné la planification
    d'espaces verts publics. » (21.I.8, le voisinage Ouest)
  contexte:
  - « De l'Hôpital Douglas à la limite de la municipalité, on retrouve un cadre bâti assez hétérogène de
    basse densité. … Le secteur est essentiellement résidentiel (unifamilial ou bifamilial), avec des
    immeubles majoritairement détachés sur des terrains individuels. … Ce sont des constructions un peu plus
    récentes que celles du reste de l'arrondissement. » (21.I.10, le voisinage Sud)
profile_note: >-
  The most sparsely evidenced record on this page, and included because it closes Verdun's plex sequence
  rather than because the source says much. Everything comes from one four-sentence fiche, 21.I.8, which is
  a secteur de valeur intéressante — hence `sectors: null`, since the ten 21.I codes are not encoded in this
  part. That fiche gives the date, the row form, the dwelling count implied by "duplex", and a judgement
  about materials; it gives no storey count, no roof form, no cladding, no opening description and no
  ornament. `storeys: 2`, `roof.form: flat` and `principal_cladding` are entered from the word "duplex" and
  from the borough's uniform practice as the cahier describes it elsewhere, not from this fiche, and are
  the fields to distrust. Articulation and openings are left empty. The canonical link is to the plex family
  as a whole rather than to one of its seven children, because nothing in the source says where the stair
  to the upper dwelling is.
