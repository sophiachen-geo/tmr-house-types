# 39 heritage sectors (35 exceptional + 4 interesting). Codes and French names are
# transcribed from the fiche headings in the 2005 Évaluation du patrimoine urbain;
# the English summaries and street lists come from the Part 5 brief's transcription.
# Sectors whose summary_en is null still await a clean transcription of their fiche
# text (the fiches are two-column and the extraction bleeds between columns) — Part 5b.
- id: colline-westmount
  code: 23.E.1
  name_fr: La Colline Westmount
  value: exceptional
  summary_en: Summit and eastern south slope, largely vacant until 1895; 'de véritables châteaux' with panoramic views, built
    1900–1930; the Belvedere (c. 1930); a wooden house of c. 1890 at 22 Summit Circle.
  streets:
  - Summit Circle
  - The Boulevard
  source: Évaluation du patrimoine urbain — Westmount (2005), fiche 23.E.1
- id: sunnyside-edgehill
  code: 23.E.2
  name_fr: Sunnyside et Chemin Edgehill
  value: exceptional
  summary_en: Steep south-west slope; large prestige houses, traditional in style to the west, more modern toward Bellevue,
    Upper Bellevue and Summit Circle.
  streets:
  - Sunnyside
  - Edgehill
  - Bellevue
  source: Évaluation du patrimoine urbain — Westmount (2005), fiche 23.E.2
- id: ouest-de-la-montagne
  code: 23.E.3
  name_fr: L’ouest de la Montagne
  value: exceptional
  summary_en: Brick semi-detached flat-roofed houses south of The Boulevard; stone-and-stucco pitched-roof houses to the north;
    streets traced 1906–1930.
  streets:
  - The Boulevard
  source: Évaluation du patrimoine urbain — Westmount (2005), fiche 23.E.3
- id: douglas-grenville
  code: 23.E.4
  name_fr: Douglas et Grenville
  value: exceptional
  summary_en: Curvilinear streets laid out by the architect W. S. Wright on garden-city principles; brick semi-detached Arts
    and Crafts houses, mid-1920s.
  streets:
  - Douglas
  - Grenville
  source: Évaluation du patrimoine urbain — Westmount (2005), fiche 23.E.4
