summary_en: >-
  The bourgeois slope suburb of Montréal, grown over the Côte-Saint-Antoine farms between the 1870s
  and 1930 and controlled almost from the start: an Architectural Commission from 1916, a four-tier
  grading of every building, and 39 heritage sectors that follow the topography from the greystone
  rows of the flat lower town up through the plateau and the slope to the summit "châteaux". About
  4,750 dwellings, some 61 % of the stock, predate 1945. A National Historic Site since 2011 for
  "the diversity and the integrity of its components".
