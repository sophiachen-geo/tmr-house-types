- id: wm-bylaw-1305
  citation: >-
    Ville de Westmount, Codification administrative du Règlement 1305 sur les plans d'implantation et
    d'intégration architecturale, adopté le 12 novembre 2001, tel que modifié par les règlements RCA
    23020, 1381, 1399, 1412, 1432, 1454, 1495, 1526, 1548, 1574, 1606, 1640, 1647 et 1662; Annexe I
    (39 plans de secteurs patrimoniaux, septembre 2001), Annexe II (directives « Rénover et construire
    à Westmount », 11 livrets), Annexe III (Étude patrimoniale – Éléments caractéristiques : Bâtiments
    de catégorie 1*). Codification non officielle — la codification porte l'avertissement suivant :
    « Cette codification administrative n'a pas été adoptée officiellement par la Ville de Westmount…
    il faut se reporter au règlement original et à ses modifications. » Le PDF consolidé lui-même
    n'a pas été fourni à cette session : les articles, l'objet, les objectifs, les critères, le tableau
    des catégories et les livrets sont transcrits du mémoire Part 5 v2, qui en donne sa propre lecture.
  url: https://westmount.org/fr/travaux-et-urbanisme/construction-et-renovation/informations-generales-construction-renovation
  used_for: [instruments, grading, sectors, types, conservation]
