profile:
  siting_landscape:
  - Free-standing houses in their own grounds along the chemin de la Côte-Saint-Antoine (23.E.14) and at Rosemount
    (23.E.8), the 'berceau de Westmount' of about 1874, at low density and with deep setbacks.
