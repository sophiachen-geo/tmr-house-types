profile_note: Assembled from the sector fiches and the National Historic Site's character-defining elements; Westmount
  publishes no per-type table. Fields the sources do not speak to are left empty and nothing is taken from photographs
  — window and door detail in particular is governed case by case by the by-law's Directive 4 rather than stated
  per type.
blurb_en: 'The picturesque villas and country cottages of the slope, standing in their own grounds before the street
  grid reached them: Metcalfe Terrace (1840), Braemar and Riverview (1847).'
origin_en: The first houses built for pleasure rather than farming on the Côte-Saint-Antoine lands, whose rural
  antecedent — the Maison Hurtubise of 1739, classified in 2004 — still stands on the founding road. Braemar (1847,
  3219 The Boulevard) was recognised in 1984.
