profile_note: Assembled from the sector fiches and the National Historic Site's character-defining elements; Westmount
  publishes no per-type table. Fields the sources do not speak to are left empty and nothing is taken from photographs
  — window and door detail in particular is governed case by case by the by-law's Directive 4 rather than stated
  per type.
blurb_en: The paired brick house of the early twentieth century, flat-roofed and plain, filling the streets west
  of the mountain as the summit above filled with châteaux.
origin_en: Built as Westmount's middle slope was subdivided between 1906 and 1930; the 2005 fiche contrasts these
  flat-roofed brick pairs south of The Boulevard with the stone-and-stucco pitched-roof houses to the north.
