blurb_en: 'Westmount Square (Mies van der Rohe, 1967) and Place Alexis Nihon: the International Style arriving at
  the foot of the slope, on ground cleared of the greystone rows that stood there.'
origin_en: The 1960s rezoning that permitted them demolished blocks on Elm and Wood — the same row-house fabric
  that sectors 23.E.24 and 23.E.33 protect a few streets away.
