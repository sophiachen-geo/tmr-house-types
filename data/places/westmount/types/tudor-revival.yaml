profile:
  siting_landscape:
  - Around Park Place (sector 37), where the buildings on chemin Academy form one of the most coherent ensembles
    in the city for height, volume and style and « le style néo-Tudor, très populaire pendant l'entre-deux-guerres,
    se retrouve sur presque tous les bâtiments plus anciens ».
  - Saint-Sulpice and Ramezay (10), stone residences of about 1930 on gently curved garden-city roads; the City
    Hall precinct (19), where « entre 1910 et 1935, la pierre et le style néo-Tudor furent maintes fois utilisés
    pour les écoles, les églises et les édifices publics ».
  massing:
  - Norman (anglo-normand, form 2) and multi-gabled (form 4) roofs.
  - The sloped roofs — Norman/anglo-normand (2), gabled (3), multi-gabled (4), hipped or pavilion (6) and mansard
    (8) — are typical of the detached houses of Middle and Upper Westmount (Toitures).
  articulation:
  - '"The visual appeal of most Westmount buildings is further heightened by design elements such as entrances,
    porches and balconies, and by decorative woodwork — cornices, marquees, consoles and gingerbread (tarabiscotage)"
    (Murs extérieurs, § 2).'
  openings: []
  materials:
  - '"One of the traits that distinguishes Westmount''s buildings from those of most North American communities
    is that the exterior walls are masonry" — the city is almost entirely brick and stone, most often the grey stone
    of the local quarries and red brick made from the local clay (Murs extérieurs, § 2).'
  - Stone, stucco and half-timbering; slate.
profile_fr:
  materiaux:
  - Un des traits qui distingue les bâtiments de Westmount de ceux de la plupart des communautés d'Amérique du Nord
    vient du fait que les murs extérieurs sont en maçonnerie. Notre ville est presque entièrement composée de bâtiments
    de brique et de pierre, le plus souvent la pierre grise des carrières locales et la brique rouge fabriquée avec
    l'argile locale. L'attrait visuel de la plupart des bâtiments de Westmount est de plus rehaussé par des éléments
    de design comme des entrées, des porches et des balcons, de même que des boiseries décoratives (corniches, marquises,
    consoles et tarabiscotage).
  toiture:
  - 'Les toits en pente : anglo-normands (2), à pignon (3), à pignons multiples (4), en croupe (pavillon) (6) et
    mansarde (8) sont typiques des maisons détachées de Middle et Upper Westmount.'
conservation:
- 'Category I* — windows: the original windows must be kept and maintained; where they cannot be kept they must
  be replaced in the same material with the same details and divisions, and original wood windows must be replaced
  in wood. Doors: the original doors must be kept and maintained, and an original wood door facing the street or
  on a principal façade must be replaced by a wood door alike in every respect (tableau 4.2.2).'
- Category I — keeping and maintaining the original windows is recommended, as is replacing wood windows in wood;
  high-quality metal-clad wood windows may be acceptable provided the profile, details and divisions of the replacement
  are the same. The door rule is the same as for I*.
- Category II — as for I, and PVC or metal windows may be considered if they conform to the original in profile,
  proportions, details and the dimensions of frame, sash and muntins; doors in places other than the street and
  principal façades may be replaced in good-quality wood or metal of the same shape.
- Category III — replacement windows must harmonise with the style of the house; doors may be replaced in good-quality
  wood or metal.
- All categories — replacements must fit exactly within the existing openings and match the original in mode of
  operation (double-hung, casement), proportions, divisions, depth of inset into the wall and framing detail; surrounds,
  sill and lintel kept or matched. Double-hung windows that are in fact casements with a horizontal muntin are not
  acceptable, and sliding windows generally are not (§ 4.2.2). PVC is not acceptable on category I* or I, and PVC
  and metal are generally not acceptable on category II (§ 4.1.6).
- The front-door design of Westmount's older houses "usually includes a window inserted in a decorative frame and
  constitutes a defining characteristic" that must be kept or matched; glazed transoms are the older Westmount pattern
  (§ 4.2.2).
- New openings in masonry walls, and the alteration or removal of old ones, are generally not acceptable on façades
  that contribute to the character of category I and II buildings (§ 4.2.6).
- Identical restoration of original components is exempt from PIIA review (art. 3.1.3); anything else is not.
conservation_fr:
- 'Catégorie I* — Fenêtres : « On doit conserver et entretenir les fenêtres d''origine. Si l''on ne peut conserver
  les fenêtres d''origine, elles devront être remplacées par des fenêtres de même matériau, dont les détails et
  les divisions sont les mêmes. Les fenêtres d''origine en bois doivent être remplacées par des fenêtres de même
  matériau. » Portes : « On doit conserver et entretenir les portes d''origine. Les portes d''origine en bois qui
  font face à la rue ou qui se trouvent sur les façades principales doivent être remplacées par des portes en bois
  en tout point semblables. » (tableau 4.2.2)'
- Catégorie I — « On recommande de conserver et d'entretenir les fenêtres d'origine. On recommande aussi de remplacer
  les fenêtres en bois par des fenêtres de même matériau. Des fenêtres de haute qualité en bois recouvert de métal
  peuvent être acceptables pourvu que le profil, les détails et les divisions de la fenêtre de remplacement soient
  les mêmes. » (tableau 4.2.2)
- Catégorie II — comme la catégorie I, et « des fenêtres en PVC ou autre variations de PVC ou des fenêtres en métal
  qui sont conformes à l'original en ce qui concerne le profil, les proportions, les détails et la dimension du
  cadre, du châssis et des meneaux pourraient être considérées. Les portes situées dans d'autres endroits peuvent
  être remplacées par des portes de bois ou de métal de bonne qualité pourvu que la forme soit la même que celle
  de la porte d'origine. » (tableau 4.2.2)
- Catégorie III — « Les fenêtres de remplacement doivent s'harmoniser au style de la maison. Les portes peuvent
  être remplacées par des portes de bois ou de métal de bonne qualité. » (tableau 4.2.2)
- Toutes catégories — « Les éléments de remplacement devraient s'insérer exactement dans les ouvertures existantes
  et ressembler aux fenêtres d'origine quant à leur mode de fonctionnement (à guillotine, à battant), leurs proportions,
  leurs divisions, leur retrait du mur et les détails du cadre. Les éléments entourant les cadres, l'appui et le
  linteau devraient être conservés ou remplacés de façon à ressembler aux originaux. Des fenêtres à guillotine qui
  sont en fait des fenêtres à battante avec un meneau horizontal ne sont pas acceptables. Les fenêtres de style
  coulissant ne sont pas généralement pas acceptables. » (art. 4.2.2)
- « De façon générale, le design des portes d'entrée principale des bâtiments résidentiels de Westmount inclus une
  fenêtre insérée dans un cadre décoratif et constitue un trait distinctif qui doit être conservé ou remplacé de
  façon à ressembler à l'original. » (art. 4.2.2)
- « Les fenêtres en PVC ne sont pas acceptables sur des bâtiments de catégorie I* et de catégorie I. Les fenêtres
  en PVC et les fenêtres en métal ne sont généralement pas acceptables sur des bâtiments de catégorie II. » (art.
  4.1.6)
profile_note: Assembled from By-law 1305's guidelines, which are organised by work type rather than by house type,
  plus the 2005 sector fiches and the National Historic Site's character-defining elements; Westmount publishes
  no per-type table. The French in profile_fr and conservation_fr is verbatim source text, not translation. The
  « Portes et fenêtres » quotations were checked word for word against sources/westmount/directive4_portes_et_fenetres.pdf;
  the « Murs extérieurs » and « Toitures » quotations and the article numbers come from the Part 5 v2 brief's reading
  of the consolidated by-law, which was NOT supplied to this session and could not be re-checked here. The per-sector
  defining-trait lists live on the reverse of the 2001 fiches and are not in any document held — see Part 5b.
blurb_en: The interwar idiom Westmount chose for itself, domestic and civic alike — the City Hall of 1922 and Victoria
  Hall are Tudor Revival, and so are the houses around them.
origin_en: Neo-Tudor was the dominant interwar manner across anglophone Montréal; Westmount applied it to public
  buildings as well as houses, which is why the type reads as the town's signature. The same idiom names Mount Royal's
  English Manor House and Saint-Lambert's King Cottage.
