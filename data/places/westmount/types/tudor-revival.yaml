profile_note: Assembled from the sector fiches and the National Historic Site's character-defining elements; Westmount
  publishes no per-type table. Fields the sources do not speak to are left empty and nothing is taken from photographs
  — window and door detail in particular is governed case by case by the by-law's Directive 4 rather than stated
  per type.
blurb_en: The interwar idiom Westmount chose for itself, domestic and civic alike — the City Hall of 1922 and Victoria
  Hall are Tudor Revival, and so are the houses around them.
origin_en: Neo-Tudor was the dominant interwar manner across anglophone Montréal; Westmount applied it to public
  buildings as well as houses, which is why the type reads as the town's signature. The same idiom names Mount Royal's
  English Manor House and Saint-Lambert's King Cottage.
