profile_note: Assembled from the sector fiches and the National Historic Site's character-defining elements; Westmount
  publishes no per-type table. Fields the sources do not speak to are left empty and nothing is taken from photographs
  — window and door detail in particular is governed case by case by the by-law's Directive 4 rather than stated
  per type.
blurb_en: 'The garden-city enclaves: brick semi-detached houses on curving streets, built in the mid-1920s at Douglas
  and Grenville and at Priests'' Farm, which straddles the Montréal boundary.'
origin_en: The Garden City idea reaching Westmount a decade after it built Mount Royal, and in the same Arts and
  Crafts vocabulary — which is why this record and Mount Royal's Garden City House share a canonical form.
