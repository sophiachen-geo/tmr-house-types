profile:
  siting_landscape:
  - Douglas and Grenville (23.E.4), curvilinear streets laid out by the architect W. S. Wright on garden-city principles,
    mid-1920s; Priests' Farm (23.E.11), built 1926–1930 by L. E. Schlemm to plans by Shorey and Ritchie, « l'un
    des premiers projets canadiens à adopter les rues sinueuses ».
  massing:
  - Semi-detached houses; at Priests' Farm, flat roofs to the south and steep pitches to the north.
