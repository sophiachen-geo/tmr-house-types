blurb_en: The mansard-roofed house of the lower town, its dormered brisis carrying the storey that the flat-roofed
  row next door does without.
origin_en: The Second Empire fashion as it reached Westmount's speculative streets in the 1880s and 90s; the 2005
  fiche notes that in this sector the false mansard is more common than the plain parapet as a crown.
