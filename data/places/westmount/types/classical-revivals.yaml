profile_note: Assembled from the sector fiches and the National Historic Site's character-defining elements; Westmount
  publishes no per-type table. Fields the sources do not speak to are left empty and nothing is taken from photographs
  — window and door detail in particular is governed case by case by the by-law's Directive 4 rather than stated
  per type.
blurb_en: The summit houses — « de véritables châteaux » in the 2005 fiche's phrase — built between 1900 and 1930
  for the view, in whichever historicist idiom the owner and architect preferred.
origin_en: The summit opened after The Boulevard was linked to Montréal in 1895. Stonehurst and Stonehenge (4200
  and 4250 Sherbrooke West, 1928, J. J. Perrault and J. R. Gadbois) are the type's best-known pair.
