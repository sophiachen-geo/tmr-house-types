profile_note: Assembled from the sector fiches and the National Historic Site's character-defining elements; Westmount
  publishes no per-type table. Fields the sources do not speak to are left empty and nothing is taken from photographs
  — window and door detail in particular is governed case by case by the by-law's Directive 4 rather than stated
  per type.
blurb_en: 'The Montréal plex as Westmount rarely built it: three flats behind a greystone front, the upper two reached
  by a straight outside stair, on one street at the town''s northern edge.'
origin_en: The 2005 fiche is explicit that this is a borrowed form — « ce genre de construction typique de Montréal
  se retrouve rarement à Westmount » — which is why it is the cross-link between Westmount and the plex cities of
  the Plateau and Saint-Lambert.
