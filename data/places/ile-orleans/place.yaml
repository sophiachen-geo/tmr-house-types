summary_en: >-
  An island of six parishes strung along a single ring road, declared a heritage site in 1970 and
  farmed continuously since 1648 — about 95 % of it is still agricultural. Its housing is the
  clearest surviving sequence of the Québec rural canon anywhere: the low stone house of French
  inspiration with its steep eaveless roof; the neoclassical Québec house raised on a cellar with
  curved eaves reaching out over a gallery; the mansard; the Regency cottage of the Sainte-Pétronille
  villégiature; then the 20th-century American vernacular, cubique and Boomtown arriving by
  catalogue. The nineteen classed houses are its spine, and the cote A–E its working instrument.
