profile:
  siting_landscape:
  - '"Sur le territoire du site patrimonial de l''Île-d''Orléans, on retrouve quelques exemplaires de
    maisons Boomtown dans toutes les municipalités."'
  - 'Both a domestic and a commercial current: "il n''est pas rare de retrouver un commerce au rez-de-chaussée
    avec un logement à l''étage".'
  massing:
  - Cubic or rectangular two-storey volume, barely raised off the ground.
  - Flat roof, or a slight slope draining to the rear.
  articulation:
  - 'Ornament concentrated at the top of the façade: a modillon or console cornice, a stepped parapet,
    or brick patterning.'
  - Other ornament stays discreet — chambranles, planches cornières, brick platebandes.
  openings:
  - Regular distribution of openings, generally symmetrical.
  - Casement windows with large panes, casement with transom, or sash.
  materials:
  - Wood-plank or brick cladding.
  - Few projections beyond a gallery under an awning, sometimes with a balcony above on the central third.
profile_fr:
  elements_caracteristiques:
  - Volume cubique ou rectangulaire de deux étages, peu dégagé du sol
  - Toiture plate ou à faible pente vers l’arrière
  - Saillies peu présentes à l’exception d’une galerie protégée d’un auvent, parfois avec un balcon à
    l’étage
  - Parement de planches de bois ou de brique
  - Distribution régulière des ouvertures, composition généralement symétrique
  - Fenêtres à battants à grands carreaux, à battants avec imposte ou à guillotine
  - 'Ornementation concentrée dans la partie supérieure de la façade : corniche à modillons ou à consoles,
    parapet en gradins ou jeux de briques. Autres éléments d’ornementation discrets : chambranles, planches
    cornières, platebandes en brique, etc.'
  repartition:
  - Sur le territoire du site patrimonial de l'Île-d'Orléans, on retrouve quelques exemplaires de maisons
    Boomtown dans toutes les municipalités.
