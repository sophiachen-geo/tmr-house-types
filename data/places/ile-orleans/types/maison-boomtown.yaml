blurb_en: A flat-topped two-storey box that spends all its ornament in one place — the top of the front
  wall, where a bracketed cornice or a stepped parapet makes the building look taller and squarer than
  it is. Everything below that is plain boards or brick and a gallery.
origin_en: The balloon frame, "qualifiée d'American Boomtown", arrived with the fast growth of American
  cities and spread especially after the economic crisis of 1870 as a cheap, quick way to build in boom
  towns. In Québec it coexists with the traditional and mansard houses before supplanting them at the
  turn of the 20th century. On this island it never supplanted anything, but there are examples in all
  six municipalities.
