blurb_en: The bourgeois Paris roof, arriving in a Québec village as a way of getting a second full floor.
  What the inventory calls a "version populaire et modeste" of the monumental style keeps only the mansard
  itself — the shallow terrasson above, the near-vertical brisis below, dormers punched through it — and
  the silhouette that villagers evidently liked.
origin_en: 'Second Empire architecture takes its source from Paris under Napoléon III (1852–1870) and
  reaches Québec in the last quarter of the 19th century, at first for institutional buildings and bourgeois
  houses. The maison à mansarde is its domestic descendant: the roof survives, the avant-corps and the
  turret mostly do not. On this island it is common enough that the inventory calls the whole courant
  well represented.'
