profile:
  siting_landscape:
  - '"Ce courant est bien présent à l''île d''Orléans."'
  - 'A late arrival: Second Empire reaches Québec in the last quarter of the 19th century and only afterwards
    becomes a village house.'
  massing:
  - Rectangular two-storey body raised slightly off the ground, on a wood frame.
  - Broken roof à la Mansart, of two or four slopes, made of brisis and terrassons — the shape that empties
    the attic and turns it into a fully habitable second storey.
  articulation:
  - 'Ornament generally sober: chambranles, planches cornières and a cornice under the brisis.'
  - Richer variants take on a more eclectic decor. The inventory's showpiece is the ancien presbytère
    de Sainte-Famille, brick, "avec un parement de brique et une ornementation très élaborée".
  openings:
  - Symmetrical façade composition.
  - Casement windows with large panes or sash windows, and dormers set in the brisis.
  materials:
  - Wood-plank or brick cladding, sometimes cut stone.
  - Gallery under an independent awning on one or more elevations.
profile_fr:
  elements_caracteristiques:
  - Corps de logis rectangulaire à deux étages légèrement exhaussé du sol, charpente en bois
  - Toiture brisée, à la Mansart, à deux versants ou à quatre versants, constituée de brisis et de terrassons
    et recouverte de tôle traditionnelle
  - Composition symétrique de la façade
  - Galerie couverte d’un auvent indépendant sur une ou plusieurs façades
  - Parement de planches de bois ou de brique, parfois en pierre de taille
  - Ouvertures caractérisées par des fenêtres à battants à grands carreaux ou à guillotine et des lucarnes
    dans le brisis
  - Ornementation généralement sobre composée de chambranles, planches cornières et corniche sous le brisis.
    Les variantes plus cossues proposent des décors plus éclectiques.
  repartition:
  - Ce courant est bien présent à l’île d’Orléans.
