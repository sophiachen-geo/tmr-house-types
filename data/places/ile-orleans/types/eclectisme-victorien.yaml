blurb_en: The one courant on the island defined by refusing a rule. Plan asymmetrical, volume broken into
  projections, roof irregular and full of gables and turrets, several materials and colours at once, and
  no typical window. The inventory admits there are very few real examples here — mostly it is ordinary
  house types wearing an extraordinary decor.
origin_en: Québec architecture arrives at eclecticism toward the end of the 19th century, "un peu en réaction
  aux compositions rigides du classicisme", fusing borrowed elements from different periods and countries
  rather than reproducing any of them. Mechanised construction around 1880 made ornament cheap and fast,
  which is why façades carry so much of it. The movement runs roughly 1880–1920 in Québec and is called
  Victorian for Victoria's reign (1837–1901); for this current, "chaque œuvre est unique en soi".
