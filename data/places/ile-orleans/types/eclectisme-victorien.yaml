profile:
  siting_landscape:
  - '"Le site patrimonial de l''Île-d''Orléans comporte peu d''exemples architecturaux issus de l''éclectisme
    victorien."'
  - What survives is a handful of genuinely eclectic houses plus common types — maison cubique, maison
    traditionnelle québécoise — carrying a very elaborate Victorian decor.
  massing:
  - Asymmetrical plan with no typical plan at all; a very articulated volume with many projections and
    advances.
  - Irregular roofs made of gables or turrets, often pierced by dormers.
  articulation:
  - Galleries and ornamented covered balconies, often continuing across more than one elevation.
  - 'Varied ornament: neoclassical fronton, ornamental woodwork, mâts, épis, consoles, encorbellements.'
  openings:
  - No typical opening; several kinds of opening on one building, including bay windows (bow, oriel).
  materials:
  - Several materials and colours combined on a single building — brick, stone, decorative or polychrome
    shingle.
profile_fr:
  elements_caracteristiques:
  - Plan asymétrique (absence de plan typique), volume très articulé, nombreuses saillies et avancées
  - Toitures irrégulières, composées de pignons ou de tourelles, souvent percées de lucarnes
  - Présence de galeries, de balcons couverts et ornementés qui se prolongent souvent sur plus d’une façade
  - Amalgame de plusieurs matériaux et couleurs sur un même immeuble (brique, pierre, bardeaux décoratifs
    ou polychromes, etc.)
  - Absence d’ouvertures typiques, variété de types d’ouvertures sur un même bâtiment, présence de fenêtres
    en baie (bow window, oriel)
  - Ornements variés (fronton néoclassique, boiseries ornementales, mâts, épis, consoles, encorbellements,
    etc.).
  repartition:
  - Le site patrimonial de l'Île-d'Orléans comporte peu d’exemples architecturaux issus de l’éclectisme
    victorien.
