blurb_en: 'The island''s single modern house. The courant is a real one — free plan, flat or sculptural roof, concrete
  and steel, ribbon glazing, no ornament at all because the materials are the ornament — but on Île d''Orléans the
  inventory found exactly one example of it, and even that one is a ship: the maison Paul-Brunet at 37 chemin de l''Église,
  modelled on an ocean liner.'
origin_en: Born of the European modern movement (Art nouveau, the Bauhaus) and American rationalism (the Chicago School),
  modernism breaks with inherited form more completely than any style before it — practical and functionalist, sober,
  refusing ornament, and putting aluminium, concrete, steel and large sheets of glass at the front of the design.
  It divides into several currents more or less faithful to the movement that produced them. Almost none of that reached
  this island.
