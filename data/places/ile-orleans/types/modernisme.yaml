profile:
  siting_landscape:
  - '"À l''île d''Orléans, nous n''avons répertorié qu''une résidence issue de l''architecture moderne." One house,
    out of 659.'
  - 'The inventory names it: the maison Paul-Brunet, 37 chemin de l''Église, "témoigne de l''architecture moderne.
    Son architecture s''inspire notamment d''un paquebot."'
  massing:
  - Simple volume, stripped of ornament.
  - Free plans producing very varied forms.
  - Flat roofs, or roofs of sculptural form.
