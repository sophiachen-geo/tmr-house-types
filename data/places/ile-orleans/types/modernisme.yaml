profile_note: 'The one courant of the eleven with a known population of exactly one: the synthesis states « À l''île
  d''Orléans, nous n''avons répertorié qu''une résidence issue de l''architecture moderne. » The English columns above
  translate the five bullets on p. 46; there is no five-column table behind them beyond that. The brief provisionally
  filed this courant under the postwar slab-and-tower form pending the parse; the parse rules that out, since the
  island''s single example is a detached house. It carries the detached modern house form instead, added for it and
  for the other single-family modern records that had been filed under the slab.'
