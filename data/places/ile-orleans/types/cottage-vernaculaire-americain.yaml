profile:
  siting_landscape:
  - '"Ce courant est peu représenté dans le site patrimonial, mais il est présent dans la majorité des
    municipalités en quelques exemplaires."'
  - Elsewhere in Québec it is "le type le plus varié et le plus courant dans la première moitié du 20e
    siècle" — the island is the exception.
  massing:
  - Rectangular volume showing a simplification of form.
  - A 1½-storey plank carré under a straight two-slope roof at 45° or with half-hips; the two-storey low-pitch
    model is also widespread.
  - 'Sub-variants: the cottage with half-hipped roof and the cottage with a gable dormer, otherwise identical.'
  articulation:
  - 'Ornament drawn from the 19th-century repertoire but standardised and bought in: chambranles, planches
    cornières, aisseliers, frontons.'
  openings:
  - Machined doors and windows — casement with transom, or sash.
  materials:
  - 'Light claddings: wood boards, asbestos-cement shingle, roughcast.'
  - Gallery under an independent awning, often present.
profile_fr:
  elements_caracteristiques:
  - Volumétrie rectangulaire dénotant une simplification des formes
  - Carré en madriers de bois d’un étage et demi avec toiture à deux versants droit d’une inclinaison
    de 45 degrés ou à demi-croupes. Aussi, le modèle de deux étages à toit à 2 versants à faible pente
    est également répandu
  - Toiture généralement couverte de tôle traditionnelle
  - Galerie couverte d’un auvent indépendant souvent présente
  - Revêtements légers (planches de bois, bardeaux d’amiante-ciment, crépi)
  - Portes et fenêtres à battants avec imposte ou à guillotine, usinées
  - Éléments d’ornementation qui puisent aux répertoires de l’architecture du 19e siècle et qui sont standardisés
    (chambranles, planches cornières, aisseliers, frontons).
  repartition:
  - Ce courant est peu représenté dans le site patrimonial, mais il est présent dans la majorité des municipalités
    en quelques exemplaires.
