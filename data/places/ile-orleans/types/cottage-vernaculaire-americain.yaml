blurb_en: 'The traditional Québec house rebuilt out of a catalogue. The inventory is precise about the
  difference: this one rises to 1½ or 2 storeys instead of one and a half, which gives it more verticality,
  and its two straight slopes at 45° have no curved larmier. The symmetry survives; the carpentry does
  not.'
origin_en: 'American vernacular architecture, the inventory says, is not a style at all — "elle reprend
  souvent les formes du siècle précédent en les simplifiant". What is new is the supply chain: milled
  beams and boards, doors and windows standardised and sold by catalogue, and the balloon frame (charpente
  claire) that made building fast and let a standard plan be fitted to a client''s means. On this island
  the courant is thin, but it appears in nearly every municipality.'
