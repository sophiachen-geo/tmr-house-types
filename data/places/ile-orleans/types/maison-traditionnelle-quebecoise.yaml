profile:
  siting_landscape:
  - '"Très bien représentée à l''île d''Orléans" — the commonest house of the 19th century here.'
  - The plan de conservation credits it with shaping the identity of the village sectors, particularly
    Saint-Laurent and Saint-Jean.
  massing:
  - Generally 1½ storeys, sometimes 2½, on a pièce-sur-pièce wood carré — occasionally brick or stone
    — raised slightly off the ground, which is what produces the gallery and its steps.
  - Two-slope roof of about 45°, its larmiers incurvés carried well past the front and rear walls to shelter
    the gallery; where the slopes are straight, an independent lean-to roof (auvent, garde-soleil) does
    the same job.
  - A cuisine d'été sometimes extends the house longitudinally or transversally, repeating the main volume
    at reduced scale.
  articulation:
  - Ornament generally sober — chambranles and planches cornières.
  - 'Richer variants take on a more eclectic decor: aisseliers, corniches, balustrades, ornamental woodwork.'
  openings:
  - Symmetrical façade composition, with many openings.
  - Double-casement windows with large panes; fronton or gable dormers lighting the attic.
  materials:
  - Cladding usually wood — horizontal or vertical boards, or cedar shingle — but sometimes stone or brick
    masonry.
  - Chimney stacks generally in line with the gable wall.
profile_fr:
  elements_caracteristiques:
  - Volume généralement de 1 étage et demi, parfois de 2 étages et demi, formé d’un carré en bois pièce
    sur pièce (ou parfois en brique ou en pierre), le plus souvent légèrement exhaussé du sol, d’où la
    présence d’une galerie et d’un escalier
  - Toiture à deux versants à pente moyenne (environ 45 degrés) recouverte de tôle traditionnelle ou de
    bardeaux de cèdre qui se prolonge souvent au-delà des murs avant et arrière grâce à des larmiers incurvés
    protégeant ainsi une galerie aménagée en façade
  - Composition symétrique de la façade
  - Toit indépendant en apprentis - aussi appelé auvent ou garde soleil - installé afin de recouvrir la
    galerie lorsque les versants de la toiture sont droits
  - Cuisine d'été parfois présente dans le prolongement longitudinal ou transversal de la maison et reproduisant
    à plus petite échelle les caractéristiques du corps de logis principal
  - Parement généralement en bois (planches de bois posées à l'horizontale ou à la verticale ainsi que
    le bardeau de cèdre), mais parfois en maçonnerie de pierre ou de brique
  - Souches de cheminée généralement dans le prolongement du mur pignon
  - Ouvertures nombreuses, dont des fenêtres à double battant à grands carreaux
  - Lucarnes à fronton ou à pignon permettant d'éclairer les combles
  - Ornementation généralement sobre composée de chambranles et planches cornières. Les variantes plus
    cossues proposent des décors plus éclectiques (aisseliers, corniches, balustrades, boiseries ornementales,
    etc.).
  repartition:
  - La maison traditionnelle québécoise d'influence néoclassique est très bien représentée à l’île d’Orléans.
