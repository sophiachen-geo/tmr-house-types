blurb_en: 'The synthesis of French practice and English neoclassicism, and the island''s most numerous
  19th-century house: a low wooden carré lifted just enough off the ground to need a gallery and steps,
  under a roof whose eaves curve outward to cover them. The summer kitchen trailing off one end is part
  of the type, not an afterthought.'
origin_en: The Conquest of 1760 changed the buildings slowly. Tradesmen stayed and French practice held
  for decades; English classical architecture arrived early in the 19th century with military engineers,
  British architects and pattern books, and the two produced what the inventory calls "une synthèse originale
  connue sous le nom de maison traditionnelle québécoise". Its variants run from a bare rural carré to
  an ornamented village house, according to site and to the owner's standing.
