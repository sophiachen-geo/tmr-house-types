profile:
  siting_landscape:
  - '"La maison cubique est assez peu représentée dans le site patrimonial de l''Île-d''Orléans."'
  - 'A rural echo of an urban phenomenon: standardisation drove growth in the towns first, "ce phénomène
    se répercutera ensuite dans les milieux ruraux".'
  massing:
  - Cubic volume on a square plan of two full storeys, raised slightly off the ground.
  - Low-pitch pavilion (four-slope) roof, sometimes flat; usually a dormer on the front slope.
  articulation:
  - '"Ornementation variable selon le statut social du propriétaire" — the one type whose decoration the
    inventory ties explicitly to the owner''s standing.'
  - 'Picturesque influences show up on some models: aisseliers, ornamental woodwork, cornices.'
  openings:
  - Regular distribution of openings.
  - Casement windows with large panes, casement with transom, or sash; hipped, gable, triangular or lean-to
    dormers, sometimes replaced by gables.
  materials:
  - 'Brick, or light cladding: wood boards, cedar shingle, embossed tin, asbestos-cement tile.'
  - Gallery under an independent awning across the front, sometimes with a balcony above.
profile_fr:
  elements_caracteristiques:
  - Volumétrie cubique, plan carré de deux étages légèrement surhaussé du sol
  - Toit en pavillon (quatre versants) à faibles pentes, revêtu de tôle traditionnelle, ou parfois toit
    plat
  - Revêtement extérieur en brique ou en matériau léger (planches de bois, bardeaux de cèdre, tôle embossée,
    tuiles d’amiante-ciment)
  - Galerie couverte d’un auvent indépendant, aménagée en façade avant avec parfois un balcon à l’étage
  - Distribution régulière des ouvertures
  - Fenêtres à battants à grands carreaux, à battants avec imposte ou à guillotine
  - Lucarnes à croupe, à pignon, triangulaire ou en appentis, parfois remplacées par des pignons
  - Ornementation variable selon le statut social du propriétaire.
  repartition:
  - La maison cubique est assez peu représentée dans le site patrimonial de l’Île-d’Orléans.
