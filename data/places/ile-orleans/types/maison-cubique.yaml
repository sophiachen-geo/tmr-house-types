blurb_en: 'Two entire floors under a shallow pavilion roof, on a square plan — a shape whose whole point
  is interior volume. The inventory says as much: its interest "réside dans les dimensions de son espace
  habitable", giving an ordinary family the room of a bourgeois house. How much ornament it carries depended
  on who was paying.'
origin_en: An American model, "conçu par l'architecte Frank Kidder en 1891" and commonly called the Four
  Square house, spread through catalogues and trade journals across North America. It reached Québec's
  towns on the back of cheap standardised materials and falling construction costs, then reached the countryside.
  On Île d'Orléans it stayed rare.
