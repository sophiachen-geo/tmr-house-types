blurb_en: 'A 1930s house built to look like a 1730s one. Québec''s own version of Arts and Crafts went
  back to the buildings of the French regime for its vocabulary — high shingled roof, fire-break gable
  walls, stone or stucco standing in for lime — and copied them as faithfully as it could. On this island
  the results sit among the resort houses at Sainte-Pétronille, and the inventory dates the individual
  examples: 1939, 1940, 1944, 1945.'
origin_en: '"Le Québec possède une version du courant Arts and Crafts qui lui est propre, soit le régionalisme
  québécois", running from 1910 to the end of the Second World War. It began in the research of the McGill
  architecture professors Percy Erskine Nobbs and Ramsay Traquair, who wanted an authentically regional
  style, and spread through their students. It fed on the identity politics of the 1920s onward, which
  glorified New France, and found fertile ground under Duplessis; Gérard Morisset, the abbé Jean-Thomas
  Nadeau and Marius Barbeau argued for the same rediscovery of tradition.'
