profile:
  siting_landscape:
  - '"Relativement rare dans le site patrimonial de l''Île-d''Orléans et particulièrement présent dans
    la municipalité de Sainte-Pétronille."'
  - 'Meant for a large wooded lot: "le cottage Régence arbore une architecture en communion avec son environnement".'
  massing:
  - Plan tending toward a square; one or two occupied levels.
  - Low, wide four-slope roof whose eaves are sometimes upturned and are carried out far enough to roof
    a gallery running right round the house.
  articulation:
  - Sober ornament drawn from the classical repertoire — entablements and frontons.
  - Trellis gallery supports are frequent.
  openings:
  - Symmetrical composition of the openings.
  - Casement windows with large panes, sometimes as French doors; rampantes, hipped or gable dormers.
  materials:
  - Walls of brick, stone or wood.
  - Central chimney.
profile_fr:
  elements_caracteristiques:
  - Plan de forme plutôt carrée
  - Toit à quatre versants à profil bas et étendu dont l'avant-toit est parfois recourbé; revêtement de
    toiture en bardeau de cèdre ou en tôle traditionelle
  - Un ou deux niveaux d'occupation
  - Composition symétrique des ouvertures
  - Bâtiment entouré d'une galerie protégée par les avants-toits
  - Murs revêtus de brique, de pierre ou de bois
  - Cheminée centrale
  - Fenêtres habituellement à battants et à grands carreaux, parfois sous la forme de portes-fenêtres
  - Lucarnes rampantes, à croupe ou à pignon
  - Ornementation sobre insipirée des éléments classiques comme les entablements et les frontons.
  repartition:
  - Ce type d’architecture demeure relativement rare dans le site patrimonial de l'Île-d'Orléans et particulièrement
    présent dans la municipalité de Sainte-Pétronille.
