blurb_en: 'The villégiature house of the British in Québec, and on this island almost entirely a Sainte-Pétronille
  phenomenon: a squarish block under a low, wide, sometimes upturned hipped roof whose eaves keep going
  until they have covered a veranda all the way around. French doors open onto it.'
origin_en: 'A Regency-period English form — "apparu en Angleterre sous le règne du Prince de Galles au
  début du 19e siècle" — introduced to Québec by the British and taken up by townspeople who wanted a
  summer house. It belongs to the romantic current, and it is the type most tightly bound to one of the
  island''s five landscape units: the villégiature sector that grew at Sainte-Pétronille after the Québec
  ferry began running in 1855.'
