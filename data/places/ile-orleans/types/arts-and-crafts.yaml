blurb_en: 'A house that breaks into wings and sheltered outdoor rooms under big overhanging roofs, with
  the structure itself doing the decorating — half-timbering, rafter ends carried out beyond the eaves,
  worked gallery posts. The inventory declines to generalise further, and says so: every case is its own.'
origin_en: 'The English Arts and Crafts movement, rooted in Morris and Ruskin, argued for handwork, traditional
  materials and local skill against mass production. Crossing to the United States it lost the argument
  and kept the look: "en Amérique, le mouvement Arts and Crafts devient essentiellement un mouvement stylistique,
  sans portée sociale" — false half-timbering and slate roofs belonging to no local tradition, distributed
  by catalogue. On this island it is a Sainte-Pétronille resort style, and its best examples are the house
  and studio of the painter Horatio Walker.'
