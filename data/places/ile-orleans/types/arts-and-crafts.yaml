profile:
  siting_landscape:
  - '"Il existe peu d''exemples de ce style dans le site patrimonial de l''Île-d''Orléans et ils sont
    principalement situés à Sainte-Pétronille."'
  - The inventory restricts the current to domestic and villégiature architecture only.
  massing:
  - A more or less imposing volume on an articulated plan — simple volumes distributed freely.
  - Roofs of varied form, with slopes or half-hips sometimes of unequal length, the larmier often projecting
    well past the façades.
  articulation:
  - 'Ornament often limited to members of the frame: colombage, exposed rafters, gallery supports.'
  - '"Chaque cas est unique et possède ses propres caractéristiques."'
  openings:
  - Numerous and varied openings, with paired windows and hipped, lean-to or triangular dormers.
  materials:
  - Natural and traditional materials — stone, brick, stucco, cedar shingle, wood boards — sometimes combined.
  - 'Sheltered outdoor spaces: perrons, galleries, terraces.'
profile_fr:
  elements_caracteristiques:
  - Volume plus ou moins imposant au plan articulé
  - Toiture de formes variées à versants ou à demi-croupes parfois de longueurs inégales, dont le larmier
    déborde souvent largement des façades
  - Espaces extérieurs protégés (perrons, galeries, terrasses)
  - Utilisation de matériaux naturels et traditionnels (pierre, brique, stuc, bardeaux de cèdre, planches
    de bois), parfois combinés entre eux
  - Ouvertures nombreuses et diversifées, présence de fenêtres jumelées et de lucarne à croupe, en appentis
    ou triangulaire
  - Ornements souvent limités aux éléments de la charpente (colombage, chevrons apparents, supports de
    galerie)
  - Chaque cas est unique et possède ses propres caractéristiques.
  repartition:
  - Il existe peu d’exemples de ce style dans le site patrimonial de l'Île-d'Orléans et ils sont principalement
    situés à Sainte-Pétronille.
