blurb_en: 'The island''s founding house and still its commonest old one: a low stone box with barely any
  foundation, its walls battered slightly inward, a single massive chimney at the centre, and a roof so
  steep and so short-eaved that it reads as almost all roof. Everything decorative is in the frames of
  the openings.'
origin_en: The house of the Régime français, built from the first concessions of 1648 onward and repeatedly
  lengthened rather than replaced. The inventory describes it as an architecture "sans architecte", brought
  by colonists and tradesmen from rural France and adapted fast to local stone, local timber and a hard
  climate — more chimney stacks, fewer openings. Dormers appear only at the end of the regime. Most of
  the island's nineteen classed immeubles patrimoniaux belong to this courant.
