profile:
  siting_landscape:
  - Present in every municipality on the island and relatively abundant — the surviving fabric of the
    Régime français.
  - The plan de conservation places the Régime-français houses near the river, reached from the chemin
    Royal by long montées.
  massing:
  - Low rectangular main body with no or almost no foundation; the original volume has often been lengthened
    rather than replaced.
  - Steep two-slope or hipped roof, over 45°, most often covered in cedar shingle.
  articulation:
  - Ornament reduced to its simplest expression, limited to encadrements, linteaux, chambranles and épis.
  openings:
  - Asymmetrical façade composition; few openings, to limit heat loss.
  - Double-casement windows with small panes, fitted with functional shutters.
  materials:
  - Stone carré carrying a slight batter (fruit), often rendered or clad in wood.
  - Massive stone chimney at the centre of the house.
profile_fr:
  elements_caracteristiques:
  - Corps de logis rectangulaire bas ne présentant pas ou peu de fondations
  - Le volume d’origine a souvent été agrandi sur la longueur de la maison
  - Toiture à deux versants droits ou à croupes à pente forte, supérieure à 45 degrés, recouverte le plus
    fréquemment de bardeau de cèdre
  - Carré en pierre, portant un certain fruit, souvent revêtu de crépi ou de bois
  - Cheminée en pierre massive située au centre de la maison
  - Composition asymétrique de la façade
  - Ouvertures peu nombreuses, fenêtres à double battant à petits carreaux, munis de volets fonctionnels
  - Ornementation réduite à sa plus simple expression limitée aux encadrements, linteaux, chambranles
    et épis.
  repartition:
  - On retrouve les demeures de cette période dans toutes les municipalités de l'Île-d'Orléans et elles
    sont relativement abondantes.
