summary_en: >-
  A South Shore railway suburb: the Victoria Bridge (1859) and the Grand Trunk turned a strip of
  farmland facing Montréal into an Anglo-Protestant commuter town, laid out on the old farm lots and
  built up between about 1875 and 1930, then rounded out by the contractor Francis King's interwar
  cottages and the postwar bungalow boom. Its inventory (Patri-Arch, 2020) names ten currents, from
  the French-regime farmhouse to the modern house, and gives each a conservation fiche.
