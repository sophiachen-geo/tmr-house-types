- id: sv-piia-452-annexe4
  citation: "Village de Senneville, « Senneville-sur-le-Parc — guide des principes architecturaux », Annexe 4 du Règlement sur les plans d'implantation et d'intégration architecturale (PIIA) no. 452, drawn by BTA Ecosystem (1450 rue City Councillors, Montréal), dated 25 February 2019 on its own cover and served under the filename Reglement-452-5-Annexe-4-PIIA-2019-02-18.pdf. Section 1 « Contexte architectural » characterises the whole village in three periods and names six architectural influences; sections 3.1–3.5 set out principles for siting, massing, roof, openings and materials. Only Annexe 4 was retrieved; the consolidated text of by-law 452 was not, so its article numbers are unverified."
  url: "https://www.senneville.ca/wp-content/uploads/2023/01/Reglement-452-5-Annexe-4-PIIA-2019-02-18.pdf"
  used_for: [types, instruments, prose]
- id: sv-village-histoire
  citation: "Village de Senneville, official history page. 1679, Michel Sidrac Dugé sells the Boisbriand fief to Charles LeMoyne and Jacques Le Ber, who « renames the Boisbriand fief 'Senneville' in memory of his hometown in France »; 1686, a stone windmill; 1703, the fort; 1777, the fort burnt by Benedict Arnold; 1895, « The town of Bay-d'Urfé and the Village of Senneville break away from parish of Sainte-Anne-Du-Bout De l'Île. Senneville is incorporated »; 1896, « On May 9th, the first assembly of the Senneville council is held, presided over by the first mayor of Senneville, his honour Louis-Joseph Forget »; 2002 merger; 2006 demerger; 2017 new town hall. The page's dates for the fort and mill disagree with both the RPCQ fiche and the 2005 cahier's archaeology section, and its entry for a 2017 « heritage declaration » of the Bois-de-la-Roche site does not correspond to any instrument found: the Ville de Montréal document is an énoncé de l'intérêt patrimonial dated 13 February 2018, which is not a designation. Neither claim is published on this site."
  url: "https://www.senneville.ca/en/municipality/senneville-in-brief/history/"
  used_for: [phases, prose]
- id: sv-memento-pine-bluff
  citation: "Héritage Montréal, Memento, « Dependencies of the Pine Bluff residence (Richard Bladworth Angus Estate) », Senneville: built between 1895 and 1903 by Maxwell Architects; the main residence demolished in 1950; five outbuildings survive — « the Peach House, the gatekeeper's house, a small country house, a greenhouse and a barn » — and are « considered to be buildings of exceptional heritage value »; in 2019 Héritage Montréal asked « the administration of the Village of Senneville to reject these requests for demolition permits ». The same page dates the national historic site to 2002, which is the claim footnoted on this page."
  url: "https://memento.heritagemontreal.org/en/site/pine-bluff-residence/"
  used_for: [prose, types]
