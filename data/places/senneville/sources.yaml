- id: sv-enonce-bdlr-2018
  citation: "Ville de Montréal, « Énoncé de l'intérêt patrimonial du site du Bois-de-la-Roche, Senneville », 13 février 2018, 26 p. Value tables with éléments caractéristiques; « DÉSIGNATIONS PATRIMONIALES ET AUTRES DÉSIGNATIONS » list; « SITES ARCHÉOLOGIQUES INSCRITS À L'INVENTAIRE DES SITES ARCHÉOLOGIQUES DU QUÉBEC : Site de la maison Eustache-Rouleau, BiFl-010 (dans le parc agricole); Site du Fort Senneville BiFl-002 (à proximité) ». Valeur architecturale, point 2: « la qualité et l'unité stylistique des bâtiments de ferme de style Shingle, conçus par les architectes Edward et William Sutherland Maxwell »."
