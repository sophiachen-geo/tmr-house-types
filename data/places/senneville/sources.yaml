- id: sv-pc-1973
  citation: "Parks Canada, Directory of Federal Heritage Designations, Senneville Historic District National Historic Site of Canada, id 1973 / Canadian Register of Historic Places, Lieu historique national du Canada de l'Arrondissement-Historique-de-Senneville, id 4442. Description of Historic Place, Heritage Value and Character-Defining Elements read in full 17 August 2026, English and French. Heritage-value text: « Senneville Historic District was designated a national historic site of Canada in 2001 because: … Source: Historic Sites and Monuments Board of Canada, Minutes, 2001. » Recognition Details block: Recognition Date 2002/07/18; Listed on the Canadian Register 2008/04/16. See notes for the two years. NOTE: pc.gc.ca and historicplaces.ca both refused every direct HTTP request from this environment (connection reset by peer, curl exit 35, over IPv4 and IPv6, HTTP/1.1 and HTTP/2); the record was read through the WebFetch tool instead, so no local HTML copy exists under sources/."
  url: "https://www.historicplaces.ca/en/rep-reg/place-lieu.aspx?id=4442"
  used_for: [instruments, types, prose, protection]
- id: sv-rpcq-93454
  citation: "RPCQ, Site patrimonial du Fort-Senneville (id 93454); other names « Fort de Senneville », « Site historique et archéologique du Fort-Senneville »; date 1702–1703 (Construction); statut « Classement — Site patrimonial — Ministre de la Culture et des Communications — 2003-11-20 »; catégories de conservation 7 (Terrain exceptionnel) and 10 (Bien classé pour son intérêt archéologique). « Le site comprend les ruines du fort toujours debout et un terrain en partie boisé d'environ 8000 mètres carrés. » Valeur paysagère: « en 1865, la pointe est achetée par John Joseph Caldwell Abbott (1821-1893), avocat de Montréal, qui réaménage les lieux en domaine champêtre et préserve les ruines du fort. En 1898, la propriété, appelée Boisbriand, est acquise par le banquier Edward Seaborne Clouston (1849-1912) qui entreprend une série de rénovations des bâtiments sauf pour les ruines du fort, dont il apprécie le romantisme pittoresque. » Source: Ministère de la Culture, des Communications et de la Condition féminine du Québec, 2009. Saved as sources/west-island/senneville/rpcq_93454.html/.txt."
  url: "https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&id=93454&type=bien"
  used_for: [instruments, protection, prose, types]
- id: sv-rpcq-protval
  citation: "Répertoire du patrimoine culturel du Québec, section « Patrimoine protégé et valorisé », keyword search for \"Senneville\", run 17 August 2026: « Résultat de la recherche (4) » — the Site patrimonial du Fort-Senneville plus three commemorative plaques (Plaque de Le Ber de Senneville, Plaque du Fort Senneville, Plaque du site historique et archéologique du Fort-Senneville). Nothing in the estate belt carries a statut. Saved as sources/west-island/senneville/rpcq_protval_search_senneville.html."
  url: "https://www.patrimoine-culturel.gouv.qc.ca/rpcq/rechercheMotCle.do?methode=rechercher&motCle=Senneville&type=PROTVAL&reset=1"
