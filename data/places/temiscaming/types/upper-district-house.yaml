profile_note: >-
  The specific upper-district streets are not named in any accessible source. The Arts-and-Crafts /
  English-cottage style attribution is an inference from CIP's contemporaneous Quartier-du-Moulin development in
  Gatineau — a site patrimonial cité of 55 buildings that the RPCQ explicitly links to the company's parallel work
  at Témiscaming — and is not a statement about Témiscaming's houses. Nothing here is taken from photographs; the
  CCA's Szilasi photographs are permission-only and are cited, not reproduced. Checked against the MRC
  de Témiscamingue inventory published 8 April 2026: it screened 1,730 pre-1940 buildings across the
  MRC but retains only three properties in the Ville de Témiscaming — the railway station, the Opémican
  log-drive relay post and the Gatineau Power forebay — none of them houses, and it carries no materials
  field. The regional house typologies it does document (maison de colonisation, maison de colonisation
  à trois pignons, grande maison carrée, maison de colonisation avec galerie ceinturante, cottage carré,
  maison à pignon sur rue avec galerie ceinturante, along 5e-et-6e Rang Est, 7e-et-8e Rang Est/Ouest,
  9e Rang Est/Ouest, rue du Carrefour Nord and rue Principale Est/Ouest) are in Latulipe-et-Gaboury,
  not Témiscaming, and are rural colonisation types unrelated to company housing. This record therefore
  stands unchanged.
blurb_en: The houses CIP built on the hill for its managers and executives between the wars, in a separate district
  from the lower town.
origin_en: William Lyon Somerville of Toronto designed the upper-district houses, the hospital, and all the town's
  schools and churches for Canadian International Paper between 1925 and 1950.
source_generation: CCA study (1996); no typology catalogue exists
