summary_en: >-
  A 1917 Garden-City company town on a hillside above Lake Timiskaming, planned by the Scottish
  planner Thomas Adams for Riordon Pulp and Paper: "The Adams plan adapted its roads to the land,
  setting the town on a hill by Lake Timiskaming and the pulp mill further down on more level
  ground." From 1918 to 1923 the Montréal architects Ross and Macdonald built the mill, the
  commercial district and all the houses of the lower town; from 1925 to 1950 William Lyon Somerville
  of Toronto designed the upper-district houses, hospital, schools and churches for Canadian
  International Paper. "A single design aesthetic, established when the town was created, prevailed
  throughout its development." No residential district has heritage status.
