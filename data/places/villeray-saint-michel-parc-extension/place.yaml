typology_document:
  title: >-
    Règlement 01-283-124, Annexe F, « Typologies architecturales résidentielles » — thirteen fiches
    in three families: 1.0 Maisons unifamiliales (1.1–1.7), 2.0 Plex (2.1–2.3), 3.0 Immeubles
    d'appartements (3.1–3.3)
  year: null
  format: per-type-table
  note: >-
    Each fiche runs to eight pages on a fixed plan — .1 fiche d'accompagnement (historical context),
    .2 an elevation of the typologie de base, .3 the description under three headings (Implantation,
    Volumétrie, Traitement architectural), .4 and .5 the lettered variants with their own elevations,
    .6 to .8 the tables of permitted original and replacement components. Fiche 1.7 has seven pages,
    having only two variant pages' worth of content. The three headings map onto this site's columns
    as Implantation → siting, Volumétrie → massing, and Traitement architectural → articulation,
    openings and materials together, since the by-law does not separate them.
