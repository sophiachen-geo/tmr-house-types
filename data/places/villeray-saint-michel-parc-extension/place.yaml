    title: >-
      Règlement de zonage de l'arrondissement de Villeray–Saint-Michel–Parc-Extension, 01-283. The
      borough's base zoning by-law. Not 01-279, which is Rosemont–La Petite-Patrie's — the two are
      routinely confused, and the amending by-law that carries this borough's typology annexe,
      01-283-124, has itself been mis-attributed to Rosemont in secondary summaries.
    year: null
    url: null
  - kind: typology-annexe
    title: >-
      Règlement 01-283-124, Annexe F — « Typologies architecturales résidentielles » (the PDF is
      headed ANNEXE 4). 109 pages; thirteen numbered fiches in three families, each with a
      fiche d'accompagnement, a typologie de base, a page of lettered variants, and three pages of
      permitted original and replacement components. This is the most formal residential typology
      instrument held by any of the five Montréal boroughs encoded on this site: it does not merely
      describe types, it names them, numbers them, gives each a lettered variant set, and ties
      several variants to specific zone codes (H01-016, H02-096, H03-034, H03-049, H03-081, H03-085,
      H03-125, H03-128, H03-131, H03-132).
