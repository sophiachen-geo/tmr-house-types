summary_en: >-
  The borough with the most formal residential typology by-law in Montréal: règlement 01-283-124's
  Annexe F names thirteen house types, numbers them, gives each a set of lettered variants, and in
  several cases ties a variant to the zones it is allowed in. It is also the borough that disagrees
  with its neighbour about what a shoebox is. Rosemont–La Petite-Patrie treats the shoebox as one
  type; Villeray–Saint-Michel–Parc-Extension splits it in two — a 1900-1940 shoebox of contiguous
  brick fronts, found « principalement dans Villeray et Parc-Extension », and a 1940-1960 shoebox
  that sheds its ornament, lifts its ground floor over a basement, detaches from its neighbours and
  pulls back from the street to make room for a car. The borough's own census says why: of its
  1 159 shoebox houses, 544 were built in the eleven years from 1950 to 1960. Around that argument
  sits everything else — a single exceptional sector, rue Saint-Denis, singled out for its
  three-storey plex; five interesting sectors; three ensembles urbains d'intérêt, two of them built
  on Wartime Housing Limited models; and a limestone quarry with lime kilns as the only
  archaeological interest in a borough where no archaeological research has ever been done.
