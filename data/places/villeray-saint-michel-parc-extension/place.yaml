id: villeray-saint-michel-parc-extension
name_en: Villeray–Saint-Michel–Parc-Extension
name_fr: Arrondissement de Villeray–Saint-Michel–Parc-Extension
sections: [borough-vernacular]
region: Montréal (arrondissement; Évaluation du patrimoine urbain code 14)
borough_of: montreal
founded: 1896                     # the village de Villeray erected as a municipality; see phases
settlement_mode: >-
  three separate settlements fused into one borough by annexation — a tramway suburb platted along
  the 1893 Montreal Park and Island Railway line (Villeray, annexed 1905), a promoters' subdivision
  at the end of avenue du Parc laid out on an orthogonal grid (Parc-Extension), and a quarry village
  on the côte Saint-Michel whose 1912 garden-city street plan was not built out until after 1945
  (Ville Saint-Michel, annexed 1968)
