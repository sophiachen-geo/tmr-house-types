building_counts:
  shoebox_houses_borough_total: 1159
  note: >-
    1 159 is the borough's own count of shoebox houses, from its 2019 guide, and it is a count of one
    type rather than of the borough's building stock. By decade: 1900-1909, 16 (1,4 %); 1910-1919,
    144 (12,4 %); 1920-1929, 136 (11,7 %); 1930-1939, 128 (11,0 %); 1940-1949, 191 (16,5 %);
    1950-1960, 544 (46,9 %). By district: François-Perrault 660 (56,9 %), Saint-Michel 256 (22,1 %),
    Villeray 153 (13,2 %), Parc-Extension 90 (7,8 %). The decade table is the empirical fact behind
    this borough's decision to split the shoebox in two: 63,4 % of its shoebox houses were built from
    1940 onward, and 46,9 % in the eleven years 1950-1960 alone.
