blurb_en: >-
  From the 1940s the apartment building comes down in stature: two or three storeys of widely varying
  width, stone at the ground floor and polychrome brick above, straight lintels, concrete bands and
  glass block, a straight parapet under a projecting eave. The organisation is unchanged from the
  conciergerie — one common stair for everyone — but it is now expressed as a central bay standing
  proud of the façade, with the front door in it.
origin_en: >-
  The post-war walk-up, which the Évaluation cahier had already caught on the ground when it recorded
  Villeray filling with « des blocs comptant quelques appartements » after the war, and which the
  cahier's 14.U.2 shows in its most ambitious form — the Terrasses Villeray, built by the SCHL in
  1947 for veterans on a modernist site plan. The by-law's variants C and D are the opposite end of
  the same story: not a designed ensemble but two ordinary developers' groups, singled out by zone
  because their details are distinctive.
