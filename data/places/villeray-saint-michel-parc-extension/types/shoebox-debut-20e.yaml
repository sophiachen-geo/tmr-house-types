blurb_en: >-
  A single-storey brick box on a lot deeper than it is wide, set end-on and close to the street with
  the yard behind, its door in the middle and one tall window either side, and a cornice or a
  pedimented parapet raising the front above the flat roof. Built cheaply from what was to hand
  between 1900 and 1940, mostly in Villeray and Parc-Extension, and built to be built over later.
origin_en: >-
  The shoebox is the one self-built type on this site, and this is one of three records for it — with
  Rosemont–La Petite-Patrie's single type and with fiche 1.3 next door. The scholarly account is Guy
  Gaudreau, "Les premières maisons shoebox montréalaises de Rosemont et de Villeray" (Revue d'histoire
  urbaine / Urban History Review, DOI 10.3138/uhr-2020-0004), which pairs the same two boroughs this
  site now pairs. What is distinctive here is that the by-law does not simply describe the type: it
  regulates it, giving it three lettered variants and a table of permitted original and replacement
  components running to three further pages.
