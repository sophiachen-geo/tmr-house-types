blurb_en: >-
  The post-war plex: the same two or three storeys of stacked flats on the same narrow lot, still
  with a door per dwelling, balconies at every level and a curved stair to the upper one — but the
  craftsmanship gone. A straight parapet under a projecting eave instead of a pedimented one, a
  stone door surround instead of worked brick, and a façade combining two claddings, brick and
  stone, which is what the by-law says marks the period.
origin_en: >-
  Villeray's post-war housing boom is recorded twice in this record and the two records disagree
  about nothing: the Évaluation cahier says the borough filled with « des blocs comptant quelques
  appartements, des maisons de vétérans et différents "plex" », and this fiche is the plex half of
  that sentence. Read against fiche 2.1 it is the clearest before-and-after pair anywhere in this
  part — same type, same street pattern, one generation apart, with the difference stated as a loss
  of artisan work rather than as a change of form.
