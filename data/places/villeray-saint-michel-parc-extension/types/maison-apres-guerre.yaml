blurb_en: >-
  The Wartime Housing Limited model, built here from the 1950s by developers rather than by the
  Crown: a small compact 1½-storey house standing free on a generous lot, its ground floor lifted
  just clear of grade, a plain two-slope roof with the ridge along the street and no dormer, and the
  front door set off to one side. Five variants, three of them tied to named zones.
origin_en: >-
  Wartime and veterans' housing recurs across this site — Lévis, Sud-Ouest, Verdun's Crawford Park,
  and here. What this borough contributes is the sequence from observation to rule. The 2005
  Évaluation cahier had recorded three post-war ensembles (14.I.5, 14.U.1, 14.U.3), noted that
  developers took the federal model up commercially, and recommended studying such groups and
  developing tools for them; the by-law's fiche 1.5 is what that recommendation turned into — a
  drawn type with five variants and a cladding schedule by zone.
