blurb_en: >-
  Two storeys of open-slat wood frame put up fast in a boom, under a flat roof or one falling gently
  to the back, with a stepped parapet on the side walls and a high pedimented or corniced parapet on
  the front that makes the building look taller than it is. A covered gallery runs the width of the
  façade. The by-law's own word for the effect is <em>postiche</em> — false-fronted.
origin_en: >-
  Boomtown is the most widely distributed form on this site, and this record is one of its two
  Montréal borough entries in Part 10. What this borough adds to the file is the frame: the fiche
  gives the construction method in plain French — a slatted wood frame, easy to build, quick to
  raise — where the Charlesbourg plan de conservation names it « une charpente claire, aussi appelée
  "Balloon Frame" » and most other sources describe only the parapet. The two readings belong
  together: the parapet is what the fast frame made possible to dress up.
