blurb_en: >-
  What the borough looked like before the tramway: a compact wood-clad house on a big lot, set back
  from the road, one storey under a mansard with the bedrooms in the attic and a covered gallery
  running the whole width of the front. The by-law keeps it because a few survive in the oldest parts
  of Villeray and of the former Cité de Saint-Michel, not because it is common.
origin_en: >-
  This is the borough's link to the rural Québec forms catalogued elsewhere on this site — the small
  village house of Charlesbourg's Trait-Carré, of Île d'Orléans, of Lévis. Here it is a survivor
  inside a twentieth-century street grid rather than the parent of what came after: nothing in
  Villeray's plex or shoebox descends from it. The by-law's ordering makes the point by putting it
  first and then never referring back to it.
