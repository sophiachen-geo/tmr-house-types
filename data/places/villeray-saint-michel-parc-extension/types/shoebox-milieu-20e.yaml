blurb_en: >-
  The same flat-roofed one-storey box, built between 1940 and 1960, with the ornament stripped off,
  the crown flattened, the ground floor lifted over a real basement, and the party walls given up for
  a gap on each side and a deeper front yard to park a car in. Two of its five variants put something
  under that raised floor: a garage in one, a second dwelling with its own areaway entrance in the
  other.
origin_en: >-
  This is the record that makes the shoebox argument visible, because it has no counterpart in
  Rosemont's single-type treatment. It is also the borough's numerically dominant shoebox: 735 of the
  1 159 houses the borough counts fall in this fiche's years, and 544 of those in the eleven years
  1950-1960 alone. The type is where the shoebox meets the bungalow — which the same by-law files six
  fiches later, at 1.7 — and the meeting happens in the siting and the section rather than in the
  roof, which stays flat.
