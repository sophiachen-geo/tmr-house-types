blurb_en: >-
  Standardised two-storey houses built in pairs in the 1950s, mostly in François-Perrault: a compact
  brick block under a hipped roof with the ridge along the street, the ground floor lifted just clear
  of grade, the door tucked near the party end under a flat marquise, and ornament that runs sideways
  — concrete bands, a patterned bond between the windows, a stone surround at the door.
origin_en: >-
  The semi-detached answer to the same housing crisis that produced fiche 1.5, and the type the
  cahier had already found on the ground: 14.U.3, on 1re Avenue and rue Villeray, records
  « un ensemble d'habitations jumelées de deux étages construites en 1950 » holding their brick
  cladding, façade organisation, galleries and entrance marquises in common — the by-law's list, in
  the cahier's words, five years before the by-law's fiche.
