blurb_en: >-
  Montréal's own building, as this borough regulates it: two or three storeys of stacked flats under
  a flat roof, filling a narrow deep lot in a contiguous row with barely any setback, each dwelling
  with its own door on the front, balconies at every level, and a curved exterior stair climbing to
  the upper one. Ornament in the brickwork, worked lintels and sills, and a pedimented parapet on
  top. Villeray from about 1900, Parc-Extension from the 1920s.
origin_en: >-
  This is the plex family recorded in the words of the borough that has most of it. Two things here
  are not in the other Montréal plex records on this site. One is the borough's own social account of
  who lived in them — « logeaient les familles ouvrières qui travaillaient, notamment, dans les
  nombreuses carrières de pierre que l'on retrouvait à l'époque sur le territoire de
  l'arrondissement » — which ties the type to the Saint-Michel limestone quarries recorded as this
  borough's only archaeological interest. The other is that the by-law makes the curved exterior
  stair a named characteristic of a regulated type, which is what the shared explainer at
  /topics/escalier-exterieur/ exists to unpack.
