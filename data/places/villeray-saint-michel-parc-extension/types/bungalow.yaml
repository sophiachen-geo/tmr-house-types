blurb_en: >-
  The suburb arriving inside the city: a one-storey rectangle in polychrome brick under a hipped roof
  set ridge-on to the street, a deep front lawn with the drive across it, a wide concrete stair up to
  a perron the roof reaches out to cover, and horizontal windows either side of a central door.
  Built in the 1960s and 1970s in groups, north of Saint-Michel and Parc-Extension and in
  François-Perrault, and valued by the by-law as groups.
origin_en: >-
  The bungalow is on this site as the form Charlesbourg's declaration was drawn to stop and as the
  ordinary end of the twentieth-century sequence in a dozen places. Here it is neither: this by-law
  gives it a fiche of its own, three variants, and an explicit statement of landscape value — a
  Montréal borough regulating the 1960s bungalow as heritage fabric. Its variant C also gives the
  split-level a place in a Québec municipal typology, which is rare.
