blurb_en: >-
  From the 1960s: three storeys or more of densely packed flats, contiguous, usually in groups built
  at one go, set back far enough for a drive to a basement garage. Pale brick — white or light
  yellow, sometimes glazed — laid now and then in coloured patterns, a low straight parapet under a
  flat projecting eave, and a common entrance that is a wide glazed vestibule under its own canopy,
  commercial in scale.
origin_en: >-
  The end of the annexe and the end of the sequence: the apartment building at its densest, described
  by the same by-law that opens with a wood-clad rural house on a large lot. Set beside fiche 2.3,
  the plex italien, it shows the 1960s arriving in this borough as one palette applied at two scales —
  pale glazed brick, horizontal banding, a flat eave for a crown, and the car put underneath.
