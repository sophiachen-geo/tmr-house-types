blurb_en: >-
  From the 1960s, and known to the borough as the <em>plex italien</em> after the builders who put it
  up: two storeys over a habitable basement, set back far enough from the street for a sunken drive
  down to a garage, a wide perron up a heavy concrete stair, horizontal windows, almost no parapet
  under a flat projecting eave — and pale brick, white or light yellow and sometimes glazed, laid
  now and then in coloured patterns the by-law calls fanciful. Its most homogeneous groups are in
  Saint-Michel.
origin_en: >-
  A third plex generation, which no other place record on this site carries, and the one that shows
  the family surviving the car. It also gives this site its only building type named for the
  immigrant community that built it, recorded as such in a municipal by-law — a companion to the way
  the 2005 cahier describes Saint-Michel receiving « de nombreux immigrants italiens » after the war
  and Parc-Extension being known for the ethnocultural diversity of its population.
