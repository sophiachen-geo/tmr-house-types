blurb_en: >-
  The conciergerie: three storeys of flats between 1900 and 1940, imposing on its lot with only a
  shallow setback, more than a dozen dwellings reached from one central door at street level by a
  common interior stair. Ornament is the point — a heavy stone surround at that door, patterned
  brickwork, worked lintels, concrete bands, and a pedimented parapet with acroteria on top.
origin_en: >-
  The apartment building appears on this site under several names — maison d'appartements,
  conciergerie, édifice de rapport, walk-up — and this borough numbers all three of its generations.
  What this record adds is the definition by stair. Everywhere else on this site the apartment
  building is separated from the plex by counting dwellings; here it is separated by asking whether
  the stair is inside the plan, and the by-law says in as many words that putting it inside
  « rompt avec la tradition montréalaise des escaliers extérieurs ».
