variants:
  - code: A
    name_fr: Immeubles d'appartements avec usage commercial au rez-de-chaussée
    summary_fr: "Cette variante présente un rez-de-chaussée à usage commercial situé près du sol. Il y a une transition dans le traitement architectural entre les usages commerciaux et résidentiels. Le traitement de la porte d’entrée des logements est plus sobre que dans la typologie de base, et ce, en raison des commerces. Lorsqu’implanté sur un coin de rue, le volume est souvent tronqué sur le coin, et de grandes ouvertures sont situées près de l’intersection."
profile:
  siting_landscape:
    - May be sited contiguously, semi-detached or detached.
    - Characterised by a shallow to medium setback and by a heavy footprint on its lot.
  massing:
    - Distinguished by its imposing gabarit, generally three storeys under a flat roof.
    - The ground floor is raised above the street and habitable rooms may be in the basement.
    - Projecting volumes on the façade are sometimes present.
  articulation:
    - The façade composition is generally symmetrical.
    - One central front door near ground level gives access to all the apartments — the single feature that separates this family from the plex.
    - Ornament is characteristic of these buildings, with the front door emphasised by a substantial stone architrave.
    - Façades may carry brick bond patterns, worked lintels and concrete bands.
    - The crown varies but often includes a pedimented parapet with acroteria under a moulded flashing.
  openings:
    - Openings of vertical proportion, vertically aligned.
    - The dwellings generally have balconies, set projecting from the façade or recessed as alcoves.
  materials:
    - Brick with stone; the ornament is worked into the brickwork and the stone door surround.
profile_fr:
  contexte:
    - "Également connus sous le nom de conciergeries, les immeubles d’appartements construits entre 1900 et 1940 sont des immeubles de trois étages au caractère souvent imposant. La présence d’ornementation au niveau des façades confère un caractère prestigieux au bâtiment, qui peut compter plus d’une dizaine de logements, tous accessibles par un escalier intérieur commun."
  implantation:
    - "Le bâtiment peut être implanté de façon contiguë, jumelée ou isolée. Il est caractérisé par une marge de recul d’une profondeur faible à moyenne, ainsi qu’une forte implantation sur son lot."
  volumetrie:
    - "Cette typologie se distingue par son gabarit imposant, généralement de trois étages surmontés d’un toit plat. Le rez-de-chaussée est surélevé par rapport à la rue et des espaces habitables peuvent être présents au sous-sol. Des volumes en avancée de la façade sont parfois présents."
  traitement_des_facades:
    - "La composition de la façade est généralement symétrique. une porte d’entrée centrale située près du sol donne accès à tous les appartements."
    - "La présence d’ornementation est caractéristique de ces immeubles, avec une mise en évidence de la porte d’entrée par un important chambranle de pierre. Les façades peuvent présenter un appareillage de brique, des linteaux travaillés et des bandeaux de béton. Le couronnement varie, mais comprend souvent un parapet à fronton et des acrotères surmontés d’un solin mouluré."
  ouvertures:
    - "Les ouvertures sont de proportions verticales et sont alignées verticalement. Les logements bénéficient généralement de balcons, positionnés en saillie de la façade ou en alcôve."
  sous_variantes:
    - "A — IMMEUBLES D’APPARTEMENTS AVEC USAGE COMMERCIAL AU REZ-DE-CHAUSSÉE. Cette variante présente un rez-de-chaussée à usage commercial situé près du sol. […] Le traitement de la porte d’entrée des logements est plus sobre que dans la typologie de base, et ce, en raison des commerces."
profile_note: >-
  <strong>The family this record belongs to was missing from the Part 10 brief entirely, and it is
  the one that states the boundary of the plex.</strong> The 3.0 divider page draws it in a single
  sentence: « Ils se distinguent des bâtiments de type plex par l'intégration, à l'intérieur du plan
  de l'édifice, d'un escalier permettant l'accès aux logements et qui rompt avec la tradition
  montréalaise des escaliers extérieurs. En raison de leur configuration, ces immeubles peuvent
  comporter significativement plus de logements que les plex. » So the line is not drawn by dwelling
  count but by where the stair is, and the count follows from it. That is a materially different test
  from the Sud-Ouest study's, which draws the line at a common entrance hall serving six to twelve
  dwellings; this by-law draws it at the stair and then says the building « peut compter plus d'une
  dizaine de logements ». Both belong on the /topics/escalier-exterieur/ page, and this one is the
  sharper of the two because it says outright that the interior stair breaks with a Montréal
  tradition. Note that the transcription keeps the source's lower-case « une porte d'entrée » after
  the full stop.
