- id: vsp-01-283-124-annexe-f
  citation: >-
    Ville de Montréal, arrondissement de Villeray–Saint-Michel–Parc-Extension, Règlement 01-283-124,
    Annexe F — « Typologies architecturales résidentielles » (the PDF's own cover reads ANNEXE 4).
    https://portail-m4s.s3.montreal.ca/pdf/R%C3%A8glement%2001-283-124%20-%20Fiches%20typologies.pdf
    — retrieved 17 August 2026; sha-256
    9ff4ea1e7b741c24436e0ff14f23018a821f91e42eb004326015e72225c1b676; 109 PDF pages. Parsed with
    pdftotext -layout to sources/vsp/txt/vsp_01-283-124_fiches_typologies.txt, and the pages where
    that extraction dropped text re-read from page images rendered with pdftoppm. See
    sources/vsp/MANIFEST.md for which pages those were and why.
  used_for: >-
    All thirteen type records and every one of their French quotations and lettered variants: family
    1.0 (fiches 1.1–1.7), family 2.0 (fiches 2.1–2.3) and family 3.0 (fiches 3.1–3.3). Also the
    family definitions on the three divider pages — the plex family's « de deux à six logements » and
    « chaque logement présente habituellement une entrée distincte en façade », and the apartment
    family's definition of itself against the plex by the position of the stair. Also the zone codes
    carried by the variants of fiches 1.5, 1.6 and 3.2.

- id: evaluation-patrimoine-vsp-2005
  citation: >-
    Ville de Montréal, Service de la mise en valeur du territoire et du patrimoine, Direction du
    développement urbain, Division du patrimoine et de la toponymie, « Évaluation du patrimoine
    urbain — Arrondissement de Villeray–Saint-Michel–Parc-Extension », 2005. ISBN 2-7647-0457-7;
    dépôt légal BAnQ and BAC 2005.
    https://ville.montreal.qc.ca/pls/portal/docs/page/patrimoine_urbain_fr/media/documents/26_evaluation_patrimoine_villeray.pdf
    — retrieved 17 August 2026; sha-256
    e6e6ff5748506e6b14ad704068d232be3c8ee7f628b82ffab0d45c1ccbc2ca08; 46 PDF pages. Parsed with
    pdftotext -layout to sources/vsp/txt/26_evaluation_patrimoine_villeray.txt.
  used_for: >-
    The arrondissement code, 14 — read from inside the document at all 121 code occurrences, in a
    file whose name begins 26. Every sector record and every sector quotation: 14.E.1, 14.I.1 to
    14.I.5, 14.U.1 to 14.U.3, 14.AP.1 and 14.A.1. The three settlement narratives for Villeray, Parc
    Extension and Ville Saint-Michel that the phases are built on, printed pp. 21–22, including the
    1893 tramway, the 1896 erection and 1905 annexation of Villeray, the 1925–1931 construction boom,
    the naming of Parc Extension after the Park Avenue Extension development, the 1931 gare
    Jean-Talon, and Saint-Michel's 1912 Béique & Charton garden-city plan, its post-war federal
    veterans' housing and its 1968 annexation. The definition of the ensembles urbains d'intérêt
    category and its three selection criteria, printed p. 13. The archaeological method and the
    definitions of the two archaeological sector classes, printed pp. 18 and 36. The project's
    authorship and dates, printed on the verso of the title page.

- id: vsp-depliant-shoebox-2019
  citation: >-
    Arrondissement de Villeray–Saint-Michel–Parc-Extension, Direction du développement du territoire,
    « Maisons de type "shoebox" — guide pour les travaux et agrandissements », année de publication
    2019. Credited on the leaflet: source Isabelle Bouchard, M. Sc. A conservation; photographs from
    the Archives de la Ville de Montréal and the Société d'histoire de Parc-Extension; map from
    Chas. E. Goad Co., Atlas of the City of Montréal and Vicinity, 1912-1914, vol. III, planche 343,
    BAnQ. https://portail-m4s.s3.montreal.ca/pdf/depliant_maisons_shoebox_final_web.pdf — retrieved
    17 August 2026; sha-256 2669e0a4b3ec22985871c5e2c4fdf78af0e4d9ebe8263cacc8f8da5707f8b4e7; 2
    pages. Parsed with pdftotext -layout to sources/vsp/txt/vsp_depliant_maisons_shoebox.txt.
  used_for: >-
    The borough's shoebox census — 1 159 houses, tabulated by decade (16 / 144 / 136 / 128 / 191 /
    544) and by district (Parc-Extension 90, Villeray 153, François-Perrault 660, Saint-Michel 256) —
    which is the evidence base for the two-type split discussed in the notes, and from which the
    derived counts on the two shoebox type records are summed. Also the leaflet's own definition of
    the shoebox and its account of industrialisation, the railways and the tramways letting workers
    put distance between work and home and buy a cheap plot on the periphery. Also the naming of the
    2018 « Étude d'évaluation patrimoniale et de mise en valeur des maisons de type "shoebox" ».
    NOTE: this leaflet is published by THIS borough, not by Rosemont–La Petite-Patrie; the Part 10
    brief cites the same file under Rosemont. The document's own imprint gives the address 405,
    avenue Ogilvy, which is the VSP borough hall.

