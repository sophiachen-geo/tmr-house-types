- id: montreal-ca-vsp-typologies
  citation: >-
    Ville de Montréal, borough guidance pages « Les maisons unifamiliales patrimoniales dans VSP »
    (montreal.ca/articles/les-maisons-shoebox-dans-vsp-6250 and
    montreal.ca/articles/les-maisons-unifamiliales-patrimoniales-dans-vsp-100059) and « Les plex
    patrimoniaux dans VSP » (montreal.ca/articles/les-plex-patrimoniaux-dans-vsp-100023), consulted
    17 August 2026.
  used_for: >-
    Independent corroboration that the borough publishes three plex typologies and not two — the plex
    page names « Le plex du début du 20e siècle », « Le plex du milieu du 20e siècle » and « Le plex
    de la seconde moitié du 20e siècle », the last « aussi connue sous le nom "plex italien" » — which
    is what settles the Part 10 brief's flag that the plex extraction might have been truncated at
    2.2. Also confirmation that the borough publishes the seven unifamiliale fiches as separate
    downloadable documents. No French wording in this record is taken from these pages rather than
    from the by-law itself.

- id: parc-extension-municipal-sources
  citation: >-
    Ville de Montréal, « Parc-Extension : 100 ans d'histoire » (rech_bilan_parc_extension.pdf) and
    « Portrait du quartier Parc-Extension par le groupe de travail » (portrait_parc_extension.pdf);
    and MEM – Centre des mémoires montréalaises, « Bienvenue dans Parc-Extension », published
    2 June 2017 (ville.montreal.qc.ca/memoiresdesmontrealais/bienvenue-dans-parc-extension).
  used_for: >-
    The MEM page was retrieved on 17 August 2026 and is the source of the « Depuis 1910 » date and
    the quarter's area of 1,6 km². THE TWO PDFs WERE NOT RETRIEVED — both returned HTTP 404 on the
    Ville's legacy pls/portal host, and the S3 portal returned 403 for both. They are the source
    ordinarily cited for the figure « 69 % des immeubles du quartier sont des duplex et des multiplex
    (4 à 12 logements) » and for the 1945–1970 construction figures, and those claims are carried on
    the place page labelled as unverified for exactly that reason. They are also the documents that
    would confirm or refute the Bloomfield–Jarry–Wiseman–de Liège wartime quadrilatère recorded in
    sectors.yaml as PE-WH-1. Retrieve them on the next pass.

- id: gaudreau-shoebox-uhr
  citation: >-
    Guy Gaudreau, « Les premières maisons shoebox montréalaises de Rosemont et de Villeray », Revue
    d'histoire urbaine / Urban History Review, DOI 10.3138/uhr-2020-0004.
  used_for: >-
    Cited on the early shoebox type record as the scholarly account of the type's origin, and as the
    paper that pairs the same two boroughs this site now pairs. NOT RETRIEVED in this pass — the
    article is behind a publisher paywall. No statement in this record is drawn from it; it is
    recorded so that a later pass can read it and check the self-build account against it.

- id: commons-vsp-photographs
  citation: >-
    Wikimedia Commons. Author, licence, description and file URL for every candidate were read
    individually through the Commons API (action=query&prop=imageinfo&iiprop=url|extmetadata) on
    17 August 2026 before any download, and no file was retrieved whose terms had not been read
    first. Categories consulted: Category:Villeray, Category:Multiplexes (buildings), and full-text
    file search on the borough's quarter names.
  used_for: >-
    The four photographs published on this place's type cards. Three are by Guerinf and one by
    Great11, all released CC BY-SA 4.0 as own work. Every match is on form rather than on address and
    carries match_confidence: visual. See sources/vsp/MANIFEST.md for the full licence findings,
    including the borough categories that were checked and found to hold no usable building
    photographs, and the types for which no freely-licensed photograph could be found at all — the
