- {id: vieux-hampstead, code: 18.E.3, name_fr: Vieux-Hampstead, value: exceptional, summary_en: "'Les premiers planificateurs se sont fortement inspirés du plan de la cité-jardin de Hampstead en Angleterre… une grande harmonie architecturale.' First construction 1916, real development from 1920, the majority pre-1940: two-storey stone or brick volumes strongly influenced by the English styles also common in Westmount. In this arrondissement 'dans le Vieux-Hampstead la pierre domine.'", streets: [Thurlow]}
- {id: hampstead-later, code: 18.I.4, name_fr: Hampstead, value: interesting, summary_en: "Continuation of the original plan — single-family houses on large lots along curving streets — with many houses of the 1940s and later; a second development phase, with less concentration of old stone houses.", streets: []}
- {id: hampstead-ensemble, code: 18.U.1, name_fr: Hampstead (ensemble urbain d'intérêt), value: urban-ensemble, summary_en: "Single-family houses of the 1960s and 1970s on large lots, often architect-designed, 'maisons qui affichent une grande individualité'.", streets: []}
