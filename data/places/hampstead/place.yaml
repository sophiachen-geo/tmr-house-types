id: hampstead
name_en: Hampstead
name_fr: Ville de Hampstead
sections: [planned]
region: Agglomération de Montréal
founded: 1914                              # incorporated 19 February 1914 (Bill 59), detached from Côte-Saint-Luc; first council 7 April 1914; founding mayor James Ballie
settlement_mode: garden-suburb subdivision by a private land company
planner:
  designer: Leonard E. Schlemm, landscape architect
  date: 1920s
  note: >-
    Two UQAM scholarly histories identify Schlemm as the author of Hampstead's plan — one says the
    plan was "confié à Leonard E. Schlemm", the other that the town was founded in 1914 but
    "dessinée par Leonard E. Schlemm durant les années 1920". Schlemm is the same landscape
    architect who laid out Westmount's Priest's Farm (1926–1930), which is why this site links the
    two places. Frederick G. Todd is NOT the designer and must not be credited. The two UQAM
    histories are reported at ingest without full bibliographic details (Part 5b task), so the
    attribution is recorded as reported rather than footnoted; no source held in sources/hampstead/
    confirms it.
  founder: >-
    Sir Herbert Holt, engineer, first president of the Hampstead Land and Construction Company,
    played a "central role" in the town's initial planning and development per the Town's official
    history, which does not name him as author of the physical plan.
  company_name_note: >-
    Two company names circulate: the Hampstead Land and Construction Company (Town's official
    history) and Côte St. Luc Realties (the landholding syndicate cited in the 2005 Évaluation).
    Record both; do not collapse them.
