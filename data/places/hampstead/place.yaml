demolition_rebuild_statistics:
  published: false
  note: >-
    The Town publishes no annual or cumulative demolition/rebuild figure. It publishes individual
    demolition notices and council decisions (e.g. 5851 Ferncroft; 74 Stratford, approved August
    2024; 29 Lyncroft, approved February 2025, with the replacement single-family house considered
    separately; 54 Place Heath), and its fee by-law treats demolition permits individually. A count
    assembled from council records would be our figure, not the Town's — do not publish one. The
    four decisions are recorded as evidence of practice, not as a statistical series; they are
    reported at ingest and no copy of them is held in sources/hampstead/.
