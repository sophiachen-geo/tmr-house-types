summary_en: >-
  A Garden City suburb laid out in 1913–14 on the model of Hampstead in London: curving streets to
  slow traffic, large single-family lots with room to garden, no commerce or industry. It grew
  slowly — 53 residents in 1921, about a thousand and a hundred houses by 1944 — then filled after
  the war. Its interwar core, Vieux-Hampstead, is a secteur de valeur patrimoniale exceptionnelle of
  two-storey stone houses "fortement inspirés des styles anglais aussi présents en grand nombre à
  Westmount".
