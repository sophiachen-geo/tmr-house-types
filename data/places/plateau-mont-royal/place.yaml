summary_en: >-
  Montréal's densest inner borough, built out between 1845 and 1914 as a cluster of villages
  (Coteau-Saint-Louis, Saint-Jean-Baptiste, De Lorimier, Saint-Louis-du-Mile-End) that Montréal
  annexed between 1886 and 1909. Its housing is the classic Montréal plex: the duplex of the 1885–91
  boom, then the triplex with exterior stair of 1904–14, whose form the City's own 1880s rules on lot
  size, lanes, front setbacks and brick or stone cladding produced. The 2004 PIIA framework classifies
  ~1,500 surveyed buildings by massing, siting, dwelling count and mode of access into fifteen types
  in five families.
