  "type 2.6"; codes are document-specific.
blurb_en: >-
  The Montréal triplex: three flats stacked in a three-storey brick front, the upper two reached by an
  outside stair, often the famous curving iron one, with balconies at each level and an L-shaped
  footprint that leaves a light-well at the back. It is the dominant building of the borough.
origin_en: >-
  The Étude typomorphologique calls the triplex "la forme architecturale typique de ce secteur de
  Montréal" and dates it to the second boom, 1904–1914, driven by housing demand and by municipal
  regulation: standard lots and lanes (1880), then the mandatory front setback and stone or brick
  cladding, which "amènera la translation de l'escalier d'accès aux logements des étages supérieurs
  vers l'extérieur". Réjean Legault (1989) is the standard scholarly account.
