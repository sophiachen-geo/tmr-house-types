profile_note: >-
  Family 1 fiche not retrieved. The typomorphological study describes the villages period (1845–1880)
  as dominated by the attached single-family house, often built at the street line, with some rear-lot
  houses (later banned on hygienist grounds) and "quelques maisons typiques de faubourg ouvrier,
  notamment dans l'ancien secteur du village des Carrières"; survivors on rues de Bullion,
  Saint-Dominique, avenue Coloniale and rue Lagarde. Do not populate from Québec City's thesaurus.
blurb_en: The oldest surviving houses of the villages, small attached workers' houses at the street line.
origin_en: Villages period, 1845–1880; the earliest built layer of the borough.
