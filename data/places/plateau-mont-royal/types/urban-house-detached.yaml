blurb_en: >-
  The bourgeois villa of the Plateau's first decades: a free-standing stone house set back from the
  street, individually designed, now rare and often converted.
origin_en: >-
  Built for the well-to-do west of Saint-Laurent and south of avenue des Pins, then along Sherbrooke,
  Square Saint-Louis and Saint-Hubert; the family also includes a two-unit superposed variant that
  differs from the duplex by storeys per dwelling, uniform stone facing and richer ornament.
