typology_document:
  title: Ville de Gatineau, « 14 fiches explicatives portant sur les types architecturaux résidentiels qui dominent le paysage gatinois » (Enclume, with Passerelles Coopérative en patrimoine, 2023); Inventaire du patrimoine bâti moderne (EVOQ Stratégies, 10 Nov 2023, 164 buildings 1937–1980, organised by familles typologiques)
  year: 2023
  format: per-type-table
  note: >-
    The fiches are the closest thing in Québec to Mount Royal's by-law tables: each gives contexte
    historique, répartition géographique, volumétrie, ouvertures, revêtement, ornementation, and
    paired "interventions à privilégier / à éviter", with one credited photograph of a real address.
    The modern inventory uses a different system — familles typologiques = function of origin
    (RES/IND/COM/SI/TCP) × morphology (volumétrie, implantation, plan) — and is not encoded here.
map_layer: null
summary_en: >-
  One city assembled in 2002 from five: Wright's timber settlement at the Chaudière that became
  Hull, the Regency resort and courthouse town of Aylmer, the paper company's Quartier-du-Moulin at
  Gatineau, and Buckingham and Masson-Angers to the east. Its housing is the Ottawa valley's
  industrial vernacular — above all the "maison allumette", the gable-front worker's house of the
  match-works era, built in three generations from the 1870s on the narrow lots of the 1864 Wright
  survey. In 2023 the City published fourteen type fiches, one per dominant residential form.
