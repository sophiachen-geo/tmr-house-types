profile:
  siting_landscape: []
  massing:
  - 'Roof form: flat roof, or low-slope roof sloping down towards the rear.'
  - 'Height: two storeys above ground.'
  - 'Ground plan: rectangular plan perpendicular to the street (frequent).'
  - Secondary volume at the rear, projecting laterally in relation to the main body (occasional).
  - The flat-roofed wood house is sometimes semi-detached or in a row.
  - 'Projections: porch (frequent) or covered gallery at the front (occasional) with a shed roof, with a triangular
    pediment (occasional).'
  - Square wooden columns (frequent) or round ones (occasional) supporting the roof of the porch or of the gallery.
  - Gallery and balustrade with simple wooden posts.
  articulation:
  - Flat-roofed wood houses have generally sober ornamentation, concentrated on the roof overhang and the openings.
  - Simple roof overhang, or one enhanced with a cornice ornamented with brackets, dentils or modillions (frequent),
    on the front façade.
  - Corner boards (frequent).
  - Casings around the openings (frequent).
  openings:
  - 'Doors: simple main door with a window, off-centre in relation to the façade.'
  - Presence of a transom above the door (occasional).
  - 'Windows: presence of simple rectangular sash (guillotine) windows, with or without small panes (frequent).'
  - Presence of one window on the ground floor on the façade and of one or two windows on the façade at the upper
    storey (frequent).
  - The ground-floor window is wider than those of the upper storey (rare).
  materials:
  - 'Walls: cladding of wood clapboard or of rabbeted (shiplap) boards (frequent).'
  - Exterior cladding of embossed sheet metal (rare).
profile_fr:
  contexte:
  - La maison en bois à toit plat, tout comme la plupart des maisons associées au style vernaculaire industriel, a
    vu le jour suite à l’industrialisation et à la standardisation des matériaux de construction. En effet, la transformation
    du bois d’œuvre en colombages de différentes dimensions (2" × 4", 2" × 6", etc.) a permis l’application de nouvelles
    techniques, telle que la construction à ossature de bois dès les années 1860.
  - Cette nouvelle façon de faire permet alors de construire plus rapidement et plus économiquement, créant des maisons
    plus spacieuses, sur deux étages complets et accessibles à la classe ouvrière. La maison en bois à toit plat est
    intimement liée à l’industrialisation, non seulement en raison des matériaux standardisés et des nouvelles techniques
    qui l’ont engendrée, mais aussi par sa volonté de loger une population ouvrière travaillant dans les usines et
    nouvellement installée dans les villes, dès la fin du 19e siècle jusqu’au début du 20e siècle. C’est pourquoi
    la plupart de ces maisons se retrouvent dans les milieux urbains denses. Aux États-Unis, on associe souvent ce
    type au style Boomtown, qui a connu un développement fulgurant au moment de l’industrialisation.
  repartition:
  - Présence marquée dans le secteur de Hull et, dans une moindre mesure, dans les secteurs d’Aylmer, de Gatineau
    et de Masson-Angers.
  volumetrie:
  - Toit plat ou à faible pente descendant vers l’arrière.
  - Deux étages hors-sol.
  - Plan rectangulaire perpendiculaire à la rue (fréquent).
  - Corps secondaire à l’arrière et en saillie latéralement par rapport au corps principal (occasionnel).
  - La maison en bois à toit plat est parfois jumelée ou en rangée.
  - Porche (fréquent) ou galerie couverte à l’avant (occasionnel) avec toit en appentis, avec fronton triangulaire
    (occasionnel).
  - Colonnes en bois carrées (fréquent) ou rondes (occasionnel) soutenant le toit du porche ou de la galerie.
  - Galerie et balustrade avec poteaux simples en bois.
  ouvertures:
  - Porte principale simple avec fenêtre, décentrée par rapport à la façade.
  - Présence d’une imposte au-dessus de la porte (occasionnel).
  - Présence de fenêtres rectangulaires simples à guillotine avec ou sans carreaux (fréquent).
  - Présence d’une fenêtre au rez-de-chaussée en façade et d’une ou deux fenêtres en façade à l’étage (fréquent).
  - La fenêtre du rez-de-chaussée est plus large que celles de l’étage (rare).
  revetement:
  - Revêtement en clins de bois ou en planches à feuillure (fréquent).
  - Revêtement extérieur en tôle embossée (rare).
  ornementation:
  - Les maisons en bois à toit plat ont une ornementation généralement sobre, se concentrant sur le débord de toit
    et les ouvertures.
  - Débord de toit simple ou agrémenté d’une corniche ornementée de consoles, de denticules ou de modillons (fréquent)
    sur la façade avant.
  - Planches cornières (fréquent).
  - Chambranles autour des ouvertures (fréquent).
