conservation:
- 'Prefer: Extensions should be made at the rear of the building and remain barely visible from the street. In the
  case of a contemporary extension at the rear, the new volume could draw on the scale and the forms of the original
  extensions or secondary volumes.'
- 'Prefer: Original projecting elements should be maintained and preserved as far as possible.'
- 'Prefer: Favour a flat roof for extensions.'
- 'Avoid: Avoid extensions or additions in height that would alter the massing of the roof or the precedence of the
  main volume.'
- 'Avoid: Avoid the removal of a projection, the significant alteration of the shape of its openings, or its covering
  with materials that do not correspond to the initial materials.'
- 'Prefer: When replacing the windows, choose sash (guillotine) models. Favour a model with a number of small panes
  similar to the original or to other houses of the same model built in the same period.'
- 'Prefer: Respect and maintain the original arrangement of the openings.'
- 'Avoid: When the house has a second entrance, avoid removing it.'
- 'Avoid: Avoid replacing sash windows with casement windows or with any other type of opening mechanism.'
- 'Avoid: Avoid altering the dimensions of the windows or blocking them up.'
- 'Prefer: Favour a cladding material in keeping with the identified original materials, such as wood clapboard or
  rabbeted (shiplap) boards. Other complementary materials could however be considered for the addition of a new volume.'
- 'Avoid: Avoid choosing a cladding whose appearance or finish does not correspond to the pre-identified original
  cladding materials of the main body.'
- 'Prefer: Original ornamentation should be maintained and kept, or else replaced as faithfully as possible when its
  preservation is not possible.'
- 'Avoid: Avoid adding ornaments that do not correspond to the pre-identified originals or that never existed on the
  building.'
- 'Avoid: Avoid removing original ornaments without replacing them.'
conservation_fr:
- Les agrandissements devraient être faits à l’arrière du bâtiment et demeurer peu visibles de la rue. Dans le cas
  d’un agrandissement contemporain à l’arrière, le nouveau volume pourrait s’inspirer du gabarit et des formes des
  extensions ou des volumes secondaires d’origine.
- Les éléments en saillie d’origine devraient être entretenus et préservés autant que possible.
- Privilégier un toit plat pour les agrandissements.
- Éviter les agrandissements ou les ajouts en hauteur qui altéreraient la volumétrie du toit ou la préséance du volume
  principal.
- Éviter le retrait d’une saillie, le changement significatif de la forme de ses ouvertures ou encore son recouvrement
  par des matériaux ne correspondant pas aux matériaux initiaux.
- Au moment de remplacer les fenêtres, choisir des modèles à guillotine. Favoriser un modèle avec un nombre similaire
  de carreaux par rapport à l’original ou à d’autres maisons du même modèle construites à la même époque.
- Respecter et maintenir la disposition originale des ouvertures.
- Lorsque la maison possède une deuxième entrée, éviter de la retirer.
- Éviter de remplacer des fenêtres à guillotine par des fenêtres à battants ou par tout autre type de mode d’ouverture.
- Éviter de modifier les dimensions des fenêtres ou de les murer.
- Privilégier un matériau de recouvrement en accord avec les matériaux d’origine identifiés comme le clin de bois
  ou les planches à feuillure. D’autres matériaux complémentaires pourraient cependant être envisagés pour l’ajout
  d’un nouveau volume.
- Éviter de choisir un revêtement dont l’aspect ou le fini ne correspond pas aux matériaux de revêtement d’origine
  préidentifiés pour le corps principal.
- Les ornementations originales devraient être entretenues et maintenues ou encore remplacées le plus fidèlement possible
  lorsque leur préservation n’est pas possible.
- Éviter d’ajouter des ornements ne correspondant pas aux originaux préidentifiés ou n’ayant jamais existé sur le
  bâtiment.
- Éviter de retirer des ornements originaux sans les remplacer.
blurb_en: Two storeys under a flat roof, or one pitched just enough to drain to the rear, on a rectangular plan. A
  porch or covered gallery on square wood posts under a shed roof fronts an off-centre door, and the ornament is saved
  for the eaves — a plain overhang, or a cornice on brackets, dentils or modillions — with corner boards and casings
  around the openings.
origin_en: 'Like most houses of the industrial vernacular style, the flat-roofed wood house appeared in the wake of
  industrialisation and the standardisation of building materials: milling lumber into studs of set dimensions (2"
  × 4", 2" × 6", etc.) made new techniques possible, notably wood-frame construction from the 1860s. Building this
  way was faster and cheaper and produced roomier houses, of two full storeys, within reach of the working class.
  The type is bound to industrialisation not only through its standardised materials and the new techniques that produced
  it, but through its purpose — housing a factory workforce newly settled in the cities, from the end of the 19th
  century into the beginning of the 20th — which is why most of these houses are found in dense urban settings. In
  the United States the type is often associated with the Boomtown style, which developed spectacularly at the time
  of industrialisation.'
