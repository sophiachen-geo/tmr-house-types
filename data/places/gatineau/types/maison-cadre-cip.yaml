profile_fr:
  contexte:
  - Construites à la fin des années 1920, ces maisons étaient destinées à loger les cadres de la Canadian International
    Paper (CIP) dont l’usine était adjacente et éponyme au Quartier-du-Moulin. Leur type bâti s’inscrit dans la mouvance
    américaine Arts & Crafts, dont les caractéristiques stylistiques et architecturales ont été importées du Royaume-Uni
    et adaptées au continent nord-américain. Ce style architectural privilégie des matériaux naturels tels que le
    bois sous forme de bardeaux ou de planches, la brique ou encore la pierre.
  - Les magazines architecturaux qui présentent différents modèles de maisons au début du 20e siècle connaissent une
    grande popularité aux États-Unis et au Canada et contribuent à la diffusion du style Arts & Crafts dans le monde
    anglo-saxon. Le torontois William Lyon Somerville, un des architectes attitrés de la CIP et concepteur présumé
    de ces maisons, a probablement privilégié ce style architectural pour les résidences du Quartier-du-Moulin. Les
    principes fondateurs de ce mouvement, tels que l’idéal du retour à la nature et l’attrait pour un mode de vie
    pastoral, conviennent parfaitement aux principes de cité-jardin suivis par la compagnie dans la planification
    de ses villes. Par exemple, les coyaux de toiture et les lucarnes rampantes qu’on retrouve sur certaines maisons
    pourraient évoquer vaguement un toit de chaume.
  repartition:
  - Présence dans le secteur de Gatineau, et plus particulièrement dans le site patrimonial du Quartier-du-Moulin.
  volumetrie:
  - Forme du toit
  - Toit à pente moyenne à abrupte et pignons perpendiculaires (fréquent).
  - Pignon asymétrique (occasionnel).
  - Présence de coyaux (fréquent).
  - Hauteur
  - Un étage et demi à deux étages et demi.
  - Plan au sol
  - Plan rectangulaire ou en L avec nombreuses saillies (fréquent).
  - Plan asymétrique (fréquent).
  - Saillies
  - Espace extérieur en loggia ou toit principal se prolongeant au-dessus du perron (fréquent).
  - Porche protégeant une entrée (rare).
  - Colonnes et poteaux carrés soutenant les porches (occasionnel).
  - Oriels (rare).
  ouvertures:
  - Portes
  - Porte principale simple ou avec tierces (fréquent).
  - Fenêtres
  - Fenêtres à guillotine, simples (occasionnel), jumelées (fréquent) ou multiples (occasionnel), avec 4 carreaux
    (rare), 8 carreaux (occasionnel) ou 12 carreaux (fréquent).
  - Lucarnes de formes variées (rampante, à fenêtre pendante, etc.) (occasionnel).
  revetement:
  - Mural
  - Revêtement extérieur en bardeaux de bois peinturés (fréquent).
  - Revêtement extérieur en planches à feuillure peinturées ou en clins de bois peinturés (fréquent). Les parements
    sont peints de couleur foncée.
  - Toit
  - Recouvrement en bardeaux d’asphalte (à l'origine).
  ornementation:
  - Chambranles de bois encadrant les ouvertures (fréquent).
  - Planches cornières (fréquent).
  - Contrevents ou volet en bois, ornementés d'un motif sculpté (fréquent).
  - Présence de pilastres encastrés dans la façade au niveau de l'entrée (occasionnel).
