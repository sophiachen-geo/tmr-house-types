conservation:
- 'Prefer: Extensions should be built at the rear of the building and remain barely visible from the street. In the
  case of a contemporary extension at the rear, the new volume, while leaving precedence to the original one, could
  take inspiration from the scale and forms of the original projections or secondary volumes.'
- 'Prefer: Maintain and keep the original components of the projections and galleries as well as the massing.'
- 'Prefer: Respect the principles of asymmetry when adding a new volume.'
- 'Avoid: Avoid removing a projection, significantly changing the form of its openings, or covering it with materials
  that do not correspond to the initial materials.'
- 'Avoid: Avoid an addition on the front façade that would harm the perception of the original volume.'
- 'Prefer: When replacing the windows, choose sash (guillotine) models. Favour a model with a number of panes similar
  to the original or to other houses of the same model built in the same period.'
- 'Prefer: Respect and maintain the original arrangement of the openings.'
- 'Avoid: Avoid replacing sash (guillotine) windows with casement windows or with any other type of opening mechanism.'
- 'Avoid: Avoid modifying the dimensions of the windows or blocking them up.'
- 'Prefer: Favour a cladding material in keeping with the identified original materials. Other complementary materials
  could however be considered for the addition of a new volume.'
- 'Prefer: Favour architectural-type shingles when replacing the roof covering.'
- 'Avoid: Avoid choosing a cladding whose appearance or finish does not correspond to the pre-identified original
  cladding materials for the original volumes.'
- 'Prefer: The original ornamentation should be maintained and kept, or else replaced when its preservation is not
  possible.'
- 'Avoid: Avoid adding ornaments that do not correspond to the pre-identified originals or that never existed on the
  building.'
- 'Avoid: Avoid removing original ornaments without replacing them.'
conservation_fr:
- Les agrandissements devraient être faits à l'arrière du bâtiment et demeurer peu visibles de la rue. Dans le cas
  d'un agrandissement contemporain à l'arrière, le nouveau volume, tout en laissant préséance à celui d’origine, pourrait
  s'inspirer du gabarit et des formes des saillies ou des volumes secondaires d'origine.
- Entretenir et maintenir les composantes d'origine des saillies et galeries ainsi que la volumétrie.
- Respecter les principes d’asymétrie dans l’ajout d’un nouveau volume.
- Éviter le retrait d'une saillie, le changement significatif de la forme de ses ouvertures ou encore son recouvrement
  par des matériaux ne correspondant pas aux matériaux initiaux.
- Éviter un ajout en façade qui nuirait à la perception du volume original.
- Au moment de remplacer les fenêtres, choisir des modèles à guillotine. Favoriser un modèle avec un nombre similaire
  de carreaux par rapport à l'original ou à d'autres maisons du même modèle construites à la même époque.
- Respecter et maintenir la disposition originale des ouvertures.
- Éviter de remplacer des fenêtres à guillotine par des fenêtres à battants ou par tout autre type de mode d'ouverture.
- Éviter de modifier les dimensions des fenêtres ou de les murer.
- Privilégier un matériau de recouvrement en accord avec les matériaux d'origine identifiés. D'autres matériaux complémentaires
  pourraient cependant être envisagés pour l'ajout d'un nouveau volume.
- Privilégier des bardeaux de type architecturaux lors du remplacement du revêtement de toiture.
- Éviter de choisir un revêtement dont l'aspect ou le fini ne correspond pas aux matériaux de revêtement d'origine
  préidentifiés pour les volumes originaux.
- Les ornementations originales devraient être entretenues et maintenues ou encore remplacées lorsque leur préservation
  n'est pas possible.
- Éviter d'ajouter des ornements ne correspondant pas aux originaux préidentifiés ou n’ayant jamais existé sur le
  bâtiment.
- Éviter de retirer des ornements originaux sans les remplacer.
blurb_en: 'The paper company''s house for its managers: an Arts and Crafts cottage of one and a half to two and a
  half storeys, its rectangular or L plan broken by projections, under a medium to steep roof with perpendicular gables
  and flared coyaux, in dark-painted shingle or board, with carved shutters — set back behind a double row of trees
  on three blocks of the Quartier-du-Moulin.'
origin_en: Built at the end of the 1920s, these houses were intended to lodge the executives of the Canadian International
  Paper (CIP), whose mill stood adjacent to — and gave its name to — the Quartier-du-Moulin. The building type belongs
  to the American Arts & Crafts current, whose stylistic and architectural characteristics were imported from the
  United Kingdom and adapted to the North American continent, and which favours natural materials such as wood in
  the form of shingles or boards, brick, or stone. Architectural magazines presenting house models were hugely popular
  in the United States and Canada in the early 20th century and spread the Arts & Crafts style through the anglophone
  world; the Toronto architect William Lyon Somerville, one of CIP's retained architects and the presumed designer
  of these houses, probably chose this style for the Quartier-du-Moulin residences. The movement's founding principles
  — the ideal of a return to nature and the appeal of a pastoral way of life — suited the garden-city principles the
  company followed in planning its towns, and details such as the roof coyaux and shed dormers found on some houses
  may vaguely evoke a thatched roof.
