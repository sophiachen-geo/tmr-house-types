conservation:
- 'Prefer: Enlargements should be made at the rear of the building and remain barely visible from the street. In the
  case of a contemporary rear enlargement, the new volume could draw on the size and the forms of the original extensions
  or secondary volumes.'
- 'Prefer: Maintain and keep the original components of the projections and galleries as well as the massing.'
- 'Prefer: When the replacement of original components is unavoidable, favour materials or a massing whose appearance
  recalls the original. A contemporary interpretation could however be authorised.'
- 'Avoid: Avoid enlargements or additions in height that would alter the massing of the roof or the precedence of
  the main volume.'
- 'Avoid: Avoid the removal of a projection, the significant change of the shape of its openings, or its covering
  with materials that do not correspond to the initial materials.'
- 'Prefer: When replacing the windows, choose sash (guillotine) models. For the windows in the gable, keep the shape
  of the window.'
- 'Prefer: Favour a model with a number of panes similar to the original or to other houses of the same model built
  in the same period.'
- 'Prefer: Respect and maintain the original arrangement of the openings (an off-centre door on the façade flanked
  by a window, and one to two windows on the façade on the upper floor).'
- 'Avoid: When the house has a secondary entrance, avoid removing it.'
- 'Avoid: Avoid replacing sash (guillotine) windows with casement windows or with any other type of window or mode
  of opening.'
- 'Avoid: Avoid modifying the dimensions of the windows or walling them up.'
- 'Prefer: Favour a cladding material in keeping with the identified original materials. Other complementary materials
  could however be considered for the addition of a new volume.'
- 'Avoid: Avoid choosing a cladding whose appearance or finish does not correspond to the pre-identified original
  cladding materials for the original volumes.'
- 'Prefer: The original ornamentation should be maintained and kept, or else replaced when its preservation is not
  possible.'
- 'Avoid: Avoid adding ornaments that do not correspond to the pre-identified originals or that never existed on the
  building.'
- 'Avoid: Avoid removing original ornaments without replacing them.'
conservation_fr:
- Les agrandissements devraient être faits à l'arrière du bâtiment et demeurer peu visibles de la rue. Dans le cas
  d'un agrandissement contemporain à l'arrière, le nouveau volume pourrait s'inspirer du gabarit et des formes des
  extensions ou des volumes secondaires d'origine.
- Entretenir et maintenir les composantes d'origine des saillies et galeries ainsi que la volumétrie.
- Lorsque le remplacement des composantes d'origine est inévitable, privilégier des matériaux ou une volumétrie dont
  l'aspect rappelle l'original. Une interprétation contemporaine pourrait cependant être autorisée.
- Éviter les agrandissements ou les ajouts en hauteur qui altéreraient la volumétrie du toit ou la préséance du volume
  principal.
- Éviter le retrait d'une saillie, le changement significatif de la forme de ses ouvertures ou encore son recouvrement
  par des matériaux ne correspondant pas aux matériaux initiaux.
- Au moment de remplacer les fenêtres, choisir des modèles à guillotine. Pour les fenêtres dans le pignon, conserver
  la forme de la fenêtre.
- Favoriser un modèle avec un nombre similaire de carreaux par rapport à l'original ou à d'autres maisons du même
  modèle construites à la même époque.
- Respecter et maintenir la disposition originale des ouvertures (une porte décentrée en façade jouxtée d'une fenêtre
  et une à deux fenêtres en façade à l'étage).
- Lorsque la maison possède une entrée secondaire, éviter de la retirer.
- Éviter de remplacer des fenêtres à guillotine par des fenêtres à battants ou par tout autre type de fenêtres ou
  mode d'ouverture.
- Éviter de modifier les dimensions des fenêtres ou de les murer.
- Privilégier un matériau de recouvrement en accord avec les matériaux d'origine identifiés. D'autres matériaux complémentaires
  pourraient cependant être envisagés pour l'ajout d'un nouveau volume.
- Éviter de choisir un revêtement dont l'aspect ou le fini ne correspond pas aux matériaux de revêtement d'origine
  préidentifiés pour les volumes originaux.
- Les ornementations originales devraient être entretenues et maintenues ou encore remplacées lorsque leur préservation
  n'est pas possible.
- Éviter d'ajouter des ornements ne correspondant pas aux originaux préidentifiés ou n’ayant jamais existé sur le
  bâtiment.
- Éviter de retirer des ornements originaux sans les remplacer.
blurb_en: 'The same narrow gable-front house rebuilt in brick: two to two and a half storeys, a main body about 20
  feet wide and 24 to 26 deep, an off-centre door beside a single window, and a gallery on the front or turning an
  L on square, round or turned wood columns. The by-law passed after the great Hull fire of 1900 is why the brick
  is there.'
origin_en: 'The "maison allumette" appears from the 1870s, its origin owing notably to the opening of the American
  market to Canada; commercial and cultural exchange between the two countries brought in American architectural catalogues
  with illustrated plans and building instructions for wooden workers'' houses, very popular with Canadian contractors
  and amateur builders. Although matchbox houses exist in every sector of the city, their narrow form is said to come
  from the rectangular subdivision typical of the Wright family''s lands in Hull, surveyed in 1864 by W. A. Austin:
  the narrowness and depth of the lots led to the adaptation of American settler houses, which, rectangular with a
  ridge line parallel to the street, were pivoted 90 degrees to suit the narrow lots, their gable wall thus moving
  to the façade. The multiplication of brick matchbox houses is directly linked to the adoption of a municipal by-law
  following the great Hull fire of 1900, which henceforth obliged new construction in the devastated sector to be
  clad in a non-combustible material; a few brick matchbox houses existed before the fire, but the buildings rebuilt
  within that perimeter are now very often clad this way. From the beginning of the 20th century the brick matchbox
  house adopts certain features of neo-Queen Anne architecture, such as a veranda with a corner rotunda, fenestrated
  projections on the façade or increased ornamentation, which, like the exterior brick cladding, attest to the higher
  level of sophistication of the original owners, often members of the petite bourgeoisie, compared with the owners
  of wooden houses, often from the working class.'
