profile:
  siting_landscape: []
  massing:
  - Gable roof with two straight slopes, with the ridge line perpendicular to the street and the gable wall on the
    façade.
  - Two storeys to two and a half storeys.
  - The half-storey, when present, is located under the attic.
  - Main dwelling body rectangular, generally 20 feet wide and about 24 to 26 feet deep.
  - Secondary body at the rear oriented perpendicularly, or offset from the main body, with a sloped or lean-to roof.
  - Covered gallery on the façade along one side or in an L, with a lean-to roof parallel to the street (frequent),
    with a triangular pediment facing the street (occasional).
  - Fenestrated projection (oriel, bay window) on the façade (occasional), or balcony or logette (occasional).
  - The columns on the gallery are generally square, round or turned, in wood, their dimensions varying between 8
    and 10 inches in width. The columns rest on masonry plinths (frequent).
  articulation:
  - Brick matchbox houses of two to two and a half storeys are generally sober, apart from the projections, the gable
    and the shape of the windows as well as their surrounds.
  - Soldier-course bricks or arched brick lintels above the openings (frequent).
  - Return of the eaves (occasional).
  - Wood roof verge (occasional).
  - Relief patterning with brick on the façade (frequent).
  openings:
  - Simple, glazed main door, with a transom above the main door (occasional).
  - Main entrance door off-centre relative to the façade.
  - Presence of one (frequent) or two windows (rare) on the ground floor, sometimes more if an oriel is present, and
    of two windows on the upper floor (frequent).
  - Presence of a rectangular window (frequent) or of another shape (occasional) in the gable.
  - Presence of a variety of window shapes (segmental arch, oriel, etc.) (occasional).
  - The typical windows are vertical, sash (guillotine) windows with 4 panes (frequent), 6 panes (rare), 9 panes (rare)
    or 12 panes (occasional).
  materials:
  - Exterior cladding in smooth-finish red clay brick of Modular format (8" × 2 ½" × 3 ½"), with a stretcher bond.
  - Wood shingle cladding in the upper part of the gable wall on the façade (occasional).
profile_fr:
  contexte:
  - La « maison allumette » fait son apparition à partir des années 1870. Son origine découle notamment de l'ouverture
    du marché américain au Canada. Les échanges commerciaux et culturels entre les deux pays donnent lieu à l'importation
    de catalogues architecturaux américains, avec plans illustrés et indications relatives à la construction de maisons
    ouvrières en bois, très populaires auprès des entrepreneurs et des constructeurs amateurs canadiens.
  - Bien qu'il existe des maisons allumettes dans tous les secteurs de la ville, leur forme étroite proviendrait du
    lotissement rectangulaire typique des terres appartenant à la famille Wright à Hull, effectué en 1864 par l'arpenteur
    W. A. Austin. L'étroitesse et la profondeur des terrains auraient donc entraîné l'adaptation des maisons de colon
    américaines. Celles-ci, de forme rectangulaire avec une ligne faîtière parallèle à la rue, auraient ainsi pivoté
    de 90 degrés pour s'adapter aux lots étroits, leur mur pignon passant alors en façade.
  - La multiplication des maisons allumettes en brique est directement liée à l'adoption d'un règlement municipal
    à la suite du grand incendie de Hull en 1900, qui oblige dorénavant les nouvelles constructions du secteur ravagé
    à être revêtues d'un parement incombustible. S'il y avait déjà quelques maisons allumettes en brique avant l'incendie,
    les bâtiments reconstruits dans ce périmètre en sont maintenant très souvent recouverts. La maison allumette en
    brique adopte dès le début du 20e siècle certaines caractéristiques de l'architecture de style néo-Queen Anne,
    comme une véranda avec rotonde en coin, des saillies fenestrées en façade ou encore une ornementation accrue.
    Ces éléments architecturaux, tout comme le revêtement extérieur en briques, témoignent du niveau plus élevé de
    sophistication des propriétaires initiaux, souvent membres de la petite bourgeoisie, comparativement aux propriétaires
    de maisons en bois, souvent issus de la classe ouvrière.
  repartition:
  - Présence marquée dans les secteurs de Hull et d'Aylmer et, dans une moindre mesure, dans le secteur de Buckingham.
  volumetrie:
  - Toit à deux versants droits avec ligne faîtière perpendiculaire à la rue et mur pignon en façade.
  - Deux étages à deux étages et demi.
  - Le demi-étage, lorsque présent, est situé sous les combles.
  - Corps de logis principal rectangulaire généralement de 20 pieds de largeur et d'environ 24 à 26 pieds de profondeur.
  - Corps secondaire à l'arrière orienté perpendiculairement, ou décalé par rapport au corps principal, avec une toiture
    en pente ou en appentis.
  - Galerie couverte en façade sur un côté ou en L avec toit en appentis parallèle à la rue (fréquent), avec fronton
    triangulaire face à la rue (occasionnel).
  - Saillie fenestrée (oriel, baie vitrée) en façade (occasionnel), ou balcon ou logette (occasionnel).
  - Les colonnes sur la galerie sont généralement de forme carrée, ronde ou tournée en bois dont les dimensions varient
    entre 8 et 10 pouces de largeur. Les colonnes reposent sur des socles en maçonnerie (fréquent).
  ouvertures:
  - Porte principale simple et fenestrée, avec une imposte au-dessus de la porte principale (occasionnel).
  - Porte d'entrée principale décentrée par rapport à la façade.
  - Présence d'une (fréquent) ou deux fenêtres (rare) au rez-de-chaussée, parfois plus si présence d'un oriel et de
    deux fenêtres à l'étage (fréquent).
  - Présence d'une fenêtre de forme rectangulaire (fréquente) ou d'une autre forme (occasionnel) dans le pignon.
  - Présence d'une variété de formes de fenêtres (arc surbaissé, oriel, etc.) (occasionnel).
  - Les fenêtres types sont verticales, à guillotine avec 4 carreaux (fréquent), 6 carreaux (rare), 9 carreaux (rare)
    ou 12 carreaux (occasionnel).
  revetement:
  - Revêtement extérieur en briques d'argile rouge de fini lisse de format Modular (8" × 2 ½" × 3 ½"), avec un appareillage
    en panneresse.
  - Revêtement en bardeaux de bois dans le haut du mur pignon en façade (occasionnel).
  ornementation:
  - Les maisons allumettes en brique de deux à deux étages et demi sont généralement sobres, hormis les saillies,
    le pignon et la forme des fenêtres ainsi que leur habillage.
  - Briques en soldat ou linteaux arqués en briques au-dessus des ouvertures (fréquent).
  - Retour de l'avant-toit (occasionnel).
  - Rive du toit en bois (occasionnel).
  - Jeu de relief avec la brique en façade (fréquent).
