conservation:
- 'Prefer: Extensions should be built at the rear of the building and remain barely visible from the street. In the
  case of a contemporary rear extension, the new volume could take inspiration from the size and forms of the original
  extensions or secondary volumes.'
- 'Prefer: Maintain and keep the original components of the projections and galleries as well as the massing.'
- 'Prefer: Where replacement of original components is unavoidable, favour materials or a massing whose appearance
  recalls the original. A contemporary interpretation could nevertheless be authorised.'
- 'Avoid: Avoid extensions or additions in height that would alter the massing of the roof or the precedence of the
  main volume.'
- 'Avoid: Avoid dismantling the original galleries or other projections without replacing them.'
- 'Prefer: When replacing the windows, choose sash (guillotine) models. Favour a model with a similar number of panes
  compared with the original or with other houses of the same model built in the same period.'
- 'Prefer: Respect and maintain the original arrangement of the openings (an off-centre door on the façade flanked
  by a window, and one to two windows on the upper-floor façade).'
- 'Prefer: If dormers are added, favour discreet models, such as shed dormers.'
- 'Avoid: Where the house has a secondary entrance, avoid removing it.'
- 'Avoid: Avoid replacing sash (guillotine) windows with casement windows or with any other type of window or mode
  of opening.'
- 'Avoid: Avoid altering the dimensions of the windows or blocking them up.'
- 'Prefer: Favour a cladding material in keeping with the identified original materials, such as wood or wood imitation
  (e.g. fibre-cement).'
- 'Avoid: Avoid choosing a cladding whose appearance or finish does not correspond to the pre-identified original
  cladding materials.'
- 'Prefer: The original ornamentation should be maintained and kept, or else replaced when its preservation is not
  possible.'
- 'Avoid: Avoid adding ornaments that do not correspond to the pre-identified originals or that never existed on the
  building.'
- 'Avoid: Avoid removing original ornaments without replacing them.'
conservation_fr:
- Les agrandissements devraient être faits à l'arrière du bâtiment et demeurer peu visibles de la rue. Dans le cas
  d'un agrandissement contemporain à l'arrière, le nouveau volume pourrait s'inspirer du gabarit et des formes des
  extensions ou des volumes secondaires d'origine.
- Entretenir et maintenir les composantes d'origine des saillies et galeries ainsi que la volumétrie.
- Lorsque le remplacement des composantes d'origine est inévitable, privilégier des matériaux ou une volumétrie dont
  l'aspect rappelle l'original. Une interprétation contemporaine pourrait cependant être autorisée.
- Éviter les agrandissements ou les ajouts en hauteur qui altéreraient la volumétrie du toit ou la préséance du volume
  principal.
- Éviter de démanteler les galeries ou autres saillies originales sans les remplacer.
- Au moment de remplacer les fenêtres, choisir des modèles à guillotine. Favoriser un modèle avec un nombre similaire
  de carreaux par rapport à l'original ou à d'autres maisons du même modèle construites à la même époque.
- Respecter et maintenir la disposition originale des ouvertures (une porte décentrée en façade jouxtée d'une fenêtre
  et une à deux fenêtres en façade à l'étage).
- Si des lucarnes sont ajoutées, privilégier des modèles discrets, comme des lucarnes rampantes.
- Lorsque la maison possède une entrée secondaire, éviter de la retirer.
- Éviter de remplacer des fenêtres à guillotine par des fenêtres à battants ou par tout autre type de fenêtres ou
  mode d'ouverture.
- Éviter de modifier les dimensions des fenêtres ou de les murer.
- Privilégier un matériau de recouvrement en accord avec les matériaux d'origine identifiés tels que le bois ou l'imitation
  du bois (p. ex. fibro-ciment).
- Éviter de choisir un revêtement dont l'aspect ou le fini ne correspond pas aux matériaux de revêtement d'origine
  préidentifiés.
- Les ornementations originales devraient être entretenues et maintenues ou encore remplacées lorsque leur préservation
  n'est pas possible.
- Éviter d'ajouter des ornements ne correspondant pas aux originaux préidentifiés ou n'ayant jamais existé sur le
  bâtiment.
- Éviter de retirer des ornements originaux sans les remplacer.
blurb_en: 'The smallest of the match houses: one and a half storeys of wood turned end-on to the street, the ridge
  running back from it so the gable wall serves as the front. The main body is 16 to 18 feet wide and about 20 feet
  deep, frequently with a secondary body behind, and a covered gallery or lean-to porch on the front, raised only
  slightly above the street. The door is off-centre; clapboard, corner boards and plain casings are nearly the whole
  of the decoration.'
origin_en: 'The "maison allumette" appears from the 1870s onward, its origin stemming notably from the opening of
  the American market to Canada: commercial and cultural exchange between the two countries brought in American architectural
  catalogues whose illustrated plans and building instructions for wooden workers'' houses were popular with Canadian
  contractors and amateur builders. Its arrival also matched a period of demographic explosion between 1871 and 1891
  in what is now Ville de Gatineau, driven by industrialisation and rural exodus, while standardised lumber and the
  large sawmills at Hull made wood easy to obtain for house building. The narrow form is attributed to an 1860 law
  obliging Lower Canada municipalities to survey their territory; in 1864, on Wright family land at Hull, the surveyor
  W. A. Austin laid out typical lots 66 feet wide by 99 feet deep, which new buyers then subdivided into lots 33 feet
  wide by 99 feet deep. The narrowness and depth of those lots is held to have forced the adaptation of the American
  settler house: rectangular, with its ridge parallel to the street, it pivoted 90 degrees to fit the narrow lots,
  bringing its gable wall to the front.'
