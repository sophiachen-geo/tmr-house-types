profile:
  siting_landscape:
  - Marked presence in the Hull and Aylmer sectors and, to a lesser extent, in the Buckingham, Gatineau and Masson-Angers
    sectors.
  massing:
  - Straight two-slope (gable) roof with the ridge perpendicular to the street and the gable wall on the front.
  - One and a half storeys.
  - The half-storey, where present, is located under the attic.
  - Rectangular main house body, generally 16 to 18 feet wide and about 20 feet deep.
  - Frequent presence of a square secondary body at the rear projecting to the side, of one or two storeys with a
    sloped roof (frequent), a shed roof (frequent) or a flat roof (occasional).
  - Covered gallery on the front with a shed-roof slope, parallel to the street (frequent) and/or with a triangular
    pediment facing the street (occasional). The gallery is (generally) raised only slightly above the street, with
    or without a railing. A side gallery gives access to the rear extension (frequent).
  - Stoop with or without a canopy (occasional).
  - The columns on the gallery are generally square or round, of wood, and their dimensions vary.
  articulation:
  - One-and-a-half-storey wooden matchstick houses are plain and devoid of ornament, apart from a few rare exceptions.
  - Originally, every wooden matchstick house had wooden casings around the openings.
  - Returning eaves (occasional).
  openings:
  - Simple glazed main door (frequent).
  - Main entrance door set off-centre in relation to the façade.
  - One of the principal variations of one-and-a-half-storey wooden matchstick houses is the presence of one window
    or of two windows in the upper part of the gable.
  - The typical windows are vertical, sash (guillotine) windows with 4 panes (frequent), 6 panes (rare), 9 panes (rare)
    or 12 panes (occasional).
  - Presence of one (frequent) or two (rare) windows on the ground floor.
  materials:
  - The cladding of the whole house is often of horizontal boards (clapboard or shiplap boards) (frequent), of vertical
    boards (occasional) or of wood shingles (rare).
  - The corners of the house are emphasised by corner boards (frequent).
profile_fr:
  contexte:
  - La « maison allumette » fait son apparition à partir des années 1870. Son origine découle notamment de l'ouverture
    du marché américain au Canada. Les échanges commerciaux et culturels entre les deux pays donnent lieu à l'importation
    de catalogues architecturaux américains. Ces publications, qui présentent des plans illustrés ainsi que des indications
    relatives à la construction de maisons ouvrières en bois, sont alors populaires auprès des entrepreneurs et des
    constructeurs amateurs canadiens.
  - L'avènement de la maison allumette correspond également à une période d'explosion démographique entre 1871 et
    1891 dans le secteur actuel de la Ville de Gatineau, en raison de l'industrialisation et de l'exode rural. La
    standardisation du bois d'œuvre et la présence d'importantes scieries à Hull facilitent aussi l'accès aux matériaux
    de bois pour la construction résidentielle.
  - La forme étroite de la maison allumette découlerait d'une loi adoptée en 1860 qui oblige les municipalités du
    Bas-Canada à cadastrer leur territoire. En 1864, sur des terres appartenant à la famille Wright à Hull, l'arpenteur
    W. A. Austin crée ainsi des lots typiques de 66 pieds de largeur sur 99 pieds de profondeur, lesquels sont ensuite
    subdivisés par les nouveaux acheteurs en terrains de 33 pieds de largeur sur 99 pieds de profondeur. L'étroitesse
    et la profondeur des terrains auraient donc entraîné l'adaptation des maisons de colon américaines. Celles-ci,
    de forme rectangulaire avec une ligne faîtière parallèle à la rue, auraient ainsi pivoté de 90 degrés pour s'adapter
    aux lots étroits, leur mur pignon passant alors en façade.
  repartition:
  - Présence marquée dans les secteurs de Hull et d'Aylmer, et, dans une moindre mesure, dans les secteurs de Buckingham,
    de Gatineau et de Masson-Angers.
  volumetrie:
  - Toit à deux versants droits avec ligne faîtière perpendiculaire à la rue et mur pignon en façade.
  - Un étage et demi.
  - Le demi-étage, lorsque présent, est situé sous les combles.
  - Corps de logis principal rectangulaire, généralement de 16 à 18 pieds de largeur et d'environ 20 pieds de profondeur.
  - Présence (fréquente) d'un corps secondaire de forme carrée à l'arrière dépassant sur le côté, d'un ou deux étages
    avec toit en pente (fréquent), en appentis (fréquent) ou avec un toit plat (occasionnel).
  - Galerie couverte en façade avec une pente de toit en appentis, parallèle à la rue (fréquent) et/ou avec fronton
    triangulaire face à la rue (occasionnel). La galerie est (généralement) peu surélevée par rapport à la rue, avec
    ou sans garde-corps. Une galerie latérale donne accès à l'extension arrière (fréquent).
  - Perron avec ou sans avant-toit (occasionnel).
  - Les colonnes sur la galerie sont généralement carrées ou rondes, en bois et leurs dimensions varient.
  ouvertures:
  - Porte principale simple fenestrée (fréquent).
  - Porte d'entrée principale décentrée par rapport à la façade.
  - Une des principales variations des maisons allumettes en bois d'un étage et demi est la présence d'une fenêtre
    ou de deux fenêtres dans le haut du pignon.
  - Les fenêtres types sont verticales, à guillotine avec 4 carreaux (fréquent), 6 carreaux (rare), 9 carreaux (rare)
    ou 12 carreaux (occasionnel).
  - Présence d'une (fréquent) ou deux (rare) fenêtres au rez-de-chaussée.
  revetement:
  - Le parement de toute la maison est souvent en planches horizontales (planches à clin ou à feuillure) (fréquent),
    en planches verticales (occasionnel) ou en bardeaux de bois (rare).
  - Les angles de la maison sont soulignés par des planches cornières (fréquent).
  ornementation:
  - Les maisons allumettes en bois d'un étage et demi sont sobres et dépourvues d'ornements, hormis quelques rares
    exceptions.
  - À l'origine, chaque maison allumette en bois possédait des chambranles en bois autour des ouvertures.
  - Retour de l'avant-toit (occasionnel).
