conservation:
- 'Prefer: Enlargements should be made at the rear of the building and remain little visible from the street. In the
  case of a contemporary rear addition, the new volume could take inspiration from the size and the forms of the original
  extensions or secondary volumes.'
- 'Prefer: Maintain and keep the original components of the projections and galleries as well as the massing.'
- 'Prefer: When replacement of the original components is unavoidable, favour materials or a massing whose appearance
  recalls the original. A contemporary interpretation could however be authorised.'
- 'Avoid: Avoid enlargements or additions in height that would alter the massing of the roof or the precedence of
  the main volume.'
- 'Avoid: Avoid the removal of a projection or a gallery, significant change to the form of the openings, or covering
  with materials that do not correspond to the initial materials.'
- 'Prefer: When replacing the windows, choose guillotine (sash) models. Favour a model with a similar number of panes
  compared with the original or with other houses of the same model built in the same period.'
- 'Prefer: Respect and maintain the original arrangement of the openings.'
- 'Avoid: When the house has a secondary entrance, avoid removing it.'
- 'Avoid: Avoid replacing guillotine (sash) windows with casement windows or with any other type of opening mechanism.'
- 'Avoid: Avoid modifying the dimensions of the windows or blocking them up.'
- 'Prefer: Favour a cladding material in keeping with the identified original materials such as wood or wood imitation
  or brick.'
- 'Avoid: Avoid choosing a cladding whose appearance or finish does not correspond to the pre-identified original
  cladding materials for the original volumes.'
- 'Prefer: The original ornaments should be maintained and kept, or else replaced when their preservation is not possible.'
- 'Avoid: Avoid adding ornaments that do not correspond to the pre-identified originals or that never existed on the
  building.'
- 'Avoid: Avoid removing original ornaments without replacing them.'
conservation_fr:
- Les agrandissements devraient être faits à l'arrière du bâtiment et demeurer peu visibles de la rue. Dans le cas
  d'un agrandissement contemporain à l'arrière, le nouveau volume pourrait s'inspirer du gabarit et des formes des
  extensions ou des volumes secondaires d'origine.
- Entretenir et maintenir les composantes d'origine des saillies et galeries ainsi que la volumétrie.
- Lorsque le remplacement des composantes d'origine est inévitable, privilégier des matériaux ou une volumétrie dont
  l'aspect rappelle l'original. Une interprétation contemporaine pourrait cependant être autorisée.
- Éviter les agrandissements ou les ajouts en hauteur qui altéreraient la volumétrie du toit ou la préséance du volume
  principal.
- Éviter le retrait d'une saillie ou d'une galerie, le changement significatif de la forme des ouvertures ou encore
  le recouvrement par des matériaux ne correspondant pas aux matériaux initiaux.
- Au moment de remplacer les fenêtres, choisir des modèles à guillotine. Favoriser un modèle avec un nombre similaire
  de carreaux par rapport à l'original ou à d'autres maisons du même modèle construites à la même époque.
- Respecter et maintenir la disposition originale des ouvertures.
- Lorsque la maison possède une entrée secondaire, éviter de la retirer.
- Éviter de remplacer des fenêtres à guillotine par des fenêtres à battants ou par tout autre type de mode d'ouverture.
- Éviter de modifier les dimensions des fenêtres ou de les murer.
- Privilégier un matériau de recouvrement en accord avec les matériaux d'origine identifiés tels que le bois ou l'imitation
  du bois ou la brique.
- Éviter de choisir un revêtement dont l'aspect ou le fini ne correspond pas aux matériaux de revêtement d'origine
  préidentifiés pour les volumes originaux.
- Les ornementations originales devraient être entretenues et maintenues ou encore remplacées lorsque leur préservation
  n'est pas possible.
- Éviter d'ajouter des ornements ne correspondant pas aux originaux préidentifiés ou n'ayant jamais existé sur le
  bâtiment.
- Éviter de retirer des ornements originaux sans les remplacer.
blurb_en: The gable wall to the street under a two-slope mansard whose brisis sits at a shallow angle, straight (frequent)
  or with flared coyaux (occasional). A covered gallery, raised a little above the street, runs the full width of
  the front (frequent), half of it, or turns an L, under its own shed roof on square or round wood columns. The top
  of the gable is often clad in something different from the rest.
origin_en: In Gatineau this type shares several characteristics with the maison allumette, the two kinds of dwelling
  having appeared at close periods; its layout may have been influenced by the narrowness of lots across the Gatineau
  territory. The two-slope mansard was popularised in Quebec after achieving great success in the United States from
  the 1850s onward, and houses built with this kind of roof took their inspiration at the time from Dutch houses.
  The type also spread widely in planned industrial towns, and its construction owes much to the plan catalogues that
  were very popular in the early 20th century, in which the models shown were built from standardised, machine-made
  materials. The various kinds of projections and ornaments found on this typology, like the use of natural materials
  such as brick and wood (clapboard, rabbeted board or shingle), are thought to be influenced by the Arts & Crafts
  movement.
