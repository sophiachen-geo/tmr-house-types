profile:
  siting_landscape:
  - Marked presence in the Aylmer sector and, to a lesser extent, in the Hull and Buckingham sectors.
  massing:
  - 'Roof form: straight two-slope (gable) roof of medium pitch.'
  - Central gable centred on the front façade, whose width varies.
  - 'Height: one and a half storeys (frequent) to two and a half storeys (rare).'
  - 'Ground plan: rectangular plan with the longest side facing the street.'
  - 'Projections: gallery covered by a shed roof on the façade (occasional).'
  - Porch sheltering the main entrance, placed at the centre of the façade (occasional).
  - Worked wooden columns and posts supporting the roof of a gallery or a porch (frequent).
  - Chimneys at the top of the side walls (frequent).
  articulation:
  - Central-gable houses are little ornamented, apart from the woodwork details of the projections.
  - Soldier-course stones (frequent) or arched stone lintels (frequent) framing the openings on stone houses.
  - Wooden casings framing the openings (frequent) on wood-clad houses.
  - Corner boards on wood-clad houses (frequent).
  openings:
  - 'Doors: main entrance door at the centre of the façade with a transom and/or sidelights (frequent).'
  - 'Windows: the typical windows are vertical, single (frequent) or paired (occasional), sash windows with 4 panes
    (occasional), 6 panes (rare), 9 panes (rare) or 12 panes (frequent).'
  - Presence of two windows on the ground floor of the façade, placed on either side of the main door.
  - Presence of a single window (occasional), a paired window (occasional) or triplets with side lights differing
    from the central light (occasional) in the central gable on the façade at the upper level. The window there is
    often wider than those of the ground floor.
  materials:
  - 'Wall: exterior cladding in wood clapboard, in rabbeted (shiplap) boards (occasional) or in pièce sur pièce (occasional).'
  - Exterior cladding in red brick of Modular format (8" × 2 ½" × 3 ½"), with a stretcher bond (occasional).
  - Exterior cladding in stone (occasional).
profile_fr:
  contexte:
  - La maison à pignon central figure parmi les premiers types bâtis résidentiels à s’implanter dans la région de
    Hull dès les années 1830. Ce type est construit tout au long du 19e siècle en s'inspirant d'éléments architecturaux
    caractéristiques de différents styles. On l’associe par exemple à l’architecture vernaculaire ontarienne en raison
    de sa forte popularité dans les communautés rurales du Haut-Canada, principalement dans le corridor entre les
    villes de Kingston et Ottawa, où plusieurs de ces maisons datant d’avant 1860 sont construites en pierre.
  - Au Québec, on la retrouve souvent dans les communautés anglophones du sud de la province. La maison à pignon central
    devient également une variante de la maison d’influence industrielle américaine, rendue possible grâce à la standardisation
    des matériaux, et se répand dans les autres régions du Québec, notamment en Gaspésie et dans les Maritimes avec
    une ornementation souvent plus simplifiée.
  - Les différents éléments architecturaux retrouvés sur les maisons à pignon central l’associent parfois au style
    néo-gothique, notamment par la présence d’ouvertures en ogive, d’un revêtement extérieur en bois, de bordures
    de rive de toit ouvragées ou d’un épi de faîtage couronnant la lucarne pignon. Ces derniers éléments ne sont toutefois
    pas présents à Gatineau. La maison à pignon central est ici davantage tributaire du style géorgien par le plan
    rectangulaire, le revêtement en pierre, la composition symétrique, le pignon en façade et la porte centrale, surmontée
    d’une imposte en éventail et encadrée par d’étroites fenêtres latérales.
  repartition:
  - Présence marquée dans le secteur d’Aylmer et, dans une moindre mesure, dans les secteurs de Hull et de Buckingham.
  volumetrie:
  - Forme du toit – Toit à deux versants droits de pente moyenne.
  - Forme du toit – Pignon central centré en façade avant dont la largeur varie.
  - Hauteur – Un étage et demi (fréquent) à deux étages et demi (rare).
  - Plan au sol – Plan de forme rectangulaire avec le pan le plus long face à la rue.
  - Saillies – Galerie couverte par un toit en appentis en façade (occasionnel).
  - Saillies – Porche protégeant l’entrée principale disposé au centre de la façade (occasionnel).
  - Saillies – Colonnes et poteaux ouvragés en bois soutenant le toit d’une galerie ou d’un porche (fréquent).
  - Saillies – Cheminées au sommet des murs latéraux (fréquent).
  ouvertures:
  - Portes – Porte d’entrée principale au centre de la façade avec imposte et/ou fenêtres latérales (fréquent).
  - Fenêtres – Les fenêtres types sont verticales, simples (fréquent) ou jumelées (occasionnel), à guillotine avec
    4 carreaux (occasionnel), 6 carreaux (rare), 9 carreaux (rare) ou 12 carreaux (fréquent).
  - Fenêtres – Présence de deux fenêtres au rez-de-chaussée en façade et situées de part et d’autre de la porte principale.
  - Fenêtres – Présence d’une fenêtre simple (occasionnel), jumelée (occasionnel) ou triplets à baies latérales différentes
    de la baie centrale (occasionnel) dans le pignon central en façade à l’étage. La fenêtre y est souvent plus large
    que celles du rez-de-chaussée.
  revetement:
  - Mural – Revêtement extérieur en clins de bois, en planches à feuillure (occasionnel) ou en pièce sur pièce (occasionnel).
  - Mural – Revêtement extérieur en briques rouges de format Modular (8" × 2 ½" × 3 ½"), avec un appareillage en panneresse
    (occasionnel).
  - Mural – Revêtement extérieur en pierres (occasionnel).
  ornementation:
  - Les maisons à pignon central sont peu ornementées, hormis les détails des boiseries des saillies.
  - Pierres en soldat (fréquent) ou linteaux arqués en pierre (fréquent) encadrant les ouvertures sur les maisons
    en pierre.
  - Chambranles en bois encadrant les ouvertures (fréquent) sur les maisons recouvertes de bois.
  - Planches cornières sur les maisons recouvertes de bois (fréquent).
