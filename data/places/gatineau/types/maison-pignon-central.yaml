conservation:
- 'Prefer: Additions should be made at the rear of the building and remain little visible from the street. In the
  case of a contemporary addition at the rear, the new volume could take inspiration from the size and the forms of
  the original extensions or secondary volumes.'
- 'Prefer: Preserve the symmetry of the volume and of the façade composition.'
- 'Prefer: Maintain the original exterior projections (gallery, storm porch, etc.) and replace them if their preservation
  is not possible.'
- 'Avoid: Avoid additions or upward extensions that would alter the massing of the roof or the precedence of the main
  volume.'
- 'Avoid: Avoid an addition on the façade that would harm the perception of the original volume.'
- 'Avoid: Avoid the removal of a projection, a significant change to the form of its openings, or its covering with
  materials not corresponding to the initial materials.'
- 'Avoid: Avoid adding dormers on the front façade.'
- 'Prefer: Preserve and maintain the original openings as far as possible. Favour a model with a similar number of
  panes relative to the original or to other houses of the same model built in the same period.'
- 'Prefer: Respect and maintain the original arrangement of the openings.'
- 'Prefer: Replace the original openings with models of similar appearance if necessary.'
- 'Prefer: For the windows in the gable, keep the form of the window.'
- 'Avoid: Avoid changing the format and the arrangement of the original openings on the façade.'
- 'Avoid: Avoid replacing sash windows with casement windows or with any other type of window whose muntin orientation
  and appearance would differ.'
- 'Avoid: Avoid modifying the dimensions of the windows or blocking them up.'
- 'Prefer: Preserve and maintain the original claddings.'
- 'Prefer: Choose claddings whose appearance corresponds to those identified in this fiche for a replacement or an
  addition.'
- 'Avoid: Avoid choosing a cladding whose appearance or finish does not correspond to the original cladding materials
  pre-identified for the original volumes.'
- 'Prefer: The original ornamentation should be maintained and kept, or else replaced as faithfully as possible when
  its preservation is not possible.'
- 'Avoid: Avoid adding ornaments that do not correspond to the pre-identified originals or that never existed on the
  building.'
- 'Avoid: Avoid removing original ornaments without replacing them.'
conservation_fr:
- Les agrandissements devraient être faits à l’arrière du bâtiment et demeurer peu visibles de la rue. Dans le cas
  d’un agrandissement contemporain à l’arrière, le nouveau volume pourrait s’inspirer du gabarit et des formes des
  extensions ou des volumes secondaires d'origine.
- Préserver la symétrie du volume et de la composition en façade.
- Maintenir les saillies extérieures d’origine (galerie, tambour, etc.) et les remplacer si leur préservation n’est
  pas possible.
- Éviter les agrandissements ou les ajouts en hauteur qui altéreraient la volumétrie du toit ou la préséance du volume
  principal.
- Éviter un ajout en façade qui nuirait à la perception du volume original.
- Éviter le retrait d’une saillie, le changement significatif de la forme de ses ouvertures ou encore son recouvrement
  par des matériaux ne correspondant pas aux matériaux initiaux.
- Éviter d'ajouter des lucarnes en façade avant.
- Préserver et entretenir les ouvertures d’origines autant que possible. Favoriser un modèle avec un nombre similaire
  de carreaux par rapport à l'original ou à d'autres maisons du même modèle construites à la même époque.
- Respecter et maintenir la disposition originale des ouvertures.
- Remplacer les ouvertures originales par des modèles d’aspect similaire si nécessaire.
- Pour les fenêtres dans le pignon, conserver la forme de la fenêtre.
- Éviter de changer le format et la disposition des ouvertures originales en façade.
- Éviter de remplacer des fenêtres à guillotine par des fenêtres à battant ou par tout autre type de fenêtre dont
  l’orientation des meneaux et l'aspect différeraient.
- Éviter de modifier les dimensions des fenêtres ou de les murer.
- Préserver et entretenir les revêtements d’origine.
- Choisir des revêtements dont l’aspect correspond à ceux identifiés dans cette fiche pour un remplacement ou un agrandissement.
- Éviter de choisir un revêtement dont l'aspect ou le fini ne correspond pas aux matériaux de revêtement d'origine
  préidentifiés pour les volumes originaux.
- Les ornementations originales devraient être entretenues et maintenues ou encore remplacées le plus fidèlement possible
  lorsque leur préservation n’est pas possible.
- Éviter d’ajouter des ornements ne correspondant pas aux originaux préidentifiés ou n'ayant jamais existé sur le
  bâtiment.
- Éviter de retirer des ornements originaux sans les remplacer.
blurb_en: 'A rectangular house set broadside to the street under a straight gable roof of medium pitch, with one gable
  rising at the centre of the front — narrow on some houses, wide on others. The front is symmetrical: a central door,
  frequently with a transom and/or sidelights, a window to either side, and a window in the central gable.'
origin_en: 'The central-gable house is among the first residential building types to take hold in the Hull region,
  from the 1830s, and was built throughout the 19th century, drawing on architectural elements characteristic of several
  styles. It is associated with Ontario vernacular architecture because of its strong popularity in the rural communities
  of Upper Canada, chiefly in the corridor between Kingston and Ottawa, where many pre-1860 examples are built of
  stone. In Québec it is often found in the anglophone communities of the south of the province; it also became a
  variant of the American industrial-influence house, made possible by the standardisation of materials, and spread
  to the other regions of Québec, notably the Gaspésie and the Maritimes, with often simplified ornamentation. The
  neo-Gothic features sometimes associated with the type — pointed-arch openings, wooden cladding, worked bargeboards,
  a finial crowning the gable dormer — are not present in Gatineau, where the type owes more to the Georgian style:
  rectangular plan, stone cladding, symmetrical composition, front gable, and a central door surmounted by a fanlight
  transom and framed by narrow sidelights.'
