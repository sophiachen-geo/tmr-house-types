profile:
  siting_landscape: []
  massing:
  - Straight two-slope gable roof with the ridge line perpendicular to the street and the gable wall on the façade.
  - Two to two and a half storeys.
  - The half-storey, when present, is located in the roof space (sous les combles).
  - Rectangular main body generally 20 feet wide and about 24 to 26 feet deep.
  - Rectangular secondary body, offset or set back, with a sloped or lean-to roof.
  - Covered gallery on the façade, or porch with a lean-to roof parallel to the street (frequent), enhanced with a
    triangular pediment facing the street (occasional). The gallery is generally only slightly raised above the street
    and does not always have a railing.
  - Covered side stoop giving access to the rear secondary body (occasional).
  - The gallery columns are generally square (frequent) or turned (frequent), of wood, and their dimensions generally
    vary between 7 and 9 ½ inches wide.
  articulation:
  - Wood matchstick houses of two to two and a half storeys are plain and display relatively little ornament, apart
    from a few rare exceptions.
  - Originally, every wood matchstick house had wood casings (chambranles) around the openings.
  - Return of the eaves (occasional).
  openings:
  - Simple glazed main door.
  - Main entrance door off-centre relative to the façade.
  - One window (frequent) or two windows (rare) on the ground floor of the façade, and two windows on the façade at
    the upper storey (frequent).
  - A window high in the gable (frequent), of varied form (originally).
  - Typical windows are vertical, sash (guillotine) windows with 4 panes (frequent), 6 panes (rare), 9 panes (rare)
    or 12 panes (occasional).
  materials:
  - The walls are generally clad in horizontal wood boards (clapboard or rabbeted/shiplap) or in vertical boards.
    Wood shingle is sometimes used as a cladding material on the façade gable (rare).
  - The corners of the house are emphasised by corner boards (frequent).
profile_fr:
  contexte:
  - La « maison allumette » fait son apparition à partir des années 1870. Son origine découle notamment de l’ouverture
    du marché américain au Canada. Les échanges commerciaux et culturels entre les deux pays donnent lieu à l’importation
    de catalogues architecturaux américains. Ces publications, qui présentent des plans illustrés ainsi que des indications
    relatives à la construction de maisons ouvrières en bois, sont alors populaires auprès des entrepreneurs et des
    constructeurs amateurs canadiens.
  - L’avènement de la maison allumette correspond également à une période d'explosion démographique entre 1871 et
    1891 dans le secteur actuel de la Ville de Gatineau, en raison de l’industrialisation et de l’exode rural. De
    plus, la standardisation du bois d’œuvre et la présence d’importantes scieries à Hull facilitent l’accès au bois
    pour la construction résidentielle.
  - Bien qu'il existe aussi des maisons allumettes dans les secteurs d'Aylmer et de Buckingham, la forme étroite de
    ces maisons proviendrait du lotissement rectangulaire typique des terres appartenant à la famille Wright à Hull,
    effectué par l'arpenteur W. A. Austin en 1864. L’étroitesse et la profondeur des terrains auraient donc entraîné
    l’adaptation des maisons de colon américaines. Celles-ci, de forme rectangulaire avec une ligne faîtière parallèle
    à la rue, auraient ainsi pivoté de 90 degrés pour s'adapter aux lots étroits, leur mur pignon passant alors en
    façade.
  - Le premier modèle de maisons allumettes est en bois et comprend un étage et demi. Une seconde génération comportant
    deux étages et demi voit le jour à partir des années 1880. Enfin, une troisième génération avec une forme en L
    et de hautes fondations fait son apparition entre 1900 et 1915.
  repartition:
  - Présence marquée dans le secteur de Hull et, dans une moindre mesure, dans les secteurs d’Aylmer, de Buckingham,
    de Gatineau et de Masson-Angers.
  volumetrie:
  - Toit à deux versants droits avec ligne faîtière perpendiculaire à la rue et mur pignon en façade.
  - De deux à deux étages et demi.
  - Le demi-étage, lorsque présent, est situé sous les combles.
  - Corps de logis principal rectangulaire généralement de 20 pieds de largeur et d’environ 24 à 26 pieds de profondeur.
  - Corps secondaire rectangulaire, décalé ou en retrait, avec une toiture en pente ou en appentis.
  - Galerie couverte en façade ou porche avec un toit en appentis parallèle à la rue (fréquent), agrémenté d'un fronton
    triangulaire face à la rue (occasionnel). La galerie est généralement peu surélevée par rapport à la rue et n’a
    pas toujours de garde-corps.
  - Perron latéral couvert donnant accès au corps secondaire arrière (occasionnel).
  - Les colonnes sur la galerie sont généralement de forme carrée (fréquent) ou tournée (fréquent) en bois et leurs
    dimensions varient généralement entre 7 et 9 ½ pouces de largeur.
  ouvertures:
  - Porte principale simple et fenestrée.
  - Porte d’entrée principale décentrée par rapport à la façade.
  - Présence d’une (fréquent) ou deux fenêtres (rare) au rez-de-chaussée en façade et de deux fenêtres en façade à
    l’étage (fréquent).
  - Présence d’une fenêtre dans le haut du pignon (fréquent) de forme variée (à l’origine).
  - Les fenêtres types sont verticales, à guillotine avec 4 carreaux (fréquent), 6 carreaux (rare), 9 carreaux (rare)
    ou 12 carreaux (occasionnel).
  revetement:
  - Les murs sont généralement recouverts de planches de bois horizontales (à clin ou à feuillure) ou de planches
    verticales. Le bardeau de bois est parfois utilisé comme matériau de recouvrement sur le pignon en façade (rare).
  - Les angles de la maison sont soulignés par des planches cornières (fréquent).
  ornementation:
  - Les maisons allumettes en bois de deux à deux étages et demi sont sobres et présentent relativement peu d’ornements,
    hormis quelques rares exceptions.
  - À l’origine, chaque maison allumette en bois possédait des chambranles en bois autour des ouvertures.
  - Retour de l’avant-toit (occasionnel).
