  massing:
  - Flat roof, or of shallow pitch sloping down towards the rear.
  - Two to three storeys above ground.
  - Rectangular plan (frequent) or L-shaped plan (occasional).
  - Trapezoidal plan (following the urban fabric) (occasional).
  - Corbelled balcony at the upper floor (occasional).
  articulation:
  - Cornice crowning the front façade (frequent) and the side façade where the latter borders a street (occasional).
  - Parapet on the front façade (rare).
  - Lintels and sills of dressed stone or moulded concrete (frequent), arched brick lintels (occasional) or soldier-course
    brick (occasional) above the openings.
  - Entablature surmounting a display window on the façade (frequent).
  - Pilasters on the façade (occasional).
  - Datestone on the façade (rare).
  openings:
  - Single or double door with a window, surmounted by a transom, at the centre of the façade (frequent), sometimes
    recessed, or in a corner of the building (occasional), for the entrance to the ground floor.
  - Single door with or without transom, set off-centre, for access to the upper floors.
  - Sash windows with or without muntins (frequent).
  - Windows of vertical format.
  - Display windows at the ground floor, with (occasional) or without a transom.
  materials:
  - Exterior cladding of red or brown brick of Modular format (8" × 2 ½" × 3 ½"), laid in stretcher bond (frequent).
  - Cladding of wood clapboard or rabbeted (shiplap) boards, sometimes partial (occasional).
profile_fr:
  contexte:
  - L’édifice mixte à toit plat partage plusieurs similitudes avec la maison en brique à toit plat. Il fait son apparition
    vers la fin du 19e siècle et le début du 20e siècle, alors que se développent les artères commerciales des secteurs
    de Hull, d'Aylmer, de Buckingham et de Gatineau. À cette époque, qui précède le principe moderne de ségrégation
    des fonctions et l’avènement des magasins à rayons, les secteurs commerciaux et résidentiels s’amalgament et les
    immeubles combinent des locaux commerciaux au rez-de-chaussée et des logements aux étages supérieurs.
  - Ces deux usages se démarquent d’ailleurs souvent par le traitement de la façade, sur laquelle on retrouve une
    corniche ou un entablement séparant le rez-de-chaussée de l’étage. Le premier comporte généralement une ou deux
    larges vitrines de part et d’autre de l’entrée du commerce, alors que la façade à l’étage est percée de fenêtres
    verticales rectangulaires.
  - Tout comme la maison en brique à toit plat, ce type est lié à l’évolution technologique des méthodes de construction
    et, surtout, à l’industrialisation des matériaux. Ainsi, l’avènement des structures de type Balloon Frame, ou
    charpente à claire-voie, à la fin du 19e siècle permet une construction plus rapide avec des matériaux standardisés,
    tels que les montants de bois qui composent ce genre de charpente. L’apparition des membranes étanches recouvrant
    les toitures dans les années 1910 et 1920 aura aussi un impact sur la construction de ce type bâti en permettant
    des pentes de toit plus faibles pour l’écoulement des eaux.
  repartition:
  - Présence marquée dans les secteurs d’Aylmer, de Hull et de Buckingham et, dans une moindre mesure, dans le secteur
    de Gatineau.
  volumetrie:
  - Toit plat ou à faible pente descendant vers l'arrière.
  - Deux à trois étages hors sol.
  - Plan rectangulaire (fréquent) ou en L (occasionnel).
  - Plan trapézoïdal (selon la trame urbaine) (occasionnel).
  - Balcon en encorbellement à l’étage (occasionnel).
  ouvertures:
  - Porte simple ou double avec fenêtre, surmontée d’une imposte au centre de la façade (fréquent), parfois en retrait,
    ou dans un angle du bâtiment (occasionnel) pour l’entrée vers le rez-de-chaussée.
  - Porte simple avec ou sans imposte, décentrée pour l’accès aux étages.
  - Fenêtres à guillotine avec ou sans carreaux (fréquent).
  - Fenêtres de format vertical.
  - Vitrines au rez-de-chaussée, avec (occasionnel) ou sans imposte.
  revetement:
  - Revêtement extérieur en briques rouges ou brunes de format Modular (8" × 2 ½" × 3 ½"), avec un appareillage en
    panneresse (fréquent).
  - Revêtement en clins de bois ou planches à feuillure, parfois partiel (occasionnel).
  ornementation:
  - Corniche couronnant la façade avant (fréquent) et la façade latérale lorsque celle-ci borde une rue (occasionnel).
  - Parapet sur la façade avant (rare).
  - Linteaux et allèges en pierre de taille ou en béton moulé (fréquent), linteaux arqués en brique (occasionnel)
    ou briques en soldat (occasionnel) au-dessus des ouvertures.
  - Entablement surmontant une vitrine en façade (fréquent).
  - Pilastres en façade (occasionnel).
  - Pierre millésimée en façade (rare).
