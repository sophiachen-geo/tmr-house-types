conservation:
- 'Prefer: Extensions should be built at the rear of the building and remain little visible from the street. In the
  case of a contemporary rear extension, the new volume could take its cue from the scale and forms of the original
  extensions or secondary volumes.'
- 'Prefer: Preserve the symmetry of the volume and of the façade composition.'
- 'Avoid: Avoid removing a projection, significantly changing the shape of its openings, or covering it with materials
  that do not correspond to the initial materials.'
- 'Avoid: Avoid an addition on the front façade that would harm the perception of the original volume.'
- 'Prefer: Maintain the original size, arrangement and type of opening as far as possible.'
- 'Prefer: Favour a model with a number of muntins/panes similar to the original or to other buildings of the same
  model built in the same period.'
- 'Prefer: The placement of signs should not conceal components of interest.'
- 'Avoid: Avoid replacing original openings with openings whose type does not correspond to those identified above.'
- 'Prefer: Favour a cladding material in keeping with the original materials identified, such as brick in shades of
  red or brown. Other complementary materials could however be considered for the addition of a new volume.'
- 'Avoid: Avoid choosing a cladding whose appearance or finish does not correspond to the pre-identified original
  cladding materials for the main body.'
- 'Prefer: Original ornamentation should be maintained and kept up, or else replaced as faithfully as possible where
  its preservation is not possible.'
- 'Avoid: Avoid adding ornaments that do not correspond to the pre-identified originals or that never existed on the
  building.'
- 'Avoid: Avoid removing original ornaments without replacing them.'
conservation_fr:
- Les agrandissements devraient être faits à l’arrière du bâtiment et demeurer peu visibles de la rue. Dans le cas
  d’un agrandissement contemporain à l’arrière, le nouveau volume pourrait s’inspirer du gabarit et des formes, des
  extensions ou des volumes secondaires d'origine.
- Préserver la symétrie du volume et de la composition en façade.
- Éviter le retrait d’une saillie, le changement significatif de la forme de ses ouvertures ou encore son recouvrement
  par des matériaux ne correspondant pas aux matériaux initiaux.
- Éviter un ajout en façade qui nuirait à la perception du volume original.
- Maintenir le format, la disposition et le type d’ouverture d’origine autant que possible.
- Favoriser un modèle avec un nombre similaire de carreaux par rapport à l'original ou à d'autres édifices du même
  modèle construits à la même époque.
- L'emplacement des enseignes ne devrait pas masquer des composantes d'intérêt.
- Éviter de remplacer des ouvertures d’origine par des ouvertures dont le type ne correspond pas à ceux identifiés
  ci-haut.
- Privilégier un matériau de recouvrement en accord avec les matériaux d’origine identifiés comme la brique dans des
  coloris de rouge ou de brun. D'autres matériaux complémentaires pourraient cependant être envisagés pour l’ajout
  d’un nouveau volume.
- Éviter de choisir un revêtement dont l’aspect ou le fini ne correspond pas aux matériaux de revêtement d'origine
  préidentifiés pour le corps principal.
- Les ornementations originales devraient être entretenues et maintenues ou encore remplacées le plus fidèlement possible
  lorsque leur préservation n’est pas possible.
- Éviter d’ajouter des ornements ne correspondant pas aux originaux préidentifiés ou n'ayant jamais existé sur le
  bâtiment.
- Éviter de retirer des ornements originaux sans les remplacer.
blurb_en: A shop below and dwellings above, in two to three storeys under a roof that is flat or falls gently to the
  rear. One or two display windows flank the store entrance, taller rectangular windows light the flats, and a cornice
  or entablature marks where the commercial floor ends and the residential ones begin.
origin_en: 'The flat-roofed mixed-use building shares many similarities with the brick house with a flat roof. It
  appears towards the end of the 19th century and the beginning of the 20th, as the commercial arteries of the Hull,
  Aylmer, Buckingham and Gatineau sectors were developing. In that period, which precedes the modern principle of
  segregating uses and the arrival of department stores, commercial and residential sectors merged and buildings combined
  commercial premises on the ground floor with dwellings on the upper floors. Like the brick house with a flat roof,
  the type is tied to technological change in construction methods and above all to the industrialisation of materials:
  balloon-frame structures at the end of the 19th century allowed faster construction with standardised materials,
  and the waterproof roofing membranes that appeared in the 1910s and 1920s permitted shallower roof pitches for drainage.'
