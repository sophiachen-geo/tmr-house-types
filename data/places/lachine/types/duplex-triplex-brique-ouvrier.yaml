blurb_en: >-
  The worker housing the canal and the factories produced: two or three dwellings stacked on one lot,
  in brick more often than not, sometimes standing free, sometimes party-walled, sometimes running the
  length of a block in one alignment. Ville Saint-Pierre's have their stairs on the façade. Vieux-
  Lachine's sometimes have a carriage gate through to the back of the lot.
origin_en: >-
  Lachine's east end densified around work. The canal opened in 1825 and the first railway on the
  island reached the Lachine quay in 1847; Dominion Bridge settled near the locks in 1883 and other
  firms followed, and the cahier says workers arrived in numbers, settled in the eastern sectors, and
  pushed the built-up area across the railway. Companies and promoters, in its words, "construisent
  une multiplicité de types d'habitation et déclinent souvent leurs variantes en alignement continu,
  en série, jumelées ou individuelles" to house the factory hands and the men working on the canal.
  The porte cochère puts this record beside the Centre-Sud worker housing of Ville-Marie, where the
  carriage gate leads to houses at the back of the yard; and the exterior stair puts it beside every
  other plex on this site.
