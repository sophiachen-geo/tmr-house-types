blurb_en: >-
  A detached one- or two-storey house on a square or rectangular plan, simple in massing, clad in
  brick with wooden trim, under a roof that might be pitched, hipped, or hipped with a false mansard;
  set back from the street with side yards and a car parked in front, and built in small series. What
  makes it worth a card is its name. The cahier records that among the contractors who built the
  1950s–1970s quarters of Lachine, the best known locally gave the dominant house type its familiar
  name — the maison « Gameroff » — and that is a piece of purely local vernacular naming that made it
  into a municipal heritage document.
origin_en: >-
  Lachine answered the postwar boom the way other towns did, by turning its unbuilt sectors into
  dormitory quarters, and the sector called Victoria – Sir-George-Simpson is what came out: a vast,
  very homogeneous stretch of detached houses that the cahier says testify to the emergence of a
  middle class, to individual ownership, and to a way of living made possible by the car. It also says
  the catalogue of types deployed there is "particulièrement impressionnant" and lists three at once —
  Boomtown houses, bungalows, and the contractors' houses of which the Gameroff is the dominant one.
  That is the note this record should end on: a document written to identify heritage found a
  1950s–1970s tract worth naming as an ensemble, and named its houses after the man who built them.
