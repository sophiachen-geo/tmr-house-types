blurb_en: >-
  A small single-family house of one storey in brick, wider across the front than it is deep, finished
  at the top with a crown. It is the plainest thing in the old town and the cahier gives it eleven
  words; what those words describe is a house that is the mirror image of the Montréal shoebox, which
  turns its narrow end to the street and grows upward. This one turns its long side to the street and
  does not.
origin_en: >-
  It belongs to the dense grid of Vieux-Lachine, which grew along the boulevard Saint-Joseph and then
  reached rue Saint-Louis and rue Victoria as the arrival of firms like Dominion Bridge consolidated
  Lachine's industrial vocation. The cahier sets it in a list beside the wooden village houses, the
  attached and terraced houses under mansards and false mansards, and the brick duplexes and
  triplexes — four kinds of small dwelling on the same street grid, housing the workforce that the
  canal and the factories drew in.
