profile_note: >-
  The whole documented content of this type is one clause of one sentence in a sector description:
  « petites maisons unifamiliales d'un étage en brique, plus larges que profondes et avec des
  couronnements ». The cahier gives no date, no roof form in words, no window type, no ornament
  beyond the crown, no lot dimension and no setback, so all of those are null. The phase is
  provisional: the type sits inside a sector whose growth the cahier ties to the consolidation of
  Lachine's industrial vocation, which is p3, but no year is printed for the houses themselves. The
  style attribution is this site's reading and not the cahier's, which attributes none.
  <strong>The canonical link needs a warning.</strong> The Montréal shoebox is defined by being narrow
  and set end-on to the street, built to be built over later; Lachine's version is explicitly the
  other way round — wider than deep. It is filed with the shoebox because it is the same one-storey,
  flat-roofed, crowned, single-family small brick house, and because the divergence is the useful
  thing to see.
