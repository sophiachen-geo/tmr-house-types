blurb_en: >-
  The house of the people who did well out of the canal and the works: brick, opulent, Victorian in
  taste, detached or semi-detached, standing among much plainer neighbours on the boulevard Saint-
  Joseph, on the chemin de LaSalle and in the Saint-Antoine sector. The cahier calls it out three
  times and describes it none of them.
origin_en: >-
  The firms that came to the canal at the end of the 19th century employed more than labourers.
  "Outre les ouvriers," the cahier says, "les entreprises emploient des gens de métiers spécialisés
  ainsi que des professionnels qui éliront domicile surtout dans le secteur ouest de Lachine" —
  skilled tradesmen and professionals, who chose the west end. What they built there is the beginning
  of the gradient this page is really about: worker housing east of the institutional core, bourgeois
  houses in the middle, and beyond the 32nd Avenue the summer-resort houses of Summerlea on their
  large treed lots, which belong to the shared West Island record for the villa anglaise de
  villégiature rather than here.
