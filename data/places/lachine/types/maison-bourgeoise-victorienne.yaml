profile:
  siting_landscape:
    - "On the boulevard Saint-Joseph between the 18th and 34th Avenues, where the cahier says the finest examples stand."
    - "On the chemin de LaSalle and rue McLaughlin, in a sector the cahier reads as having a village atmosphere produced by low density and regular siting, with back gardens giving directly onto Lac Saint-Louis and open views between the buildings."
    - "In the Saint-Antoine – Remembrance sector, where mature vegetation harmonises a mix of domestic and institutional building."
  massing:
    - "The cahier gives no storey count. In Saint-Antoine – Remembrance it speaks of « belles séries d'habitations à la volumétrie plus ou moins complexe » — runs of houses of more or less complex massing — and that is the whole of what it says about volume."
    - "Semi-detached as well as detached: « de belles maisons en brique jumelées d'inspiration victorienne »."
  articulation:
    - "The word the cahier repeats is « cossues » — opulent — set against the modest small-gabarit architecture around them."
  openings:
    - The cahier states nothing about the openings of this type.
  materials:
    - "Brick, in all three sectors."
profile_fr:
  description:
    - "Entre la 18e et la 34e Avenue, le boulevard Saint-Joseph regroupe de beaux exemples de maisons bourgeoises en brique au goût victorien"
    - "Ce secteur comprend en outre de belles maisons en brique jumelées d'inspiration victorienne et de belles séries d'habitations à la volumétrie plus ou moins complexe."
    - "L'architecture, de petit gabarit, est modeste, mais on trouve aussi des maisons d'inspiration victorienne plus cossues."
profile_note: >-
  This is a thin record and it is thin because the source is. The cahier names the type three times in
  three sectors and never describes it: no storeys, no roof, no openings, no ornament, no dates, no
  addresses. Only the material — brick — and the two attributes "victorian-inspired" and "opulent" are
  stated, plus the observation that some are semi-detached and that the massing of the runs is more or
  less complex. Every other column is null. The canonical forms and the styles are this site's reading
  of those words and of the photograph below; the cahier attributes no style and this record should be
  revisited if a per-building inventory of Lachine ever becomes available.
