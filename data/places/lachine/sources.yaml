- id: lac-commons
  citation: >-
    Wikimedia Commons. Licence, author, description and file URL were read individually through the
    Commons API (action=query&prop=imageinfo&iiprop=url|extmetadata) on 17 August 2026 before any
    download, and every downloaded file was opened and looked at before publication. Two sources are
    used: photographs uploaded from the Flickr account « Parcours riverain - Ville de Montréal », all
    CC BY 2.0, individually credited to their photographer because the set has more than one — Anne-
    Marie Dufour and Denis Tremblay both appear; and photographs by Simon Geissbuehler, CC BY-SA 4.0.
  url: https://commons.wikimedia.org/wiki/Category:Lachine
  used_for: >-
    Every photograph on this page. Also the four files staged in assets/places/lachine/ for the shared
    West Island type records rather than used here: le-ber-le-moyne-maison-commons.jpg and
    le-ber-le-moyne-dependance-commons.jpg (Simon Geissbuehler, CC BY-SA 4.0),
    maison-quesnel-5010-boulevard-saint-joseph-commons.jpg (Denis Tremblay, CC BY 2.0) and
    maison-jean-gabriel-picard-5430-boulevard-saint-joseph-commons.jpg (Anne-Marie Dufour, CC BY 2.0).
    One candidate was rejected on inspection: « Maison Emma-Jane-Sandilands, 4650-4666, rue
    Richard-Hewton » is a real photograph of a real address on the cahier's exceptional list, but the
    frame is dominated by a late-20th-century condominium extension, and publishing it as the
    Bickerdike mansion would misrepresent what survives.

- id: lac-flickr-parcours-riverain
  citation: >-
    Flickr, « Parcours riverain - Ville de Montréal » (flickr.com/photos/parcoursriverain). Licence
    checked directly against the page source on 17 August 2026: the photo pages carry
    license-id 4 with a link to creativecommons.org/licenses/by/2.0/, title "CC BY 2.0", and the
    visible text "Some rights reserved". The set is therefore free for reuse with attribution. Note
    that the photographs are not all by one person: the credit line inside each description names
    either Anne-Marie Dufour or Denis Tremblay, and Flickr licences are per-photo, so each was
    verified individually.
  url: https://www.flickr.com/photos/parcoursriverain/
  used_for: >-
    Licence provenance for the Commons re-uploads used on this page. No file was taken from Flickr
    directly; the Commons copies carry the same CC BY 2.0 licence and a stable file page.

