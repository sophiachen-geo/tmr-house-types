    1971 closing date the record carries, which its own publisher's current pages contradict.

- id: lac-pc-canal-pages
  citation: >-
    Parcs Canada, lieu historique national du Canal-de-Lachine, current website: the visitor page
    (« Sa voie navigable s'étend sur 14,5 km et est accessible via l'écluse no 1 au Vieux-Port de
    Montréal et l'écluse no 5 dans l'arrondissement Lachine »), the navigation page (« Avec ses 14
    kilomètres de voie navigable et ses 5 écluses »), the bicentenary blog posts (« En 2025, Parcs
    Canada célèbre le bicentenaire de l'ouverture du canal de Lachine »; « Les travaux débutent en
    1821. Le canal est achevé en 1825 »; the canal closed in 1970 and reopened to pleasure craft in
    2002), and the Parks Canada news release of 24 May 2022 marking the 20th anniversary of the
    reopening (« Le 17 mai 2002, plusieurs dignitaires s'étaient rassemblés à l'écluse no 5 »).
  url: https://parcs.canada.ca/lhn-nhs/qc/canallachine
  used_for: >-
    The 1970 closing date, the 2002 reopening to pleasure craft with its exact date of 17 May 2002,
    and the 2025 bicentenary. Read through the live pages rather than downloaded; three different
    lengths — 13,5 km for the multi-use trail, 14 km for the navigable channel on one page, 14,5 km on
    another — are recorded in the notes rather than reconciled.

- id: lac-ca-odj-2025
  citation: >-
    Ville de Montréal, arrondissement de Lachine, ordre du jour de la séance ordinaire du conseil
    d'arrondissement du 1er octobre 2025, items 40.01, 40.02 and 10.06.
    https://ville.montreal.qc.ca/documents/Adi_Public/CA_Lac/CA_Lac_ODJ_LPP_ORDI_2025-10-01_19h00_FR.pdf
