    20b412def89a05c84cd5d65dff7a38c077d3bd864a3d6309bf7f53e6ca5c2185.
  used_for: >-
    The two current urbanism instruments and their replacements: Règlement numéro 2710 sur le zonage,
    to be replaced by RCA25-19005; Règlement numéro 2561 sur les plans d'implantation et d'intégration
