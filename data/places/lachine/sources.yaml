- id: lac-evaluation-2005
  citation: >-
    Ville de Montréal, Service de la mise en valeur du territoire et du patrimoine, Direction du
    développement urbain, Division du patrimoine et de la toponymie, « Évaluation du patrimoine
    urbain : arrondissement de Lachine », 2005, ISBN 2-7647-0462-3, dépôt légal BNQ / BNC 2005.
    Study directed by Céline Topp; heritage analysis under Jean-François Gravel, chef de division;
    built-heritage evaluation and historical research by Julie Boivin, Elizabeth Bonner, Anne-Marie
    Dufour, Guy Lafontaine, Christiane Lefebvre and Pierre-Paul Savignac, architects, with Denise
    Caron, historian; archaeology by Claire Mousseau with Françoise Duguay, François Bélanger,
    Anne-Marie Balac and Christian Roy. Fieldwork January 2003 – May 2004, for the Plan d'urbanisme
    adopted by the conseil municipal on 23 November 2004.
    http://ville.montreal.qc.ca/pls/portal/docs/page/patrimoine_urbain_fr/media/documents/09_evaluation_patrimoine_lac.pdf
    — retrieved 17 August 2026; sha-256
    ee6a9ac6f7e768c09eddbff8ef80f3af4dd5d92db8d0eb0e7849de81067a2f51; 66 PDF pages carrying printed
    pagination to 66. Parsed with pdftotext -layout to
    sources/west-island/lachine/09_evaluation_patrimoine_lac.txt.
  url: http://ville.montreal.qc.ca/pls/portal/docs/page/patrimoine_urbain_fr/media/documents/09_evaluation_patrimoine_lac.pdf
  used_for: >-
    Everything typological and every sector row. The nineteen sectors of sectors.yaml from § 3.2.2 and
    § 3.2.3; the four type records from the typological sentences inside 19.I.1, 19.I.2, 19.I.6,
    19.I.8 and 19.U.2; the phase anchors from § 2 Historique; the exceptional and interesting
    immeubles lists from § 3.2.2 E and F; and the borough's évaluation code, 19 in the text against 09
    in the filename.

- id: lac-rpcq-93274
  citation: >-
    Répertoire du patrimoine culturel du Québec, fiche « Site patrimonial Le Ber-Le Moyne », id 93274
    (other names on the fiche: Musée de Lachine; Site historique et archéologique Le Ber-Le Moyne).
    Source of the statement of value: Ministère de la Culture et des Communications du Québec, 2015.
    https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=93274 —
    retrieved 17 August 2026; sha-256
    1fb9cecb66699082f2c26fa09b46fbbdcbc05bf6583d0bd15cd6dcb9059c962c.
  url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=93274
  used_for: >-
    The classement (Site patrimonial, Ministre de la Culture et des Communications, 2001-04-26) with
    its conservation categories 1, 9 and 10 and the sentence fixing the reach of the protection; the
    transfer of powers to the Ville de Montréal registered 2017-09-21 and effective 2018-09-21; the
    federal designation of 2002-11-01; the building campaign of 1669–1671 and the whole occupation
    sequence from La Salle's arrière-fief of 1667 to the 1946 municipal purchase; the 1981–1985
    restoration; the archaeological finding that no trace of fire has been found, which weakens the
    old assumption that the house burned in the 1689 attack; and the five-column evidence this place
    contributes to the shared type maison-de-pierre-regime-francais.

- id: lac-pc-nhs-627
