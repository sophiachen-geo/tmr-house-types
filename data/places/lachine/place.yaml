summary_en: >-
  The one place in this section that never left Montréal. Lachine begins as a portage stop at the head
  of the rapides de Lachine, where the canoe routes from the pays d'en Haut had to stop; Le Moyne and
  Le Ber built a stone trading post there in 1669–1671 that is still standing, and still the oldest
  thing on the borough's ground. The canal of 1825 and the railway of 1847 turned the east end into an
  industrial town of worker housing and the Dominion Bridge works, while the west end — Summerlea,
  annexed in 1912 — filled with Shingle Style and Arts and Crafts summer houses on very large treed
  lots. Between 1950 and 1970 the fields in between were laid out as dormitory quarters whose dominant
  house type still carries a builder's name: the maison « Gameroff ». Merged into Montréal in 2002,
  Lachine did not demerge in 2006, and it is a borough today while every one of its West Island
  neighbours is a city again.
