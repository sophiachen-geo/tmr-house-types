summary_en: >-
  Five annexed municipalities at the east end of the island, and one of them is why this page exists.
  Maisonneuve was created on 27 December 1883 by the Hochelaga landowners who refused to be annexed with
  their neighbours, grew fifth among Canadian industrial cities by 1910 on the strength of the shoe trade,
  and in that year handed its municipal engineer, Marius Dufresne, the most ambitious town-planning scheme
  drawn in Québec at the time — a City Beautiful capital of stone civic buildings on a treed boulevard,
  paid for out of municipal borrowing until the borrowing ran out and the province annexed the city to
  Montréal in 1918. It is the third planning exercise at company-town scale on this site after Arvida and
  Témiscaming, and the only one where the client was a town council rather than a corporation. What the
  workers actually lived in was not a model house but the ordinary Montréal plex: three storeys of stone or
  brick, one dwelling to a floor, outside stairs, on streets lined with trees.
