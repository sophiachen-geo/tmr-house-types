id: mercier-hochelaga-maisonneuve
name_en: Mercier–Hochelaga-Maisonneuve (borough of Montréal)
name_fr: Arrondissement de Mercier–Hochelaga-Maisonneuve
sections: [planned, borough-vernacular]    # planned, because of the cité de Maisonneuve, 1883–1918
region: Ville de Montréal
borough_of: montreal                       # borough since 1 January 2002
founded: 1722                              # paroisse Saint-François-d'Assise de la Longue Pointe, 1722; municipalité de
                                           # Longue-Pointe 1845; village d'Hochelaga incorporated 1870 and annexed to
                                           # Montréal 1883; cité de Maisonneuve created 27 December 1883 and annexed 1918;
                                           # Longue-Pointe, Beaurivage and Tétraultville annexed 1910; Saint-Jean-de-Dieu 1963.
settlement_mode: >-
  Five annexed municipalities on the eastern end of the island, the largest of which — Maisonneuve —
  was founded in 1883 by its own landowners as a rival to the Montréal that had just swallowed Hochelaga,
  and laid out on an orthogonal grid before being replanned as a City Beautiful capital in 1910
governing_instruments:
