    title: >-
      Ville de Montréal, Division du patrimoine et de la toponymie, « Évaluation du patrimoine urbain :
      arrondissement de Mercier–Hochelaga-Maisonneuve » (2005, ISBN 2-7647-0470-4). Fieldwork January 2003
      – May 2004 for the Plan d'urbanisme adopted 23 November 2004. The sector codes inside the document are
      27.E.1–5, 27.I.1–6, 27.U.1–5, 27.N.1–2 and 27.AP.1–3 / 27.A.1–2 — the arrondissement number is 27,
      not the 14 of the filename.
    year: 2005
    url: http://ville.montreal.qc.ca/pls/portal/docs/page/patrimoine_urbain_fr/media/documents/14_evaluation_patrimoine_mercier.pdf
  - kind: zoning
    title: >-
      Règlement d'urbanisme de l'arrondissement de Mercier/Hochelaga-Maisonneuve (01-275). It carries the
      borough's two building-scale heritage instruments directly: the « secteurs significatifs », where
      norms and criteria govern any exterior work visible from the street, and the « immeubles
      significatifs ». Twelve further areas are subject to PIIA review.
    year: 2001
    url: https://montreal.ca/reglements-municipaux/recherche/60d761c6fd6531b6145780ac
  - kind: PIIA
    title: >-
      Twelve PIIA sectors are designated inside règlement 01-275 (Louis-H.-Lafontaine; SDC
      Hochelaga-Maisonneuve; Lavo; Village Champlain; Promenade Bellerive; Assomption-Sud–Longue-Pointe;
      Assomption-Nord; site Contrecœur; de Rouen; Préfontaine; Radisson; and the voie panoramique et
      patrimoniale de la rue Notre-Dame Est). Règlement 01-275-112 (2017) is the amendment that inserted
      the Assomption-Sud « Cité de la logistique » PIIA as a new Section VI after article 120.12 — an
      industrial-logistics control, not a residential heritage one; public consultation 23 March 2017.
    year: 2017
    url: https://portail-m4s.s3.montreal.ca/pdf/26677_guide_patrimonial_vfinal.pdf
  - kind: demolition
    title: >-
      Règlement régissant la démolition d'immeubles (RCA02-27006) — « prévoit l'interdiction de démolir un
      immeuble sans avoir préalablement obtenu une autorisation ». The members of the comité consultatif
      d'urbanisme sit as the comité de démolition.
    year: 2002
    url: https://montreal.ca/articles/comite-de-demolition-de-mhm-20897
  - kind: classement
    title: >-
      Site patrimonial de l'Ancienne-Cité-de-Maisonneuve — classé site patrimonial by the Minister of
      Culture and Communications. Statut: Classement, date 2022-03-03, prise d'effet 2021-03-30, after an
      avis d'intention de classement of 2021-03-29. RPCQ id 232824. It covers works of 1910–1939: the
      former hôtel de ville, the former marché public, the bain et gymnase publics, the former caserne de
      pompiers, avenue Morgan and parc Morgan, and Alfred Laliberté's two bronze fountain-sculptures
      « La Fermière » and « Les Petits baigneurs ». This is a PROVINCIAL classement, not a municipal
      citation — the only provincial area protection among the five Montréal boroughs of this part.
    year: 2022
    url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&id=232824&type=bien
  - kind: classement
    title: >-
      Château Dufresne (Maisons Marius et Oscar Dufresne, 4040 rue Sherbrooke Est, 1915–1918) — classé
      immeuble patrimonial 20 December 1976, forty-six years before the site around it. RPCQ id 92740.
    year: 1976
    url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&id=92740&type=bien
  - kind: inventory
    title: >-
      Statutory pre-1940 inventory under art. 120 of the Loi sur le patrimoine culturel, carried by the
      agglomération de Montréal. Not checked for MHM as at this encoding; listing is neither citation nor
      classement, but an inventoried building falls under the demolition-control regime of LAU art. 148.0.1.
    year: null
    url: null
typology_document:
  title: >-
    Ville de Montréal, « Évaluation du patrimoine urbain — arrondissement de Mercier–Hochelaga-Maisonneuve »
    (2005); arrondissement de Mercier–Hochelaga-Maisonneuve, « Guide patrimonial » (n.d., current 2026)
  year: 2005
  format: sector-characterisation
  note: >-
    Neither document is a typology. The Évaluation characterises sectors and lists individual buildings;
    it names house forms only in passing, and the phrase it uses for Maisonneuve's workers' housing is
    « les habitations ouvrières de trois étages le long de rues bordées d'arbres ». The borough's Guide
    patrimonial is a conservation manual keyed to elements — stair, balcony, fascia, soffit, door, window,
    cladding, crown — rather than to house types, with two named exceptions of its own (Village Champlain
    types I–VII and Maison des vétérans types I–III, both post-1941). Every type record on this page
    therefore carries a profile_note saying which document each line came from.
