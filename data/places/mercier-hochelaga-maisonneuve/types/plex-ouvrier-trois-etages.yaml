blurb_en: >-
  What Maisonneuve's workers actually lived in. Three storeys of grey limestone or clay brick under a
  flat roof, one dwelling to a floor, each with its own door off the street and the upper doors reached
  by an iron stair curving up out of the front yard — repeated down both sides of a street planted with
  trees. The Évaluation gives it one clause and no fiche, which is the point: the ambition at Maisonneuve
  went into the civic buildings and the boulevard, and the housing was the standard Montréal product.
origin_en: >-
  The form arrives with the industry. Hochelaga's mills — the W.C. McDonald tobacco works, the Abattoirs
  de l'Est, the V. Hudon cotton mills and the Filature Sainte-Anne, all established between 1871 and
  1881 — drew what the cahier calls « une main-d'œuvre bon marché issue des populations agricoles qui
  convergent vers la ville », and « les terrains sont lotis sans réglementation particulière ». At
  Maisonneuve after 1883 the promoters offered huge cheap lots and tax exemptions to industry, and the
  population went from about 350 at the founding to 2,000 in 1896 and roughly 18,000 in 1911 —
  80 % francophone and « composée surtout de travailleurs et de locataires ». Renters in a boom is what
  the plex is for. Maisonneuve also enacted a zoning by-law that the cahier calls « une nouveauté à
  l'époque », barring shops and industry from certain streets reserved for housing alone — one of the
  earliest use-separation controls in Québec, and the reason these streets read as purely residential
  while rue Ontario Est a block away does not.
