blurb_en: >-
  The federal minimal house, arriving in Mercier after the war it was invented for. A detached
  one-and-a-half-storey box under a two-slope roof, clad in pale clapboard or brick, built in whole
  streets to one volume so that the ensemble reads as a single gesture — around 1950 north of rue de
  Rouen, in 1953 on rue Curatteau.
origin_en: >-
  The Évaluation states the lineage exactly: these ensembles were built « autour de 1950 sur le modèle
  des maisons de la Wartime Housing Limited. Ce modèle a été développé durant la Deuxième Guerre mondiale
  pour répondre à la crise du logement qui sévissait alors et pour loger les ouvriers à proximité des
  entreprises consacrées à l'industrie de guerre. Le modèle fut adopté par la suite par plusieurs
  promoteurs qui cherchaient à rejoindre un segment de marché composé de personnes désirant habiter une
  maison individuelle à prix abordable. » That last clause is the whole post-war housing shift in one
  sentence: a state emergency type turned into a market product. The same object appears on this site at
  Lévis, in the Sud-Ouest, in Villeray–Saint-Michel–Parc-Extension, in Parc-Extension and at Verdun's
  Crawford Park; this is its eastern Montréal instance, and it is the one place in this borough where the
  cahier uses the word « modèle » of a house at all.
