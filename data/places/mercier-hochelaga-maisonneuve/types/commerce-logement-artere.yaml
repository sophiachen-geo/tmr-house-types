blurb_en: >-
  The other half of Maisonneuve's zoning experiment. Where the by-law let commerce go — rue Ontario Est,
  rue Sainte-Catherine Est — the block turns its corner on a chamfer, puts a shop under three storeys of
  flats, runs an oriel up the angle and finishes the whole thing with an ornamented metal cornice. The
  streets the by-law reserved for housing got the plex instead, and no shop at all.
origin_en: >-
  The tramway is the cause. The Évaluation dates Hochelaga's commercial axes to the moment the streetcar
  arrived — rue Sainte-Catherine and the new Montreal Street Railway viaduct of 1892 « pour desservir les
  populations de l'est montréalais » — and dates Maisonneuve's own growth from the same year: « à partir
  de 1892, les tramways favorisent le développement rapide de Maisonneuve et placent la municipalité dans
  la zone d'influence de Montréal ». Shops followed the rails, and the corner block is what a builder
  puts on a lot that has to earn from both a shopfront and a stack of flats.
