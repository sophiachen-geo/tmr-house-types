profile:
  siting_landscape:
    - Built to the lot lines with no setback, on the corner of a commercial artery and a residential street — rue Ontario Est and rue Sainte-Catherine Est are the two the Évaluation identifies as the axes of urban development once the tramway reached the east end.
    - The corner is chamfered so the shop entrance faces the crossing.
  massing:
    - Three storeys under a flat roof, shop at street level and dwellings above.
    - A projecting oriel rides the chamfered corner through the upper storeys.
  articulation:
    - "Ground floor read as its own register — the borough's Guide patrimonial defines « entablement » precisely as « partie supérieure d'un rez-de-chaussée (commercial) prenant la forme d'un bandeau »."
    - Crown gathered into a bold projecting cornice of worked painted metal, ornamented across the whole frontage and returning around the chamfer.
  openings:
    - Vertical rectangular upper windows in regular bays; glazed shopfront below, here with glass-block infill of a later phase.
  materials:
    - Rock-faced grey limestone above, brick at the shopfront piers; the Guide's palette for significant sectors allows grey limestone, smooth or rock-faced, and clay brick in red, brown, beige, orange, polychrome or glazed.
profile_note: >-
  A weaker record than the others on this page, and marked as such. The Évaluation gives this form no
  fiche; it names commercial buildings only inside its list of what makes the sectors' fabric —
  « Industries, banques, édifices commerciaux, écoles et églises composent un paysage bâti riche et
  diversifié » — and its individual listings for rue Ontario Est are banks, not shop-houses. The
  articulation and materials lines are drawn from the borough's Guide patrimonial, which regulates the
  commercial ground-floor entablature and the crown as their own categories in the secteurs
  significatifs; the massing and siting lines are read from the photographed example and are labelled
  visual, not documentary. The type is included because it is the one thing Maisonneuve's own zoning
  by-law was written to keep off the residential streets: the cahier records that the city « instaure un
  règlement de zonage qui est une nouveauté à l'époque. Celui-ci interdit la construction de commerces ou
  d'industries sur certaines rues, consacrées uniquement au développement résidentiel. » The plex streets
  and this corner are two halves of one rule.
