profile:
  siting_landscape:
    - Along the old chemin du Roy — the present rue Notre-Dame Est — and the village streets running off it, around the parish church of Saint-François-d'Assise on the river bank; the church itself has been demolished.
    - The village core was « largement amputé » when the Louis-Hippolyte-Lafontaine bridge-tunnel was built in the early 1960s, so what survives is a fragment, not a continuous frontage.
  massing:
    - Small village gabarit, one to one-and-a-half occupied levels.
  articulation: []
  openings: []
  materials:
    - Squared-timber walls — « maisons en carré de bois » — most often sheathed in wood boards or wood shingles, and sometimes in clay brick.
profile_note: >-
  The entire documentary basis for this record is one sentence of sector fiche 27.I.3: « il présente
  encore aujourd'hui un bâti villageois typique : maisons en carré de bois, souvent recouvertes de
  planches ou de bardeaux de bois et parfois de brique d'argile. » That sentence gives wall construction
  and cladding and nothing else, so roof form, storey count beyond the small village gabarit,
  articulation and openings are left null or empty rather than inferred from the photograph. Sector
  27.I.3 is not encoded in this page's sectors.yaml, which carries only the five E sectors; the I, U, N
  and AP sectors of arrondissement 27 are Part 10b work, and the sector reference is therefore made in
  this note instead of in the `sectors` field. One building in the photographed street carries a raised
  and ornamented parapet with a 1898 date panel — a boomtown crown, and this borough's only observed
  instance — but the cahier does not name the form, so it is recorded here and not encoded as a type.
