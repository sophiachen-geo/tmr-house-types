blurb_en: >-
  What was on the ground before any of the rest of it. Small squared-timber houses sheathed in board,
  shingle or brick, strung along the old chemin du Roy around a parish founded in 1722 — the oldest
  settlement layer in the borough, and the one most thoroughly cut apart, first by the tramway that
  reached the end of the island in 1897 and then by the bridge-tunnel approaches of the early 1960s.
origin_en: >-
  Longue-Pointe is the borough's French-regime layer. A wooden redoubt went up on the shore about 1670
  in the chain of forts protecting Ville-Marie; a chapel and presbytery followed at the turn of the
  eighteenth century; Saint-François-d'Assise de la Longue Pointe became, in 1722, one of the few
  parishes erected on the island under the French regime, and the territory became a municipality in
  1845. In 1825 the parish counted 67 houses, holding « de nombreux artisans, des aubergistes, des
  rentiers, des journaliers mais surtout des agriculteurs ». Its urbanisation came late precisely because
  it was far from Montréal's economy, and the cahier says so: development « se fera plus tardivement que
  celui des municipalités voisines (Hochelaga et Maisonneuve) puisqu'elle est située assez loin du centre
  des activités économiques de Montréal ». Longue-Pointe, Beaurivage and Tétraultville were all annexed
  to Montréal in 1910.
