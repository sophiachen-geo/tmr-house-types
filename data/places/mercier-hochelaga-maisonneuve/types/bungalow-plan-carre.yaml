blurb_en: >-
  The other post-war Mercier, and the odder one. Identical brick bungalows put up in whole streets in the
  early 1950s — in one development with no front door at all on the street face, just a band of windows
  pushed to one side — laid out with rows of trees along the sidewalk that the Ville's surveyors could
  still recognise fifty years later as part of the original plan.
origin_en: >-
  Mercier is where the borough turned suburban. The Évaluation notes that the criteria it used to find
  heritage sectors « n'a pas permis d'identifier beaucoup de secteurs dans la partie est du territoire »,
  and answers itself: « cela ne signifie pas pour autant que cette partie de l'arrondissement ne présente
  pas d'intérêt. Les qualités d'ensemble de plusieurs rues devraient être maintenues. » That is why these
  four developments are recorded as ensembles urbains d'intérêt rather than as heritage sectors — the
  value is in the coherence of a whole street, not in any single house, and the document's own
  recommendation is to study such territories, « recenser les typologies des ensembles qui présentent une
  grande homogénéité », and build public awareness of them. It is a recommendation for exactly the kind
  of record this page is.
