blurb_en: >-
  The exception the record keeps insisting on. Two houses for two brothers built as one Beaux-Arts block
  in Indiana limestone — Marius Dufresne, who as municipal engineer designed Maisonneuve's public
  buildings, on one side, and Oscar Dufresne, who ran the family shoe factory, on the other — standing on
  twenty reinforced-concrete piers at a moment when almost no house in Montréal did. Forty rooms, a
  winter garden, garages underground.
origin_en: >-
  Maisonneuve was 80 % francophone and, in the Évaluation's phrase, « composée surtout de travailleurs et
  de locataires »; its promoters had founded the place in 1883 to be, as the RPCQ puts it, « la
  "Westmount des francophones" ». The bourgeois house is where that ambition became a building. The
  Dufresne brothers were both instruments of it: Oscar sat as échevin and ran Dufresne et Locke, the shoe
  manufactory established at Maisonneuve about 1900 and one of its largest employers; Marius was
  municipal engineer from 1910 to 1918 and drew the market (1912–1914), the fire station (1914–1915) and
  the public bath and gymnasium (1914–1916). They began their own house in 1915, the year the civic
  building programme was breaking the city's finances, and finished it in 1918, the year the province
  annexed Maisonneuve to Montréal. It was classé in 1976; the civic buildings had to wait until 2022.
