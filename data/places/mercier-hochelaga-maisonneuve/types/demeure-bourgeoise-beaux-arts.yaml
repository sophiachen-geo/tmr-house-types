profile:
  siting_landscape:
    - Set on a large landscaped ground behind a cast-iron fence, on one of the two thoroughfares laid out for prestige — rue Sherbrooke Est, or boulevard Pie-IX, whose subdivision « privilégiait de riches constructions sur des terrains plus grands que ce que l'on retrouve dans les environs ».
    - Garages and other service space put underground at the rear rather than on the street front.
  massing:
    - Rectangular two-storey corps de logis under a flat roof ringed by a balustrade.
    - Two paired houses composed as one unified block, with lateral wings set back from the main façade and rising only to half height, and a rear annex holding a winter garden.
  articulation:
    - "Symmetry and frontality — two avant-corps framing a central section carried on three pairs of coupled Ionic columns."
    - Classical ornament — column capitals, entablature and the terrace roof edged with a balustrade. The RPCQ names this house, with the Maisonneuve bain public et gymnase and the Saint-Sulpice library, as an illustration of Beaux-Arts composition applied in Québec.
  openings:
    - Vertical rectangular and round-headed openings, disposed symmetrically about the central bay.
  materials:
    - Indiana limestone facing.
    - Structure and twenty massive piers in reinforced concrete.
profile_note: >-
  Every line here is read off one building, the Château Dufresne (Maisons Marius et Oscar Dufresne,
  4040 rue Sherbrooke Est, 1915–1918, Marius Dufresne with the French architect Jules Renard), because it
  is the only house of this class in the borough with a fiche of its own; the Évaluation says as much —
  « Des demeures somptueuses sont également construites pour la bourgeoisie canadienne-française, mais
  elles constituent l'exception. Le meilleur exemple en est le château Dufresne. » Sector 27.E.3
  establishes that a whole street of such houses was intended on boulevard Pie-IX and that « plusieurs
  bâtiments témoignent encore du faste qu'avait autrefois cette voie », but it names none of them, so the
  siting line is the sector's and the rest is the Château's.
  ONE CORRECTION TO THE PART 10 MEMO. The RPCQ does not say this was the first reinforced-concrete
  private residence in Montréal. Its wording is « l'une des premières utilisations de ce matériau pour
  la construction résidentielle à Montréal, voire au Québec », and again « il s'agit de l'une des
  premières résidences à structure en béton armé à Montréal » — one of the first, not the first. The
  superlative is not in the source and is not published here.
  On the style tags: <em>beaux-arts</em> is the RPCQ's own word for this building, repeated four times in
  its fiche. <em>city-beautiful</em> is attached deliberately and is the only house record on this site
  that carries it, because this is the house the author of Maisonneuve's City Beautiful plan built for
  himself while executing it, and because the RPCQ ties the two together explicitly — Beaux-Arts is a
  current « fréquemment associé aux projets urbains d'inspiration City Beautiful ». The tag belongs to the
  designer and the moment, not to a set of formal features that could be found in another house.
