blurb_en: >-
  The corporate counterpart to Maisonneuve, built two years before Maisonneuve existed. Brick-faced
  wooden cubes running unbroken along the sidewalk on rue Saint-Germain, two dwellings each with the
  stair inside, put up in 1881 by the V. Hudon cotton mill for its own workers — and, according to the
  Ville's MEM, the only surviving nineteenth-century company-built housing in Montréal.
origin_en: >-
  Hochelaga industrialised faster than it could house anyone. Four large works arrived between 1871 and
  1881 — the W.C. McDonald tobacco factory, the Abattoirs de l'Est, the Compagnie des moulins à coton
  V. Hudon and the Filature Sainte-Anne, the last two merging in 1905 into Dominion Textile, which then
  held half of the Canadian textile industry — and, in the Évaluation's words, « les terrains sont lotis
  sans réglementation particulière ». The Hudon mill announced its own workers' housing in early
  December 1881 and built this row; it was renovated in 1981, exactly a century later. Read this record
  against the plex on the next page and against Arvida and Témiscaming: an employer housing its
  workforce directly is what a company town does, and it is precisely what Maisonneuve two years later
  did not do. Maisonneuve's promoters sold lots and built civic monuments instead, and left the housing
  to the ordinary speculative builder.
