profile:
  siting_landscape:
    - Built at the sidewalk edge with no setback, and set in an unbroken run — « disposées en enfilade et en bordure du trottoir ».
    - Rue Saint-Germain between rues Rouville and Adam, civic numbers 1451 to 1544; one of the three streets sector 27.E.1 names as the first ground of Hochelaga's workers' housing.
  massing:
    - Square-ish two-storey volumes — « cubes de bois revêtus de briques ».
    - Two dwellings, one on the ground floor and one above, reached by a stair inside the building. No exterior stair; this is 1881, nearly twenty years before the outside stair becomes standard in Montréal.
  articulation: []
  openings: []
  materials:
    - Wood frame faced in brick.
profile_note: >-
  Siting, massing and materials are quoted from the MEM (Mémoires des Montréalais / Centre des mémoires
  montréalaises, Ville de Montréal) article of 8 November 2017 by the Atelier d'histoire
  Mercier-Hochelaga-Maisonneuve, which is the only account of these houses found in an institutional
  source; the Évaluation names rue Saint-Germain as a first street of workers' housing but gives no fiche
  and does not list these buildings individually. Articulation and openings are left empty rather than
  inferred — no photograph of the row could be verified on Commons, and the houses were renovated in 1981,
  so present appearance is not evidence of 1881 detailing. The interior stair is the article's own
  statement, « L'escalier est à l'intérieur », and it is the reason this record attaches to
  duplex-interior-stair rather than to the exterior-stair members of the plex family.
