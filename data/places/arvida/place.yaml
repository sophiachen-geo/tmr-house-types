typology_document:
  title: Lucie K. Morisset, Les maisons d'Arvida 1926/1948. Album de 88 modèles de maisons de compagnie construites à Arvida, 1926–1948 (Éditions Patrimonium / Ville de Saguenay, 2022, 124 p.); Ville de Saguenay, "Modèles des maisons arvidiennes — Quartier historique Sainte-Thérèse" (address→model list, 2014)
  year: 2022
  format: model-catalogue
  note: >-
    88 models are those built inside the declared site; the whole town used "over 100" (Ville de
    Saguenay), 125 (Morisset, 2018 press) or 126 (Le Quotidien, 2016) models for ~2,000 houses.
    Model codes are letter-family + number (A1, B2, M11, R4). Per-model characteristics live in the
    print album; only A1 and M11 are documented online.
map_layer: null           # set to assets/places/arvida/models.geojson once geocoded
summary_en: >-
  The aluminium company's model city on the Saguenay: 2,400 hectares bought by Alcoa, a plan by
  Harry B. Brainerd and Hjalmar E. Skougor (1926) mixing Garden City and City Beautiful ideas, and
  270 houses raised in 135 days in the summer of 1926 from a handful of standardised models that
  the engineer Harold R. Wake had adapted to French-Canadian habits and climate. Three construction
  phases to 1950 produced some 2,000 company houses on more than 100 models; the 800-odd buildings of
  the core were declared a site patrimonial in 2018. Arvida is the site's clearest case of a
  typology defined by catalogue rather than by lot and massing.
