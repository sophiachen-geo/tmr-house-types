profile_note: >-
  Only A1 is documented online (photograph and floor plans reproduced from the company's late-1920s
  "Townsite Houses" catalogue). Storeys, cladding, window type and the A2–A8 variants await Morisset's
  album (Part 4b). Do not fill from photographs.
blurb_en: >-
  The first-phase house: one of the standard models of the summer of 1926, re-drawn by Wake to fit
  French-Canadian family life (a big kitchen instead of parlour and dining room), varied from house
  to house by dormers, porches and roof details so that, in the City's phrase, "not a single house
  was built that resembles its neighbour".
origin_en: >-
  Brainerd's New York-inspired type plans were "rationalised" on site by the engineer Harold R.
  Wake, who adapted them to Québec's climate and household size; the CPCQ dossier speaks of "quatre
  modèles types" enabling the 270 houses of 1926 in 135 days, with variety obtained through dormers,
  balconies and roofs. The address list is consistent with families A–D being that first set: on the
  1926 streets almost every entry is an A, B, C or D code.
