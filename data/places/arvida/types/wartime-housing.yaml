  materials: [Wood frame and panels.]
profile_note: "Not part of the 88 company models; included because the site's 1940s streets contain them and the City documents them. Storey count is the standard Wartime Housing type; confirm locally."
blurb_en: >-
  The federal Crown corporation's prefab, dropped by the hundred around the smelter in the war years
  and then bought, jacked up and given proper foundations by the company in 1949 so they would stay.
origin_en: >-
  Wartime Housing Limited (1941–47) built temporary workers' housing across Canada; in Arvida the
  aluminium company, "interested in conserving, or even developing a dense image of the city of
  aluminum", acquired most of them and made them permanent.
