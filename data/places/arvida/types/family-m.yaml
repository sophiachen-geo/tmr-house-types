profile_note: "M11 is documented as a 1942 neo-vernacular house 'probably from plans by architect Henry Ross Wiggs', catalogued at the time as a 'modern house in the French-Canadian style'. Other M models await Part 4b. The address list also carries one M97 entry (2912 rue Parks); models_observed reports the codes as parsed from the list."
blurb_en: >-
  The wartime detached house in Arvida's regionalist manner: the French-Canadian farmhouse silhouette
  re-issued as a company model. M11 (1942) is the textbook example.
origin_en: >-
  The 1940s phase drew on the regionalist current that the Manoir du Saguenay (Fetherstonhaugh &
  Durnford, 1939) and later the church of Saint-Jacques (Desgagné & Boileau, 1949) also express; the
  RPCQ statement singles out houses "davantage dans l'esprit de l'architecture traditionnelle
  québécoise" alongside those "inspirées de formes populaires aux États-Unis".
