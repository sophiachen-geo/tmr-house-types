profile_note: >-
  Grouped stub for the families the public record does not describe; to be split into separate records
  in Part 4b. The phase attribution is a hypothesis, not a finding: rue La Traverse and rue Castner lie
  between the 1926 core and the war-era streets, and no online source identifies the 1936–41 Barott
  houses by letter. Tenure is mixed and read from the civic numbering alone: G02, G03 and G04 are
  paired (1654-58, 1673-77, 1689-93, 1657-61, 2928-32, 2936-40), as are the single Y (1725-43) and Z
  (1739-41-43) entries, one H03 (1733-35 rue Neilson) and one N (2816-2820 boulevard du Saguenay);
  every other entry in these families is a single civic number. Codes are as parsed from the 2014
  address list, which carries only E01 and E04 for family E (the Part 4 brief anticipated E01–E05) and
  bare N, Y and Z with no model number. No canonical form or style is assigned, and nothing has been
  entered from photographs.
blurb_en: >-
  The families the catalogue index cannot yet describe: twenty codes clustered on rue La Traverse, rue
  Castner and rue Coulomb, between the first streets of 1926 and the war-era additions.
origin_en: >-
  Probably the second construction phase, which opened in early 1936 with houses by the Montréal
  architect Ernest Isbell Barott; no online source ties Barott's designs to particular model letters,
  so the attribution stays provisional until Morisset's album is read.
