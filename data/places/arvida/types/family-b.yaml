profile_note: >-
  Family not documented online; see Part 4b. Tenure is single-family for most entries, but the address
  list also shows paired civic numbers (2746-48 B01, 2769-71 B02, 1846-48 B02, 1852-54 B01, 1863-65 B01),
  so some B models were built as pairs. Roof form, storeys, cladding and openings await Morisset's album;
  nothing here is taken from photographs.
blurb_en: >-
  The second of the 1926 model families: B01 and B02 are scattered through the first streets around
  parc Oersted, while B03 and B04 appear only later, on rue La Traverse.
origin_en: >-
  One of the standardised models of the first construction phase, from Brainerd's type plans as
  reworked on site by Harold R. Wake; see family A for the origin of the 1926 set.
