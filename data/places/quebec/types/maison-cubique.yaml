blurb_en: A square plan, square elevations and two or three levels — a lot of house for the footprint, which is
  exactly what the American catalogues sold it on. The common version has a low four-slope roof with dormers in
  an inhabited attic; the other is simply flat-topped.
origin_en: Devised in the United States by the architect Frank Kidder in 1891, the cubic house (Four Square House)
  was abundantly circulated in architectural catalogues, which made much of the size of its living space. The plan
  and elevations of square appearance, and the two or three occupied levels, do give this house an imposing volume.
  Built above all during the first half of the 20th century, it is found in the quarters and suburbs of Québec and
  is strictly associated with residential architecture. Though a single-family house to begin with, more than one
  dwelling may be found in it.
