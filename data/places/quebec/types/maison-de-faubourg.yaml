blurb_en: 'The plainest house in the city and the one the fires rewrote: a storey or a storey and a half of pièce-sur-pièce
  timber under a steep two-slope roof, three openings at the front with the door pushed to one end, two at the back,
  blind gables, and corner boards for the whole of its ornament. After the fires the by-laws took away the boards
  and the shingles and gave it brick or roughcast and eaveless tin instead.'
origin_en: Set outside the limits of the walled town, this type descends from the urban house of French inspiration
  and can be read as a simplified version of the Québécois neoclassical house. It spread widely at Québec through
  faubourgs such as Saint-Roch, Saint-Sauveur and Saint-Jean-Baptiste, which grew under demographic pressure from
  the middle of the 18th century. It is a single-family dwelling, simple and rudimentary, built until the end of
  the 19th century by artisans, by workers, or by the owner himself. Following the great fires or the densification
  of the faubourgs, these houses were often rebuilt, enlarged, raised by one or two storeys, given dormers, or capped
  with a mansard roof that gave more space under the attic.
