profile:
  siting_landscape:
  - Built outside the limits of the walled town, it spread widely at Québec through the faubourgs of Saint-Roch,
    Saint-Sauveur and Saint-Jean-Baptiste, which grew under demographic pressure from the middle of the 18th century.
  - Often party-wall, or set off from its neighbours by a narrow alley.
  massing:
  - 'Composition: a simple, rudimentary house, with or without symmetry, party-wall or set off from its neighbours
    by a narrow alley; a type descended from the urban house of French inspiration and from the Québécois neoclassical
    house.'
  - One to two occupied levels (one to one and a half storeys); following densification or a fire, the house may
    be rebuilt, enlarged, raised by one or two storeys, given dormers, or capped with a mansard roof.
  - Two-slope roof with shallow straight or curved eaves; steep pitch, over 45°; following the by-laws against fire,
    an eaveless roof.
  - The basic model has a ground floor under a two-slope roof, straight or curved, with a shallow eave.
  articulation:
  - 'Ornaments: corner boards.'
  - The ornament stays limited to corner boards and chambranles.
  openings:
  - 'Few openings, fitted with chambranles: three at the front including the door at the end of the façade, and
    two at the rear; no dormer.'
  - The gable walls usually stay blind.
  materials:
  - Walls of pièce-sur-pièce timber; vertical or horizontal wood board cladding; following the by-laws against fire,
    walls clad in brick, roughcast or stucco.
  - Foundation barely visible or raised above the ground.
  - Roof covering of cedar shingle, board-and-batten or lapped board; following the by-laws against fire, traditional
    sheet metal.
profile_fr:
  description:
  - Implanté à l’extérieur des limites de la ville intra-muros, ce type est issu de la maison urbaine d’inspiration
    française et il peut être vu comme une version simplifiée de la maison néoclassique québécoise. Il s’est largement
    répandu à Québec dans les faubourgs comme Saint-Roch, Saint-Sauveur et Saint-Jean-Baptiste qui se sont développés
    en raison de la pression démographique à partir du milieu du 18e siècle. La maison de faubourg est donc une
    habitation unifamiliale, simple et rudimentaire, construite jusqu’à la fin 19e siècle par des artisans, des
    ouvriers ou même par son propriétaire. Le modèle de base comprend un rez-de-chaussée coiffé d’une toiture à
    deux versants, droits ou recourbés, avec un faible avant-toit. Il est souvent mitoyen ou espacé des maisons
    voisines par une allée étroite.
  - 'Les murs de cette maison sont montés en bois pièce sur pièce et recouverts à l’origine de planches verticales
    ou horizontales. Plus tard, la réglementation pour lutter contre les incendies oblige à crépir les murs ou à
    les revêtir de briques tandis que les toitures de bardeau de cèdre ou de planches à couvre-joints font place
    à des couvertures en tôle. Les murs pignons restent habituellement aveugles et les ouvertures sont peu nombreuses
    : trois à l’avant incluant la porte et deux à l’arrière. L’ornementation demeure limitée aux planches cornières
    et aux chambranles.'
  - À la suite des grands incendies ou de la densification des faubourgs, il arrive souvent que ces maisons soient
    reconstruites, agrandies, surhaussées d’un ou deux étages, munies de lucarnes ou coiffées d’une toiture mansardée
    qui offre davantage d’espace sous les combles.
  elements_caracteristiques:
  - 'Composition : maison simple, rudimentaire, avec ou sans symétrie et mitoyenne ou espacée des maisons voisines
    par une allée étroite; type issu de la maison urbaine d’inspiration française et de la maison néoclassique québécoise.'
  - Un à deux niveaux d’occupation (1 à 1 étage ½); suite à la densification ou à un incendie, la maison peut être
    reconstruite, agrandie, surhaussée d’un ou deux étages, munie de lucarnes ou coiffée d’une toiture mansardée.
  - Fondation peu visible ou visible hors sol.
  - 'Murs en bois pièce sur pièce; revêtement de planche de bois verticale ou horizontale; suite à la règlementation
    pour lutter contre les incendies, murs : revêtement de brique, de crépi ou d’enduit (stuc).'
  - Toit à deux versants et faibles avant-toits droits ou recourbés; pente forte (plus de 45°); revêtement de bardeau
    de cèdre, de planche à couvre-joints ou de planche chevauchée; suite à la règlementation pour lutter contre
    les incendies, toit sans avant-toit; revêtement de tôle traditionnelle.
  - 'Ouvertures peu nombreuses et garnies de chambranles : trois à l’avant incluant la porte à l’extrémité de la
    façade et deux à l’arrière; absence de lucarne.'
  - 'Ornements : planches cornières.'
