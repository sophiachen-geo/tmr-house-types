profile_fr:
  description:
  - En réaction à l’industrialisation et à la modernité montante, les influences marginales apparaissent au début
    du XXe siècle. Venues d’Europe, elles sont portées par une idéologie nationaliste ou un désir de créer une architecture
    originale et authentique. Elles prônent l’emploi de matériaux traditionnels ou locaux dont découle une ornementation
    sans artifice. À Québec, ces principes se transposent surtout aux bâtiments à fonction résidentielle ou religieuse.
profile_note: 'One of the nine top-level currents of the thesaurus — a landing page, not a thesaurus node, so it
  carries no tid and no Éléments caractéristiques list. Recorded so the nine-current tree can be read whole and
  checked against docs_tableau_styles.pdf; given no card and no page of its own. Its French is the landing page''s
