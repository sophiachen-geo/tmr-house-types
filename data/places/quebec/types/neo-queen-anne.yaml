blurb_en: 'The picturesque taken as far as it will go: an irregular plan, articulated volumes, asymmetrical fronts,
  turrets under conical roofs, oriels and a wrap-around gallery, all in red brick whose texture and colour are worked
  deliberately against the trim. Almost exclusively a house, and almost exclusively an anglophone one.'
origin_en: The neo-Queen Anne style appeared in Britain about the middle of the 19th century, largely through the
  architect Richard Norman Shaw. Particularly prized by the middle class of the industrial period, it carried the
  revival of English vernacular architecture, drawing its vocabulary from old rustic cottages. Despite taking its
  name from Queen Anne Stuart it has little connection with the architecture built under her reign (1702–1714).
  In vogue between 1880 and 1915 with the anglophone community of Québec, it is used almost exclusively in residential
  architecture, where the search for the picturesque had become the established norm of the Victorian era.
