profile:
  siting_landscape:
  - In vogue between 1880 and 1915 with the anglophone community of Québec, and used almost exclusively in residential
    architecture.
  - The bourgeois houses, combining medieval picturesque with Georgian classicism, are associated with the rural
    and suburban parts of the city.
  massing:
  - 'Composition drawn from the revival of English vernacular architecture, itself drawn from old rustic cottages:
    a refined character, asymmetrical fronts, decoration at once simple and elaborate, and a contrasting treatment
    of materials and ornaments; a picturesque effect combining the medieval picturesque with Georgian classicism.'
  - Irregular plan; articulated volumes.
  - Two to three occupied levels (one and a half to two and a half storeys).
  - Straight two- or four-slope roof, truncated four-slope roof crowned with a rooftop terrace, multi-slope or asymmetrical;
    medium pitch, about 45°.
  - 'Projections: avant-corps, balcony, chimneys, logettes, oriels and perron; projections capped with conical roofs:
    gallery, wrapping or not, towers and turrets; secondary body: side wing under a straight two-slope roof.'
  articulation:
  - 'Ornaments: bandeaux, quoins, columns, consoles, cornices, finials, pediments, cut-out woodwork, gables, corner
    boards and cornice returns.'
  - The ornamental treatment of the materials, at once textured and coloured, contrasts with the principal cladding
    and picks out the different parts of the construction — the base, the asymmetrical fronts, the irregular steep
    roofs, the chimney stacks, the dormers and the articulated volumes.
  openings:
  - Rectangular openings fitted with chambranles, keystones, lintels and flat arches.
  - Panelled door with or without glazing, surmounted by a transom.
  - Casements with large panes, or sashes with or without glazing bars; dormers present.
  materials:
  - 'Walls: textured or plain stone, wood, roughcast or stucco cladding, but generally red brick.'
  - Stone foundation raised above the ground.
  - Slate or traditional sheet-metal roof covering.
profile_fr:
  description:
  - Le style néo-Queen Anne apparaît en Grande-Bretagne vers le milieu du 19e siècle, notamment grâce à l’architecte
    Richard Norman Shaw qui en est le principal instigateur. Particulièrement prisé auprès de la classe moyenne
    issue de la période industrielle, ce style véhicule le renouveau de l’architecture vernaculaire anglaise en
    puisant son vocabulaire des cottages rustiques anciens. Malgré le fait qu’il tire son nom de la reine Anne Stuart,
    il présente peu de lien avec l’architecture pratiquée sous son règne (1702-1714). Dans un certain sens, il se
    réfère plutôt au passage du 17e au 18e siècle, soit à la transition entre la période historique du Moyen Âge
    et celle de la constitution de l’Europe moderne.
  - En vogue entre 1880 et 1915 auprès de la communauté anglophone de Québec, le style néo-Queen Anne est utilisé
    presque exclusivement en architecture résidentielle où la recherche de pittoresque devient la norme établie
    au cours de l’ère victorienne.
  - Les maisons bourgeoises, combinant ainsi le pittoresque moyenâgeux au classicisme géorgien, sont associées au
    milieu rural et suburbain de la ville.
  - La maison de style néo-Queen Anne est recouverte de bois, de pierre ou de crépi, mais elle fait généralement
    usage de brique rouge. Le traitement ornemental de ces matériaux, à la fois texturé et coloré, contraste avec
    le revêtement principal. Ils viennent de ce fait souligner les différentes parties de la construction telles
    que le soubassement, les façades asymétriques, les toitures irrégulières et à forte pente, les souches de cheminée,
    les lucarnes ainsi que les volumes articulés et ponctués par des ailes, des frontons, des pignons ou des saillies.
    Ces dernières comptent par exemple des tourelles circulaires ou carrées, des avant-corps munis d’oriels ou de
    logettes, de même que des galeries tournantes couvertes de toits coniques. Afin de concevoir une maison de style
    néo-Queen Anne, une composition raffinée et un décor à la fois simple et élaboré demeurent essentiels.
  elements_caracteristiques:
  - 'Composition issue du renouveau de l’architecture vernaculaire anglaise qui s’inspire des cottages rustiques
    anciens : caractère raffiné, façades asymétriques, décor simple et élaboré et traitement des matériaux et des
    ornements de manière contrastante; création d’un effet pittoresque combinant le pittoresque moyenâgeux au classicisme
    géorgien.'
  - Plan irrégulier; volumes articulés.
  - Deux à trois niveaux d’occupation (1 étage ½ à 2 étages ½).
  - Fondation en pierre visible hors sol.
  - 'Murs : revêtement texturé ou non de pierre, de bois, de crépi ou d’enduit (stuc), mais généralement de brique
    rouge.'
  - Toit à deux ou à quatre versants droits, à quatre versants droits tronqués couronné d’une terrasse faîtière,
    à versants multiples ou asymétrique; pente moyenne (environ 45°); revêtement d’ardoise ou de tôle traditionnelle.
  - Ouvertures rectangulaires garnies de chambranles, de clefs, de linteaux et de plate-bande; porte à panneau(x)
    avec ou sans vitrage surmontée d’une imposte; fenêtres à battants et à grands carreaux ou à guillotine avec
    ou sans petit-bois; présence de lucarnes.
  - 'Saillies : avant-corps, balcon, cheminées, logettes, oriels et perron; saillies coiffées de toits coniques
    : galerie tournante ou non, tours et tourelles; corps secondaire : aile latérale coiffée d’un toit à deux versants
    droits.'
  - 'Ornements : bandeaux, chaînes d’angle, colonnes, consoles, corniches, épis, frontons, garnitures de bois découpées,
    pignons, planches cornières et retours d’équerre.'
