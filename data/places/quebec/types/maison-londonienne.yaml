blurb_en: Narrow, deep and built in pairs or rows straight onto the pavement, with the door at one end of a three-bay
  front and a carriage passage to the yard behind. The rooms get smaller and more private as you climb, and the
  top-floor windows are squashed into an attic band — the detail that identifies the type.
origin_en: 'The London-type house belongs to the neoclassical style and recalls the residential models built in
  London in the 18th century. At Québec it marks the urban fabric of the 19th century, mainly from 1815 to 1870:
  an imposing volume of two or three levels with an attic, party fire-break walls carrying wide chimneys, and walls
  of ashlar or rubble stone, brick or roughcast showing a search for purity of surface suited to this sober and
  rigorous architecture.'
