profile:
  siting_landscape:
  - Principally associated with urban residential architecture — housing workers' families, for instance — but also
    referring to commercial architecture.
  - The balloon frame arrived from the United States and coincided with the rapid growth of the cities and their
    demographic surge; the type appeared after the Long Depression (1873–1896) and carried on into the first decades
    of the 20th century.
  massing:
  - 'Composition: a search for symmetry; single-family house, duplex.'
  - One to two occupied levels (one to two storeys); ground floor in commercial or residential use.
  - Flat roof (basin or internal drainage); membrane covering. Low-pitch flat roof (external drainage); very low
    pitch, under 15°; straight two-slope roof; low pitch, under 30°; asphalt shingle, membrane, profiled or traditional
    sheet-metal covering.
  - 'Projections sheltered by an awning: balcony, gallery and perron.'
  - The economy of means dictates a simple plan, a balloon frame, an inexpensive cladding and a stripped-down decoration.
  - At first a low-pitch roof draining to the rear, reaching 15 degrees, then the flat roof drained internally and
    covered in tar or membrane and gravel.
  articulation:
  - 'Ornaments: finials, cornice, crowning, mast, parapet and corner boards.'
  - As the roof is no longer visible, its presence is marked by ornamental work such as the cornice or the parapet.
  - For Boomtown shops, the cornice or parapet is used to give the volume of the construction some standing.
  openings:
  - Commercial shopfronts.
  - The gallery often runs across the whole of the principal façade, with a balcony at the upper storey.
  materials:
  - 'Walls: wood board cladding; balloon frame. Side walls: wood shingle, asbestos shingle, sheet tin or brick paper
    cladding.'
  - Sometimes clad in brick, often built of wood.
profile_fr:
  description:
  - L’industrialisation a permis de mettre au point de nouveaux modes de constructions économiques qui accélèrent
    considérablement le travail. Venue des États-Unis puis introduite au Canada, la charpente à claire-voie (Balloon
    Frame) coïncide par conséquent avec la croissance rapide des villes et leur essor démographique. Qualifiés d’American
    Boomtown, les bâtiments qui utilisent cette charpente plus légère, à l’aide de madriers sciés, sont surtout
    apparus par le biais de l’architecture développée après la Grande Dépression (1873-1896), pour se poursuivre
    dans les premières décennies du 20e siècle.
  - Les bâtiments de type Boomtown sont faciles à construire. En règle générale, l’économie de moyens commande un
    plan simple, une charpente à claire-voie, un parement peu couteux et un décor dépouillé. Bien qu’ils soient
    principalement associés à l’architecture résidentielle urbaine afin d’y loger les familles d’ouvriers par exemple,
    ils renvoient aussi à l’architecture commerciale.
  - 'Parfois revêtue de brique, souvent bâtie en bois, la maison Boomtown se caractérise par sa volumétrie : un
    ou deux niveaux d’occupation coiffés d’un toit à faible pente ou plat. Elle possède à ses débuts une toiture
    à faible pente vers l’arrière, dit à égout extérieur, qui peut atteindre 15 degrés. Elle adopte ensuite le toit
    plat, dit à bassin ou à égout intérieur, qui est recouvert de goudron ou de membranes et de gravier. Comme le
    toit n’est plus visible, sa présence est soulignée par des ouvrages ornementaux tels que la corniche ou le parapet.
    Les saillies sont souvent constituées d’une galerie, courant sur toute la façade principale, et d’un balcon
    à l’étage. En ce qui à trait aux commerces Boomtown, la corniche ou le parapet est utilisé pour donner de la
    prestance au volume de la construction. L’ordonnance et le modèle des ouvertures sont directement en lien avec
    la fonction du bâtiment : des fenêtres à guillotine ou à grands carreaux, disposées symétriquement, caractérisent
    les étages alors que des vitrines se trouvent au rez-de-chaussée.'
  elements_caracteristiques:
  - 'Composition : recherche de symétrie; maison unifamiliale, duplex.'
  - Un à deux niveaux d’occupation (1 à 2 étages); rez-de-chaussée à usage commercial ou résidentiel.
  - 'Murs : revêtement de planche de bois; charpente à claire-voie (Balloon Frame). Murs latéraux : revêtement de
    bardeau de bois, de bardeau d’amiante, de tôle en plaques ou de papier brique.'
  - Toit plat (bassin ou à égout intérieur); revêtement de membrane(s). Toit plat à faible pente (à égout extérieur);
    pente très faible (moins de 15°); toit à deux versants droits; pente faible (moins de 30°); revêtement de bardeau
    d’asphalte, de membrane(s), de tôle profilée ou de tôle traditionnelle.
  - Vitrines commerciales.
  - 'Saillies protégées par un auvent : balcon, galerie et perron.'
  - 'Ornements : amortissements, corniche, couronnement, mât, parapet et planches cornières.'
