blurb_en: 'Cheap, fast and light: a balloon frame, a simple plan, boards on the front and whatever came to hand
  down the sides, under a roof that slopes gently back or lies flat. Because the roof cannot be seen, the whole
  architectural argument is moved to the cornice and the parapet at the top of the wall.'
origin_en: 'Industrialisation brought new economical ways of building that sped the work up considerably. The balloon
  frame, which came from the United States and was then introduced into Canada, coincided with the rapid growth
  of the cities and their demographic surge. Called American Boomtown, the buildings using this lighter frame of
  sawn timber appeared above all in the architecture developed after the Long Depression (1873–1896) and carried
  on into the first decades of the 20th century. They are easy to build: the economy of means dictates a simple
  plan, a balloon frame, an inexpensive cladding and a stripped-down decoration.'
