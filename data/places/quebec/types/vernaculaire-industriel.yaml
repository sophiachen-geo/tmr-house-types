profile_fr:
  description:
  - L’architecture vernaculaire industrielle, également désignée sous le terme d’architecture vernaculaire américaine,
    se rattache au courant industriel. Ce dernier est moins tourné vers la tradition, puisqu’il emploie de nouvelles
    méthodes et matériaux de construction. Le métal, le béton armé et le verre permettent l’émergence d’une architecture
    qui se caractérise par la simplicité et l’uniformité. La forme du bâtiment est mise en avant-plan à l’aide des
    éléments structuraux, une composition d’ensemble rationnelle et une ornementation sobre.
  - Développée aux États-Unis puis introduite au Canada, l’architecture vernaculaire industrielle a connu une grande
    popularité et a contribué à la croissance rapide des villes, conséquente à l’explosion démographique. Elle marque
    donc principalement l’architecture résidentielle et se retrouve dans les quartiers et les banlieues de Québec.
    Davantage présente dans Limoilou, Montcalm ou à Vanier, elle est aussi populaire dans Saint-Sacrement, à Sainte-Foy
    et à Sillery. Elle se décline sous différents types dont la diffusion massive a contribué à la disparition des
    savoir-faire locaux traditionnels. D’un autre côté, elle a facilité l’accès aux plans et aux matériaux de construction,
    en plus de permettre l’érection rapide et à faible coût d’un bâtiment.
  - L’architecture vernaculaire industrielle se distingue peu d’un point de vue stylistique, puisqu’elle reprend
    souvent les types du siècle précédent en les simplifiant, particulièrement dans l’architecture résidentielle.
    L’innovation est visible au chapitre des matériaux et des éléments architecturaux utilisés; les premiers sont
    usinés, tels que les poutres et les planches, tandis que les seconds, notamment les portes et les fenêtres,
    sont standardisés et distribués par catalogues ou revues. La volumétrie du bâtiment est simplifiée à l’extrême;
    elle se résume souvent à une boîte carrée dont l’austérité est amenuisée par des éléments décoratifs ou des
    toitures à pentes variables. Tous ces facteurs, en plus de l’utilisation de la charpente à claire-voie (Balloon
    Frame), accélèrent considérablement le processus de construction. Il est possible, selon les publicités de l’époque,
    de bâtir sa maison en quelques jours sans connaissance pratique préalable à partir d’un plan type que le client
    peut adapter à ses besoins et à ses moyens.
  elements_caracteristiques:
  - 'Composition issue du courant industriel : caractère rationnel et logique, construction rapide et standardisée
    et forme mise en avant-plan à l’aide des éléments structuraux.'
  - Plan rectangulaire; volume simple.
  - Fondation en blocs de béton ou en pierre visible hors sol, mais généralement en béton.
  - 'Murs : revêtement de brique.'
  - Ouvertures régulières et rectangulaires garnies de chambranles, de clefs, de linteaux et de plates-bandes; porte
    à panneau(x) avec vitrage surmontée ou non d’une imposte; fenêtres à battants et à grands carreaux, à battants
    avec imposte ou à guillotine avec ou sans petits-bois.
  - Ornements réduits.
