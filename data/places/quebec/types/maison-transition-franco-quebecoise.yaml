blurb_en: 'The house caught between two building traditions: French footing, steep roof and massive chimney stacks,
  with the British contribution visible only in how regularly the openings and the chimneys are now placed, how
  many more windows there are, and how much larger the panes have grown.'
origin_en: The house changed little in the decades after the Conquest of 1759–1760, because the tradesmen and their
  French traditions remained. It met British influence only at the turn of the 19th century, with the English immigration
  that brought the newcomers' own ways of building. That period, from about 1770 to 1820, begins the adaptation
  of the French model to the Québécois context while under the influence of the neoclassical style, and produces
  the Franco-Québécois transition house, built at Québec in rural and semi-urban settings and in the faubourgs.
