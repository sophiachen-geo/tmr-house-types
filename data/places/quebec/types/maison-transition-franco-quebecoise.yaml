profile:
  siting_landscape:
  - Built at Québec in rural and semi-urban settings, and in the faubourgs.
  - The period from about 1770 to 1820 begins the adaptation of the French model to the Québécois context, under
    the influence of the neoclassical style.
  massing:
  - 'Composition: with or without symmetry; a type descended from the rural house of French inspiration.'
  - Rectangular plan; variable volume.
  - Two occupied levels (one and a half storeys); no cellar.
  - Two-slope roof with straight or curved eaves; medium pitch, about 45°.
  - 'Projection: chimney at the centre, off-centre, or set within the gable wall.'
  - The type keeps a good footing on the ground, a steep roof and massive chimney stacks from the house of French
    inspiration; the roof pitch is often less pronounced than that house's, and the eave, straight or curved, oversails
    the wall face.
  articulation:
  - Classical ornaments such as pediments sometimes dress the dormers and the windows, which are surrounded by carved
    wood chambranles.
  openings:
  - Openings fitted with chambranles; gabled or pedimented dormers.
  - The British influence is legible in the more regular disposition of the openings and the chimneys.
  - The openings are more numerous than on the house of French inspiration and their panes are enlarged; dormers,
    the gabled model in ordinary use, become general.
  materials:
  - Walls of rubble stone or pièce-sur-pièce timber; wood board, roughcast or stucco cladding.
  - Foundation barely raised above the ground.
  - Cedar shingle roof covering.
profile_fr:
  description:
  - La maison évolue peu dans les décennies qui suivent la Conquête de 1759-1760, car les gens de métier et leurs
    traditions françaises demeurent. Elle n’est confrontée aux influences britanniques qu’au tournant du 19e siècle,
    suite à l’immigration anglaise qui apporte avec ces nouveaux arrivants leurs propres traditions de construire.
    Cette période, aux environs de 1770 à 1820, amorce ainsi l’adaptation du modèle français au contexte québécois,
    tout en étant influencée par le style néoclassique. Elle entraîne le développement de la maison de transition
    franco-québécoise qui s’est implantée à Québec en milieu rural et semi-urbain, ou encore dans les faubourgs.
  - Ce type reprend quelques caractéristiques de la maison d’inspiration française avec une bonne assise au sol,
    un toit à forte pente, des murs en pierre de moellons ou en pièce-sur-pièce et d’imposantes souches de cheminée.
    L’influence britannique est quant à elle observable dans la disposition plus régulière des ouvertures et des
    cheminées. Des ornements classiques comme les frontons garnissent parfois les lucarnes et les fenêtres qui sont
    entourées de chambranles de bois sculpté.
  - La maison compte un rez-de-chaussée et un comble habitable, un volume variable, des murs revêtus de bois ou
    de crépi, une pente de toit souvent moins prononcée que celle de la maison d’inspiration française et un avant-toit
    droit ou courbé qui déborde de la surface du mur. La position de la souche de cheminée varie considérablement
    ; au centre, ou bien à une ou à chaque extrémité de la toiture. Les ouvertures sont plus nombreuses que sur
    la maison d’inspiration française et leurs carreaux de verre sont agrandis. La présence de lucarnes, avec le
    modèle d’usage à pignon, se généralise.
  elements_caracteristiques:
  - 'Composition : avec ou sans symétrie; type issu de la maison rurale d’inspiration française.'
  - Plan rectangulaire; volume variable.
  - Deux niveaux d’occupation (1 étage ½); absence de cave.
  - Fondation peu visible hors sol.
  - Murs en pierre à moellons ou en bois pièce sur pièce; revêtement de planche de bois, de crépi ou d’enduit (stuc).
  - Toit à deux versants et avant-toits droits ou recourbés; pente moyenne (environ 45°); revêtement de bardeau
    de cèdre.
  - Ouvertures garnies de chambranles; lucarnes à pignon ou à fronton.
  - 'Saillie : cheminée au centre, décentrée ou incluse dans le mur pignon.'
