profile_fr:
  description:
  - Ce mouvement de design, à cheval entre l’Art déco et le style International, s’inspire de l’aérodynamisme des
    moyens de transport des années 1930, 1940 et 1950, notamment les avions à hélices, les locomotives à vapeur,
    les automobiles de luxe et les paquebots, qui sont des symboles de progrès et d’un nouvel art de vivre. Si pour
    l’Art déco, l’accent était mis sur la verticalité, le courant Streamline, aussi appelé Art moderne ou Streamline
    Deco, verra en revanche l’horizontalité dominer, en accord avec les traînées de vent qui évoquent la rapidité
    des véhicules. Ce style est surtout employé dans l’architecture commerciale, industrielle et résidentielle jusqu’à
    l’orée des années 1960. Il préconise des angles arrondis, des bandeaux horizontaux continus, des fenêtres divisées
    à l’horizontale et des bas-reliefs épurés.
  elements_caracteristiques:
  - 'Volumétrie : horizontalité, souvent un coin de l’édifice est arrondi.'
  - Bandeau de fenêtre.
profile_note: A style the thesaurus applies to non-residential buildings — the fiche carries no storey-count-for-habitation
  bullet and its linked exemplars are a medical centre and commercial blocks. Recorded so the source's list can
  be read whole, but out of this site's residential scope, so it gets no card and no page. Its French is verbatim
  from the fiche.
