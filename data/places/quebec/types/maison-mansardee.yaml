blurb_en: 'The Second Empire without the monumentality: the same broken roof, the same dormers cut into a near-vertical
  brisis, but on a plain house, popularised through American plan catalogues. At Québec it is a densification device
  — swap a two-slope roof for a mansard and the attic becomes a whole extra floor.'
origin_en: The mansard or broken-roofed house can be understood as the vernacular version of the Second Empire style.
  Though it has neither its monumentality nor its presence, its silhouette gives off a certain elegance. It was
  popularised in the United States through architectural catalogues, in which the variations of pitch and the flaring
  of the roofs became regional particularities. It leaves its mark on the Québécois landscape between 1860 and 1920,
  in rural, semi-urban and urban settings, and at Québec it densifies the built fabric of the faubourgs in particular.
