profile:
  siting_landscape:
  - 'Layout: garden, quality of the landscaping, a wide expanse of ground and abundant vegetation.'
  - At Québec, villégiature spread to the suburbs — Sillery, Beauport and Sainte-Foy — over the 19th century; Regency
    buildings appear mainly between 1820 and 1880 along the old routes such as the Grande Allée and the chemins
    Saint-Louis and Sainte-Foy.
  - Built on large properties still unoccupied or later subdivided, the building stands in communion with the setting
    it is placed in.
  massing:
  - Composition with a search for symmetry while integrating the forms into the natural environment.
  - One to two occupied levels (one to one and a half storeys).
  - Square plan.
  - Four-slope roof; low pitch, under 30°; with curved eaves, though generally straight; traditional sheet-metal
    covering.
  - 'Projections: wrap-around gallery sheltered by the eaves, and chimneys rising from the roof.'
  - A low, wide-spreading four-slope roof whose eaves are sometimes curved is what marks the type out above all.
  articulation:
  - 'Classical ornament: columns, cornices, pediments and pilasters.'
  - The ornaments are a more or less simplified recollection of those of Greek and Roman temples.
  openings:
  - Regular rectangular openings fitted with chambranles, surrounds and flat arches; central door with sidelight(s)
    and transom, and French windows.
  - Casements with small or large panes; hipped or gabled dormers.
  - Shed dormers.
  - The most usual window is the casement with large panes, which sometimes becomes a French window.
  materials:
  - 'Walls: stone, brick or wood cladding.'
  - Stone foundation barely raised above the ground.
profile_fr:
  description:
  - 'Le style Regency s’inspire de deux conceptions esthétiques :'
  - '- Celle issue du néoclassique, basée sur l’interprétation rigoureuse des modèles antiques classiques ;'
  - '- Celle issue du pittoresque, qui cherche à intégrer l’irrégularité des formes à l’environnement naturel.'
  - Ces principes se transposent surtout à l’architecture résidentielle en périphérie des centres urbains, puisque
    le bâtiment se présente en communion avec le décor dans lequel il se trouve. La construction de grandes maisons
    appelées villas sera suivie de maisons plus modestes qui prennent l’allure de cottages. Introduits par les Britanniques,
    ces types ont été adoptés par l’élite anglaise désireuse de posséder une maison à la campagne.
  - À Québec, le développement de la villégiature gagne les banlieues comme Sillery, Beauport et Sainte-Foy au cours
    du 19e siècle. Construits sur de grandes propriétés encore inoccupées ou qui seront morcelés, les bâtiments
    de style Regency apparaissant principalement entre 1820 et 1880 le long des parcours anciens tels que la Grande
    Allée et les chemins Saint-Louis et Sainte-Foy.
  - Cottage Regency
  - Le cottage Regency est un type qui se distingue avant tout par un toit à quatre versants à profil bas et étendu
    dont l’avant-toit est parfois recourbé. Il comprend un ou deux niveaux d’occupation avec un plan de forme plutôt
    carrée. Les murs sont revêtus de brique, de pierre ou de bois.
  - Le cottage Regency offre une composition symétrique comme en témoigne la disposition ordonnée de ses ouvertures.
    Le vocabulaire classique y est bien présent. Les éléments d’ornementation se veulent ainsi un rappel plus ou
    moins simplifié de ceux des temples grecs et romains avec l’usage de colonnes, de pilastres et de frontons.
  - D’influence pittoresque, le cottage est entouré d’une galerie protégée par les avant-toits, ce qui lui permet
    de s’ouvrir généreusement vers l’extérieur. Il est par conséquent en harmonie avec la nature, puisqu’un jardin
    est souvent aménagé sur son vaste terrain.
  - Le modèle le plus usuel de fenêtre est celui à battants et à grands carreaux qui devient parfois une porte-fenêtre.
    Des lucarnes en appentis, à croupe ou à pignon percent la toiture alors que de longues souches de cheminées
    s’élancent au-delà du toit.
  elements_caracteristiques:
  - Composition avec la recherche de symétrie tout en intégration des formes à l’environnement naturel.
  - Un à deux niveaux d’occupation (1 à 1 étage ½).
  - Plan carré.
  - Fondation en pierre peu visible hors sol.
  - 'Murs: revêtement de pierre, de brique ou de bois.'
  - Toit à quatre versants; pente faible (moins de 30°); avec avant-toits recourbés, mais généralement droits; revêtement
    de tôle traditionnelle.
  - Lucarnes en appentis.
  - Ouvertures régulières et rectangulaires garnies de chambranles, d’encadrements et de plate-bande; porte centrale
    à baies(s) latérale(s) et à imposte et portes-fenêtres; fenêtres à battants et à petits ou à grands carreaux;
    lucarnes à croupe ou à pignon.
  - 'Saillies : galerie pourtournante protégée par les avant-toits et cheminées s’élançant du toit.'
  - 'Ornements classiques: colonnes, corniches, frontons et pilastres.'
  - 'Aménagement : jardin, qualité de l’aménagement paysager, terrain de vaste étendue et végétation abondante.'
