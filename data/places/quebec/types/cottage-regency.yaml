blurb_en: A square one-storey cottage under a low four-slope roof whose eaves run out far enough to roof a veranda
  all the way round — the picturesque half of the Regency, built out along the Grande Allée and the chemins Saint-Louis
  and Sainte-Foy on grounds big enough to lay out a garden.
origin_en: 'The Regency draws on two aesthetics at once: the neoclassical, based on a rigorous reading of classical
  models, and the picturesque, which seeks to fit irregular forms into the natural setting. Those principles went
  mostly into residential architecture on the edge of the urban centres. Large houses called villas were followed
  by more modest ones taking the look of cottages; introduced by the British, both were adopted by the English elite
  who wanted a house in the country. At Québec villégiature reached the suburbs of Sillery, Beauport and Sainte-Foy
  over the 19th century, and Regency buildings appear mainly between 1820 and 1880.'
