profile:
  siting_landscape:
  - Common in the urban parts of Québec, notably in the Montcalm and Limoilou quarters — today Vieux-Limoilou, Lairet
    and Maizerets.
  - Usually party-wall, which allows a greater urban density; built in numbers, plexes can form ensembles whose
    fronts are given rhythm by repeated elements.
  - The small setback left in front of the buildings is what makes the projecting stairs, balconies and galleries
    possible.
  massing:
  - 'Composition: multi-unit house, detached, party-wall or in a row, taking in several types including the duplex,
    triplex and quadruplex, and comprising superposed dwelling units with independent entries reached by exterior
    or interior stairs.'
  - Two to four occupied levels (two to four storeys).
  - Flat roof (basin or internal drainage); membrane covering. Low-pitch flat roof (external drainage); very low
    pitch, under 15°; asphalt shingle, membrane, profiled or traditional sheet-metal covering.
  - 'Projections: avant-corps, straight, turning, spiral or recessed stairs, logettes and oriels; projections sheltered
    by an awning and superposed: balconies, galleries and perrons.'
  - 'It stands beside, then from about 1910 supplants, the Boomtown building, taking over several of its characteristics:
    brick cladding, flat roof, imposing cornice or crowning, and standardised components.'
  articulation:
  - 'Ornaments: acroteria, finials, bandeaux, decorative brick, quoins, consoles, corbels, cornice in sheet metal
    or wood, and crowning.'
  - Ornamental wrought iron used for risers and posts, but generally for the balustrades of the projections.
  openings:
  - Arched openings, usually segmental, fitted with arches and keystones.
  - Fully glazed door, with or without a transom above.
  - Compound casements with transom, paired sashes or compound sashes.
  - The rectangular windows are casements with transoms or sashes, dressed with lintels or flat arches.
  materials:
  - Brick cladding.
  - The projecting stairs, balconies and galleries are of brick, wood or iron.
profile_fr:
  description:
  - Le plex est une maison à logements. Il comprend deux (duplex), trois (triplex) ou quatre (quadruplex) unités
    d’habitation superposées dont les entrées indépendantes sont accessibles par des escaliers extérieurs ou intérieurs.
    Il est fréquent en milieu urbain de Québec, notamment dans les quartiers Montcalm et Limoilou (aujourd’hui Vieux-Limoilou,
    Lairet et Maizerets). Les promoteurs et sociétés immobilières qui ont contribué au développement des quartiers
    de la ville au début du 20e siècle ont favorisé ce type. Ce dernier permet de construire rapidement et de manière
    logique dans un tissu résidentiel compact.
  - 'Le plex côtoie, puis supplante vers 1910 le bâtiment de type Boomtown dont il reprend plusieurs caractéristiques
    : revêtement en brique, toit plat, corniche ou couronnement imposant et composantes standardisées. Il est habituellement
    mitoyen, ce qui permet une plus grande densité urbaine. Construits en plusieurs exemplaires, les Plex peuvent
    former des ensembles dont les façades sont rythmées par des éléments répétitifs tels que les oriels, escaliers,
    balcons, galeries ou avant-corps. L’apparition de ces saillies en brique, en bois ou en fer est possible en
    raison de la petite marge de recul laissée devant les bâtiments. Les fenêtres rectangulaires sont à battants
    avec impostes ou à guillotine. Elles sont ornées de linteaux ou de plate-bande.'
  elements_caracteristiques:
  - 'Composition : maison à logements, isolée, mitoyenne ou en rangée, regroupant plusieurs types dont le duplex,
    le triplex ou le quadruplex et comprenant des unités d’habitation superposées avec des entrées indépendantes
    qui sont accessibles par des escaliers extérieurs ou intérieurs.'
  - Deux à quatre niveaux d’occupation (2 à 4 étages).
  - Toit plat (bassin ou à égout intérieur); revêtement de membrane(s). Toit plat à faible pente (à égout extérieur);
    pente très faible (moins de 15°); revêtement de bardeau d’asphalte, de membrane(s), de tôle profilée ou de tôle
    traditionnelle.
  - Ouvertures en arc, mais généralement en arc surbaissé, garnies d’arcs et de clefs; porte entièrement vitrée
    surmontée ou non d’une imposte; fenêtres composées à battants avec imposte, à guillotine jumelées ou composées
    à guillotine.
  - 'Saillies : avant-corps, escaliers droits, tournants, en colimaçon ou encastrés, logettes et oriels; saillies
    protégées par un auvent et superposées : balcons, galeries et perrons.'
  - 'Ornements : acrotères, amortissements, bandeaux, briques décoratives, chaînes d’angle, consoles, corbeaux,
    corniche en tôle ou en bois et couronnement.'
  - Fer forgé ornemental employé pour les contremarches et les poteaux, mais généralement pour les balustrades des
    saillies.
