blurb_en: Two, three or four dwellings stacked with their own front doors, reached — and this is where Québec parts
  company with Montréal — by stairs that may be inside as readily as out. Brick, flat-roofed, party-walled, built
  in numbers so the oriels, balconies and stairs set up a rhythm along the whole street.
origin_en: The plex is a multi-unit house comprising two (duplex), three (triplex) or four (quadruplex) superposed
  dwelling units whose independent entries are reached by exterior or interior stairs. It is common in the urban
  parts of Québec, notably in the Montcalm and Limoilou quarters. The promoters and property companies that built
  out the city's quarters at the beginning of the 20th century favoured this type, which allowed rapid and logical
  building in a compact residential fabric. It stands beside, then from about 1910 supplants, the Boomtown building,
  taking over its brick cladding, flat roof, imposing cornice and standardised components.
