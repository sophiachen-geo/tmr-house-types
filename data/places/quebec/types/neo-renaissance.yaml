profile:
  siting_landscape:
  - At Québec these buildings, though present in rural settings, are set above all in urban or semi-urban ones,
    between 1850 and 1920.
  - They put the owner's material ease, or the importance of the construction — its standing in the setting — in
    the front rank.
  massing:
  - 'Composition drawn from Renaissance architecture: richness and refinement, the orders used in superposition
    and an overabundance of decoration; a picturesque effect in reaction to the rigour of the Palladian and neoclassical
    styles, or a more austere effect with a search for symmetry and an interior organisation tied to the form and
    the openings of the building.'
  - Simple or irregular plan.
  - Three to four occupied levels (two and a half to three and a half storeys).
  - Straight four-slope or truncated four-slope roof crowned with a lantern or a rooftop terrace; low pitch, under
    30°; traditional sheet-metal covering. Flat roof (basin or internal drainage); membrane covering.
  - 'Projection: perron, portal and square tower.'
  articulation:
  - 'Classical ornaments: crowning balustrade, bas-reliefs, quoins, columns, consoles, cornices, entablatures, pediments,
    pilasters and cornice returns.'
  - The roof edge carries a crowning balustrade or a massive cornice on consoles or modillions.
  - With the orders used in superposition, the separation of the storeys is legible in the treatment of the fronts.
  openings:
  - Rectangular or arched openings fitted with sills, arches, keystones, surrounds and lintels.
  - Panelled door with or without glazing, surmounted by a transom and fitted with a portal.
  - Casements with large panes, or sashes with small panes or glazing bars.
  - A mixed-use building draws attention to its commercial ground floor with wide shopfronts, against the sober
    or distinctive look of the storeys above.
  materials:
  - 'Walls: cladding of variously rusticated stone, or of brick.'
  - Stone foundation raised above the ground.
profile_fr:
  description:
  - Apparue en Italie au 15e siècle, l’architecture de la Renaissance prône un retour aux formes antiques, en plus
    de vouloir rétablir l’harmonie et l’équilibre des proportions avec les ordres. Le style néo-Renaissance s’inspire
    des œuvres de cette période, plus précisément celles des palais et des villas italiennes des 16e et 17e siècles.
    Elles sont adaptées à l’ère victorienne et industrielle, afin de créer un effet pittoresque qui se veut en réaction
    à la rigueur du style palladien et néoclassique. Lorsqu’un effet plus austère est recherché, le bâtiment présente
    une composition davantage symétrique tandis que la forme et les ouvertures peuvent correspondre à la disposition
    intérieure.
  - Les bâtiments de style néo-Renaissance mettent en avant plan l’aisance matérielle du propriétaire ou l’importance
    de la construction, soit sa prestance dans le milieu. Ils ont généralement une fonction commerciale, industrielle
    ou résidentielle. À Québec, bien qu’ils soient présents en milieu rural, ces bâtiments sont surtout implantés
    en milieu urbain ou semi-urbain entre 1850 et 1920.
  - Le style néo-Renaissance se caractérise par la richesse et le raffinement de la composition ainsi que par la
    surabondance du décor qui puise dans le vocabulaire classique. Un bâtiment possède par exemple un plan simple
    ou irrégulier dont la volumétrie est dotée d’une tour carrée. Le toit est plat, ou encore à pavillon ou à pavillon
    tronqué surmonté d’un lanternon ou d’une terrasse faîtière. La bordure du toit est munie d’une balustrade de
    couronnement ou d’une corniche massive à consoles ou à modillons. Avec l’emploi des ordres de manière superposée,
    la séparation des étages est observable dans le traitement des façades. Un bâtiment à vocation mixte attire
    donc l’attention sur le rez-de-chaussée commercial avec de larges vitrines, comparativement à l’allure sobre
    ou distinctive des étages qui sont réservés à l’habitation. L’ornementation dans la construction de style néo-Renaissance
    comprend entre autres des murs en pierre à bossages variés, des ouvertures rectangulaires ou en arc ornées de
    frontons et de pilastres, des appuis élaborés sous les fenêtres et des chaînes d’angle.
  elements_caracteristiques:
  - 'Composition issue de l’architecture de la Renaissance : richesse et raffinement, emploi des ordres de manière
    superposée et surabondance du décor; création d’un effet pittoresque en réaction à la rigueur du style palladien
    et néoclassique ou création d’un effet plus austère avec la recherche de symétrie et l’organisation intérieure
    en lien avec la forme et les ouvertures du bâtiment.'
  - Plan simple ou irrégulier.
  - Trois à quatre niveaux d’occupation (2 étages ½ à 3 étages ½).
  - Fondation en pierre visible hors sol.
  - Toit à quatre versants droits ou à quatre versants droits tronqués couronné d’un lanternon ou d’une terrasse
    faîtière; pente faible (moins de 30°); revêtement de tôle traditionnelle. Toit plat (bassin ou à égout intérieur);
    revêtement de membrane(s).
  - 'Murs : revêtement de pierre à bossages variés ou de brique.'
  - Ouvertures rectangulaires ou en arc garnies d’appuis, d’arcs, de clefs, d’encadrements et de linteaux; porte
    à panneau(x) avec ou sans vitrage surmontée d’une imposte et garnie d’un portail; fenêtres à battants et à grands
    carreaux ou à guillotine et à petits carreaux ou à petit-bois.
  - 'Saillie : perron, portail et tour carrée.'
  - 'Ornements classiques : balustrade de couronnement, bas-reliefs, chaînes d’angle, colonnes, consoles, corniches,
    entablements, frontons, pilastres et retours d’équerre.'
