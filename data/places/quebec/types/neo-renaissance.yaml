blurb_en: 'Italian palaces done over for the Victorian street: three or four levels of rusticated stone or brick,
  the orders stacked storey on storey, a massive bracketed cornice or a balustrade at the top, and — where the ground
  floor is a shop — wide plate-glass fronts under all that decoration.'
origin_en: Renaissance architecture, which appeared in Italy in the 15th century, urged a return to antique forms
  and the restoration of harmony and balance of proportion through the orders. The neo-Renaissance style draws on
  the work of that period, more precisely the Italian palaces and villas of the 16th and 17th centuries, adapted
  to the Victorian and industrial era to create a picturesque effect in reaction to the rigour of the Palladian
  and neoclassical styles. These buildings generally have a commercial, industrial or residential function; at Québec
  they are set above all in urban or semi-urban settings between 1850 and 1920.
