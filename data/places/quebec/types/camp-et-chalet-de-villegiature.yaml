blurb_en: 'The cheap seasonal dwelling the 20th century added below the villa: a one-room camp of stacked logs,
  or a chalet a size up with a screened veranda and a stone hearth, on wood piles rather than foundations, shuttered
  against the weather and the intruders for the months nobody is there.'
origin_en: 'While the villa and the country house count as villégiature residences, they differ little from urban
  houses in their size, their styles and the comfort they offer. In the 20th century more affordable secondary dwellings
  intended for seasonal use became popular: the camp and the chalet. The camp is the simplest and most modest model,
  built in its rustic version of stacked round logs taken on the spot, of a single room, serving above all to shelter
  the users of an outdoor way of life; in the 20th century the hotel industry took up the cabin model to create
  the ''cabine'', a forerunner of the first motels. The chalet is larger and arranged for basic comfort, with no
  specific style attached to it.'
