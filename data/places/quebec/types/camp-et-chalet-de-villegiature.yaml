profile:
  siting_landscape:
  - A seasonal secondary dwelling set in a natural setting; the camp is found above all in forest country.
  - The chalet's living spaces extend outdoors, opening onto a sun room, a screened veranda, a perron or a terrace.
  - In its initial phase of occupation it rarely has hard foundations, and is neither insulated nor heated other
    than by a hearth or a stove; running water and sanitary fittings are often added late.
  massing:
  - 'Composition and structural type: for camp and chalet alike, belonging to vernacular architecture — techniques
    of stacked round logs, of traditional stone masonry (notably for the hearth), the use of a light frame and of
    the ordering typical of the North American house of the industrial period.'
  - 'Size: one storey, or never more than a storey and a half.'
  - 'Roof: low-pitched, often with an eave.'
  - 'The camp or ''cabane'' is the simplest and most modest model of the villégiature dwelling: small, of a single
    room, built cheaply with a light frame and a low-pitched roof.'
  - Larger than the camp, the chalet is arranged to give basic comfort; there is no specific style attached to it,
    and the buildings are more or less elaborate according to the owner's means.
  articulation:
  - 'Characteristic components: gallery, veranda glazed or screened, chimneys and stone hearths; shutters allowing
    the building to be protected out of season against the weather and against intruders.'
  - The chalet attaches to the main architectural currents and neo-styles of the 20th century — industrial vernacular,
    arts and crafts, bungalow and so on.
  openings:
  - 'Openings of varied shapes: doors and windows with screens.'
  - The camp has few openings, generally of small dimensions.
  materials:
  - 'Walls: cladding in natural materials, generally wood, with a preference for shingle and shiplap board.'
  - Generally without foundations, built on wood or stone piles, though some bulkier chalets, or ones built on a
    slope, have foundations of locally quarried stone.
  - 'Roof covering in modest materials: asphalt shingle, asphalt paper, shingle or sheet metal.'
  - In its rustic version, above all in forest country, the camp is built of 'bois rond' — stacked logs, a material
    taken on the spot.
profile_fr:
  description:
  - 'Si la villa et la maison de campagne sont considérées comme des résidences de villégiature, elles se distinguent
    peu des maisons urbaines par leurs dimensions, leurs styles et par le confort qu’elles offrent. Au 20e siècle,
    se popularisent des habitats secondaires plus abordables, destinés à un usage saisonnier: le camp et le chalet.'
  - Le camp
  - Le camp ou «cabane» est le modèle le plus simple et le plus modeste de l’habitat de villégiature. Dans sa version
    rustique, surtout en milieu forestier, il est construit en «bois rond», soit des billots de bois empilés, un
    matériau prélevé sur place. De petite dimension et ne comptant qu’une seule pièce, le camp sert avant tout à
    abriter et à héberger des utilisateurs d’un mode de vie relié au plein-air. Il s’édifie à peu de frais, avec
    une charpente claire et un toit à faible pente. Il présente peu d’ouvertures, généralement de petites dimensions.
    Au 20e siècle, l’industrie de l’hôtellerie a repris le modèle de cabane pour créer la «cabine», une unité individuelle
    contemporaine des premiers modèles de motels.
  - Le chalet
  - Plus grand que le camp, le chalet est aménagé de manière à fournir un confort de base à un habitat saisonnier
    situé en milieu naturel. Ses espaces de vie se prolongent à l’extérieur, s’ouvrant sur un solarium, une véranda
    entourée de moustiquaire, un perron ou une terrasse. Il n’y a pas de style spécifique associé au chalet. Les
    bâtiments sont plus ou moins élaborés en fonction des moyens financiers des propriétaires et se rattachent aux
    principaux courants architecturaux et néo-styles du 20e siècle (vernaculaire industriel, arts and crafts, bungalow,
    etc.). Une toiture à faible pente recouvre un bâtiment au gabarit d’un étage ou d’un étage et demi. Le chalet
    est une construction sommaire, voire rudimentaire. Dans sa phase initiale d’occupation, il possède rarement
    des fondations en dur, n’est pas isolé ni chauffé autrement que par un foyer ou un poêle. L’eau courante et
    les installations sanitaires sont souvent ajoutées tardivement.
  elements_caracteristiques:
  - 'Composition et type de structure : tant pour le camp que pour le chalet, qui relève de l’architecture vernaculaire
    : techniques d’empilage de bois rond, de maçonnerie traditionnelle en pierre (notamment pour le foyer), utilisation
    d’une charpente claire et de l’ordonnance typiques de la maison nord-américaine de l’époque industrielle.'
  - 'Gabarit : un étage ou jamais plus qu’un étage et demi;'
  - Généralement sans fondations, construit sur pilotis de bois ou de pierre, mais certains chalets plus volumineux
    ou construits sur une pente bénéficient de fondations en pierre prélevée localement;
  - 'Murs : revêtement en matériaux naturels, généralement de bois, avec une prédilection pour le bardeau et la
    planche à feuillure;'
  - 'Toiture : à faible pente, souvent avec avant-toit avec un revêtement en matériaux modestes (bardeaux d’asphalte,
    de papier d’asphalte, de bardeau ou de tôle;'
  - 'Ouvertures de formes variées : portes et fenêtres à moustiquaires;'
  - 'Composantes caractéristiques : galerie, véranda vitrée ou à moustiquaires, cheminées et foyers de pierre; volets
    qui permettent, en période hors-saison, de prémunir le bâtiment des intempéries et des intrus.'
