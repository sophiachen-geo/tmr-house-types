profile_fr:
  description:
  - Les bâtiments influencés par le milieu québécois apparaissent progressivement à la fin du 18e siècle, alors
    que la tradition française de construire rencontre celle des nouveaux arrivants anglais.
  - L’architecture se transforme pour en arriver à s’intégrer au contexte environnant propre au Québec.
