profile_fr:
  description:
  - Un peu à la manière des courants régionalistes de la première moitié du 20e siècle, un mouvement de retour vers
    les matériaux naturels et les formes s’inspirant de l’architecture traditionnelle marque l’architecture moderne
    résidentielle des années 1960 et 1970. Cette architecture, complètement à l’opposé des œuvres du style International
    et du brutalisme, prône une architecture nordique plus régionale où l'extérieur de la maison doit inspirer la
    protection de ses habitants et l'intérieur doit être traité avec soin puisqu'en période froide, la vie intérieure
    occupe une grande importance. L'utilisation du bois, notamment du bardeau de cèdre, de la brique d’argile et
    de la pierre naturelle constitue une ligne directrice des œuvres issues de ce courant. À la même époque, le
    Shed Style, né dans les années 1960 des dessins des architectes Charles Willard Moore et Robert Venturi en Californie,
    met de l’avant des jeux de volumes aux pentes enveloppantes recouvertes de bardeau de cèdre. Le bois domine
    tant l'enveloppe extérieure que la structure et la finition intérieure. Ces différents courants ont influencé
    les concepteurs québécois, certains allant même jusqu’à imiter des maisons « canadiennes ». D’autres ont fait
    preuve d’innovation en mariant la modernité et les matériaux traditionnels.
  elements_caracteristiques:
  - 'Volumétrie : variées.'
  - 'Matériaux: bardeau de cèdre, brique d’argile et ou pierre naturelle.'
profile_note: A style the thesaurus applies to non-residential buildings — the fiche carries no storey-count-for-habitation
  bullet and its linked exemplars are houses and addresses, but the fiche is two bullets long and describes no dwelling.
  Recorded so the source's list can be read whole, but out of this site's residential scope, so it gets no card
  and no page. Its French is verbatim from the fiche.
