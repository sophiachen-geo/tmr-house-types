profile:
  siting_landscape:
  - All through the 19th century it was built at Québec in rural and semi-urban settings, and in the faubourgs.
  - The house is raised well above ground level and frequently has, on its long axis, a summer kitchen reproducing
    the main body's characteristics at a smaller scale.
  massing:
  - 'Composition: a search for symmetry; the type is seen as the vernacular house of Québécois residential architecture,
    and takes in several variants including the artisan''s house with a shop at basement level.'
  - Rectangular plan; variable volume.
  - Two occupied levels (one and a half storeys).
  - Two-slope roof with straight, but generally curved, eaves; medium pitch, about 45°; traditional sheet-metal
    covering.
  - 'Projections sheltered by the curved eaves or by an awning: perron and gallery; secondary bodies: lean-to, larder
    and dairy, but generally a summer kitchen.'
  - The roof carries past the front and rear walls on curved bell-cast eaves that shelter a gallery laid out at
    the front; where the slopes are straight, a lean-to or awning often roofs the gallery instead.
  articulation:
  - 'Ornaments: brackets, lambrequins and corner boards.'
  - The ornament stays sober, with corner boards and chambranles; cut-out woodwork can give the house a picturesque
    touch.
  openings:
  - Openings fitted with chambranles; central door; gabled or pedimented dormers.
  - The attic is inhabited, as the presence of dormers shows.
  materials:
  - 'Walls: brick cladding, but generally wood board or wood shingle.'
  - Foundation raised above the ground.
  - Traditional sheet metal laid in battens, à la canadienne or pinched.
profile_fr:
  description:
  - Issue du Régime français, ce type de maison a évolué sous le Régime anglais au contact du style néoclassique.
    Il s’agit d’une construction plus libre qui répond spécifiquement à des contraintes fonctionnelles, économiques
    et climatiques en regard au lieu d’érection et au statut social de ses occupants. La maison néoclassique québécoise
    connaît ainsi plusieurs variantes; du petit corps de logis dépouillé, elle peut prendre la forme d’une habitation
    villageoise plus développée et ornementée. Tout au long du 19e siècle, elle est implantée à Québec en milieu
    rural et semi-urbain, ou encore dans les faubourgs.
  - Malgré sa versatilité, la maison néoclassique québécoise possède des caractéristiques récurrentes permettant
    de définir ce type. De manière générale, elle présente une symétrie dans la composition de la façade. La toiture
    est à deux versants avec une pente d’environ 45 degrés. Celle-ci se prolonge au-delà des murs avant et arrière
    (gouttereaux) grâce à des larmiers incurvés qui protègent une galerie aménagée à l’avant. Les toitures sont
    recouvertes de tôle traditionnelle à baguettes, à la canadienne ou pincée. Lorsque les versants de la toiture
    sont droits, il n’est pas rare qu’un toit en appentis (ou auvent) recouvre l’espace de la galerie. Les combles
    sont pour leur part habités, comme en témoigne la présence de lucarnes.
  - La maison est surhaussée par rapport au niveau du sol et possède fréquemment, dans son prolongement longitudinal,
    une cuisine d’été qui reproduit à plus petite échelle les caractéristiques du corps de logis principal. Le parement
    est en planche de bois posée à l’horizontale, en bardeau de cèdre ou en brique. L’ornementation demeure sobre
    avec des planches cornières et des chambranles. Des boiseries découpées peuvent quant à elles donner une touche
    pittoresque à la maison.
  elements_caracteristiques:
  - 'Composition : recherche de symétrie; type perçu comme la maison vernaculaire de l’architecture résidentielle
    québécoise et comprenant plusieurs variantes dont la maison d’artisan avec une boutique au niveau du sous-sol.'
  - Plan rectangulaire; volume variable.
  - Deux niveaux d’occupation (1 étage ½).
  - Fondation visible hors sol.
  - 'Murs : revêtement de brique, mais généralement de planche de bois ou de bardeau de bois.'
  - Toit à deux versants et avant-toits droits, mais généralement recourbés; pente moyenne (environ 45°); revêtement
    de tôle traditionnelle.
  - Ouvertures garnies de chambranles; porte centrale; lucarnes à pignon ou à fronton.
  - 'Saillies protégées par l’avant-toit recourbé ou par un auvent : perron et galerie; corps secondaires : appentis,
    dépense et laiterie, mais généralement une cuisine d’été.'
  - 'Ornements : aisseliers, lambrequins et planches cornières.'
