blurb_en: 'The vernacular house of Québec, and the one the faubourg house is a stripped-down copy of: a storey and
  a half under a 45-degree roof whose bell-cast eaves sweep out to cover the front gallery, dormers in the attic,
  a summer kitchen trailing off the end, and corner boards for ornament.'
origin_en: 'Descended from the French regime, this house evolved under the English regime in contact with the neoclassical
  style. It is a freer construction answering specifically to functional, economic and climatic constraints according
  to where it was built and the social standing of its occupants, and so takes several variants: from the small
  stripped-down body of lodging it can become a more developed and ornamented village dwelling. All through the
  19th century it was built at Québec in rural and semi-urban settings, and in the faubourgs.'
