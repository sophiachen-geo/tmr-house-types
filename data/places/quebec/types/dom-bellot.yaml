profile_fr:
  description:
  - Le renouveau architectural religieux a été introduit au Québec par l’architecte et moine bénédictin français
    Dom Paul Bellot. Après avoir conçu plusieurs immeubles religieux en France, en Belgique et aux Pays-Bas dans
    les années 1920 et 1930, Dom Bellot a participé à quelques constructions au Québec (oratoire Saint-Joseph de
    Montréal et abbaye Saint-Benoît-du-Lac). Son approche nouvelle, plus tard appelée dombellotisme, a eu beaucoup
    d’échos auprès d’architectes québécois qui ont appliqué ses principes rationalistes à l’architecture religieuse
    du Québec entre 1935 et 1955.
  - Dans les œuvres d’influence Dom Bellot, les matériaux forment à la fois la structure et le décor, ce qui rejoint
    le principe du rationalisme en architecture et qui rappelle certaines œuvres du Moyen Âge. Aucune ornementation
    n’est ajoutée à la construction. Ce sont la forme, la texture et la couleur des matériaux structuraux (brique
    ou béton) qui participent à la beauté de l’œuvre. L’architecte Dom Bellot, ou dombellotisme, se caractérise
    par un système de proportions rigoureux et par le plein rendement de chaque matériau employé avec une logique
    impeccable et une puissante originalité. Plusieurs églises de style Dom Bellot sont d’ailleurs construites à
    partir de grands arcs cintrés ou brisés, en brique ou en béton, qui sont franchement exprimés dans leur expression
    la plus pure. L’agencement fantaisiste de briques de différentes couleurs ou d’arêtes en béton créant des motifs
    géométriques suffit, avec l’emploi de la lumière, à ornementer les églises et les couvents.
  - La ville de Québec compte plusieurs réalisations issues de cette approche architecturale, notamment des œuvres
    de l’architecte Adrien Dufresne qui était l’un des plus grands adeptes québécois de dom Bellot.
  elements_caracteristiques:
  - 'Composition issue de l’architecture médiévale et de la doctrine rationaliste : système de proportions rigoureux
    et matériaux jouant un rôle à la fois structural et ornemental; style associé aux lieux de culte.'
  - Fondation en béton ou en pierre visible hors sol.
  - 'Murs : revêtement de brique, de béton ou de pierre; structure apparente en brique, en béton armé ou en pierre.'
  - Toit à deux versants droits; pente moyenne (entre 30° et 45°) ou forte (plus de 45°); revêtement de bardeau
    d’asphalte, de tôle profilée ou de tôle traditionnelle.
  - Ouvertures rectangulaires ou en arc, généralement en arc parabolique ou polygonal; porte à panneau(x) avec ou
    sans vitrage surmontée d’une imposte et garnie d’un portail; fenêtres à battants et à petits ou à grands carreaux
    ou fixes à petit-bois, à petits-fers ou avec vitrail (verrière).
  - 'Saillie : portail.'
  - 'Ornements, à l’extérieur et l''intérieur du bâtiment, utilisés pour mettre en valeur la lumière et les matériaux
    : éléments structuraux, jeux d’ombres et de lumière, motifs, généralement géométriques, formés par divers appareillages
    et polychromie.'
