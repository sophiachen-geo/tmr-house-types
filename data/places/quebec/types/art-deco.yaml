profile_fr:
  description:
  - L’Art déco fait partie des premiers mouvements d’architecture du 20e siècle qui ont ouvert la voie à une modernité
    plus affirmée. Apparu en Europe à la suite d’une grande exposition sur les arts décoratifs tenue à Paris en
    1925, ce style est d’abord employé pour la décoration intérieure, comme son nom l’indique, notamment pour les
    hôtels, les restaurants, et même les paquebots. Même s’il rejette les formes du passé, l’Art déco laisse une
    bonne place à l’ornementation, qui sera plus tard bannie par les architectes modernes.
  - Ce style connaît ensuite une forte popularité en Amérique du Nord dans les années 1920 et 1930 où il a été largement
    utilisé pour la construction de gratte-ciel construits « en escalier » à New York, à Chicago et à Montréal.
    Dans les bâtiments plus modestes, ce style se distingue par ses lignes pures qui accentuent la verticalité,
    par son ornementation stylisée aux motifs géométriques et par des bas-reliefs souvent moulés en ciment imitant
    la pierre. Les édifices d’influence Art déco utilisent habituellement un parement de brique, mais aussi des
    matériaux plus luxueux comme le laiton, le marbre, le granit poli ou le chrome. Quelques immeubles de la ville
    de Québec peuvent être attribués à ce style et comptent parfois parmi les premières utilisations du béton armé.
  elements_caracteristiques:
  - 'Composition abstraite qui rompt avec les formes du passé : lignes pures accentuant la verticalité du bâtiment
    et large place à l''ornementation.'
  - Volume simple, retraits et décrochés en gradin.
  - Fondation en béton ou en pierre visible hors sol.
  - 'Murs : revêtement de laiton, de marbre, de granit poli, de chrome ou de béton, mais généralement de brique
    ou de pierre; structure en bois, mais généralement en acier ou en béton armé.'
  - Toit plat (bassin ou à égout intérieur); revêtement de membrane(s).
  - Ouvertures rectangulaires garnies de clefs, de linteaux et de plate-bande; porte à panneau(x) avec ou sans vitrage
    surmontée d’une imposte et garnie d’un portail; fenêtres à battants et à grands carreaux, à guillotine et à
    petits carreaux ou à petit-bois ou fixes.
  - 'Saillies : avant-corps et oriels.'
  - 'Ornements : bas-reliefs, couronnements, motifs géométriques en losanges, en triangles ou en zigzags et pierres
    incrustées.'
