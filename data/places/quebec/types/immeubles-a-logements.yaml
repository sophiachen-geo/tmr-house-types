blurb_en: 'What came after the plex when the promoters wanted more density still: a square block, a symmetrical
  tripartite front, and one monumental central door opening on a stairwell that serves four, six, eight or more
  flats — with a column of glass block up the front to light it.'
origin_en: The apartment block is common in the urban parts of Québec, notably in the Montcalm and Saint-Sacrement
  quarters. Though its construction period runs between 1920 and 1970, it takes hold from 1930. The promoters and
  property companies that had built out the city's quarters at the beginning of the 20th century favoured this type
  after the plex, since it allows a greater density of residential fabric. It is a building set on a newly developed
  lot, or on an old lot that has to be rebuilt following a fire.
