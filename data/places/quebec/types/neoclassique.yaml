profile_fr:
  description:
  - Le style néoclassique se manifeste au Québec à partir du début du 19e siècle. Il est surtout diffusé sous le
    Régime anglais, avec l’arrivée des ingénieurs et des architectes britanniques voulant affirmer leur rôle sur
    le territoire. Il s’inspire de l’architecture antique grecque et romaine qui est redécouverte grâce aux fouilles
    archéologiques effectuées en Europe à la fin du 18e siècle. Le style néoclassique propose une réinterprétation
    du vocabulaire et de la composition des modèles traditionnels. Il se caractérise par la monumentalité et la
    rigueur en faisant usage d’éléments classiques qui sont utilisés de façon sévère et codifiée. Les façades symétriques
    présentent donc une ornementation logique avec l’emploi de colonnes, pilastres, frontons, chaînes d’angles,
    arcades et corniches. Revêtus de pierre de taille ou de crépi, ces bâtiments possèdent des toitures à quatre
    versants à faible pente recouvertes de tôle traditionnelle ainsi que des fenêtres à guillotine à grands carreaux.
    Ils dégagent par ailleurs un air solennel, qu’ils soient de petite ou de grande envergure. Les plus complexes
    d’entre eux sont souvent composés d’un corps principal en avancée et d’ailes latérales.
  - Le style néoclassique marque l’estompement du caractère français qui dominait jusqu'alors dans le paysage bâti
    de Québec, un état qui a été conditionné par l’évolution des besoins, la prise en charge de l’architecture par
    des professionnels, la modification des techniques de construction et le développement urbain.
  elements_caracteristiques:
  - 'Composition sévère et codifiée de l’idéal classique : caractère monumental, aspect solennel et recherche de
    symétrie.'
  - Fondation en pierre.
  - Murs en maçonnerie de pierre, généralement en pierre de taille; revêtement de crépi ou d’enduit (stuc).
  - Toit à quatre versants droits; pente faible (moins de 30°); revêtement de tôle traditionnelle.
  - Ouvertures régulières; porte à panneau(x) avec ou sans vitrage surmontée d’une imposte et garnie d’un portail;
    fenêtres à battants et à petits ou à grands carreaux garnies d’impostes ou à guillotine et à petits carreaux.
  - 'Saillies : avant-corps, dôme, portail et portique; corps secondaires : ailes latérales coiffées d’un toit à
    deux versants droits et donnant l’impression du corps principal en avancé.'
  - 'Ornements classiques cohérents avec la composition : arcades, colonnes, corniches, frontons et pilastres.'
