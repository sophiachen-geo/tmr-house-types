blurb_en: 'Known by its roof and almost nothing else: a bell-shaped gambrel of two very unequal slopes — a stub
  of terrasson over a long flared brisis — with a wide continuous shed dormer cut into it and deep eaves oversailing.
  An interwar catalogue house, and at Québec a Sillery one.'
origin_en: The Dutch Colonial Revival house has its origins at the beginning of the 18th century, when Dutch settlers
  brought their building traditions into the American colonies; the style became popular quickly in New York State
  and along the Hudson. They adapted their European technique to the harsher climate of North America, and the broken
  attic roof characteristic of the style was not only an aesthetic choice but a practical one, optimising the interior
  space while carrying heavy snowfall. At the beginning of the 20th century the Dutch colonial style was revived,
  leading to many houses reflecting the original in a schematised and more uniform way, through machined materials
  and standardised components distributed by catalogue. It spread through Québec between the wars, appearing during
  the 1920s and reaching its height at the beginning of the 1940s.
