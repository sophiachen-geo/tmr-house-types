profile:
  siting_landscape:
  - It spread through Québec between the wars thanks to the models available in the sales catalogues, and was one
    of the most popular models of that period, particularly in anglophone circles.
  - At Québec it appears during the 1920s but reaches its height at the beginning of the 1940s; though rarer, houses
    of this style are found across practically the whole territory of the city, with a notable concentration in
    the Sillery quarter.
  massing:
  - Rectangular or L-shaped plan; simple volume.
  - Two occupied levels (one and a half storeys, more rarely two and a half).
  - 'Bell-shaped roof: an asymmetrical broken attic roof made of two pronounced slopes. Wide, elongated, oversailing
    eaves; asphalt shingle covering. The roof is generally pierced by a wide continuous shed dormer, which adds
    to its massive look.'
  - 'Projections: perron, porch or short covered gallery. Most often a portico surmounted by a triangular or semicircular
    pedimented awning tied to the main roof, carried on single or double columns without a balustrade; annexe, balcony,
    veranda, chimney at the end of the gable wall.'
  - It is distinguished from the mansard roof by the asymmetry of its slopes, with a very short terrasson and a
    very long flared brisis recalling the shape of a bell, giving it a massive and austere aspect.
  articulation:
  - 'Ornamentation: sober, with a more or less ornamented portal around the door, pediment, cornice returns, plain
    or decorated chambranles, surrounds, shutters or louvred shutters, columns, piers and flat arches.'
  - The bell-shaped roof is truly the centrepiece and the most emblematic attribute of houses belonging to this
    style.
  openings:
  - 'Doors: glazed-panel door, screen door with several joinered elements. Entrance placed centrally.'
  - 'Windows: rectangular, sashes with small panes, or more rarely casements with a fixed paned section. Often accompanied
    by shutters or louvred shutters. Fixed windows, oval or semicircular, present or not.'
  - Composition of the fronts regular and symmetrical, with an emphasis on the vertical lines.
  materials:
  - 'Cladding: brick, clapboard, shiplap board, wood shingle, asbestos shingle, render.'
  - Concrete foundation.
profile_fr:
  description:
  - Le style de la maison néocoloniale néerlandaise trouve ses origines au début du 18e siècle, lorsque les colons
    hollandais ont introduit leurs traditions de construction dans les colonies américaines. Ce style est rapidement
    devenu populaire dans l’État de New York et le long du fleuve Hudson. Les colons hollandais ont adapté leur
    technique de construction européenne au climat plus rigoureux de l’Amérique du Nord, créant des maisons fonctionnelles
    et distinctives. Avec ses deux pentes, le toit à comble brisé caractéristique du style se voulait non seulement
    un choix esthétique, mais également pratique, permettant d’optimiser l’espace intérieur tout en supportant de
    fortes chutes de neige.
  - Au début du 20e siècle, le style colonial hollandais connaît un renouveau, ce qui conduit à la construction
    de nombreuses maisons reflétant le style d’origine, mais de façon schématisée et plus uniformisée, notamment
    par l’utilisation de matériaux usinés et d’éléments architecturaux standardisés, distribués par catalogue (livres
    de modèles) ou par des revues. Cette nouvelle méthode de construction, rapide, simple et peu coûteuse, mène
    à une volumétrie simplifiée du modèle d’origine.
  - Ce style s’est répandu au Québec durant l’entre-deux-guerres, grâce aux modèles disponibles dans les catalogues
    de vente. C’est l’un des modèles les plus populaires de cette époque, particulièrement dans les milieux anglophones.
    À Québec, la maison néocoloniale néerlandaise apparaît durant les années 1920, mais y connaîtra son apogée au
    début des années 1940. Bien que plus rares, des maisons de ce style se retrouvent dans pratiquement tout le
    territoire de la Ville de Québec, avec une concentration notable dans le quartier de Sillery.
  - Les maisons de style néocolonial néerlandais se reconnaissent principalement par leur toit à comble brisé, constitué
    de deux pans présentant chacun une pente douce au-dessus d’une pente plus raide. Il se distingue du toit mansardé
    par l’asymétrie de ses pentes, avec son terrasson très court et son brisis très allongé et évasé, rappelant
    la forme d’une cloche, ce qui lui confère un aspect massif et austère. Ce toit en forme de cloche est véritablement
    la pièce maîtresse et l’attribut le plus emblématique des maisons appartenant à ce style.
  elements_caracteristiques:
  - Plan rectangulaire ou en L; volume simple.
  - Deux niveaux d’occupation (1 étage ½, plus rarement 2 étages ½).
  - 'Revêtement : brique, planche à clin, planche à feuillures, bardeaux de bois, bardeaux d’amiante, enduit.'
  - Fondation en béton.
  - 'Toit en forme de cloche : comble brisé asymétrique, constitué de deux pentes prononcées. Large avant-toit allongé
    et en surplomb; revêtement en bardeaux d’asphalte. Toiture généralement percée d’une large lucarne continue
    en appentis, contribuant à son aspect massif.'
  - 'Portes : porte à carreaux vitrés, porte moustiquaire avec plusieurs éléments menuisés. Entrée disposée de manière
    centrale.'
  - 'Fenêtres : rectangulaires, à guillotine à petits carreaux, ou plus rarement à deux battants avec partie fixe
    à carreaux. Souvent accompagnées de volets ou de persiennes. Présence ou non de fenêtres fixes, en ovale ou
    en demi-cercle.'
  - Composition des façades régulière et symétrique, avec un accent sur les lignes verticales.
  - 'Saillies : perron, porche ou courte galerie couverte. Le plus souvent présence d’un portique surmonté d’un
    auvent en fronton triangulaire ou semi-circulaire relié au toit principal, supporté par des colonnes simples
    ou doubles, sans balustrade; corps d’annexe, balcon, véranda, cheminée à l’extrémité du mur pignon.'
  - 'Ornementation : sobre, portail plus ou moins orné autour de la porte, fronton, retours d’équerre, chambranles
    sobres ou décorées, encadrements, contrevents ou persiennes, colonnes, piliers, plates-bandes.'
