profile_fr:
  description:
  - L’expressionnisme est un mouvement qui s’est développé en Europe du Nord à partir du début 20e siècle. À l’origine,
    il se manifeste notamment en Allemagne, en plus d’influencer les architectes des Pays-Bas regroupés autour de
    l’École d’Amsterdam. Il marque en quelque sorte la fin de la période associée à l’architecture moderne, puisqu’il
    favorise une démarche créatrice individuelle où la recherche formelle du bâtiment est une fin en soi. Entre
    1960 et 1980, il façonne une partie du paysage urbain et semi-urbain de Québec avec les réalisations d’architectes
    tels qu’Evans St-Gelais, Jean-Marie Roy et André Robitaille. La création du campus de l’Université Laval et
    l’aménagement de la colline parlementaire sont par ailleurs deux projets qui regroupent des constructions marquantes
    de cette période. Celle-ci présente également des liens étroits avec le mouvement brutaliste qui prône l’expressivité
    des matériaux bruts et des systèmes techniques.
  - Le bâtiment découlant de l’expressionnisme se caractérise par une composition audacieuse et monumentale. En
    réaction à l'austérité de la doctrine fonctionnaliste, les architectes se libèrent de la fonction pour aller
    vers une conception plus formelle et symbolique, ce qui les amène à proposer un geste ou une signature architecturale.
    Le bâtiment se démarque ainsi du milieu, il devient une véritable œuvre d’art. L’utilisation de techniques de
    construction innovantes permet par exemple de réaliser des envolées plastiques qui prennent la forme de cônes,
    de dômes ou d’une quelconque géométrie courbe. L’expression sculpturale recherchée, à travers l’exploration
    formelle, se distingue aussi par un effet dramatique de la ligne verticale ou horizontale, un assemblage de
    volumes purs, une uniformisation des surfaces, un jeu de textures et un contraste lumineux.
  elements_caracteristiques:
  - 'Composition issue d’une démarche créatrice individuelle où la recherche formelle est une fin en soi : caractère
    monumental et audacieux, envolées plastiques, effet dramatique de la ligne verticale ou horizontale et façades
    aux surfaces uniformes; bâtiment perçu comme une œuvre d’art qui symbolise un geste ou une signature architecturale.'
  - Assemblage de volumes.
  - Fondation en béton.
  - 'Murs : revêtement de béton, de métal, de métal et de verre avec le mur rideau ou d’enduit (stuc); structure
    en bois, en acier ou en béton armé.'
  - Toit plat (bassin ou à égout intérieur); revêtement de membrane(s). Toit plat à faible pente (à égout extérieur);
    pente très faible (moins de 15°); revêtement de bardeau d’asphalte ou de membrane(s). Toit à deux versants droits,
    à versants multiples ou asymétrique; pente faible (moins de 30°), moyenne (entre 30° et 45°) ou forte (plus
    de 45°); revêtement de bardeau d’asphalte.
  - Ouvertures nombreuses; porte à panneau avec vitrage, pleine ou entièrement vitrée.
  - 'Saillies : marquise, perron, portail et portique.'
  - 'Ornements utilisés pour mettre en valeur la lumière et les matériaux : jeux d’ombres et de lumière et jeu de
    textures.'
profile_note: A style the thesaurus applies to non-residential buildings — the fiche carries no storey-count-for-habitation
  bullet and its linked exemplars are a library, churches and a hotel. Recorded so the source's list can be read
  whole, but out of this site's residential scope, so it gets no card and no page. Its French is verbatim from the
  fiche.
