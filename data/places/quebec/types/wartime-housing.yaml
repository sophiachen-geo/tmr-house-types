profile:
  siting_landscape:
  - Concentration of houses marked by tight subdivision and a regular siting.
  - Between 1942 and 1945 Wartime Housing Limited put up single-family houses across the country, notably in the
    quarters and suburbs of Québec.
  - The sectors where Cape Cod dwellings are found are marked by tight subdivision and regular siting.
  massing:
  - 'Composition drawn from the English house of the colonial period in New England, and belonging to the line of
    industrial vernacular architecture: an affordable single-family house, built quickly and without symmetry; originally
    prefabricated and assembled on site without a footing.'
  - Over the years the house may be renovated, enlarged, raised by a storey, or given a dormer.
  - Eaveless roof; medium pitch, between 30° and 45°.
  - 'Projection: perron.'
  - The attic is sometimes habitable, though roof pitches vary considerably from one construction to another.
  articulation:
  - The Cape Cod house contains few ornamented details.
  openings:
  - Panelled door with glazing, or solid.
  - Windows single, paired or grouped, sashes with or without glazing bars.
  - Dormers present or not, including the central gabled or shed dormer.
  materials:
  - 'Walls: brick or asbestos shingle cladding; gables of the side walls: cladding the same as, or different from,
    that of the walls.'
  - Concrete foundation.
  - Asphalt shingle or profiled sheet-metal roof covering.
  - The materials used had to be non-essential to the war industry, light enough to handle on site, and among the
    cheapest available.
profile_fr:
  description:
  - Le style Cape Cod
  - Les origines de l’habitation de style Cape Cod remontent à l’époque coloniale en Nouvelle-Angleterre et s’inscrivent
    dans la lignée de l’architecture vernaculaire industrielle du 20e siècle. La maison de style Cape Cod est généralement
    basse, souvent d’un étage principal et munie d’un toit à pignon, d’une cheminée centrale et contenant peu de
    détails ornementés. À l’origine, la maison de ce type est préfabriquée et assemblée sur place. Le comble est
    parfois habitable, même si les pentes de toit varient considérablement d’une construction à l’autre. Les secteurs
    où on trouve les habitations de type Cape Cod se caractérisent par un lotissement serré et une implantation
    régulière. La déclinaison la plus fréquente à Québec de ce style est la maison de type « Wartime Housing ».
  - Wartime Housing
  - Lorsque la Wartime Housing Limited est créée en 1942 par le gouvernement fédéral canadien, la nouvelle société
    a pour mandat de loger rapidement et de manière économique les familles de soldats et les ouvriers de l'industrie
    de la guerre. Entre 1942-1945, elle s’occupe donc d’ériger des maisons unifamiliales à travers le pays, notamment
    dans les quartiers ou les banlieues de Québec. Devenue la Société centrale d'hypothèques et de logements (SCHL)
    en 1946, elle poursuit ses efforts après le deuxième conflit mondial, puisque le retour des combattants entraîne
    une autre campagne de construction de maisons abordables.
  - La maison Wartime Housing s’inspire de l’habitation anglaise remontant à l’époque coloniale en Nouvelle-Angleterre,
    soit celle issue du style Cape Cod, en plus de s’inscrire dans la lignée de l'architecture vernaculaire industrielle
    du 20e siècle. À l’origine, ce type est préfabriqué et assemblé sur place sans solage. Le comble est parfois
    habitable, même si les pentes de toit varient considérablement d’une construction à l’autre. Les matériaux employés
    se doivent d’être non essentiels à l’industrie de la guerre, légers pour faciliter la manipulation sur le chantier
    et compter parmi les moins coûteux. Le revêtement peut être en clin de bois ou en bardeau d’amiante-ciment tandis
    que la couverture en bardeau d’asphalte commence à être employée. Le fenêtrage est disposé de façon irrégulière
    et asymétrique, les fenêtres à guillotine sont à petits carreaux et les ornements sont limités à des chambranles
    autour des ouvertures. Au fil des années, la plupart des maisons Wartime Housing seront posées sur un solage,
    mais elles peuvent également être rénovées, agrandies, surhaussées d’un étage ou munies d’une lucarne. Les secteurs
    où se concentre ce type se caractérisent par un lotissement serré et une implantation régulière, ils préfigurent
    la banlieue avec la venue du bungalow.
  elements_caracteristiques:
  - 'Composition qui s’inspire de la maison anglaise de l’époque coloniale en Nouvelle-Angleterre et qui s’inscrit
    dans la lignée de l''architecture vernaculaire industrielle : maison unifamiliale abordable, construite rapidement
    et sans symétrie; à l’origine, type préfabriqué et assemblé sur place sans solage.'
  - Au fil des années, la maison peut être rénovée, agrandie, surhaussée d’un étage ou munie d’une lucarne.
  - Fondation en béton.
  - 'Murs : revêtement de brique ou de bardeau d’amiante; pignons des murs latéraux : revêtement identique ou différent
    de celui des murs.'
  - Toit sans avant-toit; pente moyenne (entre 30° et 45°); revêtement de bardeau d’asphalte ou de tôle profilée.
  - Porte à panneau avec vitrage ou pleine; fenêtres isolées, jumelées ou groupées à guillotine avec ou sans à petit-bois;
    présence ou non de lucarnes dont la lucarne centrale à pignon ou en appentis.
  - 'Saillie : perron.'
  - Concentration de maisons caractérisée par un lotissement serré et une implantation régulière.
