blurb_en: 'A federal housing programme rendered as a house: a small eaveless gabled box, prefabricated and set down
  without a footing, built of whatever the war industry did not need, in tightly subdivided sectors laid out on
  a regular grid. Most have since been renovated, raised or given a dormer.'
origin_en: When Wartime Housing Limited was created in 1942 by the Canadian federal government, the new company's
  mandate was to house the families of soldiers and the workers of the war industry quickly and economically. Between
  1942 and 1945 it put up single-family houses across the country, notably in the quarters and suburbs of Québec.
  Having become the Central Mortgage and Housing Corporation in 1946, it carried on after the second conflict, since
  the return of the combatants brought another campaign of affordable house-building. The Wartime Housing house
  draws on the English dwelling of the colonial period in New England — the Cape Cod style — and belongs to the
  line of 20th-century industrial vernacular architecture.
