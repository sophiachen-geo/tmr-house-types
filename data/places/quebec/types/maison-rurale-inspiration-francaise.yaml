blurb_en: 'The oldest house in the thesaurus and the plainest: one storey, no cellar, a squat rectangle of rubble
  stone or stacked timber under a hipped roof pulled tight to the wall with no eaves at all. The attic held grain
  rather than people, which is why there are no dormers, and the windows are few because every one of them lost
  heat and weakened the wall.'
origin_en: 'The colonial français idiom as the first settlers built it in Nouvelle-France: French models kept for
  their general proportions and their reserve, then adapted to the climate, the available materials and the intendants''
  by-laws. At Québec the plan tends to the Norman, more rectangular than square, and the original square could be
  extended along its length as the household grew.'
