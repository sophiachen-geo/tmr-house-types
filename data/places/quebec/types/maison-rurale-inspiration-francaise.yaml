profile:
  siting_landscape:
  - The rural house of the French regime, built by the first settlers in a French frame of mind with such adaptations
    as the climate and the successive by-laws required.
  - At Québec the plan leans Norman — more rectangular than square — and the base square or rectangle was often
    enlarged later in the same form to give an elongated model.
  massing:
  - Square plan, but generally rectangular; enlargement of the initial plan giving an elongated volume.
  - One occupied level (one storey); no cellar.
  - Hipped roof without eaves — the roof edge barely oversails the wall face.
  - 'Projection: chimney at the centre, off-centre, or set within the gable wall.'
  - Steep roof pitch, above 45 degrees; the attic served to store grain and goods, hence the absence of dormers.
  articulation:
  - Decorative components are rare, limited to surrounds, lintels and chambranles.
  - A plain composition on the classical ideal — a system of proportions and a search for harmony, but without symmetry.
  openings:
  - Few openings; no dormer.
  - Openings distributed without any search for symmetry, and kept few to limit heat loss in winter and the weakening
    of the masonry walls.
  - The usual window is the casement with small panes, fitted with working shutters.
  materials:
  - Walls of pièce-sur-pièce timber; vertical wood board cladding.
  - Foundation barely raised above the ground.
  - A squat square of stone rubble or pièce-sur-pièce timber, which may be covered in roughcast or vertical boards,
    with a slight batter in the walls.
  - Roof slopes covered in cedar shingle.
profile_fr:
  description:
  - Le style colonial français s’est développé en Nouvelle-France d’après les modèles de construction du pays auquel
    il se rattache, la France. Il retient les principes généraux du classicisme français avec son système de proportions,
    sa composition harmonieuse d’ensemble et une certaine réserve dans l’expression architecturale. En lien avec
    la tradition, les premiers colons répètent les formes simples dont l’usage est commun. Artisans, entrepreneurs
    ou maçons construisent ainsi des bâtiments dans un état d’esprit français, tout en proposant quelques adaptations
    compte tenu du climat ou de la règlementation imposée à différentes époques.
  - Maison rurale d’inspiration française
  - 'La maison rurale d’inspiration française se distingue par sa volumétrie : un carré trapu en moellons de pierre
    ou en bois pièce sur pièce qui peut être recouvert de crépi ou de planches verticales avec un léger fruit dans
    les murs. À Québec, la maison a tendance à s’inspirer de la tradition normande, puisque son plan est davantage
    rectangulaire. Au fil des années, le carré ou le rectangle de base peut également être agrandi avec une forme
    similaire pour donner un modèle allongé.'
  - 'La maison compte habituellement un seul niveau d’occupation avec un comble qui sert à l’entreposage du grain
    et de diverses marchandises, d’où l’absence de lucarnes. L’exhaussement hors sol est faible et la fondation
    est en pierre. La toiture à deux versants ou à croupes possède une pente forte, soit supérieure à 45 degrés.
    Les versants du toit, recouverts de bardeaux de cèdre, sont droits et sans avant-toit, c’est-à-dire que le rebord
    du toit dépasse à peine la surface du mur. La position de la souche de cheminée demeure variable : aux extrémités
    de la toiture, au centre de celle-ci ou décentrée.'
  - Distribuées sans recherche de symétrie, les ouvertures de la maison sont plutôt restreintes afin de contrer
    les pertes de chaleur en hiver et l’affaiblissement des murs de maçonnerie. La fenêtre à battants et à petits
    carreaux, munie de contrevents fonctionnels, est le modèle le plus usuel. Les composantes décoratives sont plutôt
    rares; elles sont limitées aux encadrements, linteaux et chambranles.
  elements_caracteristiques:
  - Plan carré, mais généralement rectangulaire; agrandissement du plan initial donnant un volume allongé.
  - Un niveau d’occupation (1 étage); absence de cave.
  - Fondation peu visible hors sol.
  - Murs en bois pièce sur pièce; revêtement de planche de bois verticale.
  - Toit à croupe et sans avant-toit.
  - Ouvertures peu nombreuses; absence de lucarne.
  - 'Saillie : cheminée au centre, décentrée ou incluse dans le mur pignon.'
