blurb_en: 'Georgian rules applied to a 20th-century house: a square or rectangular block of at least two levels,
  three or five bays regularly disposed about a centred door with transom and sidelights, a chimney at each gable
  end, and a colour scheme fixed as tightly as the proportions — white trim, red brick, black shutters and door.'
origin_en: The Georgian style takes its name from the architecture built in Britain during the reigns of the first
  four monarchs of the House of Hanover (1714–1830). Palladian, Gothic, neoclassical and Regency, its sources are
  varied, but the Georgian refers more precisely to Renaissance architecture, urging a return to the system of proportions
  with the orders and the restoration of overall balance and harmony. After being popularised in Britain and then
  through the thirteen English colonies of North America that became the United States in 1776, it gained a fresh
  popularity at the beginning of the 20th century as the neo-Georgian.
