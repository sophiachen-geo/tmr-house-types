profile_fr:
  description:
  - Malgré la Conquête de 1759-1760, les bâtiments d’inspiration britannique n’apparaissent dans la colonie que
    vers la fin du 18e siècle. Une transformation du cadre bâti est alors opérée par le biais des nouveaux arrivants
    qui veulent consolider leur présence sur le territoire en prônant une architecture plus affirmée et achevée.
