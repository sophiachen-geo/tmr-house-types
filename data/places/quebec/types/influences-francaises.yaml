profile_fr:
  description:
  - Les bâtiments d’inspiration française des 17e et 18e siècles sont issus des modèles français adaptés aux conditions
    locales particulières, dont le climat, le savoir-faire et les matériaux disponibles en Nouvelle-France. Érigés
    en pierre ou en bois, leur architecture se caractérise par une économie de moyens et un dépouillement ornemental.
profile_note: 'One of the nine top-level currents of the thesaurus — a landing page, not a thesaurus node, so it
  carries no tid and no Éléments caractéristiques list. Recorded so the nine-current tree can be read whole and
  checked against docs_tableau_styles.pdf; given no card and no page of its own. Its French is the landing page''s
