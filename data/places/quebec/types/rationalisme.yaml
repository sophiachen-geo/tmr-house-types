profile_fr:
  description:
  - Considéré par plusieurs comme une doctrine, le rationalisme prend forme au 20e siècle. Ses théories mettent
    en avant-plan les liens et l’apport nouveau de l’architecture eu égard à l’industrie et au développement des
    villes. Aux États-Unis, il est surtout associé à la conception des premiers gratte-ciel modernes par le groupe
    d’architectes de l’École de Chicago. Ceux-ci apportent un renouveau technique en construction avec l’utilisation
    d’une ossature métallique sans mur porteur, soit le mur rideau. À Québec, le rationalisme est principalement
    destiné aux bâtiments à usage industriel et commercial de la fin du 19e et du début du 20e siècle.
  - Alliant la solidité et l’utilité, le bâtiment issu de l’architecture rationaliste se caractérise par une simplicité
    monumentale et une mise en valeur de la qualité expressive des matériaux. La forme finale devient sans importance,
    puisque la fonction et la structure prédominent. En ce qui a trait à la fonction, l’extérieur doit rendre compte
    de l’organisation intérieure tandis que pour la structure, toute ornementation qui n’en fait pas partie est
    à proscrire.
  - Le bâtiment d’allure rationaliste présente donc généralement un volume rectangulaire ou carré qui est coiffé
    d’un toit plat ou à faible pente. L'utilisation du béton armé et de l'acier permet de concevoir des espaces
    vastes et éclairés. Bien que les façades soient dépouillées d'ornements, des éléments décoratifs sont parfois
    puisés des répertoires des siècles précédents. Afin de rompre moins radicalement avec la tradition, des motifs
    formés par des appareillages ou des teintes de briques, de même que par des insertions de pierre sont employés.
    Les bandeaux, corniches et pilastres ainsi créés servent à marquer les éléments structuraux formés par la toiture,
    les niveaux ou les angles. Dans certains cas, les murs sont presque entièrement vitrés et des puits de lumière
    percent les toitures pour optimiser l’entrée de lumière naturelle.
  elements_caracteristiques:
  - 'Composition : caractère monumental, qualité expressive des matériaux, prédominance de la fonction et de la
    structure sur la forme et l’extérieur rend compte de l’organisation intérieure du bâtiment.'
  - Plan carré ou rectangulaire; volume simple.
  - Pièces vastes et éclairées et puits de lumière.
  - Fondation en béton ou en pierre visible hors sol.
  - 'Murs : revêtement de béton, de pierre, de métal ou de métal et de verre avec le mur rideau, mais généralement
    de brique; structure en bois, mais généralement apparente en acier ou en béton armé.'
  - Toit plat (bassin ou à égout intérieur); revêtement de membrane(s). Toit à deux versants droits; pente faible
    (moins de 30°) ou moyenne (entre 30° et 45°); revêtement de bardeau d’asphalte, de tôle profilée ou de tôle
    traditionnelle.
  - Ouvertures régulières, larges et rectangulaires ou en arc surmontées ou non d’impostes et garnies d’arcs, de
    clefs et de linteaux; porte à panneau(x) avec ou sans vitrage ou entièrement vitrée; fenêtres à battants et
    à grands carreaux, à guillotine et à petits carreaux ou à petit-bois ou fixes.
  - 'Ornements utilisés pour mettre en valeur les éléments structuraux : bandeaux, consoles, corbeaux, corniches,
    motifs formés par divers appareillages, pierres incrustées, pilastres et polychromie.'
