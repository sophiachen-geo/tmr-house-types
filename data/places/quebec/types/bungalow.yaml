blurb_en: One storey level with the ground, a long low rectangle with a vestibule dividing the day rooms from the
  night rooms, a shallow gable, a picture window and a garage. Descended from the Prairie house and the California
  ranch, and by the 1950s manufactured in series like any other consumer product.
origin_en: Descended from the Prairie style but also from certain Californian house models such as the ranch house,
  the postwar North American bungalow was popularised across the whole continent on the strength of the baby boom,
  the growth of the suburbs, easier access to home ownership and the popularity of the car. The bungalow, designed
  for the nuclear family wanting its own ground and a single-storey house with a garage, was a runaway success in
  the 1950s and 1960s — so much so that it became a genuine consumer product manufactured in series, the queen of
  the suburb and the symbol of the American dream. Given how popular it was, several residential quarters developed
  by working different variants of it.
