profile_fr:
  description:
  - Le modernisme ou mouvement moderne peut être vu comme l’aboutissement des révolutions sociales et politiques
    dynamisé depuis la Première Guerre mondiale, ou encore comme une résultante du développement technique qui a
    contribué à la révolution industrielle. Cette volonté de changement et cette remise en question naissent en
    réaction à l’architecture historiciste et au style Beaux-Arts. Le renouvellement du langage architectural emprunte
    ainsi une démarche technique et fonctionnaliste où les formes géométriques pures sont libérées du passé. Le
    modernisme fait sa marque en Europe au cours années 1920, aux États-Unis durant les années 1930 et finalement,
    au Québec entre les années 1930 et 1950. Bien qu’associé à l’architecture résidentielle de la ville de Québec
    à ses débuts, il représente en fait l’apparition des premières constructions modernes sur son territoire.
  - Les bâtiments issus du modernisme misent sur l’horizontalité ainsi que sur la définition et l’agencement des
    volumes. Ces derniers expriment clairement la fonction ou le programme de l’édifice, soit la distribution des
    espaces intérieurs. L’emploi de techniques de construction et de matériaux nouveaux résulte en une composition
    dépouillée qui présente généralement des toits plats, des façades aux surfaces lisses et uniformes, d’abondantes
    ouvertures, des fenêtres en coin et en bandeau, de même que des jeux de plans verticaux et horizontaux. Aucune
    ornementation superflue n'est par ailleurs ajoutée afin d'apprécier l'expressivité des matériaux. En architecture
    résidentielle, le garage fait souvent partie intégrante de la maison.
  elements_caracteristiques:
  - 'Composition qui rompt avec les formes du passé et qui se veut en réaction à l’architecture historiciste et
    au style Beaux-Arts : horizontalité, caractère dépouillé, démarche technique et fonctionnaliste, façades aux
    surfaces lisses et uniformes et l’extérieur rend compte de l’organisation intérieure du bâtiment.'
  - Assemblage de volumes et jeux de plans verticaux et horizontaux.
  - Fondation en béton.
  - 'Murs : revêtement de brique, de béton, de pierre, de bois, de métal ou de métal et de verre avec le mur rideau;
    structure en bois, en acier ou en béton armé.'
  - Toit plat (bassin ou à égout intérieur); revêtement de membrane(s).
  - Ouvertures nombreuses; porte à panneau avec vitrage, pleine ou entièrement vitrée; fenêtres en coin ou en bandeau.
  - 'Saillies : galerie, marquise, perron, portail et portique.'
profile_note: A style the thesaurus applies to non-residential buildings — the fiche carries no storey-count-for-habitation
  bullet and its linked exemplars are a restaurant, a community centre and churches. Recorded so the source's list
  can be read whole, but out of this site's residential scope, so it gets no card and no page. Its French is verbatim
  from the fiche.
