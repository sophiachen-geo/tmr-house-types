blurb_en: The house that replaced the faubourg's gables. Brick to the street, cheap sheet metal down the sides,
  filling its lot from party wall to party wall with a carriage arch punched through it, and all its display saved
  for the parapet — the last thing the tinsmiths had left to decorate.
origin_en: A turn-of-the-century densification type that gradually replaced the two-slope and broken-roof houses
  of Saint-Roch, Saint-Sauveur and Saint-Jean-Baptiste, and converted single-family ones into flats. Its architectural
  simplicity made it compatible with mixed commercial and residential use.
