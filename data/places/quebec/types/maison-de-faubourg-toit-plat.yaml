profile:
  siting_landscape:
  - Aligned on the pavement; occupies the full width of the lot, hence party walls and a porte cochère.
  - Transformed the built landscape of the faubourg quarters at the turn of the 20th century, favouring densification.
  massing:
  - 'Composition: multi-unit house, party-wall, adapted to the urban milieu and densifying the fabric.'
  - Two to three occupied levels.
  - Flat roof (basin, internal drainage) with membrane covering; or low-pitch flat roof draining to the rear (external
    drainage), under 15°, in asphalt shingle, membrane, profiled or traditional sheet metal.
  - Few projections apart from logettes and oriels at the upper floors.
  articulation:
  - 'Ornament concentrated at the crown: parapet, or a worked cornice in sheet metal or wood; bandeaux, decorative
    brick, consoles, corbels, planches cornières.'
  - The tinsmith-roofers of the period had to reinvent their decorative work, having lost much of their market to
    flat roofs covered in tar or membrane and gravel.
  openings:
  - Arched openings, usually segmental, with arches, chambranles and keystones.
  - Single- or double-leaf door, and a single- or double-leaf porte cochère with or without a wicket, surmounted
    by a transom.
  - Openings distributed fairly regularly from one level to the next; window models vary; frequently surmounted
    by transoms.
  materials:
  - Principal façade in brick.
  - 'Side walls: wood board, asbestos-cement shingle or sheet tin.'
profile_fr:
  description:
  - À Québec, la maison de faubourg à toit plat modifie principalement le paysage bâti des quartiers de faubourg
    au tournant du 20e siècle. Favorisant la densification, elle correspond à une maison à logements adaptée au
    milieu urbain. Elle remplace graduellement les maisons à toit à deux versants ou à toit brisé, en plus d’en
    modifier certaines qui sont unifamiliales. Elle présente par ailleurs une simplicité dans sa composition architecturale
    ce qui la rend compatible avec un usage mixte tel que commercial et résidentiel par exemple.
  - Ce type possède habituellement deux ou trois niveaux d’occupation coiffés d’une toiture à faible pente vers
    l’arrière ou à bassin avec égout intérieur. Étant donné qu’il occupe toute la largeur du lot, il comprend des
    murs mitoyens et une porte cochère. La façade principale est en brique, tandis que les façades secondaires sont
    parfois revêtues de matériaux légers comme le clin de bois, le bardeau d’amiante-ciment ou la tôle en plaques.
    Les ouvertures sont réparties plutôt régulièrement d’un niveau à un autre, alors que les modèles de fenêtres
    demeurent variables; elles sont souvent surmontées d’impostes. Aligné sur le trottoir, le bâtiment possède peu
    de saillies si ce n’est la présence de logettes ou d’oriels aux étages. L’ornementation est concentrée autour
    du couronnement avec la présence d’un parapet, ou encore d’une corniche ouvragée en tôle ou en bois. Les ferblantiers-couvreurs
    de l’époque ont dû se renouveler dans la confection d’éléments décoratifs, puisqu’ils ont perdu une bonne part
    de leur marché avec l’avènement des toits plats recouverts de goudron ou de membranes et de gravier.
  elements_caracteristiques:
  - 'Composition : maison à logements, mitoyenne, adaptée au milieu urbain et densifiant le tissu.'
  - Deux à trois niveaux d’occupation (2 à 3 étages).
  - 'Murs latéraux : revêtement de planche de bois, de bardeau d’amiante ou de tôle en plaques.'
  - Toit plat (bassin ou à égout intérieur); revêtement de membrane(s). Toit plat à faible pente (à égout extérieur);
    pente très faible (moins de 15°); revêtement de bardeau d’asphalte, de membrane(s), de tôle profilée ou de tôle
    traditionnelle.
  - Ouvertures en arc, mais généralement en arc surbaissé, garnies d’arcs, de chambranles et de clefs; porte à simple
    ou à double battant et porte cochère à simple ou à double battant et avec ou sans portillon surmontée d’une
    imposte.
  - 'Saillies aux étages : logettes et oriels.'
  - 'Ornements : bandeaux, briques décoratives, consoles, corbeaux, corniche en tôle ou en bois, couronnement et
    planches cornières.'
