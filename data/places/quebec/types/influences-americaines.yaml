profile_fr:
  description:
  - Dès la fin du XIXe siècle, les concepts et les théories venus des États-Unis marquent le paysage bâti à travers
    l’Amérique. Divers phénomènes comme la standardisation des matériaux, la mécanisation du travail, l’assemblage
    d’éléments préfabriqués, de même que la diffusion de plans types de maisons par le biais de catalogues et de
    revues à grande échelle vont influencer notre architecture. À Québec, l’essor économique et la croissance démographique
    sont directement liés à l’expansion et à la densification de la ville, ce qui entraîne des changements à la
    construction des bâtiments et aux règles d’urbanisme.
profile_note: 'One of the nine top-level currents of the thesaurus — a landing page, not a thesaurus node, so it
  carries no tid and no Éléments caractéristiques list. Recorded so the nine-current tree can be read whole and
