profile:
  siting_landscape:
  - The building is put up in an isolated context — that is, without any real regard for the environment or the
    setting it is inserted into.
  - The first manifestations of the International Style appear at Québec from 1935, notably with the building of
    white or brick houses of stripped-down form at Sillery, designed among others by the architects Robert Blatter
    and Charles A. Jean.
  massing:
  - 'Composition drawn from modernism, breaking totally with the forms of the past: a dominant horizontality, a
    stripped-down character, the volumes set off and brought forward, without symmetry, without regard for the natural
    and built environment, forms sometimes borrowed from the means of transport, fronts of smooth uniform surfaces,
    a palette of neutral sober colours, and an exterior that accounts for the interior organisation of the building.'
  - Assembly of volumes and play of solids and voids.
  - Flat roof (basin or internal drainage) or flat roof laid out as a terrace; membrane covering.
  - 'Projections: gallery, marquee, perron, pilotis, portal and portico.'
  - The distinct volumes, expressing the interior functions, are assembled and treated uniformly.
  articulation:
  - The smooth exterior surfaces carry no ornament and their colours stay neutral and sober; walls covered in stucco
    come in various shades of white, grey or light pastel.
  - Regularity and stripping-down applied as a principle, using every possibility offered by concrete, steel and
    glass.
  openings:
  - Numerous openings; panelled door with glazing, solid, or fully glazed.
  - Corner windows, ribbon windows, or fixed lights with glass blocks.
  materials:
  - 'Walls: stone, concrete, metal, metal-and-glass curtain wall, or render cladding; frame of wood, steel or reinforced
    concrete.'
  - Concrete foundation with or without pilotis.
profile_fr:
  description:
  - La caractéristique principale du style International est la construction de bâtiments en rupture totale avec
    les traditions du passé. Les architectes qui adhèrent à cette école de pensée mettent en valeur les volumes
    par des surfaces extérieures lisses et sans ornementation. Ces volumes pourront ainsi être reproduits partout
    à travers le monde, avec le moins d’influences culturelles locales. Étant donné que tous les humains ont les
    mêmes besoins (se loger, s’instruire, travailler, produire, etc.), l’architecture devrait être la même pour
    tous. Les adeptes du style International souhaitent donc appliquer le principe de régularité et de dépouillement
    et utiliser pour cela toutes les possibilités offertes par le béton, l’acier et le verre dans leur plus simple
    expression.
  - 'Ce style résulte du mariage des idées européennes découlant de l’école du Bauhaus avec les techniques de construction
    en acier et en verre des États-Unis. L’un des fondements de cette approche nous vient de Ludwig Mies van der
    Rohe, un architecte allemand qui a immigré aux États-Unis : « Less is more ». Cela signifie que plus l’architecture
    est dépouillée et réduite à l’essentiel, plus elle est belle. Ce principe minimaliste prônant la simplicité
    se matérialise dans des structures apparentes en acier ou en béton, des murs-rideaux constitués d’aluminium
    et de verre ainsi que des murs dépouillés de tout artifice laissant apprécier la texture des matériaux.'
  - On voit apparaître, dès 1935, les premières manifestations du style International à Québec, notamment avec la
    construction de maisons blanches ou en brique aux formes épurées à Sillery, notamment conçues par l’architecte
    Robert Blatter et Charles A. Jean, mais aussi des bâtiments commerciaux et institutionnels qui se démarquent
    par leur dépouillement ornemental.
  - Le bâtiment de style International est érigé dans un contexte isolé, c’est-à-dire sans véritable considération
    pour l’environnement ou le milieu dans lequel il s’insère. Il présente une géométrie asymétrique, une horizontalité
    dominante et une simplicité de la ligne. Le principe de régularité est appliqué pour les matériaux afin d’utiliser
    les nouvelles possibilités techniques offertes par le béton, l’acier et le verre. Les volumes distincts, exprimant
    les fonctions intérieures, sont assemblés et traités de manière uniforme. Leurs surfaces extérieures lisses
    ne possèdent pas d’ornementation et leurs couleurs demeurent neutres et sobres. Les murs recouverts de stuc
    se déclinent par exemple en diverses teintes de blancs, de gris ou de pastels légers. Il est également reconnaissable
    à ses toitures plates et aménagées en terrasse, ses façades avec des jeux de pleins et de vides, ses nombreuses
    ouvertures de formes variées ainsi que par ses fenêtres longues et étroites faisant office de bandeau.
  elements_caracteristiques:
  - 'Composition issue du modernisme qui rompt totalement avec les formes du passé : horizontalité dominante, caractère
    épuré, effet et mise en valeur des volumes, sans symétrie, sans considération pour l’environnement naturel et
    bâti, formes parfois empruntées aux moyens de transport, façades aux surfaces lisses et uniformes, palette de
    couleurs neutres et sobres et l’extérieur rend compte de l’organisation intérieure du bâtiment.'
  - Assemblage de volumes et jeux de pleins et de vides.
  - Fondation en béton avec ou sans pilotis.
  - 'Murs : revêtement de pierre, de béton, de métal, de métal et de verre avec le mur rideau ou d’enduit (stuc);
    structure en bois, en acier ou en béton armé.'
  - Toit plat (bassin ou à égout intérieur) ou plat aménagé en terrasse; revêtement de membrane(s).
  - Ouvertures nombreuses; porte à panneau avec vitrage, pleine ou entièrement vitrée; fenêtres en coin, en bandeau
    ou fixes avec blocs de verre.
  - 'Saillies : galerie, marquise, perron, pilotis, portail et portique.'
