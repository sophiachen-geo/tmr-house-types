blurb_en: Smooth white walls, a flat roof, corner and ribbon windows, volumes assembled to show what is happening
  inside and no ornament anywhere — a house built as though the site had no history. At Québec that means Sillery
  from 1935, and Robert Blatter.
origin_en: The principal characteristic of the International Style is building in total rupture with the traditions
  of the past. The architects of this school set off the volumes with smooth unornamented exterior surfaces, so
  that those volumes could be reproduced anywhere in the world with the least possible local cultural inflection.
  The style results from the marriage of European ideas out of the Bauhaus with the steel-and-glass building techniques
  of the United States; one of its foundations comes from Ludwig Mies van der Rohe — 'Less is more'. The first manifestations
  appear at Québec from 1935, notably with white or brick houses of stripped-down form at Sillery designed by Robert
  Blatter and Charles A. Jean.
