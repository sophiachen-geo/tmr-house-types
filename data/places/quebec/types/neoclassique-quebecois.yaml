profile_fr:
  description:
  - En vogue au 19e siècle, le style néoclassique québécois est une réinterprétation des styles néoclassiques venue
    d’Europe et d’Amérique. Ces derniers proposent un retour à l’architecture antique classique basé sur une composition
    rigoureuse, c’est-à-dire plus simple et dépouillé que les modèles anciens qui ont été redécouverts grâce à l’archéologie.
  - Les bâtiments de style néoclassique québécois dégagent une logique et une harmonie des proportions qui est adaptée
    à la réalité d’ici. Ils s’inscrivent dans la continuité de l’esthétique classique tout en étant moins codifiés.
    Présent dans l’architecture institutionnelle et ensuite domestique, ils caractérisent le paysage identitaire
    de la province.
  - 'À Québec, le style néoclassique québécois est fortement associé aux bâtiments à usage ou à connotation religieuse.
    Introduit et développé par l’architecte Thomas Baillairgé (1791-1859), il s’agit d’une synthèse entre les formes
    et la tradition. Il combine les styles néoclassiques français et anglais à la tradition locale de construction
    au Bas-Canada, tant du point de vue des techniques que des matériaux. Les bâtiments présentent une composition
    d’ensemble cohérente, une monumentalité et un sens du classicisme, aussi bien sur les élévations extérieures
    que dans le décor intérieur des églises par exemple. L’ornementation classique, sculptée en bois, est utilisée
    discrètement et de manière épurée : corniches, entablements, colonnes, pilastres et frontons.'
  elements_caracteristiques:
  - 'Composition moins codifiée de l’idéal classique avec la réinterprétation des styles néoclassiques qui sont
    adaptés à la réalité québécoise : système de proportions avec les ordres, recherche d’harmonie et d’équilibre,
    caractère monumental et synthèse entre les formes et la tradition locale de construire.'
  - Fondation en pierre.
  - Ouvertures régulières; porte à panneau(x) avec ou sans vitrage; fenêtres à battants et à petits carreaux, mais
    généralement à grands carreaux.
  - 'Ornements classiques utilisés discrètement et de manière épurée : colonnes, corniches, entablements, frontons
    et pilastres.'
