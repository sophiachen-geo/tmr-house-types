profile:
  siting_landscape:
  - Horizontality and regard for the natural environment.
  - Wright designed for his wealthy clients several houses of very elongated, horizontal form fitting perfectly
    into the prairie landscapes of the American Midwest.
  - At Québec, certain bungalows reflect this Prairie influence.
  massing:
  - 'Composition drawn from the architecture of the American Midwest, breaking with the forms of the past: horizontality
    and regard for the natural environment; a style seen as one of the variants of the Arts and Crafts movement,
    popularised in the United States.'
  - Simple volumes.
  - 'Projections sheltered by an awning: perron and gallery.'
  - The model was taken up across North America by architects and builders for middle-class people wanting an individual
    house in the suburbs, worked through every form while keeping the horizontal treatment of its architecture.
  - These houses may have a flat or low-pitched roof.
  articulation:
  - The horizontal treatment of the architecture is what is kept through every variant of the model.
  openings:
  - The fiche's bullet list names no openings — it runs to four bullets only, on composition, volumes, frame and
    projections; what follows is from its prose.
  - These residences, often designed by an architect, take advantage of the site they are set on by maximising the
    views over the landscape or getting the best possible sunlight.
  - They take unusual forms fitted to the interior spaces.
  materials:
  - Wood frame.
  - These houses may present various materials, usually natural ones, arranged together.
profile_fr:
  description:
  - La maison d’inspiration Frank Lloyd Wright
  - L’architecte Frank Lloyd Wright a été parmi les premiers, au début du 20e siècle, à développer un mode d’habitat
    typiquement américain. Cet architecte conçoit, pour ses clients fortunés, plusieurs maisons de forme très allongée
    et horizontale qui s’intègrent parfaitement aux paysages de prairie du Midwest américain. Ce modèle de résidence
    est ensuite repris, partout en Amérique du Nord, par des architectes et constructeurs pour des gens de la classe
    moyenne qui souhaitent acheter une maison individuelle personnalisée en banlieue. Ils déclinent ce modèle d’habitation
    dans toutes ses formes en conservant toutefois le traitement horizontal de son architecture. Ainsi, ces maisons
    peuvent avoir un toit plat ou à faible pente, présenter divers matériaux, habituellement naturels, agencés entre
    eux et prendre des formes inusitées qui s’adaptent aux espaces intérieurs. De plus, ces résidences, souvent
    conçues par un architecte, tirent profit de leur site d’implantation en maximisant les vues sur le paysage ou
    en bénéficiant du meilleur ensoleillement possible.
  - À Québec, certains bungalows reflètent cette influence de style Prairie.
  - Découvrez-en davantage en lisant cet article de blogue sur les influences de Frank Lloyd Wright à Québec.
  elements_caracteristiques:
  - 'Composition issue de l’architecture du Midwest américain qui rompt avec les formes du passé : horizontalité
    et considération pour l’environnement naturel; style perçu comme l’une des variantes du mouvement Arts and Crafts
    popularisée aux États-Unis.'
  - Volumes simples.
  - Charpente en bois.
  - 'Saillies protégées par un auvent : perron et galerie.'
