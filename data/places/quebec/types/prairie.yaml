blurb_en: Wright's long low horizontal house, worked down from wealthy clients to suburban builders across North
  America, keeping only the horizontality. The thesaurus's own fiche is brief; at Québec its clearest trace is in
  the bungalow, which the City files as its déclinaison.
origin_en: The architect Frank Lloyd Wright was among the first, at the beginning of the 20th century, to develop
  a typically American mode of dwelling. For his wealthy clients he designed several houses of very elongated and
  horizontal form that fitted perfectly into the prairie landscapes of the American Midwest. The model was then
  taken up across North America by architects and builders for middle-class people who wanted an individual, personalised
  house in the suburbs; they worked it through every form while keeping the horizontal treatment of its architecture,
  so that these houses may have a flat or low-pitched roof and present various materials. At Québec, certain bungalows
  reflect this Prairie influence.
