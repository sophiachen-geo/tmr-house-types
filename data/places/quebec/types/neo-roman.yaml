profile_fr:
  description:
  - Le style néo-roman se manifeste en Europe vers le milieu du 19e siècle. Il met en avant-plan les formes du Moyen
    Âge roman, plus particulièrement celles des édifices religieux de la France du 10e au 12e siècle. Il prend racine
    dans l’interprétation de l’art et de l’architecture médiévale, entre autres alimenté par les écrits de l’architecte
    français Eugène Emmanuel Viollet-le-Duc. En Amérique du Nord, sa portée religieuse s’estompe quelque peu sous
    l’influence américaine. L’architecte bostonien Henry Hobson Richardson popularise sa propre variante du style
    néo-roman; ses constructions d’allure massive possèdent des façades rythmées et des formes simplifiées qui tendent
    vers le modernisme.
  - Au Québec, le style néo-roman est surtout employé pour la construction de lieux de culte catholique ou de bâtiments
    qui leur sont attachés. Il est ainsi perçu comme le concurrent du style néogothique, en général associé aux
    lieux de culte protestant. Il fait sa marque entre 1870 et 1930 sur le territoire de la ville de Québec, mais
    sa présence est plutôt diluée. Il peut être combiné à d’autres styles pour donner une œuvre éclectique, ou encore
    quelques-unes de ses caractéristiques peuvent être intégrées à la conception d’ensemble d’un bâtiment.
  - Afin de faire ressortir l’expressivité des matériaux, le style néo-roman se définit par une composition sobre
    et un jeu de volumes. Le bâtiment possède des murs en pierre ou en brique dont l’effet de masse est accentué
    par des tours carrées, des piliers, des colonnes trapues ou des contreforts surmontés de pinacles. L’usage de
    l’arc plein cintre est un trait récurrent de ce style. Il se retrouve par exemple dans les portails à voussures
    dotés d’embrasures à ressauts, les portiques avec arcades ainsi que les ouvertures larges qui sont jumelées
    ou en groupe de trois.
  elements_caracteristiques:
  - 'Composition issue de l’architecture médiévale de la période romane : allure sobre et jeu de volumes permettant
    de faire ressortir l’expressivité des matériaux; création d’un effet de masse; style associé aux lieux de culte
    catholique.'
  - Plan simple ou irrégulier.
  - Fondation en pierre visible hors sol.
  - 'Murs : revêtement de brique, mais généralement en pierre.'
  - Toit à deux versants droits; pente moyenne (entre 30° et 45°); revêtement de tôle traditionnelle.
  - Ouvertures rectangulaires ou isolées, jumelées ou groupées en arc plein cintre; porte à panneau(x) avec ou sans
    vitrage surmontée d’une imposte et garnie d’un portail; fenêtres à battants et à petits ou à grands carreaux
    garnies d’impostes, à guillotine et à petits carreaux ou à petit-bois, fixes à petit-bois, à petits-fers ou
    avec vitrail (verrière) et roses.
  - 'Saillies : contreforts, portail, portique et tours carrées.'
  - 'Ornements : arcades, colonnes trapues, piliers et pinacles.'
