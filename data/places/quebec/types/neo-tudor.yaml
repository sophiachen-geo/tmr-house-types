blurb_en: 'The English manor scaled down for an anglophone bourgeoisie asserting itself: red brick below, white
  roughcast and false half-timbering above, upper storeys jettied out over the ground floor, steep gables, tall
  ornamented chimneys and stone-mullioned windows under depressed Tudor arches.'
origin_en: The neo-Tudor style is a soberer reading of the Tudor vocabulary developed in England in the 16th century
  under Henry VIII (1491–1547) and Elizabeth I (1533–1603). Drawing on traditional English and Scottish architecture,
  it means to recall the manors and farms of that period. It was popularised at Québec at the end of the 19th century,
  among others by architects and by the bourgeois community of Anglo-Saxon stock wanting to assert its cultural
  identity — a return to the sources, in pursuit of an authentic English architecture. Present across the city's
  territory between 1890 and 1920, it is principally associated with residential architecture.
