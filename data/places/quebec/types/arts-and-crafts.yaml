blurb_en: 'The English cottage as an argument against the factory: an informal plan, wood shingle over stone or
  brick, upper storeys jettied out, a gallery tucked under the eaves, and ornament cut back to exposed rafters,
  corner boards and a little false half-timbering.'
origin_en: In 19th-century England, society underwent major transformations because of industrialisation, and movements
  of thought appeared in reaction to the loss of the traditional social structure. The adherents of the Arts and
  Crafts movement proposed an architecture drawn from craft and from the dwelling of the English countryside, valuing
  a return to manual work, the use of traditional materials and recourse to local know-how as an obstacle to standardisation.
  The movement then reached the United States, where it was known through several styles — the Shingle Style on
  the east coast, the Prairie Style in the centre, and the Craftsman Style on the west. Its popularity was largely
  owed to the architectural catalogues and magazines distributed across North America from the beginning of the
  20th century, although its ideology was poorly understood.
