blurb_en: 'The workers'' cottage of the industrial era, ordered out of a pattern book: a rectangle, an L or a T
  under a straight two-slope roof with no bell-cast to the eaves, taller and more vertical than the traditional
  Québécois house it replaced, and clad in whatever was cheapest that year.'
origin_en: The vernacular cottage was popularised through pattern books, in which standard plans and architectural
  components were available. Arising out of the industrial period that began a little after the middle of the 19th
  century in Québec, it is strongly marked by standardisation, and the building of this single-family house is at
  once quick, simple and inexpensive. The American vernacular cottage is the commonest type in the first half of
  the 20th century at Québec, drawing on various styles, particularly those of the classical revival or the historical
  influences.
