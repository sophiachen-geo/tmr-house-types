profile:
  siting_landscape:
  - Associated with residential architecture in rural or urban settings; the commonest type in the first half of
    the 20th century at Québec.
  - Popularised through pattern books, which supplied standard plans and architectural components alike.
  massing:
  - 'Composition drawn from the classical revival or from the historical influences: a search for symmetry; single-family
    house; a type taking in several variants including the colonisation house, the gable-fronted house, the central-dormer
    house and the storeyed house.'
  - Rectangular, L-shaped or T-shaped plan.
  - One to three occupied levels (one and a half to two and a half storeys).
  - Straight two-slope roof, or straight two-slope with half-hips; low pitch, under 30°, or medium, between 30°
    and 45°.
  - 'Projections sheltered by an awning: balcony, gallery wrapping or not, and perron; secondary bodies: annexe,
    summer kitchen, porch and veranda.'
  - It is distinguished from the traditional Québécois house by a volume rising over one, two or three levels, giving
    the building more verticality, and by a straight two-slope roof without curved eaves.
  articulation:
  - 'Ornaments: brackets, cornices, pediments, cut-out woodwork, lambrequins, corner boards and cornice returns.'
  openings:
  - Diamond windows in the gable walls; dormers present or not.
  materials:
  - 'Walls: brick paper, pressed tin, concrete block or artificial masonry cladding, but generally wood board, wood
    shingle or asbestos shingle.'
  - Asphalt shingle, cedar shingle, profiled or traditional sheet-metal roof covering.
  - Wood frame.
profile_fr:
  description:
  - Associée à l’architecture résidentielle en milieu rural ou urbain. Le cottage vernaculaire est popularisé par
    le biais de livres de modèles (Pattern Books) où sont entre autres disponibles des plans types et des éléments
    architecturaux. Issue de la période industrielle s’amorçant peu après le milieu du 19e siècle au Québec, il
    est fortement influencé par le phénomène de la standardisation. La construction de cette maison unifamiliale
    est à la fois rapide, simple et peu coûteuse.
  - 'Le cottage vernaculaire américain est le type le plus courant dans la première moitié du 20e siècle à Québec.
    Il s’inspire de divers styles, particulièrement ceux issus du renouveau classique ou des influences historiques.
    Il se distingue de la maison traditionnelle québécoise par un volume qui s’élève sur un, deux ou trois niveaux,
    conférant plus de verticalité au bâtiment, ainsi que par une toiture à deux versants droits sans larmiers recourbés.
    Il possède un plan rectangulaire ou en « L », de même qu’une ossature en bois. Le revêtement est en planche
    à clin ou à feuillures, ou encore en bardeau de bois ou d’amiante. Le papier brique, la tôle matricée, la maçonnerie
    artificielle, la brique et les blocs de béton peuvent également être employés. Les ouvertures sont organisées
    de façon symétrique et avec rigueur tandis que l’ornementation est variable d’un bâtiment à l’autre. Les éléments
    décoratifs demeurent cependant réduits à leur plus simple expression : planches cornières, chambranles autour
    des ouvertures et retours d’équerre. Les galeries, les balcons ou les perrons sont quant à eux ornés d’aisseliers,
    de lambrequins ou de corniches.'
  elements_caracteristiques:
  - 'Composition issue du renouveau classique ou des influences historiques : recherche de symétrie; maison unifamiliale;
    type comprenant plusieurs variantes dont la maison de colonisation, à pignon sur rue, à lucarne centrale ou
    à étages.'
  - Plan rectangulaire, en « L » ou en « T ».
  - Un à trois niveaux d’occupation (1 étage ½ à 2 étages ½).
  - 'Murs : revêtement de papier brique, de tôle matricée, de blocs de béton ou de maçonnerie artificielle, mais
    généralement de planche de bois, de bardeau de bois ou de bardeau d’amiante.'
  - Toit à deux versants droits ou à deux versants droits avec demi-croupes; pente faible (moins de 30°) ou moyenne
    (entre 30° et 45°); revêtement de bardeau d’asphalte, de bardeau de cèdre, de tôle profilée ou de tôle traditionnelle.
  - Fenêtres en losange aux murs pignons; présence ou non de lucarnes.
  - 'Saillies protégées par un auvent : balcon, galerie tournante ou non et perron; corps secondaires : corps d’annexe,
    cuisine d’été, porche et véranda.'
  - 'Ornements : aisseliers, corniches, frontons, garnitures de bois découpées, lambrequins, planches cornières
    et retours d’équerre.'
