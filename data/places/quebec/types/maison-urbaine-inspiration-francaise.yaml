blurb_en: Stone, one or two levels and an attic, with the party walls carried up past the roof as fire-breaks and
  the chimneys buried inside them — the shape the intendants' ordinances imposed on the walled town after wooden
  Québec kept burning down. The well-to-do version sits on a stone vault.
origin_en: Few urban houses of French inspiration built at Québec in the 17th century survive, and the wood most
  of them were made of is not unconnected with the fires that destroyed them. In the early 18th century the edicts
  and ordinances of the colony's intendants normalised how the house was to be built in order to remedy this, and
  that series of by-laws shaped the urban landscape of the town by reconsidering how it was to be lived in.
