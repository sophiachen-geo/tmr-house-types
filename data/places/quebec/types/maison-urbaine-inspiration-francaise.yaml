profile:
  siting_landscape:
  - 'The house of the walled town, rebuilt in stone after fire: few 17th-century examples survive, because most
    were of wood and burned.'
  - In the early 18th century the edicts and ordinances of the colony's intendants standardised how the house was
    to be built, and that series of regulations shaped the urban landscape of the town by reconsidering how it was
    to be lived in.
  massing:
  - One to three occupied levels (one to two and a half storeys); a vaulted cellar in the well-to-do house.
  - Straight two-slope roof.
  - 'Projections: party fire-break walls rising above the roof and containing the chimneys — built so to check the
    spread of flames.'
  - The more substantial houses are built over stone vaults.
  articulation:
  - 'Reduced ornament: bandeaux, quoins, corbels and tie-rods.'
  - Decorative components are rare, limited to surrounds, lintels and chambranles.
  openings:
  - Regular openings; cellar lights; hipped, gabled and cat-slide dormers.
  - Openings distributed fairly regularly, but without any search for symmetry.
  - The usual window is the casement with small panes, fitted with working shutters.
  materials:
  - 'Roof: slate, board-and-batten or lapped board, but generally traditional sheet metal.'
  - Foundation raised above the ground.
  - A stone construction of one or two levels with an attic.
profile_fr:
  description:
  - Le style colonial français s’est développé en Nouvelle-France d’après les modèles de construction du pays auquel
    il se rattache, la France. Il retient les principes généraux du classicisme français avec son système de proportions,
    sa composition harmonieuse d’ensemble et une certaine réserve dans l’expression architecturale. En lien avec
    la tradition, les premiers colons répètent les formes simples dont l’usage est commun. Artisans, entrepreneurs
    ou maçons construisent ainsi des bâtiments dans un état d’esprit français, tout en proposant quelques adaptations
    compte tenu du climat ou de la règlementation imposée à différentes époques.
  - Maison urbaine d’inspiration française
  - Il reste peu de maisons urbaines d’inspiration française construites au 17e siècle à Québec. L’utilisation du
    bois pour la grande majorité d’entre elles n’est pas étrangère aux incendies qui les ont détruites. Au début
    du 18e siècle, les édits et les ordonnances des intendants de la colonie normalisent la construction de la maison
    afin de remédier à la situation. Cette série de règlements façonne le paysage urbain de la ville en reconsidérant
    la manière d’habiter.
  - La maison urbaine d’inspiration française est donc une construction en pierre d’un ou deux niveaux avec un comble.
    Le toit à deux versants droits est revêtu d’ardoise ou de tôle traditionnelle. Les cheminées sont comprises
    dans les murs mitoyens coupe-feu et dépassent la toiture pour contrer la propagation des flammes en cas d’incendie.
    Les maisons plus cossues sont construites sur des voûtes en pierre.
  - Les ouvertures de la maison sont distribuées assez régulièrement, mais sans recherche de symétrie. La fenêtre
    à battants et à petits carreaux, munie de contrevents fonctionnels, est le modèle le plus usuel. Les composantes
    décoratives sont plutôt rares; elles sont limitées aux encadrement, linteaux et chambranles.
  elements_caracteristiques:
  - Un à trois niveaux d’occupation (1 à 2 étages ½); cave voûtée pour la maison cossue.
  - Fondation visible hors sol.
  - 'Toit : revêtement d’ardoise, de planche à couvre-joints ou de planche chevauchée, mais généralement de tôle
    traditionnelle.'
  - Ouvertures régulières; soupiraux; lucarnes à croupe, à pignon et chatière.
  - 'Saillies: murs coupe-feu mitoyens dépassant du toit et incluant les cheminées.'
  - 'Ornements réduits : bandeaux, chaînes d’angle, corbeaux et tirants.'
