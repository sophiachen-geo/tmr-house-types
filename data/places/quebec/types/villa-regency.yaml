blurb_en: 'The town house moved out to the country: a square or rectangular block of two to three levels, three
  or five bays wide, under a low four-slope roof, set back from the road on cleared ground with a gallery or veranda
  across the front and the site dressed with planting, pavilions and fountains.'
origin_en: 'The Regency villa can be defined as a house transposed from the urban setting to the rural one. Its
  composition, from the classical repertoire, is turned toward rigour and symmetry, while the building still tries
  to establish a relation with its natural surroundings. The organisation of the property takes much the same shape
  from one villa to the next: the building stands back from the road on a cleared part of the ground, and the site
  is set off by landscaping, pavilions or fountains.'
