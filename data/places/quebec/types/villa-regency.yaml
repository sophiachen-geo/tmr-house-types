profile:
  siting_landscape:
  - 'Layout: garden, quality of the landscaping, a wide expanse of ground and abundant vegetation.'
  - The building is set back from the road, on a cleared part of the ground, and the site is set off by landscaping,
    pavilions or fountains.
  - At Québec, villégiature spread to the suburbs — Sillery, Beauport and Sainte-Foy — over the 19th century; Regency
    buildings appear mainly between 1820 and 1880 along the old routes such as the Grande Allée and the chemins
    Saint-Louis and Sainte-Foy.
  massing:
  - Composition drawn from the neoclassical aesthetic, with a search for symmetry and a rigorous reading of classical
    models, and from the picturesque, integrating the forms into the natural environment.
  - 'Composition: a well-to-do house with a front of three or five bays.'
  - Square or rectangular plan; rectangular for the villa proper.
  - Two to three occupied levels (two to two and a half storeys).
  - Four-slope roof; low pitch, under 30°; traditional sheet-metal covering. Straight two-slope roof; medium pitch,
    between 30° and 45°.
  - 'Projections: gallery; central projections: avant-corps; secondary body: veranda.'
  - A large gallery or a veranda across the front makes the link with the outdoors, while various annexes spread
    across the ground.
  articulation:
  - 'Classical ornament: columns, cornices, pediments and pilasters.'
  - 'Ornaments: quoins, finials, cut-out woodwork and rooftop terraces.'
  - The ornament is meant to be sober, using quoins, finials and chambranles.
  openings:
  - Regular rectangular openings fitted with chambranles, surrounds and flat arches; central door with sidelight(s)
    and transom, and French windows.
  - Casements with small or large panes; hipped or gabled dormers.
  materials:
  - 'Walls: stone, brick or wood cladding.'
  - Stone foundation barely raised above the ground.
profile_fr:
  description:
  - 'Le style Regency s’inspire de deux conceptions esthétiques :'
  - '- Celle issue du néoclassique, basée sur l’interprétation rigoureuse des modèles antiques classiques ;'
  - '- Celle issue du pittoresque, qui cherche à intégrer l’irrégularité des formes à l’environnement naturel.'
  - Ces principes se transposent surtout à l’architecture résidentielle en périphérie des centres urbains, puisque
    le bâtiment se présente en communion avec le décor dans lequel il se trouve. La construction de grandes maisons
    appelées villas sera suivie de maisons plus modestes qui prennent l’allure de cottages. Introduits par les Britanniques,
    ces types ont été adoptés par l’élite anglaise désireuse de posséder une maison à la campagne.
  - À Québec, le développement de la villégiature gagne les banlieues comme Sillery, Beauport et Sainte-Foy au cours
    du 19e siècle. Construits sur de grandes propriétés encore inoccupées ou qui seront morcelés, les bâtiments
    de style Regency apparaissant principalement entre 1820 et 1880 le long des parcours anciens tels que la Grande
    Allée et les chemins Saint-Louis et Sainte-Foy.
  - Villa Regency
  - La villa Regency peut en quelque sorte être définie comme une maison transposée du milieu urbain au milieu rural.
    Sa composition, issue du répertoire classique, est orientée vers la rigueur et la symétrie. Ce type se caractérise
    par un plan carré ou rectangulaire, deux à trois niveaux d’occupation, une façade principale de trois ou de
    cinq travées et un toit à quatre versants à faible pente. Les murs sont revêtus de brique, de pierre ou de bois.
    L’ornementation se veut sobre avec l’emploi de chaînes d’angle, d’épis et des chambranles.
  - Bien qu’une certaine monumentalité se dégage de la villa Regency, cette dernière tente d’établir une relation
    avec son environnement naturel. Une grande galerie ou une véranda en façade permet ainsi de créer un lien avec
    l’extérieur, tandis que divers corps d’annexe se déploient sur le terrain. En ce qui à trait à l’organisation
    spatiale de la propriété, elle prend sensiblement la même allure d’une villa à l’autre. Le bâtiment est implanté
    en retrait de la route, sur une partie dégagée du terrain, et le site est mis en valeur par des aménagements
    paysagers, des pavillons ou des fontaines.
  elements_caracteristiques:
  - Composition issue de l’esthétique néoclassique avec la recherche de symétrie et l’interprétation rigoureuse
    des modèles antiques classiques et pittoresque avec l’intégration des formes à l’environnement naturel.
  - Plan carré ou rectangulaire.
  - Fondation en pierre peu visible hors sol.
  - 'Murs: revêtement de pierre, de brique ou de bois.'
  - Toit à quatre versants; pente faible (moins de 30°); revêtement de tôle traditionnelle.
  - Ouvertures régulières et rectangulaires garnies de chambranles, d’encadrements et de plate-bande; porte centrale
    à baies(s) latérale(s) et à imposte et portes-fenêtres; fenêtres à battants et à petits ou à grands carreaux;
    lucarnes à croupe ou à pignon.
  - 'Ornements classiques: colonnes, corniches, frontons et pilastres.'
  - 'Aménagement : jardin, qualité de l’aménagement paysager, terrain de vaste étendue et végétation abondante.'
  - 'Éléments caractéristiques de la Villa Regency :'
  - 'Composition : maison cossue comprenant une façade de trois ou de cinq travées.'
  - Plan rectangulaire.
  - Deux à trois niveaux d’occupation (2 étages à 2 étages ½).
  - Toit à deux versants droits; pente moyenne (entre 30° et 45°).
  - 'Saillies : galerie; saillies centrales : avant-corps; corps secondaire : véranda.'
  - 'Ornements : chaînes d’angle, épis, garnitures de bois découpées et terrasses faîtières.'
