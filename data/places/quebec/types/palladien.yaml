blurb_en: 'English classicism arriving with the new rulers, and pulled back hard for domestic use: two to three
  levels, a rigorously symmetrical front with a central door, a projecting pedimented centre making the façade tripartite,
  and chimneys placed symmetrically at the ends. The Serlian window is the giveaway.'
origin_en: The Palladian style belongs to English classicism, a movement current in England from the 17th century,
  drawing on Italian Renaissance architecture and on the writings and buildings of Andrea Palladio (1508–1580).
  Introduced first into England, it appeared in Lower Canada from the end of the 18th century until about 1830,
  in a period marked by the new rulers' wish to signal their presence at Québec — buildings more representative
  of the British order were transformed or rebuilt, and well-to-do houses erected. Residential architecture took
  up only the broad principles.
