profile:
  siting_landscape:
  - Introduced in England, then appearing in Lower Canada from the end of the 18th century until about 1830.
  - 'A period marked by the new rulers'' wish to signal their presence at Québec: buildings more representative
    of the British order were transformed or rebuilt, and well-to-do houses put up to match.'
  massing:
  - 'Composition drawn from English classicism, itself drawn from Italian Renaissance architecture and reinterpreting
    the forms of Antiquity: a search for symmetry and a tripartite façade.'
  - Two to three occupied levels (two to two and a half storeys).
  - Straight two- or four-slope roof; medium pitch, between 30° and 45°; traditional sheet-metal covering.
  - 'Central projections: avant-corps and portal; central secondary body: porch.'
  - 'Projections: chimneys rising from the roof or set within the gable walls — distributed symmetrically, often
    one at each end.'
  - Handled with restraint, the residential architecture takes up only the broad principles of the Palladian style.
  articulation:
  - 'Classical ornament: columns, cornices, pediments and pilasters.'
  - A plain composition in the Palladian style.
  - Projecting portals decorated with columns or pilasters carrying a cornice and a triangular pediment, and chambranles.
  openings:
  - Rectangular and round-arched openings; central door fitted with a portal.
  - Casements with small or large panes, sash windows with small panes, Palladian (Serlian) windows and oculi.
  - Cellar lights.
  - The Serlian or Palladian window — three lights, the centre one crowned with a semicircular head — is another
    marked trait of the style.
  materials:
  - Walls of stone masonry, generally ashlar; roughcast or white stucco render.
  - Stone foundation raised above the ground.
  - The walls are of smooth-finished ashlar or covered in roughcast.
profile_fr:
  description:
  - Le style palladien est associé à un mouvement diffusé en Angleterre à partir du 17e siècle, le classicisme anglais.
    Il s’inspire de l’architecture de la Renaissance italienne ainsi que des écrits et des réalisations d’Andrea
    Palladio, un architecte italien (1508-1580) qui réinterprète les formes architecturales de l’Antiquité. Il est
    d’abord introduit en Angleterre pour ensuite se manifester au Bas-Canada à partir de la fin du 18e siècle jusque
    vers 1830. Marquée par la volonté des nouveaux dirigeants de marquer leur présence à Québec, cette période se
    caractérise par la transformation ou la reconstruction de bâtiments plus représentatifs de l’ordre britannique;
    il en va de même pour l’érection de maisons cossues.
  - Les bâtiments de style palladien possèdent généralement un plan rectangulaire, un avant-corps central avec fronton
    qui définit une façade tripartite, un toit à deux ou à quatre versants droits et une ornementation classique.
    La façade est rigoureusement symétrique avec une entrée disposée au centre et les murs sont en pierre de taille
    au fini lisse ou revêtue de crépi. L’usage de la fenêtre serlienne ou palladienne, composée de trois baies dont
    celle du centre est coiffée d’une imposte en hémicycle, est un autre trait marquant de ce style.
  - 'Traitée avec retenue, l’architecture résidentielle ne reprendra que les grands principes du style palladien.
    La maison compte donc de deux à trois niveaux et la toiture est recouverte en tôle traditionnelle avec une pente
    qui varie de 30 à 45 degrés. Les souches de cheminées sont réparties symétriquement, souvent à chaque extrémité
    du toit. Les fenêtres à guillotine à petits carreaux sont employées tandis que certaines composantes propres
    au style peuvent s’appliquer : la fenêtre palladienne, les portails en avancée qui sont décorés de colonnes
    ou de pilastres supportant une corniche et un fronton triangulaire, ainsi que des chambranles.'
  elements_caracteristiques:
  - 'Composition issue du classicisme anglais qui s’inspire de l’architecture de la Renaissance italienne et réinterprète
    les formes de l’Antiquité : recherche de symétrie et façade tripartite.'
  - Fondation en pierre visible hors sol.
  - Murs en maçonnerie de pierre, généralement en pierre de taille; revêtement de crépi ou d’enduit (stuc) blanc.
  - Toit à deux ou à quatre versants droits; pente moyenne (entre 30° et 45°); revêtement de tôle traditionnelle.
  - Ouvertures rectangulaires et en arc plein cintre; porte centrale garnie d’un portail; fenêtres à battants et
    à petits ou à grands carreaux, à guillotine et à petits carreaux, palladiennes (serliennes) et à oculus.
  - 'Saillies centrales : avant-corps et portail; corps secondaire central : porche.'
  - 'Ornements classiques : colonnes, corniches, frontons et pilastres.'
  - Maison palladienne
  - Composition sobre du style palladien.
  - Deux à trois niveaux d’occupation (2 à 2 étages ½).
  - Soupiraux.
  - 'Saillies : cheminées s’élançant du toit ou incluses dans les murs pignons.'
