blurb_en: 'The domestic half of a style that mostly built churches: a villa or cottage on the edge of town with
  a central gable dormer over the front door, pointed-arch windows, diamond panes and cut-out wood running along
  the cornice — structure turned into decoration, which is what neo-Gothic mostly was.'
origin_en: 'Drawing on medieval architecture, the neo-Gothic style appeared in England about 1750, then spread through
  Europe before reaching North America; romantic spirits found in it an answer to the severity of neoclassical architecture.
  Present at Québec between 1830 and 1880, its popularity was short-lived: it quickly became the Protestant church''s
  preferred choice, while Catholic communities moved away from it after the enthusiasm of the 1850s and 1860s. Compared
  with religious architecture, the style is observable at Québec until about 1920 for residential buildings — mostly
  villas or cottages set on the edge of the urban centre.'
