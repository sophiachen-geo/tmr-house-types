profile_fr:
  description:
  - La première moitié du XXe siècle est partagée entre les influences traditionnelles et modernes. L’historicité
    du XIXe siècle perdure, elle préconise toujours l’imitation de formes anciennes issues d’une esthétique classique,
    mais avec l’avènement de techniques de construction et de matériaux plus performants, les nouvelles formes commencent
    à s’imposer. À Québec, l’architecture conventionnelle, tout en étant moderne sur certains aspects, maintient
    le poids de la tradition. La normalisation de la construction, le développement des quartiers ouvriers, la salubrité
    de l’aménagement et les principes d’urbanisation nord-américains sont quelques-uns des facteurs qui viennent
    transformer le paysage bâti de la ville.
