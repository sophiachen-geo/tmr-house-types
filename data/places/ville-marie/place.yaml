id: ville-marie
name_en: Ville-Marie (Montréal)
name_fr: Arrondissement de Ville-Marie
borough_of: montreal          # Part 10a: the Montréal boroughs render as siblings under one header
sections: [historic-core]
region: Montréal (île de Montréal), arrondissement de Ville-Marie
founded: 1642
settlement_mode: >-
  the founding settlement itself and everything that grew off it — a walled colonial town of 1642
  laid out in 1672 by Dollier de Casson, the faubourgs that spilled through its demolished
  fortifications after 1801, the anglophone bourgeoisie's villa quarter on the south flank of the
  mountain, the francophone working-class east around the breweries and tobacco works, and a
  modern downtown driven through the middle of all of it between 1955 and 1975
