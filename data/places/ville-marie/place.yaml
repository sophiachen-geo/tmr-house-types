summary_en: >-
  The borough that is the city's beginning and its argument about protection. Ville-Marie holds the
  declared site patrimonial de Montréal, the richest domestic architecture on the island in the
  Mille carré doré, the greystone terraces of the Village Shaughnessy and the working-class
  faubourgs of the east — and the protection they carry has almost nothing to do with how good they
  are. Vieux-Montréal has been a declared site since 1964 and its plan de conservation has still not
  been produced. The Mille carré doré, graded exceptionnelle in the Ville's own 2005 cahier as
  sectors 24.E.29 and 24.E.30, has no ensemble designation at all: Héritage Montréal states in as
  many words that it <em>"does not have a designation or specific strategy to protect and promote
  its heritage over current urban development considerations"</em>. Six blocks of it — the
  Complexe-de-La-Maison-Alcan — were classed in 2017, and they are the exception that shows the
  rule. This is also the one place on the site whose arrondissement number is contradicted by two
  Ville de Montréal documents at once: the 2005 cahier prints 24 beside every sector name, the 2016
  Plan d'urbanisme calls the same territory 25, and 25 in the 2005 series is Le Plateau-Mont-Royal.
