governing_instruments:
  - kind: site-patrimonial-declare
    title: >-
      Site patrimonial de Montréal (Vieux-Montréal), RPCQ id 93528. The RPCQ statuts table makes
      the déclaration of 1995-04-26 the operative status and the déclaration of 1964-01-08 a
      statut antérieur; the 1995 declaration enlarged the limits to take in the old fortifications.
      A transfert de responsabilité — the exercise of certain powers by the municipality of
      Montréal — was registered 2017-09-21 and took effect 2018-09-21. The RPCQ describes a
      territory of about 1 400 m east–west by 800 m north–south holding 557 édifices et vestiges
      built between the 17th and the 20th century, bounded by rue Saint-Antoine (N), the fleuve
      Saint-Laurent (S), the faubourg Québec with rues Saint-Hubert and Saint-André (E) and the
      faubourg des Récollets with rues McGill, De Longueuil and des Sœurs-Grises (W), and taking in
      the pointe à Callière sector and the Vieux-Port.
    year: 1995
    url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=93528
  - kind: evaluation-cahier
    title: >-
      Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005),
      ISBN 2-7647-0467-4, the Ville-Marie volume of the twenty-seven-cahier series prepared by the
      Division du patrimoine et de la toponymie under Jean-François Gravel, worked January 2003 –
      May 2004 for the Plan d'urbanisme adopted by the conseil municipal on 23 November 2004. It
      designates 67 secteurs de valeur patrimoniale exceptionnelle (24.E.1–24.E.67), 19 secteurs de
      valeur patrimoniale intéressante (24.I.1–24.I.19), one ensemble urbain d'intérêt (24.U.1),
      two ensembles industriels d'intérêt (24.N.1–24.N.2) and six secteurs d'intérêt archéologique
      à fort potentiel (24.AP.1–24.AP.6). Every sector code it prints begins 24.
    year: 2005
    url: http://ville.montreal.qc.ca/pls/portal/docs/PAGE/PATRIMOINE_URBAIN_FR/MEDIA/DOCUMENTS/25_EVALUATION_PATRIMOINE_VILLE-MARIE.PDF
  - kind: piia
    title: >-
      Ville-Marie, règlement d'urbanisme de l'arrondissement de Ville-Marie 01-282, chapter
      « Secteurs et immeubles à valeur patrimoniale ». Recorded here as the instrument that carries
      design review in this borough; the by-law text was not retrieved for this part and the
      article numbers are therefore not stated. Part 11b task.
    year: null
    url: null
  - kind: conservation-plan
    title: >-
      MCC plan de conservation for the site patrimonial de Montréal — NOT RETRIEVED, and on the
      evidence available not published. The Conseil du patrimoine culturel du Québec's own page for
      the site (cpcq.gouv.qc.ca/patrimoine-culturel/sites-patriomoniaux/montreal/, checked 17 August
      2026) carries no plan, no règlement and no directive, only a pointer to the RPCQ fiche; the
      MCC's former plans-de-conservation index at mcc.gouv.qc.ca/index.php?id=5074 now redirects to
      a generic Québec.ca landing page. Until an instrument is produced, this page's Vieux-Montréal
      content comes from the RPCQ statement of value and the 2005 cahier, both quoted verbatim.
    year: null
    url: https://cpcq.gouv.qc.ca/patrimoine-culturel/sites-patriomoniaux/montreal/
  - kind: site-patrimonial-classe
    title: >-
      Site patrimonial du Complexe-de-La-Maison-Alcan, RPCQ id 204071 — classé by the ministre de
      la Culture et des Communications on 2017-02-23 with effect from 2015-11-09, after an avis
      d'intention of 2015-11-02 prorogé 2016-11-03; conservation categories 2 (extérieur supérieur)
      and 8 (terrain supérieur); situated inside an aire de protection; transfert de responsabilité
      to Montréal registered 2017-09-21, effective 2018-09-21. It covers La Maison-Alcan — the
      maison Lord-Atholstan, the maison Béique, the hôtel Berkeley, the maison Holland and the
      maison Klinkhoff, built 1872–1928 on rue Sherbrooke Ouest, with the 1981–83 édifice Davis and
      its atrium behind — and the former Emmanuel Congregational church of 1906. Six blocks of the
      Mille carré doré, and the only ensemble in it with a protection of its own.
    year: 2017
    url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&id=204071&type=bien
  - kind: advisory
    title: >-
      Conseil du patrimoine de Montréal — the municipal advisory body consulted on interventions in
      protected territory. Recorded as an instrument bearing on this borough; no opinion of it is
      encoded here.
    year: null
    url: null
