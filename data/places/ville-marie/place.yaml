  title: >-
    RPCQ id 93528, site patrimonial de Montréal — valeur architecturale and éléments
    caractéristiques (source: Ministère de la Culture et des Communications du Québec, 2004) —
    with Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005,
    ISBN 2-7647-0467-4)
  year: 2005
  format: sector-characterisation
  note: >-
    No per-type table exists for Ville-Marie, and none is likely to until the plan de conservation
    is produced. The six residential records below are reconstructions. Three of them are lifted
    almost whole from the RPCQ's statement of architectural value and its éléments caractéristiques,
    which for a site fiche is unusually explicit about buildings — it names the roof pitch, the
    masonry, the chimneys and the window type of the French-regime house, the stone and the orders
    of the British-regime classical house, and the mixed timber-iron-and-stone structure of the
    eclectic 19th-century commercial building. The other three are built from the cahier's own
    sector descriptions. Every column the sources do not fill is null and every record says which.
