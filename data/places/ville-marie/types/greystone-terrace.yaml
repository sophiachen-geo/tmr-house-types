blurb_en: >-
  The middle-class counterpart to the mansion, and the form this project has already recorded in
  Westmount: contiguous single-family houses in series, two and a half storeys, stone — sometimes
  brick — on the principal façade, mostly Second Empire in inspiration, built between 1870 and 1910
  on the streets around the Shaughnessy villas and between 1875 and 1900 in Milton Park north of
  Sherbrooke. Many were later subdivided into two dwellings or more, which is why so much of this
  stock now reads as plex without ever having been built as one.
origin_en: >-
  Two halves of one form, on either side of a borough boundary that did not exist when it was built.
  South of Sherbrooke, the Village Shaughnessy: John Ostell's 1842 master plan turned development
  north-west, rues Chomedey and Lambert-Closse were cut about 1880, and between 1870 and 1910 the
  streets around the surviving villas filled with row houses for the middle class, with good maisons
  de rapport of the 1920s among them. North of Sherbrooke, Milton Park, which the Plateau cahier
  reads as the same building repeated — the contiguous one- or two-family house in grey stone or red
  sandstone, 1875–1900, later subdivided. The two halves went in opposite directions after 1945.
  Shaughnessy Village lost its villas one by one and was renamed a quartier; Milton Park was bought
  up by a single developer, threatened with total demolition, and bought back by its residents. See
  the notes at the foot of this page.
