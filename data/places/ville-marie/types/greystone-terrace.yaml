profile:
  siting_landscape:
  - Contiguous, in series, on the streets around the villas rather than on the villa streets
    themselves — the cahier is explicit that these were built for the middle class, on the streets
    neighbouring the Shaughnessy villas.
  - Very dense fabric in the Village Lincoln, where the cahier says it is the terraces and the
    individual heritage houses together that make the sector exceptional.
  massing:
  - Two and a half storeys.
  articulation:
  - Not stated for the Village Shaughnessy terraces beyond their Second Empire inspiration.
  - In the Milton Park half the Plateau cahier records decoration that is often elaborate, and
    Héritage Montréal describes great architectural diversity, with large single-family Victorian
    houses standing cheek by jowl with duplexes, triplexes and apartment houses.
  openings:
  - Not stated by any of the three sources.
  materials:
  - Stone, or sometimes brick, on the principal façade.
  - In Milton Park, grey stone or red sandstone.
profile_fr:
  description:
  - >-
    « Entre 1870 et 1910, de nombreuses maisons unifamiliales en rangée destinées à la classe
    moyenne ont été construites sur les rues avoisinantes; ce sont généralement des maisons de deux
    étages et demi, avec revêtement de pierre ou parfois de brique sur la façade principale. La
    plupart d’entre elles sont d’inspiration Second Empire. On retrouve aussi dans le secteur de
    bons exemples de maisons de rapport érigées dans les années 1920. »
  - >-
    « Le type architectural dominant est le bâtiment uni- ou bifamilial contigu en pierre grise ou
    en grès rouge au décor souvent élaboré, construit entre 1875 et 1900 et subdivisé ultérieurement
    en deux logements ou plus. »
profile_note: >-
  Roof form and pitch, roofing, window proportion, articulation, lot width, setbacks and green front
  yard are null because none of the three sources states them. The « inspiration Second Empire » the
  cahier records for the Village Shaughnessy terraces is a style attribution, not a statement about
  roof form, and it has not been converted into one here. One further thing this record makes
  visible: two of its three sectors are in Ville-Marie and the third, Milton Park, is not — it is
  25.E.12 in the Plateau-Mont-Royal cahier, north of rue Sherbrooke. The form runs across the
  boundary; the documents stop at it. The same form is recorded on this site in Westmount, and the
  cross-link on the canonical page is the useful one.
