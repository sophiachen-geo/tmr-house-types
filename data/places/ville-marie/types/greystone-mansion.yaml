blurb_en: >-
  The richest domestic architecture on the island of Montréal, and the least protected. A
  freestanding house of two and a half or three storeys standing in its own garden with its own
  outbuildings, on the slope between Sherbrooke and the mountain, built between about 1860 and 1935
  in whichever revival was current — Italianate, Second Empire, Romanesque, Queen Anne, Beaux-Arts.
  The Ville grades the two sectors that hold them exceptionnelle. Neither carries an ensemble
  designation, and the columns below are empty because no document describes these houses as a type.
origin_en: >-
  The cahier's historical chapter puts it plainly: the north-west of the quartier Saint-Antoine,
  part of it running up the flank of the mountain, went on attracting the great Montréal
  bourgeoisie, which in the wake of the McTavishes and the McGills had sumptuous residences built by
  well-known architects — <em>« On y compte les Allan, les Van Horne, les Forget »</em> — and the
  sector would later be called the Square Mile. Héritage Montréal dates the golden age 1840–1930 and
  the buildings principally 1850–1930, and describes a commercial aristocracy that controlled
  two-thirds of the country's wealth. After the 1929 crash the families moved west to Westmount and
  the Town of Mount Royal, apartment and office buildings were put up in their gardens, and the
  quarter went, in Héritage Montréal's phrase, from golden age to urban decay in fifty years.
  Attrition, as English Wikipedia states it citing Rémillard and Merrett's <em>Mansions of the
  Golden Square Mile</em> (1987): <em>"By 1983, only 30% of the mansions in the northern half of the
  Square Mile had survived demolition; and only 5% survived south of Sherbrooke Street."</em>
  Héritage Montréal's own page carries a more cautious version — <em>"Only about 30% of the
  bourgeois homes survived, north of Sherbrooke Street"</em> — with neither the year nor the 5%.
  Whichever figure is right, the surviving stock is a remnant, and Héritage Montréal states that the
  ensemble <em>"does not have a designation or specific strategy to protect and promote its heritage
  over current urban development considerations"</em>.
