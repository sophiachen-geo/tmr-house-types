profile:
  siting_landscape:
  - Freestanding, often surrounded by gardens and outbuildings, on the south flank of the mountain.
  - The cahier values the sector as much for what the houses leave open as for the houses — « le
    dégagement qu'elle assure à la montagne ».
  - Only the part north of avenue du Docteur-Penfield falls inside the site patrimonial du
    Mont-Royal; sector 24.E.30, south of Sherbrooke, is explicitly outside it.
  massing:
  - Not stated for this sector. The neighbouring croissant Redpath, 24.E.28, is described as mostly
    three storeys under a two-slope roof — that is the cahier's figure for that sector, not for this
    one.
  articulation:
  - Not stated. The cahier calls the sector remarkable for « la qualité architecturale des bâtiments
    qui le composent » without describing that architecture.
  openings:
  - Not stated.
  materials:
  - Not stated for the sector. The cahier's neighbouring fiche 24.E.28 gives clay brick or stone for
    the Redpath crescent, and the site as a whole is characterised by grey limestone to 1850 and a
    wide variety of stone types after it.
profile_fr:
  description:
  - >-
    « Compris dans l’arrondissement historique et naturel du mont Royal, ce secteur résidentiel est
    urbanisé entre 1860 et 1935. C’est un quartier de résidences bourgeoises souvent entourées de
    jardins et de dépendances. »
  - >-
    « On y retrouve un grand nombre de demeures bourgeoises exceptionnelles, dont certaines sont
    classées monuments historiques. On y voit notamment des résidences unifamiliales isolées, de
    luxueuses maisons en rangée et de riches immeubles de logements. »
  - >-
    « Certaines des villas sont aujourd’hui occupées par des bureaux, ambassades, consulats et
    délégations commerciales. Cette zone est caractérisée par la présence de bâtiments d’influence
    française et anglaise. »
profile_note: >-
  Storeys, roof, openings, articulation, materials, lot width, setbacks and green front yard are all
  null, and the reason is the point of this record. Ville-Marie's own heritage document grades the
  Mille carré doré exceptionnelle and then describes it in six sentences, none of which describes a
  building: it gives the dates, the siting in gardens, the present institutional uses and the view
  of the mountain. There is no per-type table, no inventory fiche and no plan de conservation for
  this quarter, because it has no ensemble protection to generate one. The richest domestic
  architecture on the island is also the worst documented at type level of anything on this site,
  and the empty cells below are that fact rendered as data. Style list is the range of currents the
  named examples carry, attributed building by building in the list of buildings, not a
  characterisation either source makes of the sector.
