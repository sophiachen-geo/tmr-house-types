profile:
  siting_landscape:
  - Built to the street line inside the walled town, on the narrow lots of Dollier de Casson's 1672
    tracé; the RPCQ's characteristic elements list the alignment of buildings on the public way, the
    high density of ground occupation and party-wall construction as the site's defining relation.
  - Interior courts and courettes in some sectors, reached from the street.
  - The surviving concentration is in sector 24.E.45, the quartier Bonsecours, which the cahier says
    is the one part of Vieux-Montréal that kept its residential vocation after 1850.
  massing:
  - Generally low — one or two storeys.
  - Two-slope or hipped roof of medium pitch.
  - Chimneys carried up in the plane of the gable walls, and firebreak walls between houses.
  articulation:
  - Not stated by either source beyond the masonry itself. The RPCQ describes this family in one
    sentence and does not treat its ornament.
  openings:
  - Wooden casement windows with small panes.
  materials:
  - Rubble masonry of roughly squared stone.
  - Grey limestone predominates in the site as a whole until 1850, after which a wide variety of
    stone types appears.
profile_fr:
  elements_caracteristiques:
  - >-
    « La présence de bâtiments du Régime français présentant des structures généralement basses (un
    ou deux étages), des toitures à deux versants ou à croupes de pente moyenne, des murs de
    moellons grossièrement équarris, des cheminées dans la continuité des murs pignons, des murs
    coupe-feu et des fenêtres en bois à battants et à petits carreaux. »
  - >-
    « L’utilisation de matériaux traditionnels marquée par une prédominance de la pierre calcaire
    grise jusqu’en 1850, puis par une grande variété de types de pierre. »
  description:
  - >-
    « Les immeubles les plus anciens - habitations et édifices conventuels - qui datent de l’époque
    de la Nouvelle-France présentent une maçonnerie en pierre et des toits à pignon. »
profile_note: >-
  Roof pitch in degrees, roofing material, window proportion, lot width, setbacks and green front
  yard are all null because neither source states them. The RPCQ gives the roof only as « de pente
  moyenne » and the windows only as « à battants et à petits carreaux », with no dimension attached
  to either; the 2005 cahier characterises sectors, not buildings, and prints no dimensional table
  at all. There is no per-type document for Ville-Marie, and there will not be one until the plan de
  conservation for the site patrimonial is produced — this record is a reconstruction from a site
  fiche's statement of value, and its five columns carry only what that fiche and the cahier say.
