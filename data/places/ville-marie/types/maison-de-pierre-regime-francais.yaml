blurb_en: >-
  The oldest domestic form on this site and the one that recurs in six places: low walls of roughly
  squared rubble, a two-slope or hipped roof of medium pitch, chimneys rising in the plane of the
  gable walls, firebreak walls between neighbours, and small-paned wooden casements. In
  Vieux-Montréal it is an urban house — built to the street line, party-walled, on a narrow lot —
  rather than the freestanding rural house of the Île d'Orléans or the côtes.
origin_en: >-
  Ville-Marie was founded in 1642 as a missionary settlement and became the bridgehead of the fur
  trade. The Sulpicians became seigneurs of the island in 1663, and their superior François Dollier
  de Casson traced the first streets in 1672 with the notary-surveyor Bénigne Basset Des Lauriers:
  three streets parallel to the river and seven perpendicular to it. Between 1685 and 1800 the town
  was walled, and the wall fixed its form. The intendants' ordonnances then fixed the relation
  between street and building, including the alignment of construction; stone became the preferred
  material for new building, which is why so little of the wooden town survives. The form is the
  same one recorded on this site at Île d'Orléans, Charlesbourg, Québec, Terrebonne and Lachine —
  the same walls, the same roof, the same chimneys — with the difference that here it is packed
  against its neighbours.
