blurb_en: >-
  What the British regime built when the walls came down: cut grey limestone, a symmetrical street
  front, an order recalled rather than reproduced, a pediment, quoined angles. The RPCQ treats it as
  the most numerous family in the site — « la forte proportion de bâtiments du Régime britannique
  d'inspiration classique » — and, because a site fiche describes a landscape rather than a house,
  it describes the family entirely in terms of the façade.
origin_en: >-
  From 1800 Montréal became the principal city of the two Canadas. The political upheavals of the
  18th century, the Conquest and American independence among them, drove population growth and
  immigration, and dynamic import-export merchants replaced the magnates of the fur trade. The
  RPCQ's account of the change is architectural in one line: <em>« Les maisons en bois des artisans
  font place aux résidences et édifices en pierre d'inspiration néoclassique. »</em> The
  fortifications were demolished between 1801 and 1817 and three commissioners were appointed to
  plan the freed ground; their terrace along the river, enlarged Champ-de-Mars and wider streets are
  still the frame of the quarter. Grey limestone stayed the predominant material until 1850. The
  two great fires of 9 and 10 July 1852, which destroyed some 1 200 dwellings and left about 10 000
  people homeless, ended wooden construction in the city outright and made stone the rule rather
  than the preference.
