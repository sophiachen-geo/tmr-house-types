profile:
  siting_landscape:
  - Built on the public alignment, at high density, party-walled, like everything else inside the
    old town; the RPCQ lists the setting-back of certain administrative and public buildings as the
    exception that proves it.
  - The Plan des commissaires of 1804 gave the quarter a terrace along the river, an enlarged
    Champ-de-Mars and wider streets, and the three principal arteries bounding the site — rues de la
    Commune, Saint-Antoine and McGill — descend from it.
  massing:
  - Not stated. The RPCQ says only that the site's gauges are heterogeneous and very variable,
    particularly in height.
  articulation:
  - Symmetrical composition of the façade.
  - The classical orders recalled — Doric, Ionic, Corinthian.
  - Pediments and quoined angles.
  openings:
  - Not stated by either source for this family.
  - The RPCQ does record, as a characteristic of the site, the relation between lot and street
    "manifested by steps, carriage doors, railings, rights of way and several entrances — one on
    each façade giving on the street".
  materials:
  - Cut stone (pierre de taille).
  - Grey limestone predominant until 1850, then a wide variety of stone types.
profile_fr:
  elements_caracteristiques:
  - >-
    « La forte proportion de bâtiments du Régime britannique d’inspiration classique se distinguant
    par l’emploi de la pierre de taille, la composition symétrique des façades, le rappel des ordres
    classiques (dorique, ionique, corinthien), les frontons et les chaînages d’angle. »
  - >-
    « L’utilisation de matériaux traditionnels marquée par une prédominance de la pierre calcaire
    grise jusqu’en 1850, puis par une grande variété de types de pierre. »
  - >-
    « La relation entre le lot et la rue se manifestant par la présence de marches, de portes
    cochères, de grilles, de servitudes de passage et de plusieurs entrées, à savoir une sur chaque
    façade donnant sur la rue. »
  description:
  - >-
    « Les nombreux édifices d’inspiration classique du Régime britannique sont caractérisés, entre
    autres, par la pierre calcaire grise. »
profile_note: >-
  Storeys, roof form and pitch, roofing, window proportion, lot width, setbacks and green front yard
  are null because neither source states them. The RPCQ's sentence on this family is a sentence
  about façades — stone, symmetry, orders, pediments, quoins — and says nothing about section or
  roof; the site's massing it describes only as heterogeneous. Tenure plan is given as row because
  the RPCQ's characteristic elements record party-wall construction and alignment on the street as
  general to the site, not because either source classes this family by plan. This is a
  reconstruction from a site fiche, not a type record from a typology document.
