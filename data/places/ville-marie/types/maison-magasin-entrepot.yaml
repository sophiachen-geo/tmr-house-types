blurb_en: >-
  The building that made the port quarter and then, a century later, repopulated it. A mixed
  structure of timber, cast iron and stone; wide bays; a flat roof; a thick, projecting, often very
  ornamented cornice; red brick. In the runs between rue de la Commune and rue Saint-Paul it is
  frankly two-faced — sober where the goods came in, elaborate where they were sold. From the 1970s
  these are the buildings that were recycled into dwellings, which is how a quarter with a few
  hundred residents in the 1950s came to hold several thousand.
origin_en: >-
  Montréal became the undisputed metropolis of Canada in the second half of the 19th century, at the
  centre of a road, maritime and transcontinental rail network, and the old town turned into a
  financial and administrative city — the shop window of Canadian capitalism, in the RPCQ's phrase.
  Offices, banks, insurance head offices, warehouses and courthouses went up with great stylistic
  eclecticism. Then the fall: after 1945 Montréal lost the metropolitan role to Toronto, the economic
  centre moved north-west, and by the 1950s, the cahier records, retail had practically vanished
  from the old town and its residents numbered only a few hundred. Serious proposals for an
  expressway through Vieux-Montréal followed, and the protests against them led to the Québec
  government decreeing the quarter an arrondissement historique in 1964. Survival then meant new
  uses for empty floors, and the cahier states the mechanism plainly: <em>« On y a recyclé plusieurs
  de ces bâtiments en condos, dont le premier exemple est celui des Cours Le Royer, posant ainsi le
  premier jalon d'un repeuplement du Vieux-Montréal. »</em> The loft conversions of rue Saint-Paul
  and the faubourg des Récollets follow the same line.
