profile:
  siting_landscape:
  - Built to the street line in a continuous run, party-walled, on the blocks between rue de la
    Commune and rue Saint-Paul and along rues des Récollets, Sainte-Hélène, Saint-Pierre and
    Le Moyne.
  - 'Two-faced by design where the block runs through: the cahier records a relatively plain
    elevation on the goods-handling side and a far more elaborate one on the commercial side, on
    rue Saint-Paul.'
  massing:
  - Flat roof.
  - Thick, projecting and often very ornamented cornice.
  articulation:
  - Heavy projecting cornice as the crowning element.
  - Ornament concentrated on the commercial elevation; showrooms for retail selling behind the
    ground-floor bays in the sector of the Bourses.
  openings:
  - Wide bays (« larges baies »).
  materials:
  - Mixed structure of timber, cast iron and stone.
  - Red brick.
  - Grey limestone on the older runs, in a site where grey limestone predominates until 1850 and a
    wide variety of stone types after it.
profile_fr:
  elements_caracteristiques:
  - >-
    « L’empreinte de l’architecture éclectique du XIXe siècle, visible notamment dans les bâtiments
    commerciaux, industriels, institutionnels et les édifices à bureaux, reconnaissables à leur
    structure mixte de bois, de fonte et de pierres, leurs larges baies, leur toit plat, leur
    corniche épaisse, débordante et souvent très ornementée et l’emploi de la brique rouge. »
  traitement_des_facades:
  - >-
    « Plusieurs de ces bâtiments ont une façade relativement sobre du côté où se fait la
    manutention des marchandises, tandis que la facture architecturale est plus élaborée du côté
    commercial, sur la rue Saint-Paul. »
profile_note: >-
  Storeys, roof pitch, roofing, window proportion, lot width, setbacks and green front yard are null
  because neither source states them. Note also what the two sources are doing: the RPCQ describes
  this as a commercial, industrial and institutional family — « les bâtiments commerciaux,
  industriels, institutionnels et les édifices à bureaux » — and the residential content of the type
  is a fact of its second life, not of its first. It is carried on a residential site because the
  conversion of these buildings to dwellings is what repopulated Vieux-Montréal, and because the
  cahier says so. Tenure plan is recorded as mixed for the same reason.
