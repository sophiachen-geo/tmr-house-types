blurb_en: >-
  The eastern alternative to the ruelle, and the one detail in this borough that exists nowhere else
  on this site. Where the blocks around the Molson brewery, the Canadian Rubber and the MacDonald
  Tobacco works were cut into small lots with no service lane behind them, the only way to the back
  of the lot is through the building — so a full-height carriage gate is driven through the street
  front. Behind it are houses standing at the back of the yard and the coal and wood store. Two or
  three storeys, brick, vertical windows, elaborate cornices; the front setback is decided by
  nothing more than whether the stair to the upper dwellings is inside or out.
origin_en: >-
  The cahier gives the mechanism in the middle of its historical chapter, describing the dense
  population that gathered round the Molson brewery — in the quarter since the 18th century — the
  Canadian Rubber and the MacDonald Tobacco works: <em>« Les quartiers qui entourent ces usines se
  composent de petits lots, et les quadrilatères (îlots) sont sans ruelle. Dans ce type de
  lotissement, c'est la porte cochère, toujours visible dans ce secteur, qui donne accès aux maisons
  en fond de cour ainsi qu'à l'entreposage de combustibles. »</em> Set that against the Sud-Ouest,
  where Montréal's regulation of residential construction from about 1880 produced blocks with
  ruelles first in an « I » and then in an « H », and where the same regulation pushed the stair to
  the upper dwellings out of the building and into the front yard. Two solutions to one problem — how
  to reach the back of a deep, narrow lot — separated by a generation of by-laws and four kilometres
  of city. The carriage gate is the older answer, and Centre-Sud is where it survives; the RPCQ lists
  it among the characteristic elements of the declared site as well.
