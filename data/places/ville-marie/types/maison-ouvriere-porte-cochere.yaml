profile:
  siting_landscape:
  - 'Small lots on blocks laid out without a ruelle, which is the whole of the type''s logic: with
    no service lane, access to the rear of the lot has to be taken through the building.'
  - The carriage gate gives on to houses standing at the back of the yard and to fuel storage.
  - Deep lots, in 24.I.6 and 24.I.9, with rear-yard annexes since demolished; front yards where the
    ground floor stands clear of the ground.
  - The quarters that grew round the Molson brewery, the Canadian Rubber and the MacDonald Tobacco
    works.
  massing:
  - Two or three storeys.
  - Fine cornices, and in 24.I.5 false cornices.
  articulation:
  - Elaborate cornices, carriage gates and exterior stairs, in the cahier's own list for 24.I.6.
  - Elaborate crownings, slate roofs and dormers with worked joinery on the brick and grey-stone
    ensembles near rue Ontario (24.I.4).
  openings:
  - Vertical windows.
  - The carriage gate itself — a full-height arched opening in the street front, still visible
    throughout the sector.
  - 'Access to the ground floor fixes the front setback: none where the access is internal, set back
    where a stair on the façade has to be accommodated (24.I.4).'
  materials:
  - Brick as the principal facing.
  - Grey stone or brick on the finer ensembles.
profile_fr:
  description:
  - >-
    « Les quartiers qui entourent ces usines se composent de petits lots, et les quadrilatères
    (îlots) sont sans ruelle. Dans ce type de lotissement, c’est la porte cochère, toujours visible
    dans ce secteur, qui donne accès aux maisons en fond de cour ainsi qu’à l’entreposage de
    combustibles. »
  - >-
    « Construit essentiellement sur le lotissement ancien, sans ruelle, mais pourvu de terrains très
    profonds, le cadre bâti offre une gamme de typologies d’habitation. […] La brique est le
    parement principal et la porte cochère est à l’honneur. »
  elements_caracteristiques:
  - >-
    « La relation entre le lot et la rue se manifestant par la présence de marches, de portes
    cochères, de grilles, de servitudes de passage et de plusieurs entrées, à savoir une sur chaque
    façade donnant sur la rue. »
  ouvertures:
  - >-
    « L’accès au rez-de-chaussée fixe la marge avant : nulle si l’accès se fait de l’intérieur, ou
    en recul pour accommoder un escalier en façade. »
profile_note: >-
  Roof form and pitch, roofing, lot width, setbacks and green front yard are null because the cahier
  states none of them. Roof form in particular is left empty on purpose: the I-sector fiches
  describe crownings and cornices rather than roofs, 24.I.4 records slate roofs with dormers on the
  finer ensembles, and 24.I.9 records a few surviving faubourg houses « avec toit à pignon » — three
  different roofs in one family, and no source that says which is the type's. The canonical form is
  given as the flat-roofed faubourg house because that is what the cornice-and-crowning descriptions
  imply, and it is the one inference in this record; it is flagged here rather than buried. No
  count, no dimension and no dated example is published for this type anywhere in the cahier.
