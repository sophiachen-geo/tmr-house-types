- id: 24-i-9-le-secteur-plessis-et-logan
  code: 24.I.9
  name_fr: 'Le secteur Plessis et Logan'
  value: interesting
  summary_en: >-
    At the heart of the « terrasses Ontario », a working-class quarter that developed and survived.
    Built essentially on the old lotting, without ruelles but on very deep lots, so the built fabric
    carries a range of dwelling typologies; some industrial buildings still record how close work
    was to home. Brick is the principal facing and the porte cochère is, in the cahier's phrase, à
    l'honneur. A few faubourg houses with gable roofs survive.
  summary_fr: >-
    « Construit essentiellement sur le lotissement ancien, sans ruelle, mais pourvu de terrains très
    profonds, le cadre bâti offre une gamme de typologies d’habitation. […] La brique est le
    parement principal et la porte cochère est à l’honneur. »
  streets: [rue Plessis, rue Logan]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 B'

- id: 24-i-10-le-secteur-de-la-visitation-et-ontario
  code: 24.I.10
  name_fr: 'Le secteur de la Visitation et Ontario'
  value: interesting
  summary_en: >-
    Between rue Ontario and rue Sherbrooke, on the slope, streets lined with triplexes with exterior
    stairs and balconies — brick, ornamented, vertical windows — which the cahier calls the ordinary
    production of the beginning of the century. It singles out the residential ensemble at 2082–2116
    rue de la Visitation and neighbouring groups on rues Beaudry, de la Visitation and Panet.
  summary_fr: >-
    « Construits en brique, avec ornementation et fenêtres verticales, ces immeubles représentent la
    production courante du début du siècle. »
  streets: [rue de la Visitation, rue Beaudry, rue Panet]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 B'

- id: 24-i-11-la-rue-ontario-de-saint-hubert-a-de-lorimier
  code: 24.I.11
  name_fr: 'La rue Ontario (de Saint-Hubert à De Lorimier)'
  value: interesting
  summary_en: >-
    QUARTIER FEATURE — CENTRE-SUD. At the heart of the « terrasses Ontario », the commercial and
    civic street that structures the life of the quarter, punctuated by institutions: the marché
    Saint-Jacques, the fire station at the corner of rue Beaudry, the église Sacré-Cœur (1876, then
    1886–87), the église Sainte-Marguerite-Marie (1921–25), and set back from the street the école
    Plessis and the Bain Généreux. The commercial function has kept a good continuity of commercial
    buildings with dwellings above; the architecture varies in height, storeys, crowning and
    materials. East of the Jacques-Cartier bridge the fabric is more broken up but still carries
    fine residential ensembles. Centre-Sud / Sainte-Marie as a quarter is not a sector: it is spread
    across most of the 24.I series, from 24.I.1 to 24.I.19, plus the eastern E sectors.
  summary_fr: >-
    « Au cœur des « terrasses Ontario », cette rue commerciale et civique structure la vie du
    quartier. […] La fonction commerciale a maintenu une bonne continuité d’immeubles commerciaux
    avec fonction résidentielle aux étages. L’architecture des bâtiments est variée, tant par la
    hauteur, le nombre d’étages et le choix des couronnements ou des matériaux. »
  streets: [rue Ontario Est, rue Beaudry, rue Montcalm, avenue De Lorimier]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 B'

- id: 24-i-12-le-secteur-de-bordeaux-et-de-rouen
  code: 24.I.12
  name_fr: 'Le secteur de Bordeaux et de Rouen'
  value: interesting
  summary_en: >-
    Between rues Ontario and Sherbrooke, on the slope: another very homogeneous ensemble of the
    beginning of the century, brick, two or three storeys, with exterior stairs on the front yard,
    housing the workers of the neighbouring factories and shops.
  summary_fr: >-
    « Les bâtiments sont en brique et ont une hauteur de deux ou trois étages, avec des escaliers
    extérieurs sur la cour avant. Ces immeubles logent les ouvriers qui œuvrent dans les usines et
    commerces avoisinants. »
  streets: [rue de Bordeaux, rue de Rouen]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 B'

