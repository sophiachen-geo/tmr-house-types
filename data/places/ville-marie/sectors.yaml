- id: milton-park-mont-sainte-famille-plateau
  code: 25.E.12
  name_fr: 'Mont Sainte-Famille — le quartier Milton Park (arrondissement du Plateau-Mont-Royal)'
  value: exceptional
  summary_en: >-
    QUARTIER FEATURE — MILTON-PARC. NOT A SECTOR OF VILLE-MARIE. This row is a cross-boundary
    pointer and it is the only one in the table: Milton Park lies north of rue Sherbrooke and is
    therefore in Le Plateau-Mont-Royal, whose own 2005 cahier codes it 25.E.12 Mont Sainte-Famille.
    It is carried here because the borough's own southern sector, 24.E.21, stops at Sherbrooke and
    because the greystone terrace type on this page is one form running across the line — and
    because 25 is the number the 2016 Plan d'urbanisme gives to Ville-Marie. The Plateau cahier
    describes Milton Park between avenue des Pins and rue Sherbrooke as having gone through many
    still-legible building campaigns, now mostly residential, with one dominant architectural type:
    the contiguous one- or two-family building in grey stone or red sandstone, often elaborately
    decorated, built between 1875 and 1900 and later subdivided into two or more dwellings, the
    series on rues Prince-Arthur, Hutchison, Jeanne-Mance, Sainte-Famille and avenue du Parc being
    the important thing about it. Héritage Montréal describes the same fabric as great architectural
    diversity — large single-family Victorian homes cheek-by-jowl with duplexes, triplexes and
    apartment houses — and bounds the neighbourhood by University and Sherbrooke streets, boulevard
    Saint-Laurent and avenue des Pins. It is the counter-model to the Van Horne demolition and it is
    set out in the notes at the foot of this page.
  summary_fr: >-
    « Le type architectural dominant est le bâtiment uni- ou bifamilial contigu en pierre grise ou
    en grès rouge au décor souvent élaboré, construit entre 1875 et 1900 et subdivisé ultérieurement
    en deux logements ou plus. L’effet d’ensemble de plusieurs séries de maisons de grand intérêt
    architectural – rues Prince-Arthur, Hutchison, Jeanne-Mance, Sainte-Famille et avenue du Parc –
    est une caractéristique importante de ce secteur. »
  streets: [rue Prince-Arthur, rue Hutchison, rue Jeanne-Mance, rue Sainte-Famille, avenue du Parc]
  note: >-
    The brief for this part lists Milton-Parc among the quartiers Ville-Marie holds. It does not.
    The Plateau-Mont-Royal cahier (file 11) prints 25.E.12 beside this quarter's name and puts
    Milton Park inside its own sector, which the fiche says runs « entre l’avenue des Pins et la rue
    Sherbrooke ». The tally at the head of this table therefore counts 89 rows: 87 cahier sectors of
    this arrondissement, one provincial declaration lying across twelve of them, and this one, which
    belongs to the borough next door and is counted with the exceptionnels because that is its grade
    in the Plateau's cahier.
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement du Plateau-Mont-Royal (2005), section 3.2.2 A, sector 25.E.12; with Héritage Montréal, Memento, « Milton Parc Neighbourhood »'
