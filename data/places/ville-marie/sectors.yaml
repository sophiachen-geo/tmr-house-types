- id: 24-e-7-le-village-lincoln
  code: 24.E.7
  name_fr: 'Le Village Lincoln'
  value: exceptional
  summary_en: >-
    The sector whose row houses this page uses to illustrate the greystone terrace. John Ostell's
    1842 master plan turned development north-west and let rues Sainte-Catherine and Sherbrooke be
    extended; rues Chomedey and Lambert-Closse were cut about 1880 and most lots built between 1890
    and 1929. The cahier names six remarkable row houses at 1419–1441 rue Pierce, built in 1889–1890
    by the architect Robert Findlay — also known as the maisons en rangée William D. Stroud,
    restored in 1997.
  summary_fr: >-
    « Bien que le territoire soit très dense, la présence de plusieurs maisons d’intérêt patrimonial
    ainsi que de belles rangées de maisons traditionnelles rendent le secteur exceptionnel. »
  streets: [rue Pierce, rue Chomedey, rue Lambert-Closse, boulevard De Maisonneuve Ouest]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-8-la-rue-sainte-catherine-entre-guy-et-atwater
  code: 24.E.8
  name_fr: 'La rue Sainte-Catherine entre Guy et Atwater'
  value: exceptional
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-9-le-village-shaughnessy
  code: 24.E.9
  name_fr: 'Le Village Shaughnessy'
  value: exceptional
  summary_en: >-
    QUARTIER FEATURE — VILLAGE SHAUGHNESSY. A residential quarter, the cahier says, apart from the
    Montreal Children's Hospital of 1912 at its west end and the Canadian Centre for Architecture. A
    few large bourgeois villas went up on what was then rue Dorchester in the 19th century, of which
    the maison Shaughnessy — carefully restored and incorporated into the CCA complex towards the
    end of the 1980s — is the survivor. Between 1870 and 1910 the surrounding streets filled with
    middle-class single-family row houses, and the cahier's description of them is the closest thing
    this borough has to a type record: two and a half storeys, stone or sometimes brick on the
    principal façade, mostly Second Empire in inspiration, with good maisons de rapport of the 1920s
    among them. The quarter is marketed today as the « Quartier des Grands Jardins ».
  summary_fr: >-
    « Entre 1870 et 1910, de nombreuses maisons unifamiliales en rangée destinées à la classe
    moyenne ont été construites sur les rues avoisinantes; ce sont généralement des maisons de deux
    étages et demi, avec revêtement de pierre ou parfois de brique sur la façade principale. La
    plupart d’entre elles sont d’inspiration Second Empire. On retrouve aussi dans le secteur de
    bons exemples de maisons de rapport érigées dans les années 1920. »
  streets: [rue Baile, rue du Fort, rue Seymour, boulevard René-Lévesque Ouest]
  note: >-
    Protection: none at ensemble scale. The maison Shaughnessy itself was classed in November 1973,
    two months after the Van Horne demolition, and the CCA was built around it; the terraces that
    make the quarter are covered only by the borough's PIIA. The renaming to « Quartier des Grands
    Jardins » is the Ville's programme de particularisation, not a heritage status.
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-10-le-couvent-des-s-urs-grises
  code: 24.E.10
  name_fr: 'Le Couvent des Sœurs Grises'
  value: exceptional
  summary_en: >-
    One of the great conventual ensembles of Montréal: the couvent des Sœurs Grises, the aile
    Saint-Mathieu and the chapelle de l'Invention-de-la-Sainte-Croix, designed by Victor Bourgeau
    and built between 1869 and 1888, with the 1890 bell tower by Perrault et Mesnard. The chapel was
    classed a monument historique in November 1974 and the ensemble declared a site historique in
    January 1976.
  streets: [rue Guy, boulevard René-Lévesque Ouest, rue Saint-Mathieu]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

