- id: 24-e-25-griffintown
  code: 24.E.25
  name_fr: 'Griffintown'
  value: exceptional
  summary_en: >-
    Between rue McGill and the autoroute Bonaventure either side of rue William. Farmland with a few
    wooden houses and artisans' shops until the end of the 18th century; urbanised after the
    fortifications came down between 1804 and 1817 and then densely settled by a working population.
    The maison Abner-Bagg at 682 rue William and the Buchanan and Penn warehouses are the cahier's
    examples of the first half of the 19th century. From the middle of that century industry
    replaced the dwellings, and the CN elevated line of 1933 and the Bonaventure expressway of 1965
    cut the sector off from everything around it.
  streets: [rue William, rue McGill, rue Ottawa]
  note: >-
    The other half of Griffintown is in Le Sud-Ouest, where it is sector 22.E.1's north bank and the
    aire de paysage 5 of the Patri-Arch study. One quarter, two boroughs, two cahiers, two code
    prefixes.
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

