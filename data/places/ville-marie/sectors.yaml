  code: 24.E.33
  name_fr: 'Le Domaine McTavish'
  value: exceptional
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-34-la-rue-sherbrooke-ouest-datwater-a-peel
  code: 24.E.34
  name_fr: 'La rue Sherbrooke Ouest (d’Atwater à Peel)'
  value: exceptional
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-35-la-rue-sherbrooke-ouest-campus-mcgill
  code: 24.E.35
  name_fr: 'La rue Sherbrooke Ouest (campus McGill)'
  value: exceptional
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-36-la-rue-mcgill
  code: 24.E.36
  name_fr: 'La rue McGill'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The straight street cut by the Plan des commissaires when the walls came down at
    the very start of the 1800s, separating the old town from the faubourg next to it; a
    metropolitan artery by the early 20th century, with ten-storey office buildings and the great
    colonnade of the new custom house. The 18th-century fortified town and the successive stages of
    the 19th-century city are both still legible in the built fabric.
  streets: [rue McGill]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-37-la-rue-saint-jacques
  code: 24.E.37
  name_fr: 'La rue Saint-Jacques'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The financial centre of Canada at the start of the 20th century, recorded in its
    banks and office buildings: the neoclassical head office of the Banque de Montréal inaugurated
    in 1847, the more modest but very refined buildings of the 1860s and 1870s such as the Banque
    Molson, the Montreal Star and then Gazette buildings with offices on Saint-Jacques and presses
    on Saint-Antoine, the contemporary Centre de commerce mondial crossed by the ruelle des
    Fortifications, and east of the place d'Armes the La Presse buildings and the French-Canadian
    banking houses of about 1870.
  streets: [rue Saint-Jacques, ruelle des Fortifications]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-38-le-secteur-des-bourses
  code: 24.E.38
  name_fr: 'Le secteur des Bourses'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The exchange district: the Corn Exchange and Merchants' Exchange of the 1860s
    still standing though long out of use, the former Montreal Stock Exchange of 1903–04 and the
    Board of Trade rebuilt at the start of the 20th century after the fire of 1901. On the west
    side, along rues des Récollets, Sainte-Hélène, Saint-Pierre and Le Moyne, mainly
    magasins-entrepôts with showrooms for retail selling. Rebuilding on the Récollets site was so
    intense that almost nothing before 1850 survives; the fabric barely changed after 1873, which is
    why the western part is so homogeneous. One residence of 1812 remains.
  streets: [rue Saint-Sacrement, rue des Récollets, rue Sainte-Hélène, rue Saint-Pierre, rue Le Moyne]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-39-le-c-ur-de-ville-marie-et-louest-de-la-rue-saint-paul
  code: 24.E.39
  name_fr: 'Le cœur de Ville-Marie et l’ouest de la rue Saint-Paul'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The first public square of the town, its commercial centre in the 17th and 18th
    centuries, still legible in the street pattern. On the place Royale stands the Ancienne-Douane
    of 1836–38 by John Ostell, enlarged 1881–82, now joined to the main building of the Musée
    d'archéologie et d'histoire de Montréal, Pointe-à-Callière, by an underground archaeological
    crypt over the city's founding site. On the west side of rue Saint-Paul most buildings are
    commercial and late-19th-century; after a fire in 1901 many were rebuilt at the very start of
    the 20th century and are recognisable by their form and their brick façades.
  streets: [rue Saint-Paul Ouest, place Royale, place D’Youville]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-40-la-pointe-a-calliere-et-la-place-dyouville
  code: 24.E.40
  name_fr: 'La pointe à Callière et la place D’Youville'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The point between the Petite Rivière and the St Lawrence where Maisonneuve's
    colonists settled at the founding of Montréal in 1642. The cahier reads the place D'Youville and
    the pointe à Callière as a concentration of traces of everything Vieux-Montréal has been, from
    the street pattern and the standing fabric to the vestiges, artefacts and commemorative works.
    The Hôpital général of 1693–94 is the second-oldest building in the arrondissement historique
    after the Vieux Séminaire de Saint-Sulpice; warehouses typical of the first half of the 19th
    century record the port's first expansion.
  streets: [place D’Youville, rue Saint-Pierre, rue de la Commune Ouest]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-41-la-place-darmes
  code: 24.E.41
  name_fr: 'La place d’Armes'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The place d'Armes and everything round it, holding buildings from every period
    of the city's history. On the south side the classed site historique and monument historique of
    the Vieux Séminaire de Saint-Sulpice — two distinct buildings, the seminary of 1684–87, the
    oldest building in Vieux-Montréal, and the presbytery of Notre-Dame of 1848–52 — and beside them
    the néogothique basilique Notre-Dame, begun in 1824.
  streets: [place d’Armes, rue Notre-Dame Ouest, rue Saint-Sulpice]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-42-le-secteur-des-magasins-entrepots
  code: 24.E.42
  name_fr: 'Le secteur des magasins-entrepôts'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The magasins-entrepôts, and the sector this page's warehouse type is drawn from.
    The landscape is dominated by large commercial buildings of the 1850s to 1880s; the run between
    rue de la Commune and rue Saint-Paul carries the marks of the port's rapid growth, and several
    of them are deliberately two-faced — a relatively plain elevation on the handling side, a far
    more elaborate one on the commercial side, on rue Saint-Paul. Commercial and residential
    buildings of the first half of the 19th century survive among them.
  summary_fr: >-
    « Plusieurs de ces bâtiments ont une façade relativement sobre du côté où se fait la manutention
    des marchandises, tandis que la facture architecturale est plus élaborée du côté commercial, sur
    la rue Saint-Paul. »
  streets: [rue de la Commune, rue Saint-Paul, rue Notre-Dame]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-43-le-secteur-administratif
  code: 24.E.43
  name_fr: 'Le secteur administratif'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The municipal and judicial centre, monumental buildings from 1850 to the
    present: the hôtel de ville built 1872–78 and rebuilt behind its outer walls in 1922 after a
    fire; across the place Vauquelin the first palais de justice of 1851–57, neoclassical, with its
    1905 annex; the édifice Ernest-Cormier of 1921–26; the annexe de l'hôtel de ville of 1912–13 by
    Marchand et Haskell; and the modern courthouse of 1965–71. The 1672 line of rue Notre-Dame and
    the vestiges of the fortifications on the Champ-de-Mars esplanade are both here, and the line of
    the walls is picked out in the paving at several points in Vieux-Montréal.
  streets: [rue Notre-Dame Est, rue Gosford, Champ-de-Mars, place Vauquelin]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-44-la-place-jacques-cartier
  code: 24.E.44
  name_fr: 'La place Jacques-Cartier'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. Occupied at first by large residences and their gardens, of which the classed
    château Ramezay — built in 1705 for the governor Claude de Ramezay, rebuilt after a fire and
    enlarged fifty years later by the Compagnie des Indes — is the demonstration. The Marché Neuf
    stalls went up in 1808 on the strip between rues Saint-Charles and de la Fabrique, and the
    Nelson column with them; the two streets disappeared and the square took its present name after
    the marché Bonsecours opened in 1847. The buildings round it now are essentially 19th-century
    houses and hotels. The cahier notes that the area around rue Sainte-Thérèse is one of the only
    places where traces of the fur trade can still be found.
  streets: [place Jacques-Cartier, rue Sainte-Thérèse, rue Notre-Dame Est]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-45-le-quartier-bonsecours
  code: 24.E.45
  name_fr: 'Le quartier Bonsecours'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. Largely rebuilt in the 19th century, and the one part of Vieux-Montréal that
    kept its residential vocation after 1850 — which is why the domestic types on this page survive
    here at all. The faubourg Bonsecours began outside the palisades and was later taken inside the
    fortified perimeter. The chapelle Notre-Dame-de-Bon-Secours was built in 1771 and much altered
    afterwards; a few houses of the second half of the 18th century still stand and are the oldest
    evidence of the sector's residential use.
  summary_fr: >-
    « Ce secteur largement reconstruit au XIXe siècle se distingue du reste du Vieux-Montréal par le
    fait qu’il a conservé sa vocation résidentielle, même après 1850. »
  streets: [rue Saint-Paul Est, rue Bonsecours, rue de la Commune Est]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-46-le-faubourg-saint-louis
  code: 24.E.46
  name_fr: 'Le faubourg Saint-Louis'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. A few houses separated from the fortified enceinte by a small pond, under the
    citadel hill that was levelled between 1819 and 1829. The maison Brossard-Gauvin on rue
    Saint-Louis is one of only two surviving examples of the wooden houses built in the faubourgs at
    that period. The other houses of rues Saint-Louis and du Champ-de-Mars are later but give the
    sector its intimate character, and with a few more imposing buildings it reads as a gateway into
    Vieux-Montréal.
  streets: [rue Saint-Louis, rue du Champ-de-Mars]
  note: >-
    The cahier contradicts itself on the maison Brossard-Gauvin: the running text dates it 1750, the
    photograph caption on the same page reads « Maison Brossard-Gauvin (1743-1758), 433-435, rue
    Saint-Louis ». Both are recorded; neither is resolved here.
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-47-le-vieux-port
  code: 24.E.47
  name_fr: 'Le Vieux-Port'
  value: exceptional
  summary_en: >-
    VIEUX-MONTRÉAL. The oldest part of the port, from the entrance of the canal de Lachine to the
    Tour de l'Horloge, recently converted to recreation and tourism and — the cahier says so
    explicitly — included in the arrondissement historique du Vieux-Montréal. Though the port's
    history goes back to the city's origins, its standing fabric is essentially early-19th-century
    and from the great works of the early 20th. First improvements 1830; the seaway deepened to
    sixteen feet in 1853; permanent quays and sheds from about 1881; grain elevators that made
    Montréal one of the six largest ports in the world; decline after the St Lawrence Seaway opened
    in 1959, then landscaping as promenade and green space.
  summary_fr: >-
    « Cette zone récemment transformée à des fins récréotouristiques est incluse dans
    l’arrondissement historique du Vieux-Montréal. »
  streets: [rue de la Commune, quai de l’Horloge, bassin Bonsecours]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-48-lile-sainte-helene
  code: 24.E.48
  name_fr: 'L’île Sainte-Hélène'
  value: exceptional
  summary_en: >-
    Not Vieux-Montréal and not residential, despite sitting next in the sequence: the island held by
    the LeMoyne family, briefly by the French military in 1760 and bought by the British in 1818,
    with the fort of 1820–24 and the powder magazine of 1822 still standing; a park by Frederick G.
    Todd laid out 1936–39; the tour de Lévis built 1936–49; and, from Expo 67, Buckminster Fuller's
    geodesic dome and Calder's Le Stabile. The cahier says of it that the sector « mériterait sans
    contredit le statut de site du patrimoine » — a recommendation, not a status.
  streets: [chemin Tour-de-l’Isle]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-49-lile-notre-dame
  code: 24.E.49
  name_fr: 'L’île Notre-Dame'
  value: exceptional
  summary_en: >-
    Made from nothing between 1963 and 1967 out of fill excavated from the métro and the
    Louis-Hippolyte-Lafontaine bridge-tunnel. It carries the Canada, France and Québec pavilions of
    Expo 67 — the last two renovated as the Casino de Montréal — and the rowing basin built for the
    1976 Olympics.
  streets: [chemin des Îles]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

