- id: 24-e-21-les-rues-jeanne-mance-et-saint-urbain-au-sud-de-sherbrooke
  code: 24.E.21
  name_fr: 'Les rues Jeanne-Mance et Saint-Urbain au sud de Sherbrooke'
  value: exceptional
  summary_en: >-
    The cahier calls this some of the most interesting late-19th-century residential architecture in
    downtown Montréal: the rue Jeanne-Mance houses built 1886–1897, whose façades were classed in
    1975, with further residential ensembles on rues Saint-Urbain and De Bleury. Also here the
    Institut de technologie de Montréal of 1909–10 by Saxe and Archibald, now UQAM's Pavillon des
    Arts, the church of St John the Evangelist (Darling and Thomas, 1877–79) and the Bell building
    by Carmichael (1915–23).
  summary_fr: >-
    « Cette zone comprend quelques-uns des plus intéressants témoins de l’architecture résidentielle
    de la fin du XIXe siècle au centre-ville de Montréal. »
  streets: [rue Jeanne-Mance, rue Saint-Urbain, rue De Bleury]
  note: >-
    The sector stops at rue Sherbrooke — its own name says so. North of Sherbrooke the same fabric
    continues as Milton Park, and that is in another borough and another cahier: see the 25.E.12 row
    below.
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-22-beaver-hall-paper-hill
  code: 24.E.22
  name_fr: 'Beaver Hall, Paper Hill'
  value: exceptional
  summary_en: >-
    Laid out in regular lots from about 1840 around St Patrick's church of 1843–47, and filled with
    contiguous houses and institutions for the Irish Catholic population. At the start of the 20th
    century it became the centre of the Montréal printing trade — hence Paper Hill — and buildings
    of at least five storeys, usually brick-faced, replaced the dwellings: the J.-C. Wilson paper
    works, the Southam building, the Desbarats' Building built for The Gazette, the Unity Building,
    the Read and the Crane.
  streets: [côte du Beaver Hall, boulevard René-Lévesque Ouest]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

