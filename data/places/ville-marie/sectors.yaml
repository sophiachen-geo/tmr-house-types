- id: 24-e-28-le-croissant-redpath
  code: 24.E.28
  name_fr: 'Le Croissant Redpath'
  value: exceptional
  summary_en: >-
    A single building campaign of the 1920s and 1930s inside the arrondissement naturel et
    historique du mont Royal, with great stylistic coherence: large bourgeois residences of English
    inspiration, mostly three storeys under a two-slope roof, faced in clay brick or stone, on a
    cul-de-sac among mature trees, still in residential use.
  streets: [croissant Redpath]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-29-le-mille-carre-dore
  code: 24.E.29
  name_fr: 'Le Mille carré doré'
  value: exceptional
  summary_en: >-
    QUARTIER FEATURE — LE MILLE CARRÉ DORÉ. PROTECTION: NONE AT ENSEMBLE SCALE. This is the richest
    domestic architecture on the island of Montréal and it has no ensemble designation. The cahier
    grades it exceptionnelle and dates its urbanisation 1860–1935; Héritage Montréal dates the
    quarter's golden age 1840–1930 and its buildings principally 1850–1930. The cahier describes a
    residential sector of bourgeois houses often set in gardens with outbuildings, remarkable both
    for the architectural quality of the buildings and for the clearance it gives the mountain,
    holding freestanding single-family residences, luxurious row houses and rich apartment
    buildings, some of the villas now occupied by offices, embassies, consulates and trade
    delegations. Héritage Montréal: the Square Mile heritage ensemble "does not have a designation
    or specific strategy to protect and promote its heritage over current urban development
    considerations, such as urban planning parameters or building standards", and adds that the
    interiors, gardens and ancillary buildings enjoy no recognition at all. Only the part north of
    avenue du Docteur-Penfield falls inside the site patrimonial du Mont-Royal; six blocks of it are
    the classed Complexe-de-La-Maison-Alcan. Attrition, as English Wikipedia states it citing
    Rémillard and Merrett's Mansions of the Golden Square Mile (1987): "By 1983, only 30% of the
    mansions in the northern half of the Square Mile had survived demolition; and only 5% survived
    south of Sherbrooke Street." Héritage Montréal's own page puts it more cautiously — "Only about
    30% of the bourgeois homes survived, north of Sherbrooke Street" — and gives neither the year
    nor the 5%. Risk flag: Héritage Montréal records that McGill plans to close several of the large
    residences it owns here under the Master Plan approved by its Board of Governors in 2019, which
    states that they are no longer suitable for the University's institutional needs.
  summary_fr: >-
    « Compris dans l’arrondissement historique et naturel du mont Royal, ce secteur résidentiel est
    urbanisé entre 1860 et 1935. C’est un quartier de résidences bourgeoises souvent entourées de
    jardins et de dépendances. Il demeure relativement homogène et est particulièrement intéressant
    tant en raison de la qualité architecturale des bâtiments qui le composent que par le dégagement
    qu’il assure à la montagne. On y voit notamment des résidences unifamiliales isolées, de
    luxueuses maisons en rangée et de riches immeubles de logements. »
  streets: [rue Peel, rue Redpath, avenue du Docteur-Penfield, rue Drummond, rue Stanley, avenue des Pins Ouest]
  plan_de_conservation: "protection: none-at-ensemble-scale"
  note: >-
    Rough bounds, as commonly given and not as any instrument defines them, because no instrument
    defines them: boulevard René-Lévesque (formerly Dorchester) south, avenue des Pins north, rue
    University east, rues Guy / chemin de la Côte-des-Neiges west. The one sharpest comparison in
    this project: 2.7 hectares on a point in Pointe-Claire carry a municipal citation, and this does
    not. Designation tracks legibility and local politics, not architectural quality.
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-30-le-mille-carre-dore-sud
  code: 24.E.30
  name_fr: 'Le Mille carré doré Sud'
  value: exceptional
  summary_en: >-
    The southern half of the Mille carré doré, and — the cahier says so itself — outside the
    arrondissement historique et naturel du mont Royal. Slightly less homogeneous than the part
    north of rue Sherbrooke, but with substantially the same characteristics as 24.E.29. This is the
    half where, on Rémillard and Merrett's figures as cited by English Wikipedia, only 5% of the
    mansions survived to 1983. The cahier's own illustration is the maison Slessor of 1890 at 1538
    avenue du Docteur-Penfield.
  summary_fr: >-
    « Ce secteur est constitué de la portion sud du mille carré doré et ne fait pas partie de
    l’arrondissement historique et naturel du mont Royal. Le niveau d’homogénéité est un peu moindre
    qu’au nord de la rue Sherbrooke, mais les caractéristiques générales de la zone sont
    sensiblement les mêmes que celles du secteur 24.E.29. »
  streets: [rue Sherbrooke Ouest, avenue du Docteur-Penfield, rue Stanley, rue Drummond]
  plan_de_conservation: "protection: none-at-ensemble-scale"
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-31-les-impasses
  code: 24.E.31
  name_fr: 'Les Impasses'
  value: exceptional
  summary_en: >-
    Single-family houses built from 1900 to the end of the 1920s on large lots originally cut for
    villas, grouped into ensembles of contiguous two- or three-storey houses around a court or a
    pedestrian way. The cahier reads the arrangement round these impasses and semi-private gardens
    as what gives the street its character, and names avenues Summerhill, de Seaforth and Selkirk
    alongside rues Redpath and Simpson and avenue du Musée.
  streets: [rue Redpath, rue Simpson, avenue du Musée, avenue Summerhill, avenue de Seaforth, avenue Selkirk]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-32-les-terres-redpath-sud
  code: 24.E.32
  name_fr: 'Les terres Redpath sud'
  value: exceptional
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

