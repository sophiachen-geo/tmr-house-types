- id: 24-i-1-rene-levesque-et-hotel-de-ville
  code: 24.I.1
  name_fr: 'René-Lévesque et Hôtel-de-Ville'
  value: interesting
  summary_en: >-
    In the original town outside the walls, around the new Chinese Hospital and on the edge of
    downtown and UQAM: several residential alignments of high quality, with newer residential
    building fitted into the original fabric. Along the René-Lévesque axis, cut through in 1955 to
    ease east–west traffic, a heavier gauge of building shelters the residential quarters behind it
    — mostly three-storey brick buildings with or without a porte cochère. The quarter has few
    ruelles.
  summary_fr: >-
    « Ceux-ci sont principalement constitués d’immeubles de trois étages en brique avec ou sans
    porte cochère. Le quartier compte peu de ruelles. »
  streets: [boulevard René-Lévesque Est, rue de l’Hôtel-de-Ville]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 B'

