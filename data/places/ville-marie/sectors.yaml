- id: 24-i-5-le-square-viger
  code: 24.I.5
  name_fr: 'Le square Viger'
  value: interesting
  summary_en: >-
    Built at the end of the 19th century north of the square Viger along rue Saint-Hubert: fine
    brick houses with false cornices, much altered since. Blocks without ruelles and buildings at
    the street line; those on rue De La Gauchetière have a front yard arranged to let the ground
    floor sit clear of the ground.
  streets: [square Viger, rue Saint-Hubert, rue De La Gauchetière Est]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 B'

- id: 24-i-6-montcalm-et-rene-levesque
  code: 24.I.6
  name_fr: 'Montcalm et René-Lévesque'
  value: interesting
  summary_en: >-
    West of the site historique of Saint-Pierre-Apôtre, a quarter of buildings faced in stone or
    brick with elaborate cornices, portes cochères and exterior stairs, which the cahier says
    recalls the first faubourg quarters. Lotted without ruelles, with rear-yard annexes now
    demolished; deep lots and front yards.
  summary_fr: >-
    « On se retrouve dans un agréable quartier aux bâtiments parés de pierre ou de brique, avec
    corniches élaborées, portes cochères et escaliers extérieurs. […] Le lotissement s’est fait sans
    ruelle et comportait des annexes en fond de cour, aujourd’hui démolies. »
  streets: [rue Montcalm, boulevard René-Lévesque Est]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 B'

