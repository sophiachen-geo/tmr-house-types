# Eighty-nine rows: the 87 sectors the 2005 cahier grades in this arrondissement (67 E + 19 I +
# 1 U), the provincial declaration that lies across twelve of them, and one cross-boundary
# reference row for Milton-Parc, which is not in this borough at all. The names are transcribed from the headings printed inside the cahier (printed
# pp. 42-92) and the codes are read from inside the document, never from the filename: every code
# it prints begins 24. See prose notes for the 24-vs-25 collision.
#
# 67 secteurs de valeur patrimoniale exceptionnelle, 24.E.1-24.E.67 -> value: exceptional
# 19 secteurs de valeur patrimoniale interessante, 24.I.1-24.I.19  -> value: interesting
#  1 ensemble urbain d'interet, 24.U.1                             -> value: urban-ensemble
# The two ensembles industriels d'interet (24.N.1 le secteur du quai Bickerdike, 24.N.2 le secteur
# du port de Montreal) and the six secteurs d'interet archeologique a fort potentiel (24.AP.1-6)
# are NOT rows here: this site's sector vocabulary has no value for an ensemble industriel, and no
# AP fiche was transcribed for this place. Both sets are counted in place.yaml building_counts.
#
# The first row is not a cahier sector. The site patrimonial de Montreal is a provincial
# declaration lying across sectors 24.E.36-24.E.47, and it is recorded as a sector and not as a
# place of its own under the Part 9 promotion rule: see the row's own note.

- id: site-patrimonial-de-montreal
  code: SITE-93528
  name_fr: Site patrimonial de Montréal (Vieux-Montréal)
  value: declared-site

  summary_en: >-
    QUARTIER FEATURE — VIEUX-MONTRÉAL, AND THE PROMOTION RULE'S FIRST NEGATIVE CASE. A provincially
    declared site, not a sector of the cahier: about 1 400 m east–west by 800 m north–south, roughly
    one square kilometre, holding 557 édifices et vestiges built between the 17th and the 20th
    century, bounded by rue Saint-Antoine north, the fleuve Saint-Laurent south, the faubourg Québec
    with rues Saint-Hubert and Saint-André east and the faubourg des Récollets with rues McGill, De
    Longueuil and des Sœurs-Grises west, taking in the pointe à Callière sector and the Vieux-Port.
    Declared 1964-01-08; re-declared with enlarged limits 1995-04-26 to take in the old
    fortifications, which the RPCQ statuts table treats as the operative status with 1964 as the
    statut antérieur; a transfert de responsabilité to the Ville de Montréal registered 2017-09-21,
    in effect 2018-09-21. In the 2005 cahier the same territory is covered by twelve sectors,
    24.E.36 to 24.E.47, each of which has its own row below.

  summary_fr: >-
    « Le site est caractérisé par la densité de sa trame, les dimensions imposantes des bâtiments et
    la diversité des fonctions qui s’y retrouvent. Il compte 557 édifices et vestiges construits à
    différents moments entre le XVIIe siècle et le XXe siècle. Entrepôts, bâtiments religieux,
    édifices à bureaux, banques, sièges sociaux de compagnies, palais de justice et autres édifices
    institutionnels forment un paysage architectural diversifié, rendu harmonieux par l’omniprésence
    de la pierre calcaire grise. »

  characteristics_fr:
  - >-
    « Les immeubles les plus anciens - habitations et édifices conventuels - qui datent de l’époque
    de la Nouvelle-France présentent une maçonnerie en pierre et des toits à pignon. »
  - >-
    « Les nombreux édifices d’inspiration classique du Régime britannique sont caractérisés, entre
    autres, par la pierre calcaire grise. »
  - >-
    « L’architecture éclectique du XIXe siècle s’observe dans les édifices à bureaux, banques, sièges
    sociaux de compagnies d’assurances et palais de justice. »
  - >-
    « Le site compte enfin quelques bâtiments d’intérêt du XXe siècle, notamment des édifices art
    déco, rationalistes et fonctionnalistes. »
  - >-
    « L’utilisation de matériaux traditionnels marquée par une prédominance de la pierre calcaire
    grise jusqu’en 1850, puis par une grande variété de types de pierre. »
  - >-
    « La relation entre le lot et la rue se manifestant par la présence de marches, de portes
    cochères, de grilles, de servitudes de passage et de plusieurs entrées, à savoir une sur chaque
    façade donnant sur la rue. »
  plan_de_conservation: "plan de conservation NOT RETRIEVED — and, on the evidence, not published"

  note: >-
    Vieux-Montréal stays a sector on this site and is not promoted to a place of its own. It meets
    the shape of the Part 9 rule — a declared site inside a borough, exactly like Charlesbourg — but
    it fails the rule's condition, which is that a distinct per-type source must exist for it. The
    ministerial plan de conservation was not retrieved and appears not to exist: the Conseil du
    patrimoine culturel's own page for the site carries no plan, no règlement and no directive, and
    the MCC's former plans-de-conservation index now redirects to a generic landing page. Without it
    there is no per-type document, and a Vieux-Montréal place page would only repeat this borough's.
    This is the first negative case the rule has produced, and it is the case that shows the rule
    discriminates rather than promoting everything that carries a status.

  source: 'RPCQ id 93528, ministère de la Culture et des Communications (fiche source: 2004); statuts table read 17 August 2026'


- id: 24-e-1-le-parc-du-mont-royal
  code: 24.E.1
  name_fr: 'Le parc du Mont-Royal'
  value: exceptional
  summary_en: >-
    The mountain park, on one of the three summits of Mount Royal, inside the arrondissement
    historique et naturel du mont Royal. The cahier records Frederick Law Olmsted chosen in 1874 to
    design it and the park inaugurated in 1876, his plan only partly built; the maison
    Josea-Bonen-Smith of 1858, the cross of 1924, the 1931–32 chalet by Aristide
    Beaugrand-Champagne, the lac aux Castors dug 1937–38 to Frederick Todd's plans with its 1955–58
    pavilion by Hazen Sise and Guy Desbarats, and the voie Camillien-Houde of 1958 that finally let
    cars in.
  summary_fr: >-
    « Le secteur du parc du Mont-Royal est un site naturel exceptionnel possédant quelques bâtiments
    qui s’y sont implantés de façon libre. »
  streets: [voie Camillien-Houde, chemin Remembrance]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-2-trafalgar
  code: 24.E.2
  name_fr: 'Trafalgar'
  value: exceptional
  summary_en: >-
    An almost entirely residential pocket in a hollow either side of the chemin de la
    Côte-des-Neiges, developed late — the Côte-des-Neiges tramway of 1906 gave it its first push and
    small residential ensembles followed between 1930 and 1960. The block between chemin McDougall
    and the chemin de la Côte-des-Neiges holds two large freestanding conciergeries of 1929, the
    Trafalgar and the Gleneagles, with the Sparrow and Thompson houses between them. The cahier
    reads the whole sector as the natural continuation of Westmount, in street grid, massing and
    siting alike.
  summary_fr: >-
    « Ce secteur est le prolongement naturel de Westmount, tant par la trame des rues que par la
    volumétrie et l’implantation des constructions. »
  streets: [chemin de la Côte-des-Neiges, chemin McDougall, avenue Highland, croissant Blueridge]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-3-lhopital-general
  code: 24.E.3
  name_fr: 'L’Hôpital général'
  value: exceptional
  summary_en: >-
    The Montréal General Hospital and the streets around it on the south flank of the mountain,
    developed 1850–1915. The cahier names the maison J.-Henry-Birks of 1898 by Edward Maxwell, the
    former residence at 1597 avenue des Pins Ouest and the maison David-R.-Brown of 1912 at 1570
    avenue des Pins, and singles out the contiguous house, since subdivided into flats, as one of
    the dominant architectural types — which is what separates this sector from the Mille carré doré
    just east of it: density.
  summary_fr: >-
    « Ce secteur, développé entre 1850 et 1915, se détache du « mille carré doré », situé plus à
    l’est, surtout en raison de la densité de son paysage bâti. »
  streets: [avenue des Pins Ouest, avenue Cedar, avenue du Docteur-Penfield]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

- id: 24-e-4-le-fort-de-la-montagne
  code: 24.E.4
  name_fr: 'Le Fort de la Montagne'
  value: exceptional
  summary_en: >-
    The Sulpician domain, in two parts the cahier letters itself: 24.E.4a is the classed site
    historique of the Domaine des Messieurs de Saint-Sulpice with the east and west towers, remains
    of the older fort de la Montagne, and 24.E.4b the properties of the Sœurs de la Congrégation de
    Notre-Dame south of rue Sherbrooke either side of avenue Atwater. Also here: the Grand Séminaire
    of 1854 by John Ostell, the Collège de Montréal of 1867–71 by Henri-Maurice Perreault, the école
    normale Jacques-Cartier of 1913 by J.-Omer Marchand, and the former couvent des Petites Filles
    de Saint-Joseph of 1910 at 2333 rue Sherbrooke Ouest by Alfred-Hector Lapierre.
  summary_fr: >-
    « L’ensemble du domaine et des tours de la montagne a reçu le statut de site historique classé
    par le gouvernement provincial et de lieu historique national par le gouvernement fédéral. »
  streets: [rue Sherbrooke Ouest, avenue Atwater]
  source: 'Ville de Montréal, Évaluation du patrimoine urbain — arrondissement de Ville-Marie (2005), section 3.2.2 A'

