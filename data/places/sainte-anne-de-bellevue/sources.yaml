- id: sadb-toponymie
  citation: "Commission de toponymie du Québec, fiche « Sainte-Anne-de-Bellevue (Ville) », no de séquence 388472: parish of Saint-Louis-du-Bout-de-l'Île founded 1677, renamed Sainte-Anne-du-Bout-de-l'Île in 1714; post office 1835; municipality created 1845 as Bout-de-l'Isle; parish municipality abolished 1847, re-established 1855; renamed Sainte-Anne-de-Bellevue in 1878 (municipality) and 1879 (post office); village municipality created 1878 reaches ville status from 1895 and annexes the parish municipality in 1964; Baie-d'Urfé detached from Sainte-Anne-de-Bellevue in 1911; merged into the new ville de Montréal 1 January 2002, reconstituted 1 January 2006."
  url: "https://toponymie.gouv.qc.ca/ct/ToposWeb/Fiche.aspx?no_seq=388472"
