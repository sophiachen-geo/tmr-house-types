profile_note: 'The cahier grades the ensemble and not the houses. Its fiche describes the works, the former
  gardens and « les ensembles résidentiels » as one demonstration of J.-J. Harpell''s thinking, and says nothing
  whatever about the dwellings'' storey count, plan, roof, cladding or openings; its historique adds only that
  twenty-five were built in 1918 for the workers. The single-family reading of tenure follows the historique''s
  own statement of purpose — « Harpell veut aider ses employés à acquérir une propriété » — and is the only
  attribute here that is not stated outright. This record exists so that a garden-city workers'' quarter of 1918
  on the island of Montréal is not silently omitted for want of a fiche; the description belongs to a later part.'
blurb_en: 'Twenty-five houses built in 1918 for the workers of the Garden City Press, on streets, parks and
  services laid out at the same time — a garden-city quarter on Ebenezer Howard''s model at the far end of the
  island of Montréal, graded an ensemble urbain d''intérêt in 2005. What the houses look like is not recorded in
  any source this project has read, and nothing is invented here to fill the gap.'
origin_en: J.-J. Harpell brought the Garden City Press to Sainte-Anne-de-Bellevue in 1918, a printer of school
  textbooks and educational material for workers, choosing the site for the two railways that crossed it and
  allowed fast shipping across Canada. He was influenced by the theories of the Briton Ebenezer Howard, who
  proposed garden cities as the cure for urban insalubrity; in that spirit he set out to help his employees buy
  their own homes and paid attention to the land around the plant. In 1918 streets, parks and urban
  infrastructure were laid out and twenty-five houses built near the printing works. During the Depression he
  hired unemployed men to plant trees and commissioned Frederick Todd to make a luxurious Japanese garden with a
  pond facing the works, of which nothing survives today. In 1945 he transferred control of the firm to a
  workers' cooperative.
