# The shared West Island skeleton (Part 11a §2.2), adjusted for Sainte-Anne: p3 is titled for the
# canal, the railways and the college campuses rather than for the country-estate belt, which is
# Senneville's and Dorval's story and not this village's.
#
# Written in block style on purpose. The skeleton as printed in the brief uses YAML flow mappings —
# {id: p5, label: 2002–2026, ..., title_en: Merger, demerger, and inventory, colour_key: p5} — and
# inside a flow mapping a comma is a separator, so that title silently parses as title_en "Merger"
# plus two null-valued keys. build.py does not catch it because title_en is still a string.
- id: p1
  label: 1663–1760
  start: 1663
  end: 1760
  title_en: "Seigneurial côtes, the portage and the fur-trade halt"
  colour_key: p1
- id: p2
  label: 1760–1855
  start: 1760
  end: 1855
  title_en: "The parish, the village and the canal"
  colour_key: p2
- id: p3
  label: 1855–1930
  start: 1855
  end: 1930
  title_en: "The railways, the college campuses and the Garden City Press"
  colour_key: p3
- id: p4
  label: 1930–2002
  start: 1930
  end: 2002
  title_en: "Suburbanisation and the merger"
  colour_key: p4
- id: p5
  label: 2002–2026
  start: 2002
  end: 2026
  title_en: "Merger, demerger, and inventory"
  colour_key: p5
