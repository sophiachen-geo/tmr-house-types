- id: bdu-town-history
  citation: "Ville de Baie-D'Urfé, « History and Heritage — Part 1 » and « Part 2 »: « In 1663, the Sulpician Order acquired the Seigneury of the Island of Montreal »; « The Town Charter was granted in March 1911 »; « Mr. James Morgan, one of the Town founders, donated a lakefront property for the construction of a Town Hall »; « In October 1912, Mr. Morgan generously donated the white-frame farmhouse for conversion to a Town Hall »; « In the 1950s, Baie-D'Urfé experienced a growth rate which increased its population fivefold. » Neither page uses the phrase heritage village or village patrimonial."
  url: "https://www.baie-durfe.qc.ca/en/the-town/page/history-and-heritage-part-1"
