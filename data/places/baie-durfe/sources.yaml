- id: bdu-toponymie
  citation: "Commission de toponymie du Québec, fiche « Baie-D'Urfé (Ville) », no de séquence 388456: the town was erected in 1911 under the name Baie-d'Urfée, its territory detached from the ville de Sainte-Anne-de-Bellevue; named for the abbé François-Saturnin Lascaris d'Urfé (1641–1701), Sulpician, in Canada from 1668 and first resident curé of Saint-Louis-du-Haut-de-l'Île or Saint-Louis-du-Bout-de-l'Isle in 1686, returning to France the following year; the misspelling Urfée was corrected only in 1960; the capitalised form Baie-D'Urfé is preferred « parce qu'elle tient compte de la présence de la particule patronymique »; a Nipissing community was settled at the baie d'Urfé on the pointe à Caron; merged into the new ville de Montréal 1 January 2002, reconstituted 1 January 2006."
  url: "https://toponymie.gouv.qc.ca/ct/ToposWeb/Fiche.aspx?no_seq=388456"
  used_for: [phases, prose]
- id: bdu-beaupre-michaud
  citation: "Beaupré et Michaud, architectes (Pierre Beaupré, Josette Michaud), Inventaire des bâtiments patrimoniaux du secteur Baie-d'Urfé de l'arrondissement Beaconsfield–Baie d'Urfé de la Ville de Montréal. Cahier 1 – Textes préliminaires, sommaire de l'inventaire et liste des bâtiments, rapport d'étape, Montréal, Ville de Montréal, 7 avril 2003; cited by the RPCQ in its completed form as Inventaire patrimonial de la Ville de Baie d'Urfé, 2004, s.p. NOT OBTAINED. The firm's own project list gives it as « Inventaire patrimonial de Baie d'Urfé, Arrondissement de Baie d'Urfé, 2003 » with no downloadable file; the town publishes no copy; no library or repository copy was found. Both the 2005 cahier's bibliography and the RPCQ fiche for the maison Rangé-Dit-Laviolette cite it, which is how its existence and authorship are confirmed here."
  url: "https://bmaarchitectes.com/etudes-et-expertises/etudes-historiques-et-patrimoniales/"
