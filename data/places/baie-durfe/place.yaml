summary_en: >-
  A shore town of Sulpician farm lots that never grew a village. The chemin du Roy — later the
  Queen's Highway, now the chemin du Lakeshore — runs along the lac Saint-Louis past what the 2005
  heritage evaluation calls the densest concentration of heritage buildings in its arrondissement:
  old farmhouses, bourgeois houses and summer villas of the late nineteenth and early twentieth
  centuries, standing far back from the road behind mature trees, with no sidewalks. Detached from
  Sainte-Anne-de-Bellevue and chartered in 1911 with fewer than two hundred inhabitants, the town
  quintupled in the 1950s and is now almost entirely postwar. It is spoken of as a heritage village
  and it is not one: a single building is protected, the maison Rangé-Dit-Laviolette of about 1700,
  and only the outer envelope of its oldest wing. Everything else is held by a demolition by-law,
  design review, and lots so large they cannot be subdivided.
hero_photo:
  file: assets/places/baie-durfe/hotel-de-ville-20410-chemin-lakeshore-commons.jpg
  credit: >-
    The hôtel de ville of Baie-D'Urfé, 20410 chemin Lakeshore, on the lac Saint-Louis (December
    2012) — the white-frame farmhouse James Morgan gave the town in October 1912 for conversion to a
    town hall, renovated and enlarged in 1913 by the architects Edward and William Maxwell. The
    gambrel roof with its dormers, the segmental pediment carrying the town's arms and the columned
    verandas wrapping both flanks are the Maxwell remodelling; the façade is lettered TOWN OF BAIE
    D'URFÉ, 20410 and 1911, the year of the charter. The 2005 cahier calls it « l'ancien hôtel de
    ville », but the building was still signed Hôtel de ville — Administration when this photograph
    was taken. It anchors the town's one sector of exceptional value, which the 2025 plan d'urbanisme
    says is safe because the town owns it. Photograph from the Parcours riverain – Ville de Montréal
    Flickr stream, CC BY 2.0; Commons licence review by MTLskyline, 27 September 2013.
    https://commons.wikimedia.org/wiki/File:H%C3%B4tel_de_ville_de_Baie-D%27Urf%C3%A9,_20410,_chemin_Lakeshore_(Baie-D%27Urf%C3%A9).jpg
