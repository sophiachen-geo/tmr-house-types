founded: 1686                              # the Sulpicians conceded the lot on which the maison Rangé-Dit-Laviolette stands in 1686, the year the parish of Saint-Louis-du-Bout-de-l'Île got its first resident curé; the sources also give 1677 and 1678 for the earliest concessions here — see prose.md
settlement_mode: Sulpician farm concessions strung along the chemin du Roy on the lac Saint-Louis shore, later a resort and then a low-density commuter suburb
coordinates: {lat: 45.411708, lon: -73.902640}   # 45° 24' 42.149" N, -73° 54' 9.504" W — the RPCQ coordinate for the maison Rangé-Dit-Laviolette, 20122 chemin Lakeshore
