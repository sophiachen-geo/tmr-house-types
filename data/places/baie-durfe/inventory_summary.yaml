title_en: The town's own built-heritage inventory, annexe C of the 2025 plan d'urbanisme
source: Ville de Baie-D'Urfé, règlement 1108 sur le plan d'urbanisme (avis de motion 11 mars 2025, adopted
  17 juin 2025, in force 20 octobre 2025), annexe C « Inventaire du patrimoine bâti ». Transcribed
  row for row from the by-law's own table, which prints four columns — Nom de la rue, Numéro civique,
  Catégorie de bien, Valeur patrimoniale — and no description of any kind.
note_en: >-
  This is a list of addresses with grades attached, not a typology. Annexe C gives no date, no
  storey count, no roof form, no material and no building name for a single one of its 48 records,
  and this project has added nothing to it except two mechanical cross-references: whether the same
  address appears in the 2005 cahier's list of « immeubles de valeur patrimoniale exceptionnelle »,
  and whether it carries an RPCQ status. Both are in the published CSV. The comparison is worth
  making. Thirty-nine distinct addresses are graded here; sixteen of them were on the 2005 list, and
  twenty-three are new to it. One address travels the other way — 20658 chemin du Lakeshore, listed
  as exceptional by the Ville de Montréal in 2005, is absent from the town's 2025 inventory, and
  neither document explains why. Exactly one of the 48 records is protected: 20122 chemin Lakeshore,
  the maison Rangé-Dit-Laviolette, citée in 2001, and the citation reaches only the outer envelope of
  the oldest wing. The survey behind the grades is the agglomeration of Montréal's pre-1940 inventory
  begun in 2024 under the 2021 Loi sur le patrimoine culturel, which the agglomeration must complete
  by 1 April 2026.
