profile_note: 'Encoded by sources/levis/parse.py from the City''s fiche for this courant. The five columns follow the fiche''s own seven fields: Volumétrie, Plan, Toiture and Saillies together make up massing, Ornementation is articulation, Ouvertures is openings and Revêtements is materials. The French under each English list is the fiche''s wording verbatim, unedited. Siting has no counterpart in the fiche, so it carries the catalogue''s own « Nombre à Lévis » distribution figure instead, and no French. Phase follows the opening year of the index''s period range (1890-1960). The fiche describes the commercial ground floor only — shopfronts, transoms, signage — and says nothing about the dwellings on the two or three storeys above it. The columns therefore carry the street level and are silent above it, which is the fiche''s silence, not the building''s.'
conservation: null
conservation_fr: null
blurb_en: 'The main-street block of the côte du Passage and the avenue Bégin: two or three storeys of brick, flat-roofed or shallow-gabled, with shop windows and transomed commercial doors below and a signage cornice, signs and retractable awnings above.'
origin_en: 'The second of the catalogue''s two « Autre type » entries, and one of only two of the twenty carrying no « Nombre à Lévis » figure. All seven of its fields describe the commercial ground floor — vitrines, portes commerciales, corniche d''affichage, enseignes, auvents rétractables — and none describes the dwellings above, which is how a mixed-use fiche is normally written: the shopfront is what distinguishes the type, the flats over it are what it has in common with everything else on the street. The City''s walking-tour brochure says of the édifice Laurentien on rue Guenette that it « jumelle aujourd''hui les vocations commerciale et résidentielle », which is the mixed use the name promises.'
