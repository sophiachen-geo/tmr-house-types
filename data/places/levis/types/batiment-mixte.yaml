profile_note: 'Encoded by sources/levis/parse.py from the City''s fiche for this courant. The five columns follow the fiche''s own seven fields: Volumétrie, Plan, Toiture and Saillies together make up massing, Ornementation is articulation, Ouvertures is openings and Revêtements is materials. The French under each English list is the fiche''s wording verbatim, unedited. Siting has no counterpart in the fiche, so it carries the catalogue''s own « Nombre à Lévis » distribution figure instead, and no French. Phase follows the opening year of the index''s period range (1890-1960). Not encoded as a dwelling: the fiche''s seven fields describe shopfronts and signage only, and the catalogue files this entry under « Autre type ». Recorded and exported, but not rendered as a type card. This departs from the Part 8 brief, which listed it « yes, mixed-use »; see the place notes.'
conservation: null
conservation_fr: null
blurb_en: 'The main-street block of the côte du Passage and the avenue Bégin: two or three storeys of brick, flat-roofed or shallow-gabled, with shop windows and transomed commercial doors below and a signage cornice, signs and retractable awnings above.'
origin_en: 'The second of the catalogue''s two « Autre type » entries and, like the first, one of only two of the twenty that carry no « Nombre à Lévis » figure. Every one of its seven fields describes commerce — vitrines, portes commerciales, corniche d''affichage, enseignes, auvents rétractables — with no dwelling feature named, so it is recorded and exported but gets no card. The City''s walking-tour brochure notes that the édifice Laurentien on rue Guenette « jumelle aujourd''hui les vocations commerciale et résidentielle », which is the mixed use the name promises.'
