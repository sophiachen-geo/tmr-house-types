blurb_en: 'Two or three storeys of brick or stone under a flat roof, symmetrical, with a covered veranda and the longest ornament list in the catalogue — modillion cornice, balustrade, quoins, doorcase, pediment, keystone, columns and pilasters.'
origin_en: 'A prestige house rather than a public building: the City''s line drawing for this current is a two-storey dwelling with a veranda, quoins and a modillion cornice, and its worked example is 55 avenue Bégin. The walking-tour brochure''s maison Lasnier at 44 rue Wolfe, rebuilt in 1910 down to the basement in a « style éclectique d''inspiration palladienne », is the same idea. About ten are counted.'
