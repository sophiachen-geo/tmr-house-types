blurb_en: 'Two to three storeys under a mansard whose two tin finishes are specified separately — standing seam on the flat deck above, Canadian pan on the steep slope below. Four- and six-pane casements, gabled or round-headed dormers, a covered veranda and carpentered trim.'
origin_en: 'At about 450 buildings, one of the four big currents in the catalogue, and the form of the Lévis of the railway decades after 1870. The old hôtel de ville, demolished in 1965 and shown in the City''s walking-tour brochure on the site of the present parc Joseph-Godéric-Blanchet, was Second Empire.'
