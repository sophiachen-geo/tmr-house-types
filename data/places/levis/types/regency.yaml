blurb_en: 'Square in plan under a four-slope pavilion roof whose curved base runs out over a veranda on every side. Six-pane casements arranged symmetrically, gabled or hipped dormers, and clapboard, shingle or brick walls.'
origin_en: 'The British officer''s cottage as it was built on the south shore facing Québec, and one of the rarest currents in the catalogue at about fifteen buildings. The RPCQ''s description of the cited site at Saint-Nicolas names the Regency among the « manifestations d''architecture pittoresque » that give that ensemble its character.'
