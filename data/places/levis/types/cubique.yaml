blurb_en: 'Two storeys on a square plan under a shallow four-slope or pavilion roof, with a central dormer and a covered veranda that sometimes wraps a second face. Ornament is explicitly sober — corner boards and surrounds only.'
origin_en: 'At about 450 buildings this is level with Second Empire as the third most numerous current. It is the same foursquare that Saint-Lambert, Gatineau, Québec City and Trois-Rivières each catalogue, and Lévis''s version is distinguished by the veranda turning the corner.'
