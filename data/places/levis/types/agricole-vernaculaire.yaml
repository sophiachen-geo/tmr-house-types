profile_note: 'Encoded by sources/levis/parse.py from the City''s fiche for this courant. The five columns follow the fiche''s own seven fields: Volumétrie, Plan, Toiture and Saillies together make up massing, Ornementation is articulation, Ouvertures is openings and Revêtements is materials. The French under each English list is the fiche''s wording verbatim, unedited. Siting has no counterpart in the fiche, so it carries the catalogue''s own « Nombre à Lévis » distribution figure instead, and no French. Phase follows the opening year of the index''s period range (1850-1950). Rural rather than urban: the fiche describes farm buildings, and its openings row is about barn doors rather than windows.'
conservation: null
conservation_fr: null
blurb_en: 'The rural building of the merged territory: a long rectangle of vertical boarding or shingle under a straight two-slope roof, sometimes mansarded, with big hinged or track-hung doors, a roof vent, lean-to additions and a silo.'
origin_en: 'Rural rather than urban, and included here because Lévis''s 2002 merger of ten municipalities brought a large farming territory inside one city boundary — Saint-Étienne, Saint-Nicolas, Pintendre, Breakeyville and Vire-Crêpes all carry PIIA heritage sectors of this kind. The RPCQ''s cited site at Saint-Nicolas is itself described as « un ensemble continu de propriétés agricoles ». About a hundred are counted.'
