blurb_en: 'The catalogue''s entry for garages, sheds and other outbuildings that are not farm buildings: one to one and a half storeys, shallow two-slope roof, boarded or shingled walls, a garage door and fixed lights, and no projections at all.'
origin_en: 'One of the two entries the catalogue files under « Autre type », and one of only two of the twenty that carry no « Nombre à Lévis » figure. It is recorded here because it is part of the published catalogue, but it is not a dwelling and gets no card.'
