blurb_en: 'Two or three storeys, square or rectangular, flat-roofed, finished at the top by a cornice or parapet and at the front by a covered veranda — the superposed-dwelling form of the industrial faubourgs, and at about 600 buildings the third most numerous current in the catalogue.'
origin_en: 'Where Boomtown hides a shallow slope behind a parapet, this current has no slope to hide: the flat roof is the type. It is the Lévis relative of the Montréal plex and of Gatineau''s flat-roofed brick and wood houses, and the City''s ornament list — modillion cornice, patterned brickwork, veranda trim — is the richest of the three flat-roofed currents it publishes.'
