blurb_en: 'One to two storeys, square or rectangular, with the roof either flat or falling so gently to the rear that the street sees a straight line. A parapet or cornice finishes the front, a covered veranda fronts it, and corner boards and surrounds do the rest.'
origin_en: 'The same form Saint-Lambert, Gatineau, Québec City and Trois-Rivières each describe in their own words — six independent municipal descriptions of one building. Lévis''s fiche is the tersest of them and the only one that pins the shallow pitch to the rear slope explicitly. About a hundred are counted.'
