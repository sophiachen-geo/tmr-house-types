profile_note: 'Encoded by sources/levis/parse.py from the City''s fiche for this courant. The five columns follow the fiche''s own seven fields: Volumétrie, Plan, Toiture and Saillies together make up massing, Ornementation is articulation, Ouvertures is openings and Revêtements is materials. The French under each English list is the fiche''s wording verbatim, unedited. Siting has no counterpart in the fiche, so it carries the catalogue''s own « Nombre à Lévis » distribution figure instead, and no French. Phase follows the opening year of the index''s period range (1950-1975).'
conservation: null
conservation_fr: null
blurb_en: 'Flat-roofed, brick, concrete or metal-clad, with openings set in repeating horizontal bands. The one current in the catalogue whose massing the City declines to fix at all — « diversifiée selon l''usage » — because the same language served houses, schools and offices.'
origin_en: 'The last of the twenty currents, dated 1950–1975 and counted at about thirty buildings. Lévis published a separate Inventaire du patrimoine moderne in 2016 covering 79 buildings put up between 1946 and 1975 (RPCQ inventory 1313), and a guide, L''architecture moderne, un héritage du 20e siècle à démystifier. The City''s line drawing for the current is an office block, and the fiche''s own volumetry row concedes the range, so both a low ranch house and a slab are cross-linked here.'
