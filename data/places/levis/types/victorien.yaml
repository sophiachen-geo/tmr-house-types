blurb_en: 'Two to three storeys well up off the ground on a complex articulated plan, broken by turrets, oriels, balconies and gables, and covered in decorative woodwork — the fiche calls the ornament « très chargée » and then lists seven kinds of it.'
origin_en: 'The City''s walking-tour brochure points to the three houses at 20, 22-26 and 28 rue Guenette — « le trio victorien » — as « un des ensembles architecturaux les plus intéressants du Québec », reading them through bichrome brick at the quoins and entablements, imitation keystones over the lintels, arched windows and elaborated gables.'
