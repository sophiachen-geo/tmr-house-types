profile_note: 'Encoded by sources/levis/parse.py from the City''s fiche for this courant. The five columns follow the fiche''s own seven fields: Volumétrie, Plan, Toiture and Saillies together make up massing, Ornementation is articulation, Ouvertures is openings and Revêtements is materials. The French under each English list is the fiche''s wording verbatim, unedited. Siting has no counterpart in the fiche, so it carries the catalogue''s own « Nombre à Lévis » distribution figure instead, and no French. Phase follows the opening year of the index''s period range (1880-1940).'
conservation: null
conservation_fr: null
blurb_en: 'At about 1,700 buildings the most numerous current in Lévis by a wide margin: one and a half or two storeys well clear of the ground, rectangular or L-shaped, under a straight tin roof of medium to shallow pitch, with a veranda under its own separate awning.'
origin_en: 'The workers'' house of the industrial south shore, and the plainest demonstration of what the catalogue is for — one form accounting for more than a third of the 4,000-odd heritage buildings the City counts. The diamond-pattern asbestos-cement tile the fiche names as a cladding is the same material it lists for Boomtown, and marks the interwar re-skinning of both.'
