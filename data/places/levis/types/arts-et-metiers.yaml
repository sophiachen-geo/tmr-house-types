blurb_en: 'One and a half to two storeys on a complex articulated plan under roofs the fiche describes only as varied and complex, in natural materials — stone, brick, render, clapboard, shingle — often several at once. Verandas, chimneys and oriels project; the ornament is woodwork.'
origin_en: 'Lévis says « Arts & métiers » where English-speaking Canada says Arts and Crafts, and the catalogue dates it 1910–1945. The insistence on « matériaux naturels » and on combining several of them is the movement''s own argument, restated as a planning description. About sixty are counted.'
