blurb_en: 'One and a half storeys sitting almost on the ground under a steep two-slope or hipped roof with barely any eaves overhang. Walls are massive stone, sometimes rendered or boarded over. Windows are few, small-paned casements, set without symmetry; a large stone chimney is the only projection.'
origin_en: 'The oldest of the twenty currents in the City''s catalogue, covering the French colonial period on the seigneurie de Lauzon, granted to Jean de Lauson in 1636 and settled at Pointe-Lévy from 1647. The City counts about fifteen buildings of this kind across the whole merged territory — the smallest surviving group in the catalogue, and the reason so little of Lévis reads as pre-Conquest today.'
