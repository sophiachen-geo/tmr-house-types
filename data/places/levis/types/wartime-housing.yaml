blurb_en: 'One and a half storeys, rectangular or square, under asphalt shingle, in the light claddings that arrived with it — asbestos-cement tile, aluminium or masonite clapboard. A veranda or stoop, a chimney, and ornamental ironwork as the only decoration.'
origin_en: 'Wartime Housing Limited''s standard dwelling, built for shipyard and munitions workers and kept in production into the 1960s; the City dates the current 1940–1970 and counts about 200. It is the first current in the catalogue whose materials are all industrial products rather than wood, stone or tin, and the ornamental ironwork on the veranda is the period''s signature.'
