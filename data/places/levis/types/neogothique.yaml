blurb_en: 'Steep two-slope roofs over an irregular plan, with pointed-arch openings and vertical windows of varied pattern. The City''s own line drawing for this current is a chapel, and its projections — bell tower, buttresses, pinnacles — are ecclesiastical; the domestic version reads through the same steep gables and decorative bargeboards.'
origin_en: 'Lévis''s best-known Neo-Gothic building is a house: the maison Alphonse-Desjardins of 1882–1884, where the first caisse populaire was founded in 1900. The RPCQ describes it as « une habitation de style néogothique… de plan asymétrique en forme de « L », à un étage et demi… coiffée d''un toit à deux versants ponctué de deux pignons en façade », and it was classed an immeuble patrimonial on 21 March 1983. The City''s fiche spans 1830 to 1940, a reach of over a century, so the phase placement here follows the opening date and is marked provisional.'
