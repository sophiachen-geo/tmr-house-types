blurb_en: 'One to five storeys, flat or straight-gabled, in stone, brick, render, concrete or sheet metal, with large windows or vehicle doors and nothing decorative about it. The building type of the Davie yards at Lauzon and the railway works.'
origin_en: 'The industrial current of a shipbuilding and railway town — the Davie yard at Lauzon has been building ships since 1829 — and the only entry in the catalogue that the City gives a style but no house form. Not a dwelling, so it is recorded and exported but gets no card.'
