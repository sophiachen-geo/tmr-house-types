- id: p1
  label: 1636–1780
  start: 1636
  end: 1780
  title_en: The seigneurie de Lauzon
  colour_key: p1
  summary_en: >-
    The seigneurie de Lauzon is granted to Jean de Lauson in 1636; Guillaume Couture settles at
    Pointe-Lévy as its first colonist in 1647. Settlement of the south shore runs a century behind
    the north. About fifteen buildings of the Régime français survive across the whole of the
    present city.
- id: p2
  label: 1780–1861
  start: 1780
  end: 1861
  title_en: Pointe-Lévy, the ferry and the shipyards
  colour_key: p2
  summary_en: >-
    John Caldwell lays out a street grid on top of the cliff — the town of Aubigny — and the côte
    du Passage carries every traveller from the Beauce and the United States down to the canotiers
    who ferried them to Québec. The seigneury is dismantled in 1836; Allison Davie opens the yard
    at Lauzon in 1829, and from 1836 Elizabeth Taylor Johnson Davie runs it, the first woman to
    run a Canadian shipyard.
- id: p3
  label: 1861–1900
  start: 1861
  end: 1900
  title_en: Ville de Lévis — railway, forts, terraces
  colour_key: p3
  summary_en: >-
    Ville de Lévis is incorporated on 18 May 1861, out of Mgr Joseph-David Déziel's parish of
    Notre-Dame-de-la-Victoire. The forts de Lévis are built 1865–72, the timber trade and the
    shipyards make the town a rival to Québec, and the bourgeois streets on the promontory — Wolfe,
    Guenette, Fraser, Bégin — fill with Second Empire and Victorian houses.
- id: p4
  label: 1900–1945
  start: 1900
  end: 1945
  title_en: Boomtown, cubique and the flat roof
  colour_key: p4
  summary_en: >-
    Alphonse Desjardins founds the first caisse populaire at Lévis on 6 December 1900. The
    industrial house forms arrive together and account between them for most of the catalogue's
    count: Boomtown, the maison cubique, the flat-roofed house and, above all, the vernaculaire
    américain at some 1,700 buildings.
- id: p5
  label: 1940–1975
  start: 1940
  end: 1975
  title_en: Wartime housing and modernism
  colour_key: p5
  summary_en: >-
    Wartime Housing Limited builds for the shipyard and munitions workers, and the light industrial
    claddings — asbestos-cement tile, aluminium, masonite — replace wood, stone and tin. The City's
    2016 Inventaire du patrimoine moderne covers 79 buildings from 1946 to 1975.
- id: p6
  label: 1975–2002
  start: 1975
  end: 2002
  title_en: Suburbanisation and the merger
  colour_key: p6
  summary_en: >-
    The catalogue stops at 1975 and nothing in it describes what was built afterwards. In 2002 ten
    municipalities are merged into a single Ville de Lévis of three boroughs — Desjardins, Les
    Chutes-de-la-Chaudière-Est and Les Chutes-de-la-Chaudière-Ouest — which is why a catalogue of
    urban house types has to carry an agricultural vernacular as one of its twenty currents.
