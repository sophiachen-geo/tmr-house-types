- id: piia-new-liverpool
  code: PIIA-NEWLIVERPOOL
  name_fr: Secteur d'intérêt patrimonial de New Liverpool
  value: review-jurisdiction
  summary_en: >-
    The timber-cove settlement of New Liverpool on the river west of Saint-Romuald, where the
    square-timber trade loaded its rafts. Named as its own secteur on the City's general sheet.
  streets: ["rue des Caps", "rue Hardy"]
  source: Ville de Lévis, Localisation des secteurs de PIIA patrimonial, sheet "New Liverpool" (4 March 2020)

- id: piia-vire-crepes
  code: PIIA-VIRECREPES
  name_fr: Secteur d'intérêt patrimonial de Vire-Crêpes
  value: review-jurisdiction
  summary_en: >-
    The chemin Vire-Crêpes, a rural road corridor rather than a village core — the clearest case of
    the City protecting a farmed landscape rather than a built ensemble.
  streets: ["chemin Vire-Crêpes", "route Lagueux"]
  source: Ville de Lévis, Localisation des secteurs de PIIA patrimonial, sheet "Vire-Crêpes" (4 March 2020)
