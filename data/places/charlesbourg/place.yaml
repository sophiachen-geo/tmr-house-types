typology_document:
  title: >-
    MCC, Plan de conservation du site patrimonial de Charlesbourg (2016), pp. 48–51 — five
    residential types, the fourth holding three sub-variants
  year: 2016
  format: per-type-narrative
  note: >-
    Unlike Île d'Orléans, Charlesbourg has no separate inventory; the plan's own prose is the
    typology. Each type is introduced in a paragraph and then set out as a bulleted list headed
    "Voici les principales caractéristiques de ce type", and those bullets are what this site
    transcribes into profile_fr. The fourth type, maison vernaculaire industrielle, is a parent: its
    shared bullets are followed by three bullets that each define one sub-variant — maison cubique
    (or "Four Square"), cottage vernaculaire, and bâtiment "Boomtown" — which other Québec sources
    (the Île d'Orléans inventory, the Lévis catalogue) treat as three top-level courants instead.
map_layer: null
summary_en: >-
  A star-shaped village the Jesuits laid out in 1665 on their seigneurie de Notre-Dame-des-Anges:
  forty trapezoidal farm lots radiating from a square ring road, around a common pasture, with five
  arpents at the dead centre reserved for church, presbytery and cemetery, and a rule obliging every
  farmer to build in the first third of his lot, hard against the Trait-Carré. It was the first
  settlement of its kind in New France and one of three the same seigneury attempted — the others,
  Petite-Auvergne and Bourg-Royal, had no parish core and did not survive as legible plans. Québec's
  suburbs arrived in the 1950s and cut up the farms, but the radial geometry is still readable on
  the ground, and 138 principal buildings inside 24 hectares still carry three centuries of housing,
  from a 1742 stone mill to the postwar bungalow.
