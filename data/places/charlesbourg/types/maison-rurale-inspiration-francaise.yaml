blurb_en: >-
  The oldest house in the site and the only one that ignores the road: a low, squat, one-and-a-half
  storey box of pièce-sur-pièce or whitewashed rendered stone, under two straight steep slopes of
  wood shingle, with one or two stacks and small-paned casements set wherever the inside wanted
  them. Its façade faces south for the sun, whatever direction the Trait-Carré happens to run.
origin_en: >-
  The house of the Régime français, built on the trapezoidal farm lots the Jesuits conceded from
  1665 and, under the règle du tiers, always in the first third of the lot against the Trait-Carré.
  The plan de conservation warns that this type is easier to see than to date: several 18th-century
  houses were altered so heavily that their apparent age is nothing like their real one — 8180-8182
  Le Trait-Carré Est was built about 1724 and given a mansard roof in 1931 — while the maison
  Éphraïm-Bédard looks like a French-inspired farmhouse and was built about a century later.
