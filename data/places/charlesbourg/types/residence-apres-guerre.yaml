blurb_en: >-
  A rectangular or nearly square plan, one storey, a low pavilion or hipped roof, and brick mixed
  with artificial stone. Four lines is all the plan gives it — and yet more than a third of
  everything standing inside this declared site went up between 1925 and 1975.
origin_en: >-
  The bungalow is what the declaration of 1965 was reacting to. Sprawl reached Charlesbourg at the
  turn of the 1950s and cut up the farm lots; the plan records that 65 buildings, 48.5 % of the
  site, date from 1925–1975, and that most of the site's 26 single-storey buildings are post-war
  bungalows. The 2005 Étude de caractérisation makes the same point from the other side: by 1963
  urban sprawl had already reached the ceinture, much of the agricultural heritage had gone, and the
  perimeter drawn in 1965 enclosed "le produit (la zone d'occupation villageoise) plutôt que la
  source (ce qu'il restait des terres agricoles à l'origine du village)".
