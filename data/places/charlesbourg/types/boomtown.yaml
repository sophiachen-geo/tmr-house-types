profile:
  siting_landscape:
    - Flat roofs account for 31 of the site's 138 principal buildings, about 22 %, and the plan says most of them date from the 20th century.
    - The oldest flat roof in the site is not a house at all but a former forge at 7821 Le Trait-Carré Est, built between 1863 and 1886.
  massing:
    - Distinguished by its flat or low-pitched roof, concealed behind a parapet.
  articulation:
    - Inherited from the parent type — standardised architectural elements, doors and windows. The parapet is the type's defining articulation.
  openings:
    - Rectangular openings of vertical proportion; wood windows, casement or sash.
  materials:
    - Machined materials; the parent type's beams, boards and asbestos-cement tile.
profile_fr:
  sous_variantes:
    - "le bâtiment « Boomtown » se distingue par son toit plat ou à faible pente dissimulé derrière un parapet"
  volumetrie:
    - "un volume simplifié. Une charpente claire, aussi appelée « Balloon Frame »"
  ouvertures:
    - "des ouvertures de forme rectangulaire aux proportions verticales. Ces fenêtres en bois sont à battants ou à guillotine"
  materiaux:
    - "des matériaux usinés, tels que les poutres et les planches. Des nouveaux matériaux faisant leur apparition au début du XXe siècle, comme la tuile d'amiante-ciment. Des éléments architecturaux standardisés, tels que les portes et les fenêtres"
profile_note: >-
  The sub-variant bullet is transcribed verbatim from printed p. 51 and is a single line — the
  shortest type definition in this part. The volumetrie, ouvertures and materiaux entries are the
  parent type's shared bullets, repeated so the child record stands on its own. The siting column
  carries the plan's flat-roof statistics from printed p. 45, which count the whole site rather than
  this sub-variant alone. The plan also notes that the salle Pierre-Garon of 1925, an institutional
  building, carries a parapet « évoquant l'architecture "Boomtown" » — the vocabulary travelling
  from the shopfront to the parish hall.
