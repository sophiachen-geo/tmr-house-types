blurb_en: >-
  One line in the plan and nothing more: a flat or barely sloping roof hidden behind a parapet. It
  is the shopkeeper's end of the industrial vernacular, and at Charlesbourg it belongs with the
  fourteen buildings that put a shop on the ground floor and a dwelling above it.
origin_en: >-
  Boomtown is now the most widely distributed form on this site, catalogued at Saint-Lambert,
  Gatineau, Québec City, Trois-Rivières, Lévis, Île d'Orléans and here. Charlesbourg is the case
  where it is filed as a sub-variant rather than a type, and where the plan shows the parapet
  jumping category: the salle paroissiale of 1925, now the salle Pierre-Garon, borrows it for a
  parish hall.
