blurb_en: >-
  The 19th-century village house, and the one the Trait-Carré is mostly made of: a rectangular
  white box raised just enough for a rough cellar, with the roof's larmiers reaching out past the
  wall — often curving up as they go — to shelter a gallery running the whole width of the façade.
  Large-paned casements sit symmetrically either side of a central door in moulded frames, and a
  summer kitchen often repeats the house in miniature at the back.
origin_en: >-
  The plan makes it an explicitly post-Conquest form: British know-how, changing construction
  technique and changing ways of living produce a new type that "marque tout le XIXe siècle", while
  keeping the rectangular plan and the sloped roof of the French model. It is the same house
  Saint-Lambert, Terrebonne, Lévis, Québec City and Île d'Orléans each catalogue under their own
  names, and the Charlesbourg description is the one that insists on the colour.
