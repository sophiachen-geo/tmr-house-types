blurb_en: >-
  A square plan two storeys high under a shallow pavilion roof, sometimes with a single dormer on
  the front slope, clad in horizontal boards or brick. The plan gives it three lines and no more —
  which is itself the point: the whole appeal of the industrial vernacular was that it needed no
  more than three lines to describe.
origin_en: >-
  The same American Foursquare that Saint-Lambert, Gatineau, Québec City, Trois-Rivières, Lévis and
  Île d'Orléans all catalogue. What differs at Charlesbourg is its rank: here it is a sub-variant
  inside the maison vernaculaire industrielle rather than a courant of its own, and the plan's
  built-fabric survey confirms it arrived with the century, putting most of the site's pavilion
  roofs on two-storey cubic houses of the first decades of the 20th century.
