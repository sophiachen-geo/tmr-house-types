blurb_en: >-
  A rectangular plan that stretches longer than the houses before it, under a roof of gentle
  terrasson over an almost vertical brisis — two slopes usually, four or hipped sometimes.
  Symmetrical, vertically proportioned openings, occasionally arched, and ornament that can turn
  elaborate: decorative woodwork on the galleries, on the dormers and round the windows. Its
  materials are simply those of the neoclassical house it succeeds.
origin_en: >-
  The plan traces the route explicitly: monumental Paris under Napoleon III, reintroducing a roof
  form of the French classical period; then Québec's institutional buildings and bourgeois houses;
  then convents and presbyteries; then, quickly, rural domestic architecture. Charlesbourg shows the
  whole chain in one place — the presbytery of 1875, the convent of 1883 and the sacristy of 1887
  are all Second Empire, and the houses follow. The plan is also candid that some mansards here are
  retro-fits: a few old houses got one to make the attic habitable.
