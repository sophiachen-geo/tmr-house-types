blurb_en: >-
  The type that took over. From the 1890s to the Second World War it is what got built here:
  a simplified volume on a balloon frame, machined beams and boards, catalogue doors and windows,
  asbestos-cement tile, rectangular vertically proportioned casements or sashes — cheap, simple and
  adaptable enough to hold one household or two. The plan then splits it three ways: cubique,
  cottage vernaculaire, Boomtown.
origin_en: >-
  Standardised materials, mechanised labour and plans distributed at continental scale through
  catalogues and magazines produced this architecture in the United States; it came to Canada and
  spread on the strength of how simple and cheap it was to build. Charlesbourg's plan de
  conservation is one of the two Québec sources on this site that treat the three forms as one
  family with a parent — the Ville de Québec thésaurus is the other — while the MRC de L'Île-d'Orléans
  and the Ville de Lévis list them as separate courants of equal rank. Nothing in the buildings
  changes; the disagreement is entirely about the level of the category.
