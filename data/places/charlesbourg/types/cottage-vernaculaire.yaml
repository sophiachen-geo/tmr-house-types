profile:
  siting_landscape:
    - Reads at a glance as the traditional Québec house it stands beside on the Trait-Carré; the difference is in the eave.
  massing:
    - Compares to the Québec house of neoclassical inspiration in its general form.
    - But its eave differs — the larmier has no coyaux, and its pitch is slightly shallower.
    - A variant sets the façade on the gable wall.
  articulation:
    - Inherited from the parent type — standardised architectural elements, doors and windows.
  openings:
    - Rectangular openings of vertical proportion; wood windows, casement or sash.
  materials:
    - Machined materials; the parent type's beams, boards and asbestos-cement tile.
profile_fr:
  sous_variantes:
    - "le cottage vernaculaire se compare à la maison québécoise d'inspiration néoclassique par sa forme générale, mais son avant-toit diffère par le larmier sans coyaux et sa pente légèrement plus faible. Il existe une variante où la façade est aménagée sur le mur pignon"
  volumetrie:
    - "un volume simplifié. Une charpente claire, aussi appelée « Balloon Frame »"
  ouvertures:
    - "des ouvertures de forme rectangulaire aux proportions verticales. Ces fenêtres en bois sont à battants ou à guillotine"
  materiaux:
    - "des matériaux usinés, tels que les poutres et les planches. Des nouveaux matériaux faisant leur apparition au début du XXe siècle, comme la tuile d'amiante-ciment. Des éléments architecturaux standardisés, tels que les portes et les fenêtres"
profile_note: >-
  The sub-variant bullet is transcribed verbatim and in full from printed p. 51, because it is the
  clearest published statement anywhere in the sources this site draws on of how the industrial
  vernacular differs from the traditional type it imitates. The distinction turns on one word:
  a coyau is the short piece fixed at the foot of a rafter that lifts and curves the eave outward,
  producing the larmier retroussé of the traditional Québec roof. The cottage vernaculaire keeps the
  silhouette and drops the coyau, so the eave runs straight out instead of flaring — and the pitch
  slackens slightly with it. The plan's own built-fabric survey gives the arithmetic of that
  distinction across the site: of 56 two-slope roofs, 26 have larmiers retroussés and 30 do not.
  The volumetrie, ouvertures and materiaux entries are the parent type's shared bullets, repeated so
  the child record stands on its own.
