blurb_en: >-
  The industrial vernacular wearing the traditional house's clothes. In general form it is the
  Québec house of neoclassical inspiration; what gives it away is the eave, where the larmier runs
  out straight because there is no coyau under it, on a pitch that is slightly shallower. One
  variant turns the façade onto the gable wall.
origin_en: >-
  The plan's sentence on this form is the most useful in the whole part, because it is the only
  place in these sources where a document says plainly what separates a mass-produced house from the
  handbuilt one it copies — and the answer is a single missing piece of carpentry. The coyau is
  fiddly work; the balloon frame and the catalogue plan dispensed with it. This is the same form the
  Île d'Orléans inventory calls the cottage vernaculaire américain, Lévis calls the vernaculaire
  américain, and Québec City catalogues as the cottage vernaculaire industriel.
