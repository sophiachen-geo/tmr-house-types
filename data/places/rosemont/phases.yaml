# The cahier (3.1) divides the borough into three sectors "dont le développement urbain correspond
# à des périodes historiques différentes": La Petite-Patrie 1885–1930 with the tramway; the quartier
# Rosemont from the Angus Shops c. 1904; and Nouveau Rosemont after the Second World War. The phases
# below follow that division, with an agricultural prologue for the côte de la Visitation and the
# quarries, and a closing phase for the pressure the 2018–2019 shoebox by-law answers.
