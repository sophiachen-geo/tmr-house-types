profile:
  siting_landscape:
    - Detached bungalows dropped into an urban setting that is otherwise mostly duplex — the cahier's own framing, and the reason the sector is interesting.
    - Set back from the street to allow front lawns; mature trees shade the streets.
    - The street layout breaks the orthogonal grid, and 33e Avenue widens, which together produce what the cahier calls « une ambiance de banlieue en ville ».
    - Developed in the 1950s.
  massing:
    - Squat form, one storey.
    - Hipped roof (toit à pavillon).
  articulation:
    - Asymmetrical composition.
    - Brick facing dressed with stone to mark the main entrance.
  openings: []
  materials:
    - Brick, with stone used to set off the entrance.
profile_fr:
  description:
    - "« Cette zone est composée de bungalows implantés dans un milieu urbain comprenant en majorité des duplex. Les principaux traits architecturaux de ces petites maisons banlieusardes sont leur forme trapue et leur toit à pavillon, le parement de brique rehaussé de pierre pour marquer l'entrée principale et la composition asymétrique. »"
    - "« Par ailleurs, le tracé particulier des rues – il brise la trame urbaine orthogonale – ainsi que l'élargissement de la 33e Avenue contribuent à créer une ambiance de banlieue en ville. »"
profile_note: >-
  A one-sector type taken from a single fiche, quoted in full. Openings are left empty because the
  fiche says nothing about them, and the horizontal window_proportion recorded above is the one
  inference in this record — it follows from the named form (trapue, toit à pavillon, composition
  asymétrique, 1950s) rather than from the text, and should be read as provisional.
phase_confidence: provisional
blurb_en: >-
  Squat, one storey, hipped roof, brick with a panel of stone beside the door, standing on a lawn in a
  street of duplex. The cahier records the effect precisely: a suburb inside the city, produced as much
  by the broken street grid and the widened 33e Avenue as by the houses.
origin_en: >-
  The eastern part of the borough — what the cahier calls Nouveau Rosemont — developed late, after the
  Second World War, when large lots were still available and the population of the east end was rising
  fast. This sector is the 1950s result, and the cahier reads it as an import: bungalows « implantés
  dans un milieu urbain comprenant en majorité des duplex ». It is the far end of the borough's
  sequence, and the exact opposite of the shoebox at the other end — the same one-storey house, but
  detached, on a lawn, with a hipped roof and no intention of ever growing upward.
