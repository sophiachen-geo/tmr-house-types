profile_note: >-
  This is the thinnest record on the page and is published thin on purpose. The cahier mentions
  conciergeries in Rosemont–La Petite-Patrie in exactly one clause, quoted above in full, and gives no
  description of them whatever. The columns are therefore almost entirely empty, and the storeys,
  cladding and tenure_plan values above are carried from what the canonical type means rather than
  from this borough's source — they should be read as the canonical's defaults, not as evidence from
  Rosemont. The line that defines the form — a common entrance hall serving six to twelve dwellings,
  which is where the plex family stops — comes from Le Sud-Ouest's typo-morphological study, not from
  here. Nothing else has been imported.
blurb_en: >-
  The point at which a Montréal building stops giving each dwelling its own front door and starts
  giving them all one hall. The cahier notes a few of them in the eastern part of La Petite-Patrie,
  dating from the first decades of the twentieth century, and says no more.
origin_en: >-
  La Petite-Patrie's eastern sector was built between 1885 and 1930, and the conciergeries the cahier
  notes belong to the later end of that span. They are recorded here so that the borough's place in
  the canonical type's list of occurrences is honest, and because their scarcity is itself the finding:
  in a borough of 561 self-built one-storey houses and street after street of two- and three-dwelling
  plex, the shared-hall apartment building is a marginal form.
