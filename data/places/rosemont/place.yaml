summary_en: >-
  The borough the Canadian Pacific built. When the Angus Shops opened in 1904 the promoters U.-H.
  Dandurand and Herbert Holt subdivided the Crawford farm beside them, and the shopmen who could not
  afford a plex bought a lot on a promise of sale for a few dollars down and built a one-storey
  flat-roofed box on it themselves, meaning to add a floor later. Some five hundred and sixty-one of
  those maisons shoebox survive, and in 2018–2019 Rosemont–La Petite-Patrie became the first Montréal
  borough to write them into its zoning by-law — house by house, with an architectural value from 1
  to 3 attached to each address. Around them the borough is otherwise the standard Montréal fabric of
  contiguous brick duplex and triplex with exterior stairs, denser and more ornate on rue Saint-Denis;
  and at its eastern edge sits the Cité-Jardin du Tricentenaire, a co-operative garden suburb of
  1941–1947 that answered the row plex with detached houses on curving planted streets.
