id: rosemont
name_en: Rosemont–La Petite-Patrie (borough of Montréal)
name_fr: Arrondissement de Rosemont–La Petite-Patrie
sections: [borough-vernacular]
region: Ville de Montréal
borough_of: montreal                       # Part 10a: renders as a sibling under the Montréal header
founded: 1904                              # the Angus Shops open; the village of Rosemont follows, annexed 1906–1910
settlement_mode: >-
  railway-shop suburb laid out by the Rosemont Land Improvement Company on the Crawford farm,
  self-built in part by the shopmen who worked at Angus
