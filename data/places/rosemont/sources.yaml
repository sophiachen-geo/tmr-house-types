- id: rosemont-evaluation-cahier
  citation: >-
    Ville de Montréal, Service de la mise en valeur du territoire et du patrimoine, Direction du
    développement urbain, Division du patrimoine et de la toponymie, « Évaluation du patrimoine urbain
    — Arrondissement de Rosemont–La Petite-Patrie », 60 p., ISBN 2-7647-0469-0, dépôt légal 2005.
    Study directed by Céline Topp; heritage evaluation and historical research under Jean-François
    Gravel by Julie Boivin, Elizabeth Bonner, Anne-Marie Dufour, Guy Lafontaine, Christiane Lefebvre
    and Pierre-Paul Savignac, architects, with Denise Caron, historian; archaeology by Claire Mousseau
    with Françoise Duguay, François Bélanger, Anne-Marie Balac and Christian Roy. Work carried out
    January 2003 – May 2004 for the Plan d'urbanisme adopted 23 November 2004; one of 27 cahiers.
    File 21_evaluation_patrimoine_rose.pdf, downloaded 17 August 2026;
    https://ville.montreal.qc.ca/pls/portal/docs/page/patrimoine_urbain_fr/media/documents/21_evaluation_patrimoine_rose.pdf
  used_for: >-
    sectors.yaml in full — the arrondissement code 26 read from the sector codes inside the document,
    all eleven 26.E sectors, seven 26.I, four 26.U, one 26.N and three 26.AP, with their verbatim
    French where it carries the argument, plus the rue des Carrières tracé fondateur, which is carried
    in prose rather than as a sector record for the reason set out there. Also the historique
    (Angus, the Rosemont Land subdivision, the Cité-Jardin, the hospitals, the Jean-Talon market),
    phases.yaml, the plex and bungalow type records, and the 2004 sentence naming the threat to the
    one-storey houses that the 2018–2019 by-law answers.
  note: >-
    Two filename and metadata traps in one document. The file prefix is 21 and the arrondissement code
    is 26; and the PDF's own Title metadata still reads "maq1_CŽte StLuc Hampstead", left over from
    the template the series was produced from. Neither the filename nor the metadata may be used to
    identify the arrondissement — only the sector codes printed inside. The cahier also cites 14.AP.1,
    an adjoining borough's sector, which independently confirms VSP as code 14.

- id: rosemont-annexe-f
  citation: >-
    Arrondissement de Rosemont–La Petite-Patrie, « ANNEXE F — Maisons shoebox de l'arrondissement de
    Rosemont – La Petite-Patrie », the address-by-address characterisation table published with the
    projet de règlement. Source spreadsheet "Annexe F _ décembre 2018.xls"; PDF created 7 December
    2018, ModDate 21 January 2019; 8 pages, 561 rows; columns No. Civique, Rue, Valeur architecturale,
    Couronnement de qualité, Construite en fonds de lot, Adjacente à une autre maison shoebox.
    http://ville.montreal.qc.ca/pls/portal/docs/1/89503139.PDF — downloaded 17 August 2026,
    kept at sources/rosemont/rosemont_annexe_caracterisation_shoebox.pdf
  used_for: >-
    count_in_place (561) and the whole grading block. Counts computed from the table itself rather
    than taken from any summary: valeur architecturale 1 = 170, 2 = 233, 3 = 158; « couronnement de
    qualité » = 118; « construite en fonds de lot » = 56; « adjacente à une autre maison shoebox » =
    232; 77 distinct streets. Also the example_addresses on the shoebox record.
  note: >-
    This is the document that resolves a conflict in the Part 10 research memo. The memo gave the
    three classes as 69 / 258 / 235, which sums to 562 and does not match. The parsed table gives
    561 rows and 170 / 233 / 158, which agrees exactly with the percentages the Ville publishes
    (30.3 / 41.5 / 28.2). The memo's other Annexe F figure, 56 rear-lot houses, is confirmed exactly.
    The parse is reproducible: sources/rosemont/annexe_f_parsed.json holds all 561 rows as read.

- id: rosemont-reglement-01-279
  citation: >-
    Ville de Montréal, « Règlement d'urbanisme de l'arrondissement Rosemont–Petite-Patrie (01-279) »,
    codification administrative 01-279-78, dated 23 May 2024, 295 p. Copy served by the Office de
    consultation publique de Montréal (dossier P131, pièce 5-1); downloaded 17 August 2026 and kept
    at sources/rosemont/reglement_urbanisme_01-279_codification.pdf. Article 5 (definitions of
    « maison shoebox » and « maison shoebox d'intérêt »); art. 11.1 minimum height; art. 26.1 maximum
    height; art. 52.1 the 1 m upper-floor setback; Chapitre VIII and the art. 89 table of dominant
    architectural characteristics, where the maison shoebox d'intérêt is the row coded MS; art. 100.1
    compulsory couronnement; art. 135.1 usage categories H.1–H.3 and the H.1-only rule for value 3;
    Annexe B fascicule d'évaluation 10, « Maison shoebox d'intérêt », with separate criteria sheets
    for value 3 and value 2; Annexe F.
  used_for: >-
    The shoebox record's regulated massing, articulation, openings and conservation blocks; the
    grading block's intervention_fr; the governing_instruments entries; and the by-law numbers.
  note: >-
    The amending by-law that created the shoebox regime is 01-279-58. Its zone-by-zone successors are
    visible in the codification's own citation footers as 01-279-58-01 through 01-279-58-39 — thirty-
    nine of them, one per zone, which is the primary-source confirmation that thirty-nine zones went
    to signature registers. Later amendments touching the same articles: 01-279-66, 01-279-67,
    01-279-76. Rosemont's base by-law is 01-279; règlement 01-283-124 belongs to Villeray–Saint-Michel–
    Parc-Extension, whose base by-law is 01-283.

- id: ville-montreal-depliant-shoebox
  citation: >-
    Ville de Montréal, arrondissement de Villeray–Saint-Michel–Parc-Extension, Direction du
    développement du territoire, « Maisons de type « shoebox » — Guide pour les travaux et
    agrandissements », dépliant, année de publication 2019. Source credited on the dépliant to
    Isabelle Bouchard, M. Sc. A. conservation; photographs Archives de la Ville de Montréal and
    Société d'histoire de Parc-Extension; map Chas. E. Goad Co., Atlas of the City of Montréal and
    Vicinity, 1912–1914, vol. III, pl. 343, BAnQ.
    https://portail-m4s.s3.montreal.ca/pdf/depliant_maisons_shoebox_final_web.pdf — downloaded
    17 August 2026, kept at sources/rosemont/shoebox_depliant.pdf
  used_for: >-
    The verbatim definition of the type, its appearance « au début du XXe siècle » and its phases
    « jusqu'aux années 1960 », the self-build sentence, the origin of the name, the three
    caractéristiques architecturales (central door with two symmetrical windows; brick façade with a
    cornice or parapet couronnement; front galerie under a marquise), and the industrialisation /
    railway / tramway account of why workers bought peripheral lots.
  note: >-
    Attribution matters here and is stated on the place page. The dépliant is VSP's, not Rosemont's.
    Its definition is the one the Ville uses city-wide and is quoted as such; its statistics are VSP's
    own — 1,159 houses, 46.9 % of them built 1950–1960, 660 in the François-Perrault district — and
    none of them is used on this page.

- id: montreal-ca-shoebox-rosemont
  citation: >-
    Ville de Montréal, « Les maisons shoebox dans Rosemont–La Petite-Patrie », montreal.ca article
    22005 (page last updated 15 December 2021) —
    https://montreal.ca/articles/les-maisons-shoebox-dans-rosemont-la-petite-patrie-22005 —
    consulted 17 August 2026.
  used_for: >-
    Cross-check on the grading counts and percentages (170 / 30.3 %, 233 / 41.5 %, 158 / 28.2 %); the
