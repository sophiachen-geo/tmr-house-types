    dwelling limits by value; the demolition by-law reference RCA-6; and the link to the Annexe F PDF.

- id: rosemont-communiques-2019
  citation: >-
    Arrondissement de Rosemont–La Petite-Patrie, two press releases on CNW/Newswire: « Adoption du
    règlement visant la protection de maisons de type shoebox : un cadre clair et une protection sans
    précédent », 12 February 2019; and « Le règlement visant la protection de maisons de type shoebox
    s'appliquera maintenant à l'ensemble de l'arrondissement de Rosemont-La Petite-Patrie »,
    27 March 2019. Consulted 17 August 2026.
  used_for: >-
    The protection chronology: the moratorium instituted in May 2018 (« instauré en mai dernier »),
    adoption in « 3e et dernière lecture » on 12 February 2019, and full application across the
    borough on 27 March 2019. Also the borough's own claim to be « le premier à protéger cet élément
    distinctif de son patrimoine bâti », the 561 figure, and the mayor, François William Croteau.
  note: >-
    These are the borough's own releases, which is why they are used for the chronology rather than
    news coverage. The 12 February release states the first-borough claim; the 27 March release does
    not repeat it, and notes instead that other boroughs are now taking up the approach.

- id: gaudreau-shoebox-2021
  citation: >-
    Guy Gaudreau, « Les premières maisons shoebox montréalaises de Rosemont et de Villeray », Urban
    History Review / Revue d'histoire urbaine, vol. 49, no 1 (Fall/automne 2021), p. 4–29.
    DOI 10.3138/uhr-2020-0004.
  used_for: >-
    The promettants-acquéreurs mechanism — promises of sale from land companies requiring only a few
    dollars down, which allowed journaliers to build modest houses on their own lots — and the
    attribution of the earliest Rosemont and Villeray shoeboxes to that mechanism. This is the
    scholarly authority for calling the shoebox a self-build type.
  note: >-
    Cited from the publisher's and JSTOR's bibliographic records and the published abstract; the full
    text is behind a paywall and was not read for this encoding. Nothing in the type records depends
    on a claim from the body of the article.

- id: la-presse-shoebox
  citation: >-
    Two La Presse reports, used as PRESS and labelled as such on the page: « Maisons shoebox : des
    mesures qui compliquent la vie des propriétaires », 19 October 2018,
    https://www.lapresse.ca/actualites/grand-montreal/201810/19/01-5201010-maisons-shoebox-des-mesures-qui-compliquent-la-vie-des-proprietaires.php ;
    and « Un demi-million… à démolir », 20 September 2019,
    https://www.lapresse.ca/maison/immobilier/201909/20/01-5242101-un-demi-million-a-demolir.php
  used_for: >-
    Two figures the municipal record does not carry. First, the island-wide estimate — about a
    thousand shoebox houses in Montréal, roughly half of them in Rosemont–La Petite-Patrie — which is
    presented on the page as press, never as a municipal count. Second, the September 2019 case of a
    couple who paid $500,000 for an uninhabited Rosemont shoebox in order to demolish it and build a
    single-family house of over $700,000, a project that reached about $1.3 million.
  note: >-
    Neither article could be fetched directly (lapresse.ca returns 403 to automated requests); both
    are cited from search-index summaries carrying their headlines, dates and URLs. They are used only
    for the two attributed claims above, and both are flagged as press in prose.md so that no reader
    can mistake them for the municipal figures. Per the Part 10 brief, no commercial real-estate blog
    has been used for any date or count on this page.

