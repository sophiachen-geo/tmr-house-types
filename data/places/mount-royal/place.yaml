summary_en: >-
  Only Québec locality built entirely to one garden-city plan, drawn by Frederick
  Gage Todd in 1912 for the Canadian Northern Railway. Three build-out phases,
  1915–1975, each with its own family of houses; thirteen types codified in the
  town's design-review by-law.
