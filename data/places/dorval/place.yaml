    The Musée d'histoire et du patrimoine de Dorval, 1850 chemin du Bord-du-Lac — the former
    stables of the Forest and Stream Club, « bâtiment construit en 1874 par Alfred S. Brown,
    magasinier de la compagnie de chemin de fer Grand Tronc et directeur de la Banque de Montréal »
