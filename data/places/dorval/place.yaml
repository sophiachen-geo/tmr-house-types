summary_en: >-
  A lakeshore côte where every layer is still legible along one road. The Sulpicians put a mission
  on this shore in 1667 and called it Gentilly, then La Présentation de la Vierge Marie; Jean-
  Baptiste Bouchard dit Dorval took the land in 1691 and left his name; farming held the territory
  until the twentieth century. The Grand Trunk reached Dorval in 1855 and brought wealthy
  anglophone Montrealers, who built chalets and villas along the water and founded a yacht club,
  a golf club and the Forest and Stream Club. The village incorporated in 1892, became a town in
  1903 and a city in 1956; the airport of 1941 turned the rest of the farmland into a bungalow
  suburb and took the population from under 3,000 in the 1940s to more than 20,000 by 1971. Dorval
  was a Montréal borough from 2002 and a reconstituted cité from 2006. Nothing here is protected
  under the Loi sur le patrimoine culturel — not a building, not a sector — and the whole weight
  of conservation rests on a design-review by-law over thirty-two addresses.
