- id: dv-rpcq-216208
  citation: "RPCQ, Centre culturel Peter-B.-Yeomans et bibliothèque de Dorval (id 216208). Statut block: « Inventorié », authority and date blank; inventory of record « Inventaire des projets du Centenaire de la Confédération canadienne réalisés au Québec (2014 - 2019) ». Construction began February 1967; the centre opened in October 1967 and was inaugurated 18 November 1967; the library reopened in 1996 at almost double the area and was reorganised again in 2012."
