- id: dv-ville-histoire
  citation: "Cité de Dorval, official history page: the mission of 1667, first named « Gentilly », later « La Présentation de la Vierge Marie »; the 1691 concession to Jean-Baptiste Bouchard dit d'Orval; « The railroad, which came to Dorval in 1855, was highly instrumental in attracting many wealthier families »; and the status chain — « incorporated as a village in 1892, as a town in 1903, as a city in 1956, became a borough of Montreal in 2002, and a city again in 2006 »."
  url: "https://www.ville.dorval.qc.ca/en/the-city/page/history"
