- id: dv-eval-2005
  citation: "Ville de Montréal, Service de la mise en valeur du territoire et du patrimoine, Direction du développement urbain, Division du patrimoine et de la toponymie, « Évaluation du patrimoine urbain : arrondissement de Dorval–L'Île-Dorval », 2005, ISBN 2-7647-0450-X. Work carried out January 2003 – May 2004 under Jean-François Gravel for the Plan d'urbanisme adopted 23 November 2004; built evaluation and historical research by Julie Boivin, Elizabeth Bonner, Anne-Marie Dufour, Guy Lafontaine, Christiane Lefebvre and Pierre-Paul Savignac, architects, and Denise Caron, historian; archaeology by Claire Mousseau with Françoise Duguay, François Bélanger, Anne-Marie Balac and Christian Roy. Downloaded 17 August 2026 and converted with pdftotext -layout; 7 PDF pages, 162 KB of text."
  url: "http://ville.montreal.qc.ca/pls/portal/docs/page/patrimoine_urbain_fr/media/documents/07_evaluation_patrimoine_dorval.pdf"
