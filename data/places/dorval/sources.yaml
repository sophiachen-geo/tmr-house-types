- id: dv-piia-2024
  citation: "Cité de Dorval, « Règlement sur les plans d'implantation et d'intégration architecturale (PIIA) RCM-60I-2024 », December 2024, administrative codification à jour au 16 décembre 2025 (« Modifié par RCM-60A-22 le 16 décembre 2025 »; « Cette codification administrative n'a aucune valeur officielle »). Chapter 03, sub-chapter « Bâtiments d'intérêt patrimonial », articles 56–60; article 59 lists thirty-two addresses. Article 56 also states that Dorval « héberge deux bâtiments cités au répertoire du patrimoine culturel du Québec, soit le Centre culturel Peter-B.-Yeomans et la bibliothèque de Dorval, tous deux construits en 1968, ainsi que l'Église Strathmore United (310, avenue Brookhaven), édifiée en 1956 » — see notes: those records carry the statut « Inventorié », not a citation."
  url: "https://www.ville.dorval.qc.ca/storage/app/media/la-cite/administration-et-finances/reglements-municipaux/reglements-en-vigueur/rcm-60i-2024-piia-cod-a-jour-au-2025-12-16-fr-reduit.pdf"
