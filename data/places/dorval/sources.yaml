- id: dv-etude-dahlia-2024
  citation: "LEMAYMICHAUD + Réal Paul architecte inc., « Expertise historique et étude patrimoniale — 12, avenue Dahlia, Dorval », offre de service OSM-1297-2405-01, prepared for the Cité de Dorval, 60 avenue Martin. Sections 2.3 « Cadre légal de protection » and 7 « Analyse du cadre légal de protection »; the study concerns the Quatre-Vents residence of 1803, its enlargement of 1874–1885 by Désiré Girouard, its renovation of 1927–1937 by Josh Charles Asch, the chapel of 1960 and the annex of 1965."
