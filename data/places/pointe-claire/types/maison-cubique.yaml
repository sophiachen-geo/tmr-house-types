blurb_en: >-
  A massive, symmetrical two-storey block with an imposing gallery across the front, under a low
  hipped roof. It is the second of the two styles the Code villageois says rebuilt Pointe-Claire after
  the fire, and the Code describes it in a single sentence — which is exactly why it is worth carding:
  the record shows what a form-based code does and does not bother to say about a house.
origin_en: >-
  The Cubique arrives with the Boomtown, after the fire that took much of the village at the turn of
  the 20th century, and the Code sets the two side by side as the pair that "créent une certaine
  homogénéité". It survives in three of the ten landscape units, and the company it keeps in each of
  their style rows is worth reading: in UP5 it stands with Boomtown, Second Empire, mansard and
  vernaculaire industriel; in UP8 with vernaculaire industriel and Boomtown; in UP10 with Boomtown
  alone. Elsewhere on this site the same form is the maison cubique of Charlesbourg and the maison
  cubique of Gatineau and of the Île d'Orléans — a form that half of Québec's sources treat as a
  top-level type and the other half as a sub-variant of the industrial vernacular. Pointe-Claire's
  Code, characteristically, does neither: it treats it as a style.
