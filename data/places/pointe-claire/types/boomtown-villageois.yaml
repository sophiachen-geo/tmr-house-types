blurb_en: >-
  Two storeys in a cubic volume under a flat or barely sloping roof, regular vertical openings that
  are usually sashes, a front kept free of projections except for the gallery under its awning, and
  all the ornament gathered at the top in a moulded cornice, a parapet or a pattern laid in the brick.
  It is the style the Code villageois names for seven of its ten landscape units, which makes it the
  ordinary building of Pointe-Claire's village.
origin_en: >-
  The Code ties it to a rebuilding. The traditional Québec architecture of the oldest sectors, it
  says, recalls the village as it was up to the fire; after the fire, two styles produce a certain
  homogeneity, and the Boomtown, "apparue au début du 20e siècle", is the first of them. That is the
  whole of the origin story the source gives, and it is worth noticing what kind of document gives it:
  not an inventory, not a conservation plan, but a zoning by-law written on form-based principles,
  which had to describe the village's architecture in order to prescribe more of it. The same form
  under the same name is carded on this site at Charlesbourg, where a ministerial plan de conservation
  files it as one of three sub-variants of the maison vernaculaire industrielle — and the Code
  villageois lists « vernaculaire industriel » as a separate style of units UP5 and UP8, alongside the
  Boomtown rather than above it.
