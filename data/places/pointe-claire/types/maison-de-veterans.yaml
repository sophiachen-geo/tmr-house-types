blurb_en: >-
  Houses built about 1947 to the Wartime Housing Limited pattern, on the ground north of the railway
  that was the last part of Pointe-Claire to be opened. The programme was a wartime answer to a
  housing crisis; afterwards promoters took the model up for buyers who wanted an affordable detached
  house of their own. Few of the houses are left. What is left is the street plan.
origin_en: >-
  Pointe-Claire's population went from 1,240 in 1925 to 8,753 in 1951 and 21,926 ten years after that,
  and the veterans' sector is the front edge of that curve. The cahier sets it against the projet
  Magil in Lakeside Heights, one-and-a-half-storey cottages and red brick bungalows of 1953–1955 that
  it calls remarkable as an ensemble and little altered — the same postwar wave, ten years later,
  and much better preserved. Between them they are why the sentence the cahier closes its assessment
  with is worth quoting: « le tracé des rues et le lotissement de l'ancien quartier des vétérans de
  même que les formes architecturales du projet Magil nous plongent dans les principes d'urbanisme
  popularisés après la Seconde Guerre mondiale. »
