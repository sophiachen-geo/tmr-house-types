profile_fr:
  description:
    - "Ce secteur est composé de maisons construites autour de 1947 sur le modèle des maisons de la Wartime Housing Limited. Ce modèle est développé durant la Seconde Guerre mondiale pour répondre à la crise du logement qui sévit, mais il est adopté par la suite par plusieurs promoteurs qui cherchent à rejoindre un segment de marché désirant habiter une maison individuelle à prix abordable."
    - "Aujourd'hui, même s'il y reste bien peu de ces maisons de vétérans, le secteur continue de se démarquer par le tracé particulier des rues et le lotissement."
profile_note: >-
  Four of the five columns are empty, and that is the record. The cahier describes this ensemble by
  its provenance — houses built about 1947 on the Wartime Housing Limited model, a wartime answer to
  the housing crisis afterwards taken up by promoters selling affordable detached houses — and by what
  survives of it, which is the street plan and the lot pattern rather than the buildings: « il y reste
  bien peu de ces maisons de vétérans ». It gives no storeys, no roof, no cladding, no openings and no
  dimensions. The type is carded rather than left as a sector row, unlike the Vétérans ensemble at
  Lachine, because here the source does name the model the houses were built to, and that model has a
  canonical form and a documented description elsewhere on this site; the canonical page is where the
  five columns can be read. The style attribution is the Wartime Housing programme itself.
