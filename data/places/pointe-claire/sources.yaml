- id: pc-commons
  citation: >-
    Wikimedia Commons. Licence, author, description and file URL were read individually through the
    Commons API (action=query&prop=imageinfo&iiprop=url|extmetadata) on 17 August 2026 before any
    download, and every downloaded file was opened and looked at before publication. All the
    Pointe-Claire photographs are Commons re-uploads from the Flickr account « Parcours riverain -
    Ville de Montréal », CC BY 2.0, except the maison Hyacinthe-Jamme-dit-Carrière, which is from
    Wikipedia Takes Montreal 2011, CC BY-SA 3.0. The Parcours riverain photographs are not all by one
    person: each file's description names either Anne-Marie Dufour or Denis Tremblay, and each is
    credited to the one it names.
  url: https://commons.wikimedia.org/wiki/Category:Pointe-Claire
  used_for: >-
    The hero photograph and the photographs on the type cards, and the files staged in
    assets/places/pointe-claire/ for the shared West Island type records: noyau-villageois-commons.jpg,
    chemin-du-bord-du-lac-commons.jpg, avenue-demers-commons.jpg and
    ancien-hotel-canada-322-324-bord-du-lac-commons.jpg for the maison de tradition québécoise;
    secteur-avenue-du-golf-commons.jpg, secteur-bowling-green-commons.jpg and
    secteur-cedar-park-avenue-cedar-commons.jpg for the villa anglaise de villégiature; and
    maison-hyacinthe-jamme-dit-carriere-commons.jpg for the maison de pierre du Régime français. One
    candidate was rejected on inspection: « Avenue Maywood, Pointe-Claire » is titled for a street
    that carries two buildings on the PIIA heritage list, but the photograph is of modern apartment
    blocks and shows neither.

- id: pc-flickr-parcours-riverain
  citation: >-
    Flickr, « Parcours riverain - Ville de Montréal » (flickr.com/photos/parcoursriverain). Licence
    checked directly against the page source on 17 August 2026: license-id 4, a link to
    creativecommons.org/licenses/by/2.0/, title "CC BY 2.0", visible text "Some rights reserved". Free
    for reuse with attribution. Part 11 § 1.3 attributes the set to Anne-Marie Dufour; that is only
