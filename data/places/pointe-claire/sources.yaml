    https://www.pointe-claire.ca/assets/images/Documents/PC-2880_Code-Villageois_2025-10-03-1.pdf —
    retrieved 17 August 2026; sha-256
    0260fd91e6166363c172903e8431f90e0b1922917c4b20114904dd0dda8a2f3c. Parsed with pdftotext -layout to
    sources/west-island/pointe-claire/PC-2880_Code-Villageois.txt.
  url: https://www.pointe-claire.ca/affaires-juridiques/reglements-municipaux/code-villageois-applicable-au-village-de-pointe-claire
  used_for: >-
    Both type records, verbatim, from chapitre 03 « Architecture villageoise »; the gabarit rule of
    the same chapter; the ten unités paysagères of chapitres 04–13 with their full summary tables,
    transcribed into sectors.yaml; the bâtiments d'intérêt architectural named by amendment PC-2880-4;
    and the form-based-planning claim quoted on the instrument row. Also the two dates the Code gives
    for the village fire — 1901 in chapitre 03 and 1900 in the same chapter and again in UP3 — which
    are recorded as a contradiction and not resolved.

- id: pc-evaluation-2005
  citation: >-
    Ville de Montréal, Service de la mise en valeur du territoire et du patrimoine, Division du
    patrimoine et de la toponymie, « Évaluation du patrimoine urbain : arrondissement de
    Pointe-Claire », 2005, ISBN 2-7647-0448-8, dépôt légal BNQ / BNC 2005 — made in the four years
    Pointe-Claire spent as a borough of the Ville de Montréal, and part of the same twenty-seven-volume
    series as the Lachine cahier. The borough is coded 5 in the text and the PDF is filed as 19.
    http://ville.montreal.qc.ca/pls/portal/docs/PAGE/PATRIMOINE_URBAIN_FR/MEDIA/DOCUMENTS/19_EVALUATION_PATRIMOINE_POINTE-CLAIRE.PDF
    — retrieved 17 August 2026; sha-256
    f528324af4e4db529b497acb532d74fcd5fb0c5f6e8dbc404a19e6216a6de7b7; 56 PDF pages. Parsed with
    pdftotext -layout to sources/west-island/pointe-claire/19_evaluation_patrimoine_pointe-claire.txt.
  url: http://ville.montreal.qc.ca/pls/portal/docs/PAGE/PATRIMOINE_URBAIN_FR/MEDIA/DOCUMENTS/19_EVALUATION_PATRIMOINE_POINTE-CLAIRE.PDF
  used_for: >-
    Twenty-two of the sector rows (5.E.1–5.E.7, 5.I.1–5.I.12, 5.U.1–5.U.3); the veterans' house type
    record; the two tracés fondateurs — the chemin du Bord-du-Lac and the line of the côte Saint-Jean
    followed by the boulevard Saint-Jean, avenue Douglas-Shand and avenue Maywood, along which the
    Sulpicians conceded land from 1720; the fire of May 1900 and its origin in a tinsmith's shop; the
    village municipality of Saint-Joachim-de-la-Pointe-Claire created 1854 and the incorporation as a
    ville in 1911; the quarry from 1850 and the stone shipped by rail for the Victoria Bridge; the
    population series 1,240 (1925), 8,753 (1951), 21,926 (1961) and 29,049 at the turn of the 21st
    century; the garden-suburb sequence from Cedar Park in 1893 to the Bowling Green of 1905; and the
    Frederick G. Todd and Robert Findlay attributions. It is also the source of three factual
    conflicts recorded in the notes rather than resolved: the mill's date, the mill's ownership, and
    the church's dates.

- id: pc-rpcq-93473
  citation: >-
    Répertoire du patrimoine culturel du Québec, fiche « Moulin à vent de Pointe-Claire », id 93473.
    Source of the statement of value: Ministère de la Culture et des Communications du Québec, 2004.
    https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=93473 —
    retrieved 17 August 2026; sha-256
    cbbe13588f04fb1b50b67caa3795cecfd044ea3971f6973a96f6eb559a0c5b89.
  url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=93473
  used_for: >-
    The classement (Immeuble patrimonial, Ministre de la Culture et des Communications, 1983-03-21),
    its conservation categories 2 and 5, and the sentence fixing the protection to the building inside
    and out but not the land; the second status the mill carries inside the cited site; the Sulpician
    ownership and the 1698 land reservation; the moulin banal and droit de banalité; the loopholes and
    the redoubt function, and the 1729 stockade; the disuse between 1880 and 1885 and the conversion to
    an observatory with a terrace roof carrying a wind pump for the convent's private aqueduct; and
    the restoration sequence — begun 1954, conical roof restored 1962, sails added 1967 — which
    corrects the ambiguous single sentence in the site fiche.

- id: pc-rpcq-92796
  citation: >-
    Répertoire du patrimoine culturel du Québec, fiche « Maison Hyacinthe-Jamme-Dit-Carrière », id
    92796. Source of the statement of value: Ministère de la Culture et des Communications du Québec,
    2004. https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=92796
    — retrieved 17 August 2026; sha-256
    5d98a41a91947f21f136c40bbaf3a2f9dd7b55f25555e029eb75dbc7215e1077.
  url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=92796
  used_for: >-
    The classement of 1964-08-12 and its reach over the building inside and out and over the land; the
    construction between 1769 and 1791 on a censive conceded in 1722 along the côte Saint-Jean; and
    the five-column evidence Pointe-Claire contributes to the shared West Island record for the maison
    de pierre du Régime français — the low fieldstone body, the one-and-a-half storeys, the steep
    two-slope roof, the two chimneys in the gable walls, the asymmetrical openings and small-paned
    casements, the south-facing façade with a north wall pierced by only two windows, the almost square
    plan, the absence of roughcast, the raised basement of 1828 and the bell-cast eaves and covered
    front gallery that the fiche reads as neoclassical influence on a traditional house.

