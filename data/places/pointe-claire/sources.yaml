  url: https://www.pointe-claire.ca/assets/images/Documents/pc-2787_piia_codif_2024-12-10.pdf
  used_for: >-
    The instrument row; the chapter 13 list of buildings of heritage interest by civic address, which
    is the source of every named house on this page (maison Tunnoch, maison Legault, maison
    Napoléon-Charbonneau, maison Baucet, maison Henri-E.-Vautelet, maison Mgr-Mitchell, maison
    Antoine-Pilon, maison Charlebois, maison Docteur Park, maison Arthur Harris, maison Deslauriers,
    maison Antoine-Felsque, maison Gédéon-Legault, maison Pierre-Demers, maison Brunet, maison
