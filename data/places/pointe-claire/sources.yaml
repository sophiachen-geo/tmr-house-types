    c4416c5810950fb6a469a4ee539d0b1ca1d319198f8bd638ca30c64732c08a80.
  url: https://www.pointe-claire.ca/assets/images/Documents/PC-2808_Site_patrimonial.pdf
  used_for: >-
    The by-law NUMBER, which Part 11 § 4 lists as outstanding, and its adoption date, resolution
    number, signatories and in-force line; the seven cadastral lots of the perimeter; the four grounds
    of heritage value in the council's own words; the acts made subject to conditions and the
    forty-five-day notice; the demolition control; the named religious and historic components and the
