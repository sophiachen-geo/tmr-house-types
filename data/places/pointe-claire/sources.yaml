  citation: >-
    Répertoire du patrimoine culturel du Québec, fiche « Site patrimonial de la pointe Claire », id
    196303 (other name: Site patrimonial du noyau institutionnel de Pointe-Claire). Source of the
    description, statement of value and éléments caractéristiques: Ville de Pointe-Claire, 2013.
    https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=196303 —
    retrieved 17 August 2026; sha-256
    82d12efe26bb65a00e8d8525cf22e2404d4179e51604eb9690e9cb160af7324c.
  url: https://www.patrimoine-culturel.gouv.qc.ca/rpcq/detail.do?methode=consulter&type=bien&id=196303
  used_for: >-
    The citation as recorded in the statut block (Citation, Site patrimonial, Municipalité
    (Pointe-Claire), 2013-04-02, over the statut antérieur « Avis de motion de citation, 2012-12-03 »);
    the 2.7 hectares and the polygon's contents and bounds; the sentence fixing the reach of the
    protection to the terrains and the exterior envelopes; the "Patrimoine immobilier associé (9)"
    header; the dates and authorship of the church (1882-1885, Victor Bourgeau and Alcibiade
    Leprohon), the convent (1867-1868, Henri-Maurice Perrault), the presbytery (1913, Théodose Daoust,
    on the 1848 masonry body) and the mill (1709-1710, charpentiers Léonard and Charles Paillé, maçon
    Jean Mars); the whole historical sequence from the 1705 presbytère-chapelle to the 1946 relocation
    of the cemetery; and the sector row SP-1.

