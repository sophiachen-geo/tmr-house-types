- id: tr-ville-histoire
  citation: >-
    Ville de Trois-Rivières, "Histoire de Trois-Rivières" (page last updated 30 January 2025) —
    survol historique and ligne du temps. On the fire: "Le 22 juin 1908, Trois-Rivières connaît
    l'incendie le plus dévastateur de son histoire… Près de 800 bâtiments sont rasés, ruinant et
    jetant des centaines de personnes à la rue." On the reconstruction: "En 1912, quatre ans après le
    grand incendie, le centre-ville de Trois-Rivières est à nouveau animé. Rebâti par une poignée
    d'architectes et d'entrepreneurs, le quartier présente une grande homogénéité architecturale qui
    se constate encore aujourd'hui."
  url: https://www.v3r.net/culture/histoire-et-patrimoine/histoire-de-trois-rivieres
  used_for: [phases, prose]
- id: tr-radio-canada-2008
  citation: >-
    "Un feu centenaire", Radio-Canada, 2008 — "un incendie qui a ravagé le quart de la ville";
    "Plus de 800 bâtiments ont été rasés par les flammes"; "Tout le secteur situé entre les rues du
    Fleuve, Bonaventure, Champlain et Saint-Georges avait été complètement dévasté. Quelque 800
    bâtiments avaient été rasés par le feu."; "Les pompiers avaient combattu les flammes pendant 24
    heures. Il n'y avait eu aucun mort ni blessé à la suite de cet incendie dévastateur."
  url: https://ici.radio-canada.ca/nouvelle/401911/incendie-1908-trois-rivieres
  used_for: [prose]
- id: tr-uqtr-incendie
  citation: >-
    Micheline Champoux, "Le grand incendie de Trois-Rivières", Histoire et culture régionale du
    Québec, Université du Québec à Trois-Rivières — "un incendie a détruit toute la partie de la
    ville située entre les rues du Fleuve, Bonaventure, Champlain, et Saint-Georges"; "En tout, 800
    bâtiments, y compris hangars et entrepôts, ont brûlé"; "Plus de 200 résidences et presque tous
    les commerces de la ville ont été complètement rasés par les flammes."
  url: https://oraprdnt.uqtr.uquebec.ca/portail/gscw031?owa_no_site=4080&owa_no_fiche=53
  used_for: [prose]
