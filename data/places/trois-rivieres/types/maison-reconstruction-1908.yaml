blurb_en: >-
  A quarter rebuilt in four years by, as the City puts it, a handful of architects and contractors — and the evenness
  that produced is the heritage claim, not a side effect of it. Brick, flat roofs, two to four storeys in continuous
  rows, ornament gathered into parapets, cornices on consoles, keystones, lintels and brick banding. The fire took the
  commercial centre and largely spared the old core, so this fabric surrounds the declared site rather than filling it;
  but the site's widened streets, its public space on the burnt parish church's ground, and thirteen of its
  forty-five buildings belong to the same four years.
origin_en: >-
  The fire of 22 June 1908 began in a hay store, pushed back the city's eight firefighters within a quarter of an hour,
  and brought help from Shawinigan, Grand-Mère, Québec and Montréal. How much it destroyed is genuinely contested and
  the figures are set out with their attributions in the notes on the place page — the City says "près de 800
  bâtiments", its own Patri-Arch study says "environ 200 bâtiments", Radio-Canada says a quarter of the city and no
  casualties, and the UQTR account reconciles the two counts as buildings-including-sheds against residences. What is
  not contested is the speed and the singleness of the rebuilding, and its material — a city still largely of wood in
  1900 was 55 % brick-housed by 1931.
