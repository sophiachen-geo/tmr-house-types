blurb_en: >-
  Roofs of unequal slope running into one another, big chimneys, exposed rafters under wide overhangs, cedar shingle
  and stucco and stone used together, and windows put wherever the plan wanted them. The City's fiche declines to give
  a type description and says so: every case is unique and has its own characteristics. In Trois-Rivières it arrived
  with the paper company — place Freeman, the old terrasse Saint-Maurice, was the address of the Saint-Maurice Paper
  Company's bosses — and then filtered down through every layer of society until 1939.
origin_en: >-
  Ruskin and Morris, reacting against industrialisation and standardisation by way of English craft and the English
  country house; the movement converged with the garden city. Crossing to the United States it split into the Shingle
  Style of the east coast, the Prairie Style of the centre and the Craftsman of the west, and the catalogues and plan
  magazines carried all three across North America through the first half of the twentieth century. The City's fiche is
  candid that the idea did not survive the crossing — "en Amérique, le mouvement Arts & Crafts devient essentiellement
  un mouvement stylistique, sans portée sociale."
