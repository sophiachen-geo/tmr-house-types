blurb_en: >-
  When coal tar made the waterproof flat roof possible, the urban dwelling became a stack. Two or three storeys of
  superposed flats, each with its own door off the street reached by its own stair, put up at speed on cramped lots by
  the first property developers the city had seen, to house the mill workers. The oldest of them still carry the
  Boomtown's gallery-and-balcony arrangement — the fiche calls that their filiation — while the parapet turns from an
  applied cornice into stepped brick with friezes, and then into curves and counter-curves.
origin_en: >-
  The plex coexisted with the Boomtown house and then supplanted it about 1910; it is the house that matches the
  accelerated urban growth of 1910 to 1930, and by the 1920s the Patri-Arch Synthèse records it as the principal
  workers' dwelling in Trois-Rivières. The Depression and the Second World War left only an impoverished version, and
  it faded slowly in favour of the apartment block with a single common entrance. The interwar plex is a near relation
  of proto-rationalist architecture — the regular-framed, plainly detailed brick manufactories and warehouses of
  1850-1890 — and it is the rational, simple, easily built and economical side of it that ties the plex to that
  current. The same superposed-dwelling form is followed through the canonical layer under `plex-superposed-units`.
