profile:
  siting_landscape:
  - Built by property developers on cramped lots, as contiguous houses put up at speed to house the workers who
    supplied the labour for the city's rapid industrialisation.
  - Inside the declared site these are the îlots résidentiels — narrower parcels, more densely occupied, evidence of a
    stronger urban pressure during industrialisation than in the other sectors, though a tree cover survives in the
    back yards.
  - The RPCQ's second residential register for the declared site — "des immeubles d'habitation construits sur des lots
    étroits", against the maisons cossues.
  massing:
  - Cubic-looking volume, generally of two or three storeys.
  - Several dwellings, each with its own direct entrance from outside.
  - Numerous exterior extensions — balcony, gallery, stair. On the plainest examples these batteries of acrobatic
    stairs, balconies and galleries are the only decoration left.
  - Many have polygonal or rectangular projections; some have galleries and balconies carried on brick piers,
    sometimes arcaded; others have a setback cutting re-entrant angles wholly occupied by galleries and balconies in
    loggia, on masonry supports so strongly stated that they redraw the cubic volume.
  - Concrete foundations appear with this current.
  articulation:
  - Varied ornament — cornice, parapet, decorative banding, lintel, keystone, brick or stone insets.
  - Parapets with applied cornices give way to stepped brick parapets with friezes, or decorative brick panels,
    appearing tentatively about 1910.
  - Walls end in worked cornices of wood or metal, sometimes curved, sometimes with dentils and consoles, and often
    paired with parapets under cornices (1890-1915) or with scalloped parapets cut in curves and counter-curves
    (1910-1930).
  - Many plexes carry construction dates or patriotic motifs moulded into cement insets set in the brickwork.
  openings:
  - Segmental-arched openings are frequent, especially on the earliest plexes; later, lintels increasingly replace the
    segmental arches, in cement like the sills.
  - Sash windows, often with a transom or decorative mullions; sometimes sash with casement storm windows, often tall
    and of six panes; the upper part sometimes forms a transom decorated with stained glass.
  materials:
  - Traditional materials — brick cladding, wood openings.
  - Red or brown clay brick on many; concrete block imitating rusticated stone on others; limestone on a few
    exceptions.
  - Rare sheet-metal claddings imitating rusticated stone need upkeep or rust will make them disappear.
profile_fr:
  description:
  - "Le secteur regroupe également des bâtiments associés à l'industrialisation, comme des maisons boomtown et des
    immeubles à logements, caractérisés par un volume cubique, un toit plat et une ornementation modeste."
  - "les immeubles de logements (caractérisés par un volume cubique, un toit plat, une élévation de deux à trois
    étages, une corniche ornementée ainsi que des balcons en bois ou en fer forgé)"
  contexte:
  - "Les habitations de type « plex » sont ces maisons à logements multiples qui comportent deux (duplex), trois
    (triplex), quatre (quadruplex) ou plusieurs unités d'habitation superposées qui ont des entrées indépendantes. Ce
    type de logement côtoie, puis supplante l'architecture Boomtown vers 1910. C'est la maison qui correspond à la
    croissance accélérée des villes de 1910 à 1930."
  - "Un nouveau matériau, le goudron, obtenu par la distillation du charbon, amène la construction du toit plat, à
    bassins ou à égout intérieur. L'habitation urbaine devient un immeuble à logements superposés et le volume cubique
    s'affirme sans détour. Les parapets à corniches appliquées cèdent la place aux parapets de brique à gradins et à
    frises, ou panneaux de brique décoratifs, apparus timidement vers 1910. Les plus anciens reprennent d'ailleurs la
    disposition des balcons et galeries propres aux maisons Boomtown, marquant ainsi leur filiation."
  - "Avec ces bâtiments, on assiste à une première manifestation d'envergure des promoteurs immobiliers qui réalisent
    sur des terrains exigus des maisons contiguës, construites en vitesse pour loger les ouvriers qui alimentent en
    main d'œuvre l'industrialisation rapide de la ville."
  volumetrie:
  - "Volume d'aspect cubique, généralement de deux ou trois étages"
  - "Plusieurs logements possédant une entrée extérieure directe"
  saillies:
  - "Nombreux prolongements extérieurs : balcon, galerie, escalier"
  - "Les prolongements extérieurs deviennent le trait spécifique de cette architecture. Chaque logement possède ainsi
    son entrée directe, accessible par un escalier (intérieur ou extérieur) et un balcon parfois imposants."
  ouvertures:
  - "Ouvertures à arc surbaissé fréquentes, fenêtres à guillotine, souvent avec imposte ou meneaux décoratifs"
  revetements:
  - "Matériaux traditionnels : parement de brique, ouvertures en bois"
  ornementation:
  - "Ornements variés : corniche, parapet, bandeau décoratif, linteau, clé de voûte, insertion de briques ou de
    pierre, etc."
  sous_variantes:
  - "Ce courant est composé de diverses tendances. Les maisons sont le plus souvent de volume cubique, à deux ou trois
    étages. Plusieurs disposent de saillies polygonales ou rectangulaires. Certaines résidences ont leurs balcons et
    galeries soutenus par d'intéressants piliers en brique, parfois à arcades, alors que d'autres comportent un
    décroché qui découpe des angles rentrants complètement occupés par des galeries et balcons en loggias, à supports
    maçonnés si fortement affirmés qu'ils redessinent un volume cubique."
  - "Plusieurs possèdent un parement en brique d'argile rouge ou brune, d'autres sont construites en bloc de béton,
    imitant la pierre à bossage, alors que quelques exceptions le sont en pierre calcaire. Les fondations en béton font
    leur apparition avec ce courant."
profile_note: >-
  A naming caution the sources force. The Ville de Trois-Rivières catalogues TWO distinct currents here, and this record
  encodes the first — "Immeuble de type « plex »", where every dwelling has its own direct entrance from the street —
  and not the second, "Immeuble d'appartements", which the same fiche distinguishes explicitly: "Contrairement aux
  bâtiments de type « plex », les immeubles d'appartements possèdent une seule et même entrée commune à tous les
  logements." The RPCQ and the Plan de conservation, writing about the declared site, use the phrase "immeubles à
  logements" for buildings whose described characteristics — cubic volume, flat roof, two to three storeys, ornamented
  cornice, wood or wrought-iron balconies — match the plex. The record slug follows the ministerial phrase and the
  French name carries both, so that neither vocabulary is lost. The apartment block with one common entrance is a
  separate form and is not encoded here.
conservation_fr:
- "Si une partie du parement de brique de ces maisons est refait, il importe de bien marier les couleurs de maçonnerie.
  Il faut éviter en outre de peindre la brique ou d'y appliquer des parements d'aluminium ou de vinyle. Lors d'un
  rejointoiement, il faut appareiller le mortier à l'existant afin d'éviter de créer des démarcations disgracieuses."
- "Il faut éviter d'araser, ou niveler, les parapets à gradins. Il est préférable de les consolider en les appuyant
  solidement du côté de la toiture."
- "Il convient de ne pas transformer les ouvertures ou murer les impostes."
- "L'application d'un parement d'aluminium sur les couronnements de murs et les abris de balcons est à éviter, car il
  les dénature en gonflant démesurément le volume."
- "Dans les cas de maisons contiguës ou jumelées, il faut éviter toute rénovation ponctuelle en apportant des
  modifications pour des motifs personnels, au détriment d'une esthétique d'ensemble."
- "Il faut éviter d'utiliser des garde-corps en planches découpées et préfabriquées ainsi que des mains courantes de
  section trop faible. Les garde-corps de 42 pouces (1,07 m) de hauteur requis par la réglementation d'aujourd'hui
  peuvent être obtenus par l'ajout d'une deuxième main courante au garde-corps de 36 pouces (0,914 m) en place, sans
  déparer l'existant."
conservation:
- 'Prefer: where part of the brick cladding is redone, match the masonry colours carefully. Do not paint the brick or
  apply aluminium or vinyl cladding to it. When repointing, match the mortar to what is there, to avoid ugly
  demarcations.'
- 'Avoid: levelling off the stepped parapets. Consolidate them instead, by bracing them solidly on the roof side.'
- 'Avoid: altering the openings or blocking up the transoms.'
- 'Avoid: aluminium cladding on the wall crowns and the balcony shelters — it distorts them by swelling the volume out
  of all proportion.'
- 'Avoid: on contiguous or semi-detached houses, piecemeal renovation making changes for personal reasons at the
  expense of the aesthetic of the whole.'
- 'Prefer: today''s required 42-inch (1.07 m) guard height can be reached by adding a second handrail to the existing
  36-inch (0.914 m) railing, without spoiling what is there. Avoid guards of cut-out prefabricated boards and handrails
  of too slight a section.'
