blurb_en: >-
  The merchant's house of a river town that had money before it had industry, standing back from the street behind
  mature trees on the thinnest-built edge of the old core. Stone in the first half of the nineteenth century, brick by
  the turn of the twentieth, always well clear of the ground and always symmetrical — the neoclassical order held on
  here longer than anywhere else in Québec, and when it finally loosened it did so into Second Empire mansards and
  eclectic crowns rather than into anything plainer.
origin_en: >-
  English neoclassicism arrived with the British and Scottish military engineers and architects at the start of the
  nineteenth century, and the City's fiche notes that in Trois-Rivières it gave ground to eclecticism more slowly than
  elsewhere, even reviving early in the twentieth century as Beaux-Arts. Its bourgeois version is what the RPCQ means
  by "des maisons cossues", the first of the two residential registers it says characterise the declared site — the
  other being "des immeubles d'habitation construits sur des lots étroits". The same opulent-house form is described
  under `maison-cossue-ornamented` at Vieux-Terrebonne, where the declaration reads it off the rue Saint-Louis crest;
  here it is read off the terrasse Turcotte and rue des Ursulines.
