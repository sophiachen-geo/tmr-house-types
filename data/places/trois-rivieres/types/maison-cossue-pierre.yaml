profile:
  siting_landscape:
  - Along the terrasse Turcotte and rue des Ursulines, where the declared site's occupation is at its thinnest —
    the RPCQ contrasts "la faible densité d'occupation en bordure de la rue des Ursulines et de la terrasse Turcotte"
    with the smaller, more densely built lots of rues Saint-Pierre, Saint-François-Xavier, Saint-Louis and des Casernes.
  - Deeper front margins than in the institutional blocks, and a marked tree cover, in the Plan de conservation's
    unité de paysage of "maisons urbaines individuelles".
  - The grandest georgian houses stand alone in the middle of a large lot.
  massing:
  - Rectangular body well clear of the ground, two or two and a half storeys.
  - Two- or four-slope roof of medium or shallow pitch; mansard roofs on the Second Empire examples.
  - Monumental in effect rather than in size; the Plan de conservation calls the group homogeneous in volume,
    height and material.
  - Few or no projecting elements such as balconies and galleries in the neoclassical register; on the Second Empire
    and eclectic examples, a projecting central bay marking the entrance, turrets, and polygonal projections.
  articulation:
  - Order, symmetry and sobriety are the three watchwords of the neoclassical register — regularity in the plan
    as much as in the distribution of the openings, sometimes to the point of austerity.
  - Classical ornament drawn from antiquity — pediment, round arch over the openings, columns, piers, pilasters,
    quoins, cornice returns.
  - On the eclectic examples, an elaborate crown — cornices on consoles and modillions, carved lintels, worked
    cornices, dormers under semicircular pediments.
  - Main entrance marked by a porch or a portal.
  openings:
  - Casement or sash windows, with panes.
  - Round-arched doors and windows and oculi in the palladian register; segmental-arched openings on the later ones.
  - Symmetrical arrangement of openings and chimneys, the English signature on a house otherwise French in its
    siting and roof.
  materials:
  - Smooth wall surfaces — cut stone, roughcast, brick or wood boards.
  - Stone in the earlier houses; the Plan de conservation records that the declared site's ten stone buildings
    include the classed houses, and that only two stone dwellings postdate 1900.
  - Brick predominates in the turn-of-the-century group, which the Plan de conservation describes as
    "résidences individuelles en brique à deux niveaux d'habitation".
  - Copper roofing on at least one — the house of about 1850 at 858 terrasse Turcotte.
profile_fr:
  description:
  - "Le XIXe siècle est représenté par des demeures bourgeoises en pierre, comme la maison Hertel-De La Fresnière
    (1824-1829) et celles qui longent la terrasse Turcotte."
  - "les bâtiments témoignant de la fonction résidentielle au XIXe siècle, entre autres les résidences bourgeoises
    de styles variés (néoclassique, Second Empire et georgien)"
  - "Cette unité de paysage est formée de bâtiments individuels de type résidentiel et regroupe surtout des résidences
    cossues datant du tournant du XXe siècle… Les résidences présentent des caractéristiques architecturales homogènes
    en ce qui a trait au volume, à la hauteur et aux matériaux. Les résidences individuelles en brique à deux niveaux
    d'habitation prédominent dans cette unité."
  volumetrie:
  - "Corps de bâtiment rectangulaire bien dégagé du sol, à un ou deux étages"
  toiture:
  - "Toiture à deux ou à quatre versants de pente moyenne ou faible"
  saillies:
  - "Peu ou pas d'éléments en saillie tels les balcons, galeries"
  revetements:
  - "Revêtements lisses : pierre de taille, crépi, brique ou planches de bois"
  ouvertures:
  - "Ordonnance, symétrie et sobriété dans les compositions et la distribution des ouvertures"
  - "Fenêtre à battants ou à guillotine, à carreaux"
  - "Entrée principale soulignée par un porche ou un portail"
  ornementation:
  - "Ornements classiques variés : fronton, arc en plein cintre au-dessus des ouvertures, colonnes, piliers, pilastres,
    chaînage d'angle, retour de corniche"
  sous_variantes:
  - "Trois-Rivières compte également plusieurs maisons georgiennes. Ces résidences monumentales constituent un style
    néoclassique assez pur, proche de modèles du nord-est des États-Unis : grandes maisons à deux étages et demi, de
    composition symétrique, avec retours de corniche amorçant des frontons. Ces maisons de briques se dressent toujours
    seules au centre d'un terrain vaste."
  - "L'architecture palladienne est caractéristique de l'austérité néoclassique. Elle présente en effet une ordonnance
    irréprochable et une parfaite symétrie. Il est fréquent d'y voir un avant-corps central et un porche ouvert à
    fronton coiffé d'un toit en pavillon. Ses composantes distinctives sont les portes et fenêtres réalisées en arc en
    plein cintre, la présence d'oculi et un parement en pierre de taille."
  - "Le cottage Regency arbore une architecture en communion avec son environnement. Parmi ses principales
    caractéristiques, on note le profil bas de la toiture à quatre versants dont les avant-toits se prolongent au-delà
    des murs et recouvrent une galerie ceinturant le carré de la maison."
profile_note: >-
  This record is assembled, not transcribed. The City publishes no fiche for a "maison cossue" — the term is the
  ministry's, used in the RPCQ fiche and in the Plan de conservation's unité de paysage "les maisons urbaines
  individuelles". The five columns therefore take their architectural detail from the City's Néoclassicisme fiche,
  which is the courant the RPCQ names first for these houses, and their siting and material detail from the two
  ministerial documents. The phase is provisional because the sources straddle two of them: the RPCQ places the stone
  bourgeois houses in the nineteenth century, with the maison Hertel-De La Fresnière at 1824-1829, while the Plan de
  conservation's cossues date "du tournant du XXe siècle". The RPCQ names three registers for these houses —
  "néoclassique, Second Empire et georgien" — and the third has no style id in this project; it is recorded verbatim
  above instead of being forced into one.
conservation_fr:
- "Le choix des matériaux revêtant les lucarnes et la toiture ainsi que le choix du modèle de garde-corps ne
  conviennent pas à cette architecture au caractère noble."
- "Cette résidence aux influences néoclassiques a malheureusement perdu l'ensemble de ses attributs par le recours à
  des matériaux de revêtement, des modèles de fenêtres et de portes, ainsi qu'à des garde-corps inappropriés."
conservation:
- 'Avoid: cladding and roofing materials on the house and its dormers, and railing patterns, that do not answer to the
  noble character of this architecture.'
- 'Avoid: the combination that has stripped one such house of all its attributes — replacement cladding, replacement
  window and door models, and unsuitable railings, applied together while the overall composition was respected.'
