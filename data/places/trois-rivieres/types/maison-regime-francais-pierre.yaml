blurb_en: >-
  The house the first colonists built and the notables rebuilt in stone: a squat rectangle sitting straight on the
  ground without a cellar, one floor under a steep roof that could reach 55 degrees, few windows because the winter
  demanded few, and massive chimneys because it demanded many. In town the party walls run up past the roof as
  fire-breaks. Trois-Rivières had almost no local stone, so the stone version was always the exception — the mark of a
  family with the means to ship it from the south shore.
origin_en: >-
  Brought from rural north-western France — Brittany, Normandy, the Île-de-France — and adapted fast to a country with
  different materials and a harsher winter. The RPCQ says of the declared site that "le Régime français a légué… la
  maison Saint-François… des résidences de notables en pierre, comme le manoir de Tonnancour (1795-1797)". The form
  outlived the Conquest by the isolation of the population, and buildings put up between 1780 and 1820 still show it;
  from the 1820s, crossed with English neoclassicism, it produced the maison de tradition québécoise. The 1908 fire
  destroyed several of the city's French-regime buildings, including the parish church and the maison des Gouverneurs.
