blurb_en: >-
  Two storeys, a flat roof or one falling gently to the rear, and a front wall carried up past it into a cornice or a
  parapet so the building looks taller from the street than it is from the lane. Balloon-framed, so it went up fast;
  clapboard or brick; a big gallery across the front under an independent awning, with a balcony on its middle third
  and cast-iron railings. Trois-Rivières has enough of them, the City says, for the form to count as characteristic of
  the city — and the small diamond attic vents punched into the high clear front are a trifluvien signature the
  inventory says is little found elsewhere in Québec.
origin_en: >-
  The form is one of the strongest comparisons this site can make, because six independent municipalities describe it
  in their own words and the descriptions agree. Follow `boomtown-false-front` in the canonical layer to reach them —
  Québec City's thésaurus node tid 502, the flat-roofed types of the Ville de Gatineau's 2023 fiches, Saint-Lambert's
  two Boomtown fiches, the Ville de Lévis's styles-architecturaux fiche idfiche 10 ("1 à 2 étages… toiture plate ou à
  très faible pente vers l'arrière… parapet ou corniche, galerie couverte"), and this record. Every one of them
  arrives at the same building from a different municipal vocabulary. The mechanism is the same everywhere: balloon
  framing and sawn planks made construction fast and cheap after the crisis of 1870, and the boom towns of rapid
  industrial growth took it up for houses and shops alike. In Trois-Rivières it first coexisted with the maison
  villageoise de tradition québécoise and the mansard house, supplanted both at the turn of the twentieth century, and
  was in turn supplanted by the plex in the 1920s.
