blurb_en: >-
  Two full storeys on a square plan under a shallow hipped roof — Frank Kidder's Four-square of 1891, sold through
  American plan catalogues on the strength of how much room it gave for the money, and taken up across Québec in the
  first half of the twentieth century. In Trois-Rivières it settled equally on the bare rural plains and in the denser
  village cores, and its ornament is a straightforward index of the first owner's means: chambranles only on one
  house, corner boards, turned columns and worked railings on the next.
origin_en: >-
  One branch of the industrial vernacular that standardised materials, mechanised the work and distributed plans
  through catalogues and magazines from the end of the nineteenth century, alongside the balloon frame that made
  building fast. The same square hipped block is followed through the canonical layer under `foursquare-hipped-2st`,
  where it can be set beside the versions catalogued by Saint-Lambert, Gatineau, Québec City and Lévis — a form that
  arrived from the United States by catalogue and was then renamed locally in every place it landed.
