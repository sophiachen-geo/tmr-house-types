profile:
  siting_landscape:
  - Strung along the winding course of rue Saint-Louis, which forms the sector's spine.
  - Relatively deep front setbacks and generous side setbacks.
  - Front yards bounded by fences of traditional make.
  - Mature deciduous trees on lawn in the front yard, with rows of large deciduous trees along the street edge.
  - Old residential outbuildings, often harmonised with the houses.
  - The ruelle des Anges runs along the boundary between two properties.
  - The steep wooded riverbank closes the sector to the south.
  massing: []
  articulation:
  - "\"à l'ornementation élaborée\" — the declaration says only that the ornament is elaborate, and names
    no motif, order or feature. Nothing further is claimed here."
  openings: []
  materials:
  - Stone or brick masonry, or wood cladding.
  - Tin roofing.
profile_note: The declaration characterises sectors, not building types; the columns below carry only what
  the sector text and the individual classed fiches state. Per-building attributes exist in the Bergeron
  Gagnon 2015 inventory and the 225 associated RPCQ records — see Part 8b.
blurb_en: The merchants' house of the crest — stone or brick, sometimes wood, under a tin roof, standing
  well back from rue Saint-Louis in a fenced and planted front yard with its old outbuildings beside it,
  and ornamented, the declaration says, elaborately. It is the only one of the four types here whose
  record rests on the sector paragraph alone, with no classed building behind it, which is why its styles
  are provisional and its massing and openings rows are empty.
origin_en: A migration, and a datable one. The RPCQ's fiche for the maison Roussil explains that the
  building of the second manor at the site of today's parc Masson at the end of the eighteenth century
  "entraîne une migration de la bourgeoisie vers la rue Saint-Louis. Plusieurs résidences cossues en pierre
  ou en bois sont alors érigées le long de cette artère." The fur merchants McTavish attracted after 1802
  began it; the francophone business élite that followed Joseph Masson's purchase of the seigneury in 1832
  continued it; and the street kept filling through the nineteenth century, which is why the surviving
  houses on it run from the maison Joseph-Augé of 1798–1801 through the maison Roussil of about 1830 to
  the maison Hercule-Masson of about 1880–1900, the maison Louis-de-Gonzague-Masson of about 1896 and the
  maison Raymond-Masson of about 1910–1935. Rue Saint-Louis carries 44 of the site's 225 associated RPCQ
  records, more than any other street.
