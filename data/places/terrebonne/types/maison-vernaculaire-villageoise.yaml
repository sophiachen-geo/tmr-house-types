profile:
  siting_landscape:
  - Set on relatively straight, narrow public streets forming an orthogonal grid.
  - Minimal front setbacks, producing "un fort encadrement urbain" — a hard, continuous street wall.
  - Plain and limited front-yard treatment; no ornamental planting is claimed by the source.
  - The ground falls away from rue Saint-Louis down towards the river, so the street wall steps down the slope.
  - The ruelle du Passant links rues Sainte-Marie and Saint-André through the block.
  massing:
  - Small in gabarit in both height and width — the declaration's only dimensional statement about them.
  - Wood galleries and balconies of traditional make project over the street.
  articulation:
  - Buildings set at street intersections carry distinguishing architectural detail, notably angled corner doors.
  openings: []
  materials:
  - Wood cladding or brick masonry.
  - Tin roofing.
profile_note: The declaration characterises sectors, not building types; the columns below carry only what
  the sector text and the individual classed fiches state. Per-building attributes exist in the Bergeron
  Gagnon 2015 inventory and the 225 associated RPCQ records — see Part 8b.
blurb_en: The ordinary house of the Bas-de-la-Côte, and by count the commonest thing in the declared site
  — small in height and width, wood or brick under a tin roof, set almost on the street line so that the
  row of them makes a continuous urban wall, with wooden galleries and balconies over the footway and an
  angled door where a house turns a corner. The declaration names no storey count, roof form or window
  type for it, so neither does this record.
origin_en: The bourg's fabric rather than any one architect's product. Louis Lepage de Sainte-Claire began
  conceding urban lots from 1720, and by 1781 the village counted more than sixty dwellings; the grid of
  narrow streets dropping from rue Saint-Louis to the rivière des Mille-Îles was laid out before 1850 and
  filled with modest houses for the artisans, tradespeople and workers who served the mills and, later, the
  grain and fur trades. The RPCQ's valeur architecturale calls the result "un ensemble de résidences
  villageoises de petit gabarit et d'architecture vernaculaire". A fire ravaged part of Terrebonne in 1922,
  destroying most of the houses between rues Sainte-Marie and Chapleau south of rue Saint-Pierre, so what
  stands in that stretch is in part post-1922 rebuilding on the old lot pattern.
