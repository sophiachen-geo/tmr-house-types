profile:
  siting_landscape:
  - Set on the edge of rue Saint-Louis, in the bourgeois sector of the Vieux-Terrebonne.
  massing:
  - Rectangular ground plan, two and a half storeys, detached.
  - Two-slope roof of medium pitch with slightly flared larmiers.
  - Chimney and gallery are the projections the fiche records.
  articulation:
  - Symmetry of the principal façade and regular ordering of the openings.
  - Carved window casings (chambranles sculptés).
  - Quoins (chaînages d'angle).
  - Cornice underlined with modillons; corbels; a wooden balustrade.
  - Wide two-headed cut-stone chimney stacks joined by a low wall at each end of the roof.
  openings:
  - Rectangular casement windows; small-paned windows alongside large-paned ones.
  - Main door of wood, panelled and glazed.
  materials:
  - Rubble masonry dressed to give the appearance of cut stone on the front elevation, over a stone foundation.
  - Cedar-shingle roof covering.
profile_note: The declaration characterises sectors, not building types; the columns below carry only what
  the sector text and the individual classed fiches state. Per-building attributes exist in the Bergeron
  Gagnon 2015 inventory and the 225 associated RPCQ records — see Part 8b.
blurb_en: >-
  The maison Roussil of about 1830 on rue Saint-Louis, classed in 1972 and given an aire de
  protection in 1975, is the anchor — a rectangular stone house of two and a half storeys under two
  slightly flared slopes, its front elevation laid in rubble dressed to look like cut stone, symmetrical
  and regularly fenestrated, with carved chambranles, quoins, a cornice on modillons, and wide
  two-headed cut-stone chimney stacks joined by a low wall at each end of the roof.
origin_en: Built by and for Noël-Théodore Roussil (c. 1798–1890), master joiner and militia captain, as
  both dwelling and craftsman's workshop — a door cut in the west elevation once gave onto the shop.
  The RPCQ reads the house as representative of the influence of neoclassicism on Québec residential
  architecture in the nineteenth century, expressed in the symmetry of the main façade, the regular
  ordering of the openings, the medium-pitched roof and the ornamental vocabulary of carved casings,
  quoins and modillon cornice; Roussil gave every interior bay a different treatment, which the fiche
  says is what gives the house its originality. As master joiner he is said to have taken contracts for
  work on the parish church and on the seigneurial office; as militia captain he sided with the loyalists
  in the rebellions of 1837–1838, and some authors hold that patriotes were held in the house awaiting
  transfer to the prison du Pied-du-Courant in Montréal. A second example stands a few doors away — the
  maison Alexandre et Joseph Roussil, built in stone about 1830 by Noël-Théodore's uncles "tout près de
  celle de leur neveu", two and a half storeys under a tôle à baguettes roof, cited by the Ville on
  13 September 2021.
