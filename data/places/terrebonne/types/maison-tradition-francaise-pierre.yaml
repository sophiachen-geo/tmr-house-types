profile:
  siting_landscape:
  - Sited on the edge of a narrow street in the heart of the Vieux-Terrebonne, detached.
  massing:
  - Rectangular ground plan; the carré low and barely raised above the ground.
  - One and a half storeys.
  - Steep two-slope roof with short larmiers and no dormers.
  - Chimney stack and perron are the only projections the fiche records.
  articulation:
  - Cut-stone chimney stacks set staggered ("en chicane") in the gable walls.
  - Wooden window casings, an S-shaped wall anchor (esse), a wooden balustrade.
  openings:
  - Rectangular casement windows with small panes.
  - Main door of wood, panelled, with a transom.
  materials:
  - Roughcast stone masonry over a stone foundation.
  - Cedar-shingle roof covering.
profile_note: The declaration characterises sectors, not building types; the columns below carry only what
  the sector text and the individual classed fiches state. Per-building attributes exist in the Bergeron
  Gagnon 2015 inventory and the 225 associated RPCQ records — see Part 8b.
blurb_en: One building carries this type, and it is a reconstruction around old walls. The maison Bélisle
  of about 1759 at 844 rue Saint-François-Xavier is a low roughcast-stone carré of one and a half storeys,
  barely raised off the ground, under a steep two-slope roof with short larmiers, no dormers and cedar
  shingle, with casement windows of small panes and cut-stone chimney stacks staggered in the gable walls.
  The RPCQ calls what remains of it "un rare témoin du noyau villageois du milieu du XVIIIe siècle".
origin_en: Jacques Perras (1725–1786), écrivain du munitionnaire du Roy, took a land concession in 1759
  and had the house built shortly afterwards, when Lepage's bourg was some four decades old; by 1781 the
  village counted more than sixty dwellings. The RPCQ reads the house as an example of "la maison rurale
  québécoise d'inspiration française" — the French model progressively adapted by local know-how to the
  climate and the available materials. It was considerably altered between 1830 and 1850, when coyaux
  were added at the ends of the rafters and the roof took on the flared larmiers it now shows, and an
  angled corner door was cut at the turn of the twentieth century. The Bélisle family bought it in 1916
  and held it for much of the century. It escaped the 1922 fire that destroyed most of the houses between
  rues Sainte-Marie and Chapleau south of rue Saint-Pierre, but it burned in 1999 — only the masonry could
  be kept, and the building was restored in 2002–2003 to return it to its eighteenth-century appearance.
  What stands today is therefore old walls with new everything else, and the record should be read that
  way. It is classed as an immeuble patrimonial (30 October 1973) with an aire de protection of the same
  date, and the protection covers the exterior and the interior but not the land.
