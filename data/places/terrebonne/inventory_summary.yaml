title_en: The 225 RPCQ records inside the declared site
source: Répertoire du patrimoine culturel du Québec, « Site patrimonial du Vieux-Terrebonne » (id 231571),
  block « Patrimoine immobilier associé (225) », crawled record by record 16 August 2026. © Gouvernement
  du Québec; reproduced here as bibliographic metadata only.
note_en: >-
  This is not the site's building count. The declaration counts « environ 210 édifices » on the ground;
  the RPCQ separately holds 225 immovable records that fall inside the perimeter, some of which are
  components of a larger classed ensemble (the six mill buildings and dams on the île des Moulins are
  each their own record inside id 92594) and some of which are landscape rather than buildings (parks,
  a street, gloriettes, a retaining wall). The rows below are grouped by the RPCQ's own « Usage »
  field, which one record leaves blank. Four records carry a Classement as an immeuble patrimonial —
  the four the fiche means when it says « Il compte quatre immeubles patrimoniaux classés »; six more
  carry « Classement — Situé dans un immeuble patrimonial » because they sit inside the Île-des-Moulins
  ensemble. Every one of the 225 carries the 2026-05-20 Déclaration.
