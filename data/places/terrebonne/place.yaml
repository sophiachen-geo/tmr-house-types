governing_instruments:
  - kind: site-patrimonial-declare
    title: >-
      Site patrimonial du Vieux-Terrebonne, déclaré par le gouvernement du Québec le 20 mai 2026 —
      the 14th declared site in Québec. Statut block: "Déclaration, Site patrimonial, Ministre de la
      Culture et des Communications, 2026-05-20, Prise d'effet : 2025-07-02"; prior statuses
      "Recommandation ministérielle de déclaration, 2025-06-20" and "Dossier initié par le ministre,
      2020-11-12". The effect date precedes the decree because protection runs from the ministerial
      notice under the Loi sur le patrimoine culturel. ~25 ha; ~210 buildings; 225 associated
      immovables in the RPCQ, of which four are immeubles patrimoniaux classés.
    year: 2026
    url: https://www.patrimoine-culturel.gouv.qc.ca/detail.do?id=231571&methode=consulter&type=bien
  - kind: consultation
    title: >-
      CPCQ public consultation on the projet de déclaration: audience publique 10 September 2025,
      18h30, amphithéâtre du collège Saint-Sacrement, 901 rue Saint-Louis; written submissions and
      online questionnaire to 19 September 2025. The consultation page describes the site as
      "environ 200 bâtiments construits à partir du XVIIIe siècle" on "25 hectares".
    year: 2025
    url: https://cpcq.gouv.qc.ca/consultations-publiques/archivees/projet-de-declaration-du-site-patrimonial-du-vieux-terrebonne/
  - kind: citation
    title: Ville de Terrebonne, Règlement 810 sur la citation des biens et immeubles patrimoniaux (adopted 13 September 2021, in force 20 September 2021), based on the Bergeron Gagnon inventory — 28 of the 225 associated RPCQ records carry a Citation
    year: 2021
    url: https://terrebonne.ca/reglements-permis/reglement-sur-la-citation-des-biens-et-immeubles-patrimoniaux/
  - kind: PIIA
    title: "Ville de Terrebonne, Règlement d'urbanisme 1011 (PIIA; replaced the abrogated 1005) — the articles applying to the Vieux-Terrebonne sector remain UNVERIFIED: terrebonne.ca refused every automated request (see notes)"
    year: null
    url: null
  - kind: inventory
    title: >-
      Ville de Terrebonne / Bergeron Gagnon inc., inventaire du patrimoine bâti (2015): ~600–609
