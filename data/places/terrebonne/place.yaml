summary_en: >-
  A seigneurial mill bourg laid out from 1720 on the north bank of the rivière des Mille-Îles, where
  the river breaks into rapids: an orthogonal grid of narrow streets dropping from rue Saint-Louis to
  the water, small vernacular houses packed tight along the Bas-de-la-Côte, a stone proto-industrial
  complex on the island, a stone parish core on the ridge, and a line of merchants' houses on the
  crest. Dévitalisé after the autoroute of 1965 and the boulevard of 1967 drew life away, it was
  rescued by a 1970s mobilisation and is now "considéré comme une réussite en manière de
  réhabilitation urbaine". Declared Québec's 14th site patrimonial on 20 May 2026.
