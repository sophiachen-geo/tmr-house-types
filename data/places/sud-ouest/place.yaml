summary_en: >-
  The borough where the Montréal plex was made, and the one place on this site whose own planning
  document says so in as many words. The Patri-Arch typo-morphological study reads the whole
  territory as five landscape areas cut into sixty-five landscape units, and reads the buildings as
  nineteen architectural types on one template — of which seven are plexes, defined in a single
  line: « Ces immeubles possèdent de deux à six logements. » Its explanation of the
  exterior stair is mechanical, not folkloric: the requirement to build behind a front setback,
  imposed as Montréal began regulating residential construction around 1880, pushed the stair to
  the upper dwellings out of the building and into the yard. The triplex with exterior stair
  appears from 1900; the duplex and the multiplex follow. And the borough's design-review by-law
  turns all of it into a rule — where two typological ensembles meet, a new building
  « doit choisir clairement une des deux typologies ».
