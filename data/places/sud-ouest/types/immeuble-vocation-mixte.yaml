blurb_en: >-
  Recorded, not carded: the study's family 4 is a commercial ground floor under dwellings, and this
  site's type cards are residential. It earns its place in the record because its socle is the exception
  that proves the triad — the only type in the study whose socle takes in the whole ground floor.
origin_en: >-
  The PIIA's own summary: <em>« Les magasins, ouverts sur le trottoir par de grandes vitrines, sont
  clairement séparés des étages supérieurs par une frise continue. Les étages supérieurs sont généralement
  occupés par des logements. »</em>
