blurb_en: >-
  The single-family house built where the borough could afford ornament. Two storeys over a ground floor
  raised five to ten risers, a false mansard across the front, an oriel often enough, rusticated stone
  at the base and brick or cut stone above. It is contemporary with the plexes and built to the same
  street rules — setback, alignment, low iron fence — but holds one household where its neighbours hold
  two or three.
origin_en: >-
  The Montréal faubourg house with a flat roof and a false mansard, which this site already carries
  at the Plateau and in Ville-Marie. In the Sud-Ouest it is the exception rather than the rule: the
  study introduces it by saying the borough is otherwise made of modest, often high-density residential
  buildings.
