blurb_en: >-
  The redevelopment house: two storeys under a pitched roof, an integral garage, a deep planted setback,
  built from the 1960s and mostly from the 1980s in the cleared parts of La Petite-Bourgogne and in
  the sectors reached by the Opération 20 000 logements. The study is blunt about what it is — « généralement
  en rupture avec les développements urbains traditionnels » — and equally clear that each project is
  internally consistent.
origin_en: >-
  No canonical form is claimed for this record. It is the one Sud-Ouest residential type that does not
  match anything else on this site: not the 19th-century terrace the English word <em>town house</em>
  normally names, not the plex it replaced, and not a suburban model catalogue. It belongs to the fifth
  phase and to the machinery of urban renewal, and it is recorded here because the borough's own typology
  records it.
