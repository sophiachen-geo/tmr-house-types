profile:
  siting_landscape:
  - >-
    Semi-detached or contiguous. Side margins vary where they are paired; the front setback is generously
    large, 5 to 8 m.
  - Front yards regularly carry real landscaping — hedges or trees — and a parking space.
  - >-
    The result, the study says, is generally a break with traditional urban development; the sets are
    homogeneous by street segment or by block, according to how each project was planned.
  massing:
  - >-
    Rectangular plan, two storeys, pitched gable or hipped roof, ground floor raised two to five risers.
  - Many carry projections on the façade, but their position varies from one to the next.
  - >-
    An internal garage is frequent — either in a projecting volume at ground level or in the basement,
    which then commands a ramp down from the street.
  articulation:
  - >-
    The corps of the façade is asymmetrical: one vertical alignment of the front doors with a window
    above, a second of windows only.
  - >-
    The composition is usually mirrored from one building to the next so that a pair reads as symmetrical.
  - The socle is expressed by the exposed foundation, the crowning barely expressed at all.
  - Façades are sober and carry very few ornamental details.
  openings:
  - >-
    Sizes and proportions vary, and different sizes are often used to express the different rooms behind
    — a wide picture window for the living room, smaller openings for the bedrooms.
  - Doors plain and without a transom.
  - Surrounds are rarely expressed, except by decorative shutters.
  materials:
  - Concrete foundation at the socle.
  - >-
    Brick dominant on the façade, frequently with a change to a light cladding (wood or synthetic) on
    parts of the building.
  - Asphalt shingle roofs.
profile_fr:
  implantation:
  - >-
    Les maisons de ville sont principalement implantées de façon jumelée ou contiguë. Bien que dans
    les cas jumelés la marge latérale peut varier, la marge de recul avant est généralement importante
    et varie entre 5 et 8 mètres. L’aménagement des cours avant présente régulièrement plusieurs éléments
    de paysagement dont des haies ou des arbres et un espace de stationnement pour les voitures.
  volumetrie:
  - >-
    La maison de ville est un bâtiment dont le plan est de forme rectangulaire et qui possède 2 étages.
    Le toit est généralement en pente à pignon ou en croupe. Le rez-de-chaussée est surélevé de 2 à
    5 contremarches par rapport au niveau du sol. Plusieurs maisons de ville présentent des saillies
    en façade mais leur position varie d’une à l’autre.
  - >-
    Il est fréquent que les maisons de ville présentent un garage intérieur. Celui-ci est localisé soit
    dans un volume en saillie au rez-de-chaussée ou en sous-sol, ce qui commande la présence d’une rampe
    d’accès.
  materiaux:
  - >-
    Le socle est formé de la fondation en béton. La brique est dominante comme matériau de revêtement
    de la façade. Il est cependant fréquent d’observer des changements de matériaux sur certaines parties
    du bâtiment et ce, notamment par l’utilisation d’un revêtement léger (bois ou matière synthétique).
    Les toitures sont revêtues de bardeau d’asphalte.
  traitement_des_facades:
  - Socle — Le socle est exprimé par une fondation apparente.
  - >-
    Corps — Le corps de la façade est asymétrique. On retrouve un premier alignement vertical composé
    des portes principales et d’une fenêtre à l’étage et un deuxième alignement composé seulement de
    fenêtres. La composition des façades est généralement inversée en alternance d’un bâtiment à l’autre
    de manière à créer un axe de symétrie entre les bâtiments.
  - Couronnement — Le couronnement est peu exprimé.
  - Ornementation — Les façades sont sobres et possèdent très peu de détails ornementaux.
  ouvertures:
  - >-
    La dimension et les proportions des ouvertures sont variables. Il est fréquent d’observer l’utilisation
    d’ouverture de taille différente pour exprimer les diverses fonctions des pièces intérieures. Par
    exemple, on retrouve une grande baie vitrée pour la salle de séjour et de plus petites ouvertures
    pour les chambres.
  - Les portes sont simples et sans imposte.
  - >-
    L’encadrement des ouvertures est rarement exprimé, si ce n’est par la présence de volets décoratifs
    aux fenêtres.
  description:
  - >-
    Dans l’arrondissement du Sud-Ouest, on retrouve plusieurs maisons de ville généralement constituées
    d’habitations unifamiliales de 2 étages, coiffées d’un toit en pente. Ces maisons de ville ont pour
    la plupart été érigées récemment, c’est-à-dire depuis les années 1960, voir depuis les années 1980,
    et sont généralement en rupture avec les développements urbains traditionnels. Bien que ces ensembles
    présentent une grande diversité de caractéristiques architecturales, les maisons de ville sont généralement
    homogènes par segment de rue ou par îlot selon leur mode de planification.
  contexte:
  - >-
    Les maisons de ville ont principalement été construites à partir des années 1960. Elles sont principalement
    issues de projets de redéveloppement de secteurs anciens tels La Petite-Bourgogne ou dans les secteurs
    touchés par l’Opération 20 000 logements.
  - C. Caractéristiques
