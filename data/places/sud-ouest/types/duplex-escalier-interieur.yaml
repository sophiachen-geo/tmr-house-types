blurb_en: >-
  The first multi-family building type built in the borough, and the one the exterior stair eventually
  killed. Two dwellings stacked under a flat roof, hard on the street line, both front doors at ground
  level and the upper dwelling reached by a stair inside. It loses ground after 1880 and is finally
  displaced by the triplex with exterior stair around 1900 — which is the whole argument of this borough
  in one sentence.
origin_en: >-
  The plex before the stair went outside. Reading this record against the triplex with exterior stair
  (2.6) gives the mechanism directly: no setback, so no room for a stair in the yard, so the stair eats
  interior floor area instead.
