blurb_en: >-
  The archetypal Montréal house, and this is the document that says how it happened. It appears from
  1900. Its parent is the block with an « H » ruelle and four built sides. Its defining feature is not
  the stair as an object but the stair as a consequence: the front-setback requirement gave the stair
  somewhere to go, and putting it there kept the interior floor area and saved heating a shared hall.
  Eleven of the borough's sixty-five landscape units name it as their principal type.
origin_en: >-
  The mechanism, verbatim from the study's synthèse: <em>« l’obligation de l’implantation avec une marge
  de recul avant amènera la translation de l’escalier d’accès aux logements des étages supérieurs vers
  l’extérieur, ce qui donnera la caractéristique si typique des bâtiments des quartiers montréalais
  de cette époque »</em>. The sequence is dated: lotting without a ruelle and building with no setback
  <em>« ne sera abandonnée que vers la fin des années 1880 »</em>; this type <em>« fait son apparition
  principalement à partir de 1900 »</em>; the duplex with exterior stair and the multiplex follow shortly
  after.
