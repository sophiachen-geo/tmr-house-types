blurb_en: >-
  Two dwellings over three occupied levels under a false mansard — the type that answers the question
  of what Montréal built before the exterior stair, and the one the study reaches for when it explains
  why the fabric of the 1875–1945 period is not homogeneous. Built with no setback in the earlier phase
  and with one in the later, which is when the projecting window and the raised ground floor arrive.
origin_en: >-
  It is the plex family's tallest pre-1900 member and its closest relative to the Second Empire terraces
  of Ville-Marie and the Plateau. The study notes a rare third dwelling squeezed in — variante 2, a
  triplex with a false-mansard roof — which is how the boundary between duplex and triplex actually
  behaves on the ground.
