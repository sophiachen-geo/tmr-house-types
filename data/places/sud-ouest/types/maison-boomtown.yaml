blurb_en: >-
  One storey, flat roof, a door between two windows, and a flashing or a worked metal cornice for a
  crown. Three hundred and fifty-two of them, all but a handful inside one landscape area, Côte-Saint-Paul
  — and, tellingly, not the principal type of a single landscape unit anywhere. It is the cheap detached
  house of the borough's last frontier, built while the plex was filling everything closer in.
origin_en: >-
  Boomtown is the most widely distributed form on this site, and the Sud-Ouest is one of the places
  that extend its range. What is unusual here is the count and the confinement: the study puts a number
  on it — 352 — and puts it in one corner of one borough. Compare the Rosemont shoebox, a one-storey
  flat-roofed self-built house of the same decades that another Montréal borough treats as a protected
  type of its own.
