profile:
  siting_landscape:
  - >-
    Contiguous, front margin 2 to 4.5 m; the alignment of façades is regular where the multiplexes are
    built in series.
  - A low metal — sometimes wood — fence characterises the outdoor treatment.
  - >-
    Generally built in a fabric with a ruelle, like the triplex, but on wider lots. Mostly from the
    First World War to the end of the 1875–1945 period.
  massing:
  - >-
    A simple rectangular body with no projections, generally with a rear extension whose position reverses
    from one building to the next so as to maximise sunlight in the yards.
  - Three storeys, ground floor raised two to three risers, flat roof.
  - Two dwellings per floor, and a shared access for the two dwellings on the top floor.
  articulation:
  - The socle is one or two courses of stone, or an exposed concrete foundation.
  - The crowning is underlined by a moulded metal cornice, a stone cornice or a parapet.
  openings:
  - Sash or casement, generally one width to half a height.
  - Doors plain with a transom; the doors to the upper dwellings are often paired.
  - Lintels expressed as a cut-stone band or soldier-course brick.
  materials:
  - Concrete or rusticated stone at the socle.
  - Brick dominant.
  - Balconies and stair treads in wood; guards in metal.
profile_fr:
  implantation:
  - >-
    Le multiplex est implanté de façon contiguë. La marge de recul avant varie de 2 à 4,5 mètres. L’alignement
    des façades est régulier si les multiplex sont construits en série. L’aménagement extérieur est
    caractérisé par la présence d’une clôture basse en métal ou parfois en bois.
  volumetrie:
  - >-
    Le corps de bâti est de forme rectangulaire simple et sans saillie. On remarque généralement la
    présence d’une rallonge arrière. La disposition de celle-ci est inversée d’un bâtiment à l’autre
    de manière à maximiser l’ensoleillement des cours. La hauteur est de trois étages avec une surélévation
    du rez-dechaussée par rapport au niveau du sol de deux à trois contremarches. Le toit est plat.
    On retrouve un balcon sur tous les niveaux au-dessus de l’entrée du rez-de-chaussée. Un escalier
    extérieur mène au premier étage.
  materiaux:
  - Le socle est en béton ou revêtu de pierres à bossages.
  - La brique est le matériau de revêtement dominant.
  - Les balcons et les marches des escaliers sont en bois et les garde-corps sont en métal.
  traitement_des_facades:
  - >-
    Socle — Le socle se distingue par la présence de un ou deux rangs de pierres ou d’une fondation
    apparente en béton.
  - >-
    Corps — La composition des façades est symétrique. Les portes d’entrées et les balcons sont disposés
    dans l’alignement central de la façade. On retrouve deux alignements latéraux formés de fenêtres.
    La présence des portes au premier étage est parfois soulignée par un porche d’entrée en alcôve.
  - >-
    Couronnement — Le couronnement du bâtiment est souligné par la présence d’une corniche moulurée
    en métal, d’une corniche en brique ou d’un parapet à fronton.
  ouvertures:
  - >-
    Les fenêtres à guillotine ou à battants avec ou sans imposte sont dominantes. Les proportions de
    ces fenêtres sont équivalentes à 1 largeur = ½ hauteur.
  - >-
    Les portes sont simples avec imposte. Les portes sont généralement jumelées sauf au dernier étage
    où elles sont simples.
  - >-
    Les linteaux des ouvertures sont droits en pierre, en brique ou en béton ou constitués d’une platebande
    en brique en forme d’arc surbaissé.
  description:
  - >-
    Le multiplex est un bâtiment de trois étages généralement implanté avec une marge de recul avant
    et sans marge latérale. Il se caractérise par la présence de deux logements par étage et la présence
    d’un accès commun pour les deux logements de l’étage supérieur.
  contexte:
  - >-
    Le multiplex est une dérivation du triplex avec escalier extérieur. Il constitue la transformation
    typologique du triplex afin de répondre au processus de densification du tissu urbain. Il a généralement
    été construit dans un tissu urbain avec ruelle, donc de façon similaire au triplex, mais sur des
    parcelles plus larges. Ce type de bâtiment a surtout été construit à partir de la Première Guerre
    mondiale jusqu’à la fin de la période création des infrastructures municipales (1875-1945).
