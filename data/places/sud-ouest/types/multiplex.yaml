blurb_en: >-
  The top of the plex family: three storeys, two dwellings per floor, and — the detail that matters
  — one shared access for the two dwellings on the top floor. The study calls it a derivation of the
  triplex with exterior stair, « la transformation typologique du triplex afin de répondre au processus
  de densification du tissu urbain », built on wider lots from the First World War on.
origin_en: >-
  This is where the plex family ends and the apartment building begins. The multiplex still gives most
  dwellings their own front door but concedes a shared one at the top; the maison d'appartements (3.1)
  concedes the whole stair; the immeuble d'appartements (3.3) concedes a common hall serving six to
  twelve. Read the four records in order and the boundary the canonical layer draws between <em>plex-family</em>
  and <em>apartment-house-common-hall</em> is the study's own.
