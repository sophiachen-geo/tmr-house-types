blurb_en: >-
  Three dwellings, three storeys, flat roof, no setback and no stair in the yard — the densest thing
  the borough built before 1900, and a denser variant of the duplex with interior stair rather than
  an ancestor of the triplex with exterior stair. Most dwellings have their own stair, but it is frequent
  for the two upper dwellings to share one. Where the block has no ruelle, a porte cochère cuts through
  to the back yard.
origin_en: >-
  The interior-stair triplex is the form the exterior-stair triplex displaced. Both are carried on this
  site, and their canonical ids are siblings under <em>plex-family</em> precisely so that the swap can
  be read as one event rather than two unrelated types.
