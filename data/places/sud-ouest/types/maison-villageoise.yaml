blurb_en: >-
  The oldest housing form still standing in the borough, and the rarest: thirty-eight of them, which
  the study says is what gives the type its value. One and a half storeys, a two-slope roof with two
  dormers, almost no front setback unless a galerie fills it, and a side passage to the back. They were
  built singly, in wood, in the first villages — Saint-Henri, Turcot, Saint-Augustin, Pointe-Saint-Charles
  — and burned or were pulled down for denser brick. Only the village Turcot, too far from the mills
  to be worth redeveloping, still has them as its principal type.
origin_en: >-
  The same small vernacular house that this site catalogues at Charlesbourg, on the Île d'Orléans and
  in the faubourgs of Québec City, arriving here as the pre-industrial layer under everything else.
  Note the name: the 2013 study calls it <em>maison villageoise</em>, but the PIIA by-law's own summary
  of the seven typologies calls the same thing <em>maison « de faubourg »</em>. Two arms of the same
  borough, two names for one form.
