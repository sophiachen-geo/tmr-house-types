profile:
  siting_landscape:
  - >-
    Detached, semi-detached or contiguous — the only residential type in the borough that occurs all
    three ways.
  - Front setback under 1.5 m, and usually filled by a galerie rather than a yard.
  - A side passage giving on to the back yard is frequent.
  - >-
    They rarely form regular alignments, because they were built one at a time rather than in series.
  massing:
  - A plain rectangular body with no projections, 1½ storeys.
  - The ground floor sits almost on the ground — three risers at most.
  - Two-slope pitched roof, normally with two dormers.
  - A galerie running the full width of the building is common.
  articulation:
  - >-
    Symmetrical with the door at the centre and windows either side, or asymmetrical with the door at
    one end.
  - >-
    All ground-floor windows line up horizontally, but there is generally no vertical alignment between
    them and the dormers: there is one dormer fewer than there are ground-floor openings, so the dormers
    sit between them.
  - Window surrounds and corner boards are usually painted a contrasting colour.
  openings:
  - >-
    Almost all windows are replacements. The originals were probably six-pane casements; today they
    are mostly sash or paneless casements.
  - Dormer windows are smaller, square or barely rectangular.
  - Doors are plain, with no transom.
  - >-
    The surround follows the cladding: a wood chambranle on clapboarded houses, a wood chambranle or
    a soldier-course brick lintel on brick ones.
  materials:
  - Stone foundation, sometimes rendered in cement roughcast.
  - Brick and wood clapboard for the body of the building — the two claddings in use.
  - >-
    Traditional sheet metal was probably the original roofing; asphalt shingle has often replaced it.
profile_fr:
  implantation:
  - >-
    La maison villageoise peut être isolée, jumelée ou contiguë. La présence d’un passage latéral qui
    permet un accès à la cour arrière est fréquente. La marge de recul avant est inférieure à 1,5 mètre
    et est souvent comblée par une galerie. Les maisons villageoises forment rarement des alignements
    réguliers.
  volumetrie:
  - >-
    Le corps du bâtiment est rectangulaire et sans saillie. La hauteur est de 1½ étage. Le rez-de-chaussée
    est très peu élevé par rapport au niveau du sol, avec un maximum de 3 contremarches. Le toit est
    en pente à deux versants et présente généralement 2 lucarnes. La présence d’une galerie occupant
    la même largeur que le bâtiment est fréquente.
  materiaux:
  - >-
    La fondation, en pierre, est parfois recouverte de crépi de ciment. Pour le corps du bâtiment, la
    brique et le déclin de bois sont les deux matériaux de revêtement utilisés. La tôle traditionnelle
    était probablement le matériau le plus courant à l’origine pour le recouvrement des toitures. Cependant,
    la tôle a souvent été substituée pour du bardeau d’asphalte.
  traitement_des_facades:
  - >-
    Corps — La composition peut être symétrique avec la porte au centre et les fenêtres sur les côtés,
    ou asymétrique avec la porte à l’une des extrémités. Toutes les fenêtres du rez-de-chaussée sont
    alignées horizontalement. Cependant, il n’y a généralement pas d’alignement vertical entre les fenêtres
    du rez-dechaussée et les lucarnes. On retrouve généralement une lucarne de moins que le nombre d’ouvertures
    au rez-de-chaussée. Les lucarnes sont donc disposées entre chacune des ouvertures du rez-de-chaussée.
  - >-
    Corps — Les encadrements des ouvertures ainsi que les planches cornières sont généralement peints
    d’une couleur contrastante par rapport au reste de la façade.
  ouvertures:
  - >-
    On retrouve des fenêtres de remplacement sur la plupart des bâtiments. À l’origine, il est probable
    que ces bâtiments possédaient des fenêtres à battants à 6 carreaux. Cependant, on retrouve aujourd’hui
    principalement des fenêtres à guillotine ou à battants sans carreau. Les fenêtres des lucarnes sont
    plus petites et de forme carrée ou faiblement rectangulaire.
  - Les portes sont simples et sans imposte.
  - >-
    L’encadrement des ouvertures est variable selon le matériau de revêtement utilisé. Pour les bâtiments
    revêtus de déclin de bois, on retrouve un chambranle en bois. Pour les bâtiments revêtus de briques,
    on retrouve un chambranle en bois ou un linteau composé d’un appareillage de briques en soldat.
  description:
  - >-
    La maison villageoise est une habitation unifamiliale, implantée sans marge de recul avant sauf
    s’il y a une galerie en façade. Son rez-de-chaussée est généralement peu dégagé du sol. Sa hauteur
    est généralement de 1½ étage. Les modèles les plus anciens possèdent un toit en pente à deux versants
    ainsi que 2 lucarnes à pignon.
  contexte:
  - >-
    Les maisons villageoises peuvent être observées dans les premiers villages de l’arrondissement du
    SudOuest, soit Saint-Henri, Turcot, Saint-Augustin et Pointe-Saint-Charles. Généralement construites
    en bois, les maisons villageoises sont disparues dans la plupart de ces villages, soit en raison
    du feu, soit en raison de leur démolition pour y reconstruire des bâtiments de briques de plus grande
    densité. De plus, elles ont été construites de façon individuelle, d’où l’absence de séries de maisons
    villageoises presque identiques. Elles forment ainsi rarement le type architectural dominant d’une
    unité de paysage. La principale exception est le village Turcot, qui est demeuré à faible densité,
    probablement en raison de son éloignement par rapport aux principaux pôles industriels et institutionnels.
  - >-
    On ne retrouve au total que 38 maisons de cette typologie dans l’arrondissement du Sud-Ouest, ce
    qui lui donne une valeur de rareté.
  sous_variantes: &id001
  - >-
    Variante 1 — La maison villageoise à deux étages : La première variante possède une composition
    de façade similaire au type de base mais on y retrouve deux étages et demi. Cette sous-variante
    ne possède pas de galerie en façade.
  - >-
    Variante 2 — La maison villageoise à toit en mansarde : La seconde variante possède un toit en mansarde.
    Cette variante est relativement rare dans l’arrondissement du Sud-Ouest.
  - >-
    Variante 3 — La maison villageoise avec pignon secondaire : Cette variante se trouve principalement
    dans le secteur de l’unité de paysage William-Parkin et celle de Parc Saint-Henri. Il s’agit d’une
    maison villageoise avec un pignon secondaire en façade au lieu de lucarnes.
  - >-
    Variante 4 — La maison villageoise à toit plat : Cette dernière variante se trouve essentiellement
    dans le secteur Village Turcot. Sa composition est proche du duplex avec escalier intérieur. Certaines
    peuvent être composées d’une fausse mansarde.
