profile_fr:
  description:
  - >-
    Quelques immeubles à vocation uniquement commerciale ont également été construits sur les grandes
    artères du Sud-Ouest. Ces bâtiments sont généralement conçus par des architectes et possèdent un
    langage architectural qui leur est propre. Lorsqu’ils sont situés à une intersection, leur façade
    latérale conserve les mêmes règles de composition que la façade principale. En raison de la grande
    différenciation des bâtiments de ce type, il n’a pas fait l’objet d’une attention particulière dans
    cette description typologique.
