blurb_en: >-
  The triplex's smaller twin, built simultaneously and for the same reason, in the parts of the borough
  that did not need three dwellings on a lot. Two storeys, flat roof, a setback of two to four and a
  half metres, and an L-shaped stair climbing that setback because it is not deep enough for a straight
  one — a detail the study records and which explains the curved and dog-legged stairs of Montréal better
  than any folklore about snow.
origin_en: >-
  The study is explicit that this type and the triplex with exterior stair (2.6) are the same event:
  <em>« Le duplex avec escalier extérieur a été construit de façon simultanée au triplex avec escalier
  extérieur, soit à partir de 1900 jusqu’à 1945 »</em>. Density, not date, is what separates them.
