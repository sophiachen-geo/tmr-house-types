blurb_en: >-
  Three or four storeys, one shared entrance, an irregular number of window bays and a flashing for
  a cornice. Almost all of them are replacements — the study calls them « bâtiments de substitution
  » standing where something older was pulled down — and their gauges vary enormously with the number
  of dwellings in each project. Only the group on boulevard des Trinitaires was planned for.
origin_en: >-
  The second of the study's three apartment types, and the one that carries the postwar history of the
  borough on its face: expropriation, demolition, and rebuilding at a scale unrelated to the lot pattern
  around it. The same canonical form as the maison d'appartements and the immeuble d'appartements —
  the common hall — at a different height.
