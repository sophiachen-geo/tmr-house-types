profile:
  siting_landscape:
  - >-
    Generally detached, with front and side margins of variable size; contiguous ones built as sets
    share a uniform front margin.
  - Landscaping dominated by lawn.
  - >-
    Mostly built during the 1945-onward period of urban renewal — substitution buildings replacing older
    structures. The exception is the group on boulevard des Trinitaires, where the layout was planned
    around this building type from the start.
  massing:
  - A simple rectangular plan, the long side generally parallel to the street.
  - Three or four storeys, flat roof.
  - >-
    The only projections on the façades are the vertical alignments of balconies running through every
    level.
  articulation:
  - The socle is the exposed foundation.
  - The corps of the façade is composed of an irregular number of vertical alignments of openings.
  - >-
    The crowning is barely expressed — generally a plain metal flashing; sometimes a band of brick in
    a colour contrasting with the body of the façade makes one, or a projecting roof.
  openings:
  - Window and door types and proportions are varied on this type.
  - Lintels and surrounds are barely expressed or not at all.
  materials:
  - Concrete at the socle.
  - The body of the façade generally clad in brick, in varying tones.
profile_fr:
  implantation:
  - >-
    La conciergerie est généralement isolée. Les marges de recul avant et latérales sont alors de dimensions
    variables. On retrouve également des conciergeries contiguës, construites en ensemble. Les marges
    avant sont alors uniformes pour tout l’ensemble. Les aménagements paysagers sont caractérisés par
    la dominance des surfaces gazonnées.
  volumetrie:
  - >-
    L’immeuble d’appartements possède un plan de forme rectangulaire simple. Le côté le plus large est
    généralement parallèle à la rue. Sa hauteur varie de trois à quatre étages. Le toit est plat. Les
    seules saillies présentes en façades sont les alignements verticaux de balcons sur tous les niveaux.
  materiaux:
  - Le socle est en béton.
  - Le corps de la façade est généralement revêtu de briques dont les teintes peuvent varier.
  traitement_des_facades:
  - Socle — Le socle est composé de la fondation apparente.
  - >-
    Corps — Le corps de la façade est composé d’un nombre irrégulier d’alignements verticaux d’ouvertures.
  - >-
    Couronnement — Le couronnement est peu exprimé. Il est généralement composé d’un simple solin métallique.
    L’utilisation de briques d’une couleur contrastante à celle du corps de la façade et disposées en
    bandeau contribue parfois à former un couronnement.
  - Couronnement — Le couronnement peut également être formé d’une toiture en projection.
  ouvertures:
  - >-
    Les types de fenêtres et de portes ainsi que leur proportion sont variés sur ce type de bâtiment.
  - Le linteau et l’encadrement des ouvertures sont peu ou pas exprimés.
  description:
  - >-
    La conciergerie est un bâtiment multifamilial dont la hauteur est de 3 ou 4 étages et dont l’accès
    aux logements est commun. Le volume rectangulaire et simple de la conciergerie est souvent ponctué
    par la présence de balcons.
  contexte:
  - >-
    La plupart des conciergeries de l’arrondissement du Sud-Ouest ont été construites pendant la période
    de revitalisation et de rénovation urbaine (1945 à nos jours). Il s’agit donc essentiellement de
    bâtiments de substitution qui remplacent des structures plus anciennes, à l’exception des conciergeries
    situées sur le boulevard des Trinitaires dont l’aménagement a été prévu en fonction de l’érection
    de ce type d’immeuble. Les conciergeries sont conçues et construites individuellement ou par ensemble,
    ce qui amène de grandes différences dans leur mode d’implantation et de composition architecturale.
    De plus, les gabarits varient énormément en fonction du nombre de logements inclus dans le projet.
    On retrouve ces bâtiments dans l’ensemble du territoire de l’arrondissement du Sud-Ouest.
