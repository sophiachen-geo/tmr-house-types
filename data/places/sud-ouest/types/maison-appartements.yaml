blurb_en: >-
  The point at which the plex stops. Two storeys, four or six dwellings, and a single central interior
  stair reaching all of them — « Cet immeuble à logements se différencie du plex par la présence d’un
  escalier commun intérieur pour accéder aux logements ». It arrives in the 1930s, and it is the only
  Sud-Ouest type whose definition is drawn by negation from another type on the same page.
origin_en: >-
  First of the three members of the study's family 3, <em>L'immeuble d'appartements</em>, which the
  PIIA by-law summarises in one sentence that this site takes as the definition of the canonical form:
  <em>« L’immeuble d’appartements, aussi nommé édifice de rapport, est construit entre les deux guerres
  le long de boulevards ou d’avenues prestigieuses. Ce bâtiment possède un hall d’entrée commun qui
  dessert de six à douze logements. »</em>
