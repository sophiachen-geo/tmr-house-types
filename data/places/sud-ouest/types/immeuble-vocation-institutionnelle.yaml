profile_fr:
  description:
  - >-
    Les immeubles institutionnels de l’arrondissement du Sud-Ouest sont répartis sur l’ensemble de son
    territoire. Ils peuvent former des complexes qui occupent un îlot entier, par exemple l’école secondaire
    Saint-Henri située dans l’îlot délimité par les rues Saint-Ferdinand, du Couvent, Saint-Jacques
    et SaintAntoine Ouest, ou être insérés à l’intérieur du tissu résidentiel. Ces bâtiments sont destinés
    à des fonctions multiples (église, école, hôpital, etc.). Ce type n’a pas fait l’objet d’une description
    complète dans cette description typologique car ils constituent des exceptions dans le tissu urbain
    plutôt que des éléments de base.
