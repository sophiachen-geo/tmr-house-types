blurb_en: >-
  What distinguishes it from the duplex with interior stair, the study says, is the front setback, the
  symmetrical façade and the use of square or rectangular windows. It is the hinge type between the
  pre-war plex and the post-war one: built at the end of the infrastructure period and the start of
  urban renewal, raised high enough to put parking under it, and — the study notes without comment —
  the principal type of nowhere.
origin_en: >-
  The raised duplex is the plex adjusting to the car and to the picture window. Its ground floor climbs
  from three risers to ten, the basement becomes a garage, and the ornamental programme collapses to
  a stone band. Compare the postwar plexes of Verdun and Villeray.
