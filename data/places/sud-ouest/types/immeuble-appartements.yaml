blurb_en: >-
  The top of the borough's residential scale and the end of the sequence that starts with the duplex:
  more than four storeys, a lift, and a shared hall. The PIIA by-law's own summary is the definition
  this site uses for the canonical form — an édifice de rapport with « un hall d’entrée commun qui dessert
  de six à douze logements ».
origin_en: >-
  Note what the study does not do here: it does not treat the lift-served apartment building as a different
  family from the two-storey maison d'appartements. All three share family 3, and the thing they share
  is the common entrance. On this site they share one canonical id for the same reason.
