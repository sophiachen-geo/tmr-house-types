profile:
  siting_landscape:
  - Generally detached, front and side margins of variable size, façades not in regular alignment.
  - Landscaping dominated by lawn.
  - >-
    Found throughout the borough. Mostly built during the 1945-onward period of urban renewal, as substitution
    buildings.
  massing:
  - A simple rectangular plan, the long side generally parallel to the street.
  - More than four storeys, and it may take the form of a residential tower.
  - Flat roof; projecting balconies are frequent.
  - Large enough to require large lots, because access to the upper dwellings is by lift.
  articulation:
  - The socle is the exposed foundation.
  - The corps of the façade is composed of an irregular number of vertical alignments of openings.
  - The crowning is barely expressed, generally a plain metal flashing.
  openings:
  - Window and door types and proportions are varied on this type.
  - Lintels and surrounds are barely expressed or not at all.
  materials:
  - Concrete at the socle.
  - The body of the façade generally clad in brick, in varying tones.
profile_fr:
  implantation:
  - >-
    L’immeuble d’appartements est généralement isolé mais ses marges de recul avant et latérales sont
    de dimensions variables. Les façades ne forment pas d’alignements réguliers. Les aménagements paysagers
    sont caractérisés par la dominance des surfaces gazonnées.
  volumetrie:
  - >-
    L’immeuble d’appartements possède un plan de forme rectangulaire simple. Le côté le plus large est
    généralement parallèle à la rue. Sa hauteur est de plus de 4 étages. Le toit est plat. Les balcons
    en saillie sont fréquents.
  materiaux:
  - Le socle est en béton.
  - Le corps de la façade est généralement revêtu de briques dont les teintes peuvent varier.
  traitement_des_facades:
  - Socle — Le socle est composé de la fondation apparente.
  - >-
    Corps — Le corps de la façade est composé d’un nombre irrégulier d’alignements verticaux d’ouvertures.
  - >-
    Couronnement — Le couronnement est peu exprimé. Il est généralement composé d’un simple solin métallique.
  ouvertures:
  - >-
    Les types de fenêtres et de portes ainsi que leur proportion sont variés sur ce type de bâtiment.
  - Le linteau et l’encadrement des ouvertures sont peu ou pas exprimés.
  description:
  - >-
    L’immeuble d’appartements est un bâtiment de grande dimension dont l’accès aux logements des étages
    supérieurs est caractérisé par la présence d’un ascenseur. Ainsi, ces bâtiments sont souvent implantés
    sur de larges parcelles. Ils possèdent généralement plus de 4 étages et peuvent se présenter sous
    la forme d’une tour à logements.
  contexte:
  - >-
    La plupart des immeubles d’appartements de l’arrondissement du Sud-Ouest ont été construits pendant
    la période de revitalisation et de rénovation urbaine (1945 à nos jours). Il s’agit donc essentiellement
    de bâtiments de substitution qui remplacent des structures plus anciennes. Les immeubles d’appartements
    sont conçus et construits individuellement ou par ensemble, ce qui amène de grandes différences
    dans leur mode d’implantation et de composition architecturale. De plus, les gabarits varient énormément
    en fonction du nombre de logements inclus dans le projet. On retrouve ces bâtiments dans l’ensemble
    du territoire de l’arrondissement du Sud-Ouest.
