profile_fr:
  description:
  - >-
    Le pourtour du canal de Lachine ainsi que tous les secteurs situés à proximité de voies ferrées
    ont conservé un tissu urbain à larges mailles, destiné principalement à la fonction industrielle.
    La plupart des bâtiments industriels qui sont toujours présents dans ces secteurs possèdent une
    grande simplicité architecturale. Les ouvertures sont disposées en alignement régulier et les éléments
    de structures forment les principaux éléments d’ornementation. Le mode d’implantation et les matériaux
    de revêtement sont cependant variables. Ce type n’a pas fait l’objet d’une description complète
    dans cette description typologique.
