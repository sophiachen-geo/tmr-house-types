blurb_en: >-
  Recorded, not carded. The industrial fabric is the reason the borough exists, and the Évaluation cahier
  gives it a whole grade of its own — the two secteurs industriels d'intérêt 22.N.1 and 22.N.2 — but
  the typo-morphological study leaves it deliberately undescribed: « Ce type n’a pas fait l’objet d’une
  description complète dans cette description typologique. »
