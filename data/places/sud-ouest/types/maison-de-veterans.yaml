blurb_en: >-
  The one type in the borough that arrived from Ottawa rather than from a Montréal builder. Wartime
  Housing Limited, created by the federal government, drew economical, quickly built models for the
  workers in the munitions plants; they were meant to be dismantled after the war and instead spread
  through the outer quarters. One storey, low pitch, a door between two windows of unequal width, and
  — after seventy years — a façade that may carry brick, sheet metal and artificial stone at once.
origin_en: >-
  The same object as the wartime housing this site catalogues at Lévis, at Arvida and in Verdun's voisinage
  Crawford, and the reason the canonical id is shared. What the Sud-Ouest fiche adds is the ordinary
  end of the story: not a prize-winning NHA neighbourhood but a few streets in Côte-Saint-Paul where
  the standard plan was dropped into an existing grid.
