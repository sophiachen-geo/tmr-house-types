blurb_en: 'The ordinary house of the two West Island village cores — modest, one and a half to two storeys,
  rectangular, under a steep two-slope roof with dormers, standing close to a narrow street, in clapboard
  at Sainte-Anne and roughcast at Pointe-Claire. Both places advertise a heritage village. Between them
  they have three protected buildings and no protected ensemble. One record, two municipalities: the photograph
  on this card is a Sainte-Anne street, and Pointe-Claire''s stands beside it on the type page.'
origin_en: 'Pointe-Claire''s parish dates from 1698 and Sainte-Anne''s core grew around a mission that
  took its present name in 1714, and both produced a small village around the church rather than a string
  of farms along a côte. A plan of 1767 already shows Pointe-Claire''s clustered on the three avenues
  it still occupies; by the nineteenth century it held hotels, artisans'' workshops and shops serving
  the surrounding farms and the first summer people on the lake shore. Most of what stands there now is
  younger than that, because a fire in 1900 took a good part of it — the cahier says so plainly, and then
  argues that the value survived the fire anyway, in the width of the streets and the height of the houses.
  Sainte-Anne''s core sits at the point of the island between the canal locks of 1843 and the railway
  bridges, and the 2005 cahier separates it into two things worth naming - the îlot villageois round the
  church, of two-storey clapboard houses built close to the street, and the workers'' cottages of rue
  Saint-Jean-Baptiste, steep-roofed and dormered and low-floored, which it calls the most characteristic
  thing in the town''s architectural heritage. One classed house, built between 1790 and 1810 for the
  fur trader Peter Grant and bought by Simon Fraser in 1820, shows the whole arc in a single building:
  a French-tradition rubble carré under a steep roof, then a bell-cast eave and two rows of ornamented
  dormers added as taste changed, then two flats in 1892, then a bank counter from 1906 to 1954, then
  a restoration in 1962 that kept the evidence of all of it.'
