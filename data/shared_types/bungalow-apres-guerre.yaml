  credit: >-
    The only photographs of West Island postwar bungalows located during this research are the 2005
    Ville de Montréal évaluation cahiers' own — Dorval, p. 30–31, captioned « 7.U.1 165, rue McNicoll »,
    « 7.U.2 1, avenue Dalhia », « 7.U.3 70, avenue des Lilas », « 7.U.4 Vue d'ensemble » and « 7.U.6
    Avenue Claude »; Pointe-Claire, p. 34, « 5.U.2 Le 105 de l'avenue de Windward Crescent »; Lachine,
    p. 40, « 19.U.2 La 53e Avenue » and « 19.U.2 Une maison "Gameroff" typique au 3, 40e avenue ». ©
    Ville de Montréal; not reproduced here. Wikimedia Commons was searched for a freely licensed
    photograph of a postwar bungalow in any of the six places and none was found. The one candidate that
    looked promising by its address — « Quatre-Vents, 12, avenue Dahlia (Dorval) », on the Model Homes
    street itself — was downloaded and inspected and is not a bungalow at all but a two-and-a-half-storey
    stuccoed house with a tiled coping and an arcaded loggia, so it was rejected. The Cité de Dorval's own
    heritage study of that address (LEMAYMICHAUD + Réal Paul architecte, « Expertise historique et étude
    patrimoniale, 12, avenue Dahlia, Dorval ») confirms the rejection and dates the house to 1803, enlarged
    1874–85 in a neo-Gothic manner and wholly remade 1927–37 into the Italianate it wears now — one of the
    first stone houses in the district, standing on the street the bungalows were later built along, and
    not one of them. The same study independently repeats the cahier's figures for the 1951 project - 28
    dwellings, 12 detached and 16 semi-detached bungalows, and two apartment buildings.
