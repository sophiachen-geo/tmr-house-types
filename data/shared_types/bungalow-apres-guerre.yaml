blurb_en: >-
  One storey, hipped roof, brick with artificial stone and clapboard for variety, a carport or a garage,
  a cul-de-sac and mature trees. Built from a short catalogue of models across all six West Island places
  from the late 1940s, and the only twentieth-century housing the 2005 evaluation series took seriously
  enough to invent a category for.
origin_en: >-
  The wave arrives at different moments and for different reasons. At Dorval it is the airport: the
  aerodrome opened in 1941, air traffic grew fast after the war, the rest of the territory was opened to
  subdivision and the population went from under 3,000 in the 1940s to more than 20,000 by 1971. At
  Pointe-Claire it is a straight housing shortage — a veterans' sector on the Wartime Housing Limited
  model about 1947, then the Magil project of 1953–55. At Lachine it is what the cahier calls « l'urbanisation
  massive des années 1950-1970 », running east across the last open ground and producing a catalogue of
  contractors' types so consistent that the dominant one is still known locally by its builder's name. At
  Baie-D'Urfé it is the Métropolitaine and the demographic boom together, pushing settlement north across
  the railway for the first time. What the 2005 cahiers do with all of it is the interesting part. The
  series invented a category, Ensembles urbains d'intérêt, to hold postwar suburbs, said openly that the
  exercise was exploratory, and then valued these places for their street layouts, their planting and the
  consistency of their materials rather than for their architecture — while recording, in the same
  paragraphs, that almost every house had already been raised, extended, re-clad or re-roofed. It is the
  one wave on these six pages that the source treats as heritage-in-progress rather than as heritage.
