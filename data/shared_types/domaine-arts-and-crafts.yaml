  note: House and former stable of the J.L. Todd estate, 1911–13, by Percy Erskine Nobbs and George Taylor
    Hyde, with landscaped grounds and a tea house. Parks Canada spells the owner John Lancelot Todd; the
    Ville de Montréal cahier spells him John-Launcelot-Todd.
- address: 140, chemin de Senneville, Senneville
  municipality: Senneville
  note: Dow house, 1885 — the earliest of the eight houses Parks Canada names as character-defining.
- address: 149–65, chemin de Senneville, Senneville
  municipality: Senneville
  note: J.B. Abbott house, "Hillcote", 1900 and 1920. The Ville de Montréal cahier lists the same house
    at 163 chemin de Senneville as « Maison John-Bethune-Abbott-Hillcote ».
- address: 200, chemin de Senneville, Senneville
  municipality: Senneville
  note: D.F. Angus house, "Chatblanc", 1926.
- address: 216–19, chemin de Senneville, Senneville
  municipality: Senneville
  note: Five ancillary buildings on the R.B. Angus estate, 1895–1903 — Peach House, a small country house,
    the caretaker's house, a greenhouse and a barn. The cahier calls the estate Pine Bluff; Parks Canada
    does not use that name.
- address: 202, chemin de Senneville, Senneville
  municipality: Senneville
  note: Charles Meredith house, "Bally Bawn", Neo-Gothic, dated by Parks Canada 1750, 1864, 1897, 1902
    and 1909, and attributed to the Maxwells.
- address: 240, chemin de Senneville, Senneville
  municipality: Senneville
  note: Harry Abbott house, "Birchfield", Neo-Tudor, 1892, 1899 and 1910, attributed to the Maxwells.
- address: 292, chemin de Senneville, Senneville
  municipality: Senneville
  note: Senator Louis-Joseph Forget house, "Bois-de-la-Roche", Château-style, with its chapel, cowshed
    and other ancillary buildings of 1901–02, attributed to the Maxwells. Parks Canada gives 292; the
    Ville de Montréal cahier gives 290 for « Maison Louis-Joseph-Forget ou Bois-de-la-Roche ». Both numbers
    appear in official documents for the same estate.
- address: 168–70, chemin de Senneville, Senneville
  municipality: Senneville
  note: Abbott/Clouston house, "Bois-Briant", Neo-Gothic, 1860–5 and 1899–1902, with a caretaker's house
    of 1900, an ice house and a dairy of 1899; grounds by Frederick G. Todd working with Frederick Law
    Olmsted, with a pergola and the ruins of a seventeenth-century mill and an eighteenth-century fort.
- address: 264, chemin de Senneville, Senneville
  municipality: Senneville
  note: Frederick Cleveland Morgan house, "Le Bousquet", 1912.
