blurb_en: A dozen country estates on one road, more than 1,400 acres, and at least 82 buildings put up
  between 1860 and 1930 — houses of stone and shingle set far back in wooded grounds, each with its own
  stable, chapel, farm buildings, tea house and gatekeeper's lodge in the same manner, and grounds designed
  to keep the house out of sight from the chemin. The Maxwells built dozens of them; twenty survive.
origin_en: 'Sir John Joseph Caldwell Abbott, mayor of Montréal and later prime minister, bought a Gothic
  revival house at Senneville for a second residence, and the rest of financial Montréal followed him
  — Forget, Angus, Clouston, Morgan, Todd, founders and presidents of the Bank of Montreal and the Canadian
  Pacific among them. Between 1865 and 1930 they turned the old Senneville farms into estates and hired
  one small circle of architects and landscape architects to do it: Edward and William Sutherland Maxwell,
  often with George Cutler Shattuck; Percy Erskine Nobbs with George Taylor Hyde; Robert Findlay; and,
  for the grounds, Frederick G. Todd working with the American Frederick Law Olmsted. Because so few people
  commissioned so few designers over so short a period, the result has, in Parks Canada''s words, "a strong
  formal and stylistic coherence" — which is exactly what makes it legible as a type rather than a collection.
  The 2005 Ville de Montréal cahier, which is not given to superlatives, calls the road one of the most
  picturesque in Montréal and the sector exceptional « non seulement à Montréal, mais au Canada ». Set
  that against the Mille carré doré in Part 11''s other half, which has no ensemble protection at all:
  a country road of eighty-two seasonal houses is a National Historic Site, and the richest domestic architecture
  on the island is not. That asymmetry is the argument of this part, and Senneville is one end of it.'
