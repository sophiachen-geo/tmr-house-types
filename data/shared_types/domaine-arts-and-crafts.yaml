profile:
  siting_landscape:
  - The estate, not the house, is the unit. Parks Canada counts "more than 1400 acres" and "at least 82
    buildings constructed between 1860 and 1930 as part of about a dozen country estates", strung along
    one country road that runs parallel to the lac des Deux-Montagnes.
  - Houses sit far back inside large wooded grounds, most of them backing onto the lake, and the planting
    is arranged so that the house cannot be seen from the chemin de Senneville at all.
  - The designed landscape is part of the building. Winding paths, great gardens, woods, ponds, orchards,
    stone walls, gateways and a gatekeeper's house, either set back from the chemin or visible from it.
  - Four pieces of former estate land are now public and form a greenbelt — the Morgan Arboretum, the
    Braeside golf course of about 1898, the Anse-à-l'Orme nature park and the Bois-de-la-Roche agricultural
    park.
  massing:
  - Rambling rather than composed. Clean volumes and large roofs assembled with more or less complexity,
    two to two and a half storeys, gables and dormers pushed forward off the main slope.
  - Ancillary buildings in the same manner and generally in the same style — staff house, chapel, farm
    buildings, pool house, stable, garage, tea house, cold room, observation tower.
  articulation:
  - Deep sun porches and glazed loggias, ranges of casements set flush in the wall plane, massive stone
    chimney stacks carried well above the ridge.
  openings:
  - Long horizontal bands of small-paned casements; no source gives a proportion.
  materials:
  - Cut stone or rubble, brick, wood, stucco, and cedar shingle on the roofs — the Senneville fiche's
    own list, in that order.
profile_fr:
  description:
  - « De l'autoroute Transcanadienne à la limite de l'ancienne municipalité de Senneville, entre le lac
    des Deux-Montagnes et l'Arboretum Morgan, on trouve une grande concentration de résidences du début
    du XIXe siècle qui, avec la végétation, les éléments de paysage et le tracé du chemin de Senneville
    en font un secteur pittoresque de qualité exceptionnelle non seulement à Montréal, mais au Canada.
    »
  - « Les Forget, Angus, Morgan et Abbot, pour ne mentionner que ceux-là, ont confié la conception de
    leurs résidences à des architectes et des architectes paysagistes de prestige (Maxwell, Findlay, Hyde,
    Nobbs, Olmsted, Todd, Rose). Le bâti y est pour la plupart implanté du côté du lac et éloigné du chemin.
    »
  - « Souvent de style Arts and Crafts ou Shingle Style, les résidences agencent des volumes nets et des
    toitures importantes de façon plus ou moins complexe avec leurs revêtements de pierre taillée ou de
    moellons, brique, bois, stuc et toitures en bardeaux de cèdre. »
  - « Les grandes propriétés comportent généralement des bâtiments ancillaires (résidence du personnel,
    chapelle, bâtiments de ferme, pool house, écurie, garage, maison de thé, chambre froide, tour d'observation,
    etc.), généralement du même style, implantés dans des aménagements raffinés – sentiers sinueux, grands
    jardins, boisés, étangs, vergers, murets de pierre, portails, maison de gardien – en retrait ou visibles
    du chemin de Senneville. »
  - « Bien que la plupart des édifices les plus imposants ont été construits en fonction d'une utilisation
    saisonnière, le secteur comprend aussi des résidences de l'après-guerre et des demeures contemporaines
    qui lui donnent un caractère suburbain mais qui poursuivent la tradition d'intégration du bâti au
    paysage. »
conservation:
- The designation is federal and commemorative. It records the district and its constructed and natural
  features as they stood at the time of designation; it is not a control on private alteration, and Senneville
  has no provincial site patrimonial and no ensemble citation.
- The 2005 cahier's warning has not aged well and is worth keeping in view - « on assiste actuellement
  à un morcellement des lots des grandes propriétés et à la densification rapide du territoire ».
- 'One classed provincial element sits inside the district and is not a house at all: the site of Fort
  Senneville with the Le Ber mill, listed by the cahier at 168 chemin de Senneville as both a classed
  archaeological site and a classed historic site.'
profile_note: 'Unusually well evidenced for the West Island, because a federal designation record exists
  and is detailed; but still not a per-type record, so the five columns are inferred from an estate-level
  description rather than read off a table. Null and why: `window_proportion` and `roof.pitch_deg` — no
  source states either; `lot_width_m`, `setback_front_m`, `setback_side_m`, `front_yard_green_pct` — the
  sources describe deep setbacks and screened approaches in words and never in numbers, and the one measured
  figure that exists is the district''s total area, "more than 1400 acres", which is not a lot width;
  `sectors` — a shared record cannot carry sector codes that exist in only one of its places. `storeys`,
  `roofing`, `garage` and `principal_cladding` come from the Senneville fiche''s own materials list and
  its list of ancillary buildings, checked against the photograph, not from a stated figure. Two corrections
  to Part 11''s brief, both from the primary source. First, the designation year: the brief says Parks
  Canada''s record gives 2001 and that others say 2002, and instructs that 2001 be published. The record
  gives both, in different fields — the metadata line reads "Designation Date: 2002-07-18" while the Heritage
  Value narrative reads "designated a national historic site of Canada in 2001" and cites "Historic Sites
  and Monuments Board of Canada, Minutes, 2001". The two are the Board''s recommendation and the Minister''s
  approval, and both belong in the record; this page follows the source and reports both rather than choosing.
  Second, "Le Sabot", which the brief lists among the named estates, appears in no retrieved source; David
  Shennan is listed by Parks Canada as one of the district''s architects, but no house of that name is
  named by Parks Canada or by the cahier, so it is not carried here. The brief''s other named estates
  all check out, with two address discrepancies noted in `related_buildings`.'
