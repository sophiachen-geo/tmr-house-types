blurb_en: 'The summer house of anglophone Montréal on the western lake shore — free-standing in its own
  grounds, set back and screened from the road, two to two and a half storeys of shingle over rubble stone,
  big loose roofs and a deep arcaded verandah facing the water. The railway of 1855 made it possible;
  sailing, golf and horse racing came with it; and at Dorval speculation on the shore has already taken
  the two largest of them. One record, two municipalities: the photograph on this card is Senneville''s
  Wanklyn house, and Dorval''s maison Beaurivage stands beside it on the type page.'
origin_en: 'From the late nineteenth century the shores of lac Saint-Louis and the lac des Deux-Montagnes
  became the summer address of bourgeois Montréal, and the train is what did it. At Dorval the village
  fed both the summer people and the farmers at once, and the resort came with a whole apparatus — sailing,
  horse racing, golf, a yacht club, a Protestant chapel of fieldstone built for the villégiateurs in 1898.
  Île Dorval, bought in 1853 by Sir George Simpson of the Hudson''s Bay Company for a summer house in
  the woods, was cut into fifty-seven lots in 1911, and about fifteen families were summering there by
  the 1930s; it is still only reachable by boat. At Senneville the same impulse produced something denser
  and grander, a dozen estates along one country road with their houses turned to the lake and hidden
  from the chemin, and Parks Canada designated the whole of it. The two places show the same form at two
  scales, and they show the same erosion: the Senneville fiche records the great lots being cut up and
  the territory densifying, and Dorval''s records speculation on shore land, the disappearance of the
  great properties and new houses of a size that breaks the street. Ashburton of about 1879 is gone. The
  stone manor that J. W. McConnell built after it burned in 1963. What is left of that property is the
  entrance pavilion and one summer house in its gardens.'
