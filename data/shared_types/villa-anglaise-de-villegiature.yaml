profile:
  siting_landscape:
  - Free-standing on a large treed lot between the shore road and the water, set well back from the road
    and, at Senneville, deliberately screened from it — Parks Canada records that the siting and planting
    of most Senneville houses "prevents a view to the buildings from chemin Senneville".
  - At Dorval the belt runs along the chemin du Bord-du-Lac, the old shore road, and out onto the points
    that reach into lac Saint-Louis. Île Dorval was divided into 57 lots for summer houses in 1911 and
    is still reachable only by ferry.
  - Boat clubs, a yacht club, horse racing and golf belong to the same siting. The Dorval cahier treats
    them as part of the phase, not as background.
  massing:
  - Two to two and a half storeys, informal in plan, with the volumes and roofs put together loosely rather
    than symmetrically — the Senneville fiche says the houses « agencent des volumes nets et des toitures
    importantes de façon plus ou moins complexe ».
  - Large roofs carrying dormers, and deep verandahs across the front, often arcaded on heavy rubble piers.
  - Smaller and plainer versions of the same idea line the same shore — the modest one-storey chalets
    and cottages of Dorval's avenue Saint-Charles, avenues Roy and Lepage, boulevard Pine Beach and secteur
    Ouest, many later converted to year-round houses.
  articulation:
  - Wide arched openings under the verandah roof, heavy stone piers, shingled wall planes carried unbroken
    around corners.
  openings:
  - Grouped windows, often in twos and threes, in plain flat casings; no source gives a proportion.
  materials:
  - Wood shingle over the upper walls and the roof; rubble or cut stone below. The Senneville fiche lists
    « revêtements de pierre taillée ou de moellons, brique, bois, stuc et toitures en bardeaux de cèdre
    ».
  - Fieldstone alone where the building is earlier or plainer — Dorval's chapelle St. Mark of 1898, built
    « en pierre des champs » for the Protestant summer people, and the stone manor Alfred Brown called
    Bel-Air.
profile_fr:
  description:
  - « Souvent de style Arts and Crafts ou Shingle Style, les résidences agencent des volumes nets et des
    toitures importantes de façon plus ou moins complexe avec leurs revêtements de pierre taillée ou de
    moellons, brique, bois, stuc et toitures en bardeaux de cèdre qui témoignent « … [of a] sophisticated
    nostalgia for a rustic way of life and for the rural craft industry » (Friedman, 2000). »
  - « Le bâti y est pour la plupart implanté du côté du lac et éloigné du chemin. »
  contexte:
  - « À la fin du XIXe siècle, les rives du lac Saint-Louis dans l'ouest de l'île de Montréal deviennent
    des lieux de villégiature attrayants pour la société bourgeoise montréalaise. Le village de Dorval
    dessert les estivants et les agriculteurs qui s'y côtoient. » (§ 2)
  - « La seconde phase de développement du territoire se concrétise avec la formation du village et le
    développement en parallèle de la villégiature et des activités telles que la voile, les courses de
    chevaux et le golf, sous l'impulsion de l'arrivée du train qui permet une plus grande mobilité entre
    le centre-ville et la banlieue. » (§ 3.1)
  - « … il ne reste plus rien de l'opulente résidence d'été appelée Ashburton, construite dans les années
    1879, ni de la maison bâtie par la suite par l'industriel John Wilson McConnell, un magnifique manoir
    de pierre qui a été détruit par un incendie en 1963. Par contre, il subsiste le pavillon d'entrée
    et une résidence d'été entourée de magnifiques jardins. » (7.E.4)
  - « Autrefois connue sous le nom de « Bel-Air », nom donné par l'architecte Alfred Brown à son manoir
    de pierre de style anglais, cette propriété a été vendue après son décès à un club privé prestigieux
    (le Forest and Stream Club), qui l'occupe toujours. » (7.E.5)
  - « L'île n'est accessible que par traversier, ce qui a sans aucun doute contribué à préserver son caractère
    bucolique évocateur des années 1920-1940, période où la majorité des chalets se sont construits. »
    (7.E.6)
conservation:
- Senneville's villas fall inside a National Historic Site, which is a federal commemorative designation
  and not a control on private alteration. Dorval's have no ensemble instrument of any kind.
- Both cahiers name attrition as the live risk. Dorval's says speculation on shore land and the disappearance
  of the great properties or of their lot patterns is a problem to be reckoned with, and that speculation
  on old houses and their lots for large new houses works against the village character. The Senneville
  fiche records « un morcellement des lots des grandes propriétés et à la densification rapide du territoire
  ».
- Two of the named Dorval villas are already gone — Ashburton, built about 1879, and the McConnell stone
  manor that replaced it, burned in 1963.
profile_note: 'The West Island has no per-type typology document, so this record is assembled from sector
  paragraphs in two of the twenty-seven 2005 Ville de Montréal évaluation cahiers, plus the federal designation
  record for Senneville. Fields left null and why: `window_proportion` — neither cahier nor Parks Canada
  describes a window proportion anywhere in either place; `roof.pitch_deg` — no source gives a pitch;
  `lot_width_m`, `setback_front_m`, `setback_side_m`, `front_yard_green_pct` — no source measures a lot
  or a setback in the West Island, and although both sources insist on deep setbacks in words ("set well
  back from the road", « éloigné du chemin »), a word is not a number; `sectors` — a shared record cannot
  carry sector codes that exist in only one of its places. `garage: detached` is entered from the Senneville
  fiche''s list of ancillary buildings, which includes a garage, and is weak for Dorval, where no source
  mentions one. `storeys` is read off the photographs and off the phrase « volumes nets et toitures importantes
  », not off a stated figure. On styles, this record departs from the Part 11 brief: the brief specifies
  `[queen-anne, shingle-style]`, and `shingle-style` is well attested — Parks Canada names "the Shingle-style,
  E.M. Angus house, ''Wanklyn''", and the Senneville fiche says « souvent de style Arts and Crafts ou
  Shingle Style » — but no retrieved source names Queen Anne anywhere in Dorval or Senneville, so `queen-anne`
  is dropped rather than asserted, and `arts-and-crafts` is carried in its place because both the Senneville
  fiche and the Lachine cahier, for the same villégiature belt, name it explicitly. The styles Parks Canada
  does name at Senneville besides Shingle — Neo-Gothic, Neo-Tudor and Château — have no id in this project''s
  `styles.yaml` and are therefore recorded in prose only.'
