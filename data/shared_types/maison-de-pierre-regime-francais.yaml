blurb_en: 'A low fieldstone box of one and a half storeys under a steep two-slope roof, stacks rising
  inside the gable walls, openings placed where they were wanted rather than where symmetry asked for
  them. Three of them survive across three of the six West Island places — a trading post of 1669–71 at
  Lachine, a farm house of about 1700 at Baie-D''Urfé, and one of 1769–91 at Pointe-Claire — and all three
  are protected individually while nothing around them is. One record, three municipalities: the photograph
  on this card is Lachine''s, and Baie-D''Urfé''s and Pointe-Claire''s stand beside it on the type page.'
origin_en: 'The Sulpicians became seigneurs of the island of Montréal in 1663 and conceded the côtes that
  run out to its western end; the houses built on those concessions were stone because stone was what
  the fields gave up and because fire and raiding made anything else a poor bet. What survives is very
  little. Lachine''s is the oldest and least altered: two rectangular stone buildings put up in 1669–71
  as a fur-trade post for Charles Le Moyne and Jacques Le Ber, restored in the 1980s toward their seventeenth-century
  appearance and now the Musée de Lachine. Baie-D''Urfé''s was built about 1700 by Hubert Rangé dit Laviolette
  on a concession he bought in 1695, and then quietly rebuilt by the Pilon family between 1839 and 1874
  — the walls raised, the roof pitch eased off, moulded chambranles and projecting eaves added in what
  RPCQ calls a taste imported after the Conquest. Pointe-Claire''s went up between 1769 and 1791 on a
  censive conceded in 1722, and was altered again in 1828. Read together the three make the point the
  West Island pages keep making: the form is one form across three municipalities, the protection is three
  separate individual instruments granted in 1964, 2001 and 2001, and not one of them protects an ensemble.'
