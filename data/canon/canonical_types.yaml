- id: plex-family
  name_en: Plex — the Montréal family of two to six stacked dwellings on a narrow lot
  definition_en: 'Montréal''s defining housing family: two to six dwellings stacked on a narrow lot, each
    with its own front door, under a flat roof. The Sud-Ouest typo-morphological study defines the family
    in one line — « Ces immeubles possèdent de deux à six logements » — and the members differ by dwelling
    count, by whether the stair to the upper doors is inside or outside, and by whether the ground floor is
    raised.'
