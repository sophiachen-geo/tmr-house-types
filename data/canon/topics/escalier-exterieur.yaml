id: escalier-exterieur
title: L'escalier extérieur — the outside stair
kicker: Topic — one element, one explanation
lede: >-
  The stair climbing the front of a Montréal plex is the most recognisable thing about the city's
  housing, and almost everything commonly said about why it exists is wrong. It is not thrift, not
  climate, and not a fire regulation. It is a <strong>by-product of a setback rule</strong>: once
  buildings had to stand back from the street, the stair that used to be inside moved out into the
  space the rule created. This page holds the explanation once, so that every plex type record can
  point at it — and holds, equally, the one date this site refuses to publish.

blocks:
  - heading: The mechanism, in the study's own words
    paragraphs:
      - >-
        Patri-Arch's <em>Étude typomorphologique de l'arrondissement du Sud-Ouest</em> (2005, updated
        October 2013) states the causal chain in a single sentence, in its synthesis of the 1875–1945
        period of municipal infrastructure. Construction regulation begins in Montréal around 1880; it
        produces a new mode of subdivision, with simple lanes, then I-shaped, then H-shaped ones, giving
        blocks a regular parcellation. And then:
    quote: >-
      De plus, l'obligation de l'implantation avec une marge de recul avant amènera la translation de
      l'escalier d'accès aux logements des étages supérieurs vers l'extérieur, ce qui donnera la
      caractéristique si typique des bâtiments des quartiers montréalais de cette époque.
    list:
      - >-
        The rule is about <strong>implantation</strong>, not about stairs. A compulsory front setback took
        buildable depth off a lot that was already narrow. Moving the stair to the upper dwellings outside
        recovered that depth as interior floor area, in a strip of ground the by-law had just made
        unbuildable anyway.
      - >-
        The second gain is thermal and it follows from the first: no interior stair means <strong>no
        shared hall to heat</strong>, and no shared hall means each dwelling keeps its full plan. This is
        the consequence, not the cause. The popular explanation reverses them.
      - >-
        The exterior stair is therefore inseparable from the front setback and from the plex plan. Where
        the setback was not required — the older faubourg fabric built flush to the street — the stair
        stayed inside.

  - heading: The sequence
    paragraphs:
      - >-
        The same study dates the transition and the types that carry it. The older practice did not stop
        at once: <em>« La construction des lotissements sans ruelle ainsi que des bâtiments implantés sans
        marge de recul ne sera abandonnée que vers la fin des années 1880. »</em> So the early years of the
        period still produce three-storey duplexes (type 2.4) and duplexes and triplexes with
        <em>interior</em> stairs (types 2.1 and 2.5) — the exterior stair is not yet available, because the
        setback that creates it is not yet general.
      - >-
        Then, verbatim: <em>« Le triplex avec escalier extérieur (type architectural 2.6) fait son
        apparition principalement à partir de 1900. Il sera accompagné peu après de plusieurs variantes :
        la première est un duplex avec escalier extérieur (type architectural 2.2) et la deuxième un
        bâtiment de 3 étages mais à plus de 3 logements ou multiplex (type architectural 2.7). »</em> The
        triplex comes first and the duplex is derived from it — the reverse of the order one would guess
        from dwelling counts.
    table:
      columns: [Step, Date, What happens]
      rows:
        - ["Construction regulation begins", "c. 1880", "Patri-Arch: <em>« les efforts de réglementation de la construction résidentielle qui débutent à Montréal vers 1880 »</em>. Lanes appear, simple then in <em>I</em>, then in <em>H</em>; blocks get a regular parcellation."]
        - ["Old practice abandoned", "late 1880s", "Subdivision without a lane, and building without a front setback, <em>« ne sera abandonnée que vers la fin des années 1880 »</em>. Until then the interior-stair types dominate."]
        - ["The archetype appears", "from 1900", "<a href=\"../../canonical/triplex-exterior-stair/\">Triplex with exterior stair</a>, Sud-Ouest type 2.6 — <em>« fait son apparition principalement à partir de 1900 »</em>, and <em>« le type architectural de base du tissu urbain »</em> of the four-sided block with an H-lane."]
        - ["Variants follow", "shortly after", "<a href=\"../../canonical/duplex-exterior-stair/\">Duplex with exterior stair</a> (2.2), then the <a href=\"../../canonical/multiplex-4-6/\">multiplex</a> (2.7) — three storeys, more than three dwellings."]
        - ["Prohibited", "1940", "New exterior stairs prohibited. See the next section: the prohibition is well attested, its repeal is not."]
        - ["Built again", "today", "Permitted under the Code de construction du Québec, with a two-dwellings-per-storey ceiling. See the last section."]

  - heading: Prohibited 1940 — and no repeal year is published here
    paragraphs:
      - >-
        This site encodes <code>prohibited: 1940</code> and <code>repealed: null</code>, and the null is
        deliberate. The prohibition of new exterior stairs around 1940 is repeated consistently. The date
        it ended is not: three different years circulate, in three different secondary sources,
        <strong>none of them municipal</strong>, and none citing a by-law number. Publishing any one of
        them would manufacture a precision the record does not have.
      - >-
        A fourth chronology complicates even the 1940 date, and is recorded here rather than suppressed:
        the same source that gives 1980 also dates the prohibition differently, to by-laws adopted
        <em>« quartier par quartier, à partir de décembre 1935 »</em> with a city-wide ban
        <em>« en 1955 »</em>. That is a different account of both ends of the story from a single
        secondary source, and it is why the 1940 date is carried here as the conventional one rather than
        as a verified one.
    table:
      columns: [Claim, Where it comes from, Status]
      rows:
        - ["Repealed <strong>1970</strong>", "Reported in the research memo behind this part. No source for it could be located on this pass — no publication, no by-law, no archival reference.", "<strong>Unsourced.</strong> Recorded so that a later pass does not rediscover it as if it were new."]
        - ["Repealed <strong>1980</strong>", "Maudits Français, « Pourquoi certaines habitations ont des escaliers extérieurs à Montréal ? », Daisy Le Corre, 23 January 2018 — <em>« Cette restriction ne sera levée qu'en 1980 »</em>. The page credits the <em>Dictionnaire historique du Plateau Mont-Royal</em> for its historical material, and gives the December 1935 / 1955 prohibition chronology.", "Secondary, non-municipal. No by-law named."]
        - ["Repealed <strong>1994</strong>", "Pierre Bellerose (Tourisme Montréal), « Les escaliers de Montréal : une histoire fascinante et un symbole identitaire », HuffPost Québec, 21 April 2016 — <em>« Depuis 1994, il est possible de construire à nouveau des escaliers extérieurs dans les rues où il en existe déjà »</em>, to preserve neighbourhood character.", "Secondary, non-municipal. Note that this is a narrower claim than a repeal: permission only on streets that already have them."]
    list:
      - >-
        The 1994 claim and the 1980 claim are not necessarily rivals — a general lifting and a later,
        conditional re-permission could both be true, in that order. But nothing found on this pass
        establishes either.
      - >-
        <strong>Next step, for Part 10b:</strong> find the primary instrument. The 1940 prohibition and
        its repealing by-law should both be in the Ville's règlements archive, and one sourced date should
        replace all three claims above. Because the prohibition appears to have been enacted by
        <em>quartier</em> rather than city-wide, there may be no single instrument to find, which would
        itself explain why the secondary accounts disagree.

  - heading: Why they are being built again
    paragraphs:
      - >-
        The exterior stair is not merely tolerated today; it is expressly provided for, and the provision
        is shaped to exactly the building this page is about. Article 9.8.5.1 of the Code de construction
        du Québec, chapitre I – Bâtiment, permits a turning or helical stair to serve as a dwelling's
        <em>issue</em> on four conditions, one of which is a ceiling on how many dwellings it may serve:
    quote: >-
      Un escalier tournant ou hélicoïdal peut servir d'issue à un logement si : le logement a un autre
      moyen d'évacuation ; l'escalier ne dessert pas plus que 2 logements par étage ; l'escalier a une
      largeur libre entre 760 mm et 860 mm ; comporte des girons égaux d'au moins 225 mm lorsque mesurés à
      500 mm de l'extrémité la plus étroite ; et a une rotation dans un seul sens entre les 2 étages.
    list:
      - >-
        <strong>Two dwellings per storey</strong> is the hinge. It is the plex's own dimension: a duplex or
        triplex on a narrow lot puts one or two doors on each level, and the curved stair that reaches
        them is inside the rule. A larger building is not.
      - >-
        Article 9.8.3.1, which sets riser, tread and run dimensions, classes
        <em>« les escaliers extérieurs ne desservant qu'un seul logement »</em> with interior dwelling
        stairs as <em>privé</em> — the more permissive of the three dimension sets — rather than as public
        stairs. The Code treats the outside stair of a small house as a domestic stair that happens to be
        outdoors.
      - >-
        The Ville's current permit guidance (montreal.ca, <em>Construire ou remplacer un escalier
        extérieur</em>, updated 3 February 2026) is consistent with this and adds the municipal layer: a
        permit is required to build, alter or replace an exterior stair; it must generally stand at least
        1.2 m from a property line; and <em>« des matériaux non combustibles peuvent être requis dans un
        bâtiment de plus de 2 logements »</em> — the same two-dwelling threshold, from the other
        direction.
      - >-
        <strong>Verification note.</strong> The research memo behind this part cited these provisions as
        <em>arts. 29.2 / 9.8.3.1</em>. Article 9.8.3.1 is right. The substantive rule about curved stairs
        and the two-dwelling ceiling is at <strong>9.8.5.1(2)</strong>, quoted above from the Régie du
        bâtiment du Québec's own presentation of the chapter; no article numbered 29.2 carrying this rule
        could be confirmed, and it is not cited here.

  - heading: Which types this explains
    paragraphs:
      - >-
        Every type record on this site whose form depends on the outside stair should point here rather
        than repeat the argument. The distinction the stair draws is also what separates the plex family
        from what comes after it: once a building has one shared hall serving six to twelve dwellings
        instead of a door per dwelling, the stair goes back inside and the type changes name.
    list:
      - <a href="../../canonical/plex-family/">Plex family</a> — the group, two to six stacked dwellings on a narrow lot.
      - <a href="../../canonical/triplex-exterior-stair/">Triplex with exterior stair</a> — Sud-Ouest 2.6, the archetype, from 1900.
      - <a href="../../canonical/duplex-exterior-stair/">Duplex with exterior stair</a> — Sud-Ouest 2.2, derived from the triplex.
      - <a href="../../canonical/multiplex-4-6/">Multiplex of four to six dwellings</a> — Sud-Ouest 2.7.
      - >-
        <a href="../../canonical/duplex-interior-stair/">Duplex</a> and
        <a href="../../canonical/triplex-interior-stair/">triplex with interior stair</a> — Sud-Ouest 2.1
        and 2.5, the pre-setback forms, and the control case: same dwelling counts, no setback, stair
        stays in.
      - >-
        <a href="../../canonical/greystone-triplex-exterior-stair/">Greystone triplex with exterior
        stair</a> — the same arrangement in Montréal greystone.
      - >-
        <a href="../../canonical/apartment-house-common-hall/">Maison d'appartements / conciergerie</a> —
        where it stops, and why: <em>« un hall d'entrée commun qui dessert de six à douze logements »</em>.
