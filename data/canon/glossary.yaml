# Glossary, v0 (Part 1 seed). Terms drawn from the TMR pages; grows with later parts.
- term: articulation
  term_fr: découpage
  definition_en: The by-law's word for how a façade is broken into base, body and crown, and how volumes are read against each other.
- term: larmier
  term_fr: larmier
  definition_en: The flared drip edge of a Québec roof, extended so its overhang shelters the front door; typical of the maison canadienne.
- term: chamois
  term_fr: chamois
  definition_en: Buff-coloured clay brick, characteristic of postwar bungalows and cottages.
- term: cottage
  term_fr: cottage
  definition_en: >-
    Three different things on this site, and the OQLF's is only one of them. In Québec French generally,
    and in the OQLF's definition, a cottage is any two-storey detached house as opposed to the one-storey
    bungalow. Ville de Québec's thésaurus uses the word twice and means neither of those: the
    cottage Regency (tid 205) is a low hipped-roofed villégiature house whose eaves cover a
    veranda, and the cottage vernaculaire industriel (tid 505) is the standard workers' house of
    the industrial era. Saint-Lambert's King Cottage is a fourth thing again, named for its street.
- term: marquise
  term_fr: marquise
  definition_en: A flat canopy over an entrance door, without posts; standard on postwar cottages and modernist apartment blocks.
- term: faubourg
  term_fr: faubourg
  definition_en: One of a city's nineteenth-century inner suburbs, outside the old walls or the old core; by extension, the plain housing vernacular that grew there.
- term: maison de faubourg
  term_fr: maison de faubourg
  definition_en: >-
    One phrase, three distinct objects, all now on this site. Ville de Québec's maison de faubourg
    (thésaurus tid 303) is a rudimentary house of one to one and a half storeys under a steep two-slope
    roof, with three openings on the front and the door at one end — and its flat-roofed successor
    (tid 501) is a party-wall building of flats filling the lot. Le Plateau-Mont-Royal's faubourg
    family is Montréal's brick vernacular of the same century, on a different plan. Mount Royal's
    maison faubourienne is a 1940s by-law type that quotes that vernacular in a garden suburb,
    two generations later. Read the canonical form, not the phrase.
- term: PIIA
  term_fr: plan d'implantation et d'intégration architecturale
  definition_en: A discretionary site-planning and architectural-integration programme under Québec's planning act (LAU ss. 145.15–145.20.1); it judges a project's appearance and integration, not whether it is warranted.
# ---- Parts 7-8 additions ----
- term: plex
  term_fr: plex
  definition_en: >-
    Superposed dwellings under one roof, each with its own entrance. Montréal's plex is defined by the
    exterior stair climbing to the upper door and by a ground floor raised above the street; Québec
    City's (thésaurus tid 503) allows the stair to be interior and does not require the raised ground
    floor. Outremont's duplexes are paired side to side rather than stacked with a stair. Same word,
    three arrangements — the canonical form plex-superposed-units holds what they share.
- term: courant
  term_fr: courant architectural
  definition_en: >-
    A municipality's own word for a category of building. Ville de Québec says courant and puts
    its types under nine of them; Ville de Lévis says style for objects at the same level; Ville
    de Gatineau says type architectural. On this site the shared vocabulary is deliberately split
    in two — canonical form for the shape of the building, style for the idiom it is
    dressed in — and each place's native word is recorded in its typology document's format field.
- term: unité de paysage
  term_fr: unité de paysage
  definition_en: >-
    A landscape unit: a stretch of territory read as one coherent piece for planning purposes, by its
    street pattern, topography, setbacks, planting and building character together, rather than by
    building type. Outremont's 2020 study cuts the borough into four aires and twenty-nine of
    them; the Vieux-Terrebonne declaration of 2026 uses four.
- term: prise d'effet
  term_fr: prise d'effet
  definition_en: >-
    The date a Québec heritage protection begins to bite, which is the date of the minister's notice of
    intent — not the date of the decree that follows it. Vieux-Terrebonne was declared on 20 May 2026
    with effect from 2 July 2025; that is the statute working normally, not a clerical error.
- term: site patrimonial déclaré
  term_fr: site patrimonial déclaré
  definition_en: >-
    Territory protected by the government of Québec under the Loi sur le patrimoine culturel — the
    strongest area-based status in the province, and distinct from a site patrimonial cité,
    which a municipality declares over its own territory. Québec City has four declared sites; Gatineau
    has cited ones; Lévis has neither over its historic cores.
