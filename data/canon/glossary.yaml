# Glossary, v0 (Part 1 seed). Terms drawn from the TMR pages; grows with later parts.
- term: articulation
  term_fr: découpage
  definition_en: The by-law's word for how a façade is broken into base, body and crown, and how volumes are read against each other.
- term: larmier
  term_fr: larmier
  definition_en: The flared drip edge of a Québec roof, extended so its overhang shelters the front door; typical of the maison canadienne.
- term: chamois
  term_fr: chamois
  definition_en: Buff-coloured clay brick, characteristic of postwar bungalows and cottages.
- term: cottage
  term_fr: cottage
  definition_en: >-
    Three different things on this site, and the OQLF's is only one of them. In Québec French generally,
    and in the OQLF's definition, a cottage is any two-storey detached house as opposed to the one-storey
    bungalow. Ville de Québec's thésaurus uses the word twice and means neither of those: the
    cottage Regency (tid 205) is a low hipped-roofed villégiature house whose eaves cover a
    veranda, and the cottage vernaculaire industriel (tid 505) is the standard workers' house of
    the industrial era. Saint-Lambert's King Cottage is a fourth thing again, named for its street.
- term: marquise
  term_fr: marquise
  definition_en: A flat canopy over an entrance door, without posts; standard on postwar cottages and modernist apartment blocks.
- term: faubourg
  term_fr: faubourg
  definition_en: One of a city's nineteenth-century inner suburbs, outside the old walls or the old core; by extension, the plain housing vernacular that grew there.
- term: maison de faubourg
  term_fr: maison de faubourg
  definition_en: >-
    One phrase, three distinct objects, all now on this site. Ville de Québec's maison de faubourg
    (thésaurus tid 303) is a rudimentary house of one to one and a half storeys under a steep two-slope
    roof, with three openings on the front and the door at one end — and its flat-roofed successor
    (tid 501) is a party-wall building of flats filling the lot. Le Plateau-Mont-Royal's faubourg
    family is Montréal's brick vernacular of the same century, on a different plan. Mount Royal's
    maison faubourienne is a 1940s by-law type that quotes that vernacular in a garden suburb,
    two generations later. Read the canonical form, not the phrase.
- term: PIIA
  term_fr: plan d'implantation et d'intégration architecturale
  definition_en: A discretionary site-planning and architectural-integration programme under Québec's planning act (LAU ss. 145.15–145.20.1); it judges a project's appearance and integration, not whether it is warranted.
# ---- Parts 7-8 additions ----
- term: plex
  term_fr: plex
  definition_en: >-
    Superposed dwellings under one roof, each with its own street entrance. The exterior stair is the
    popular image of the Montréal plex but it is not the definition: the Sud-Ouest typology defines its
    family 2 by dwelling count alone — « Ces immeubles possèdent de deux à six logements » — and files
    the interior-stair duplex (2.1) and interior-stair triplex (2.5) in that family beside the
    exterior-stair ones. Québec City's (thésaurus tid 503) likewise allows an interior stair and does
    not require the raised ground floor. Outremont's duplexes are paired side to side rather than
    stacked with a stair. Villeray–Saint-Michel–Parc-Extension stretches the word furthest, filing its
    one-storey single-family shoebox under the plex heading. Same word, several arrangements — the
    canonical group plex-family holds what they share, and plex-superposed-units is an alias of it.
- term: courant
  term_fr: courant architectural
  definition_en: >-
    A municipality's own word for a category of building. Ville de Québec says courant and puts
    its types under nine of them; Ville de Lévis says style for objects at the same level; Ville
    de Gatineau says type architectural. On this site the shared vocabulary is deliberately split
    in two — canonical form for the shape of the building, style for the idiom it is
    dressed in — and each place's native word is recorded in its typology document's format field.
- term: unité de paysage
  term_fr: unité de paysage
  definition_en: >-
    A landscape unit: a stretch of territory read as one coherent piece for planning purposes, by its
    street pattern, topography, setbacks, planting and building character together, rather than by
    building type. Outremont's 2020 study cuts the borough into four aires and twenty-nine of
    them; the Vieux-Terrebonne declaration of 2026 uses four.
- term: prise d'effet
  term_fr: prise d'effet
  definition_en: >-
    The date a Québec heritage protection begins to bite, which is the date of the minister's notice of
    intent — not the date of the decree that follows it. Vieux-Terrebonne was declared on 20 May 2026
    with effect from 2 July 2025; that is the statute working normally, not a clerical error.
- term: site patrimonial déclaré
  term_fr: site patrimonial déclaré
  definition_en: >-
    Territory protected by the government of Québec under the Loi sur le patrimoine culturel — the
    strongest area-based status in the province, and distinct from a site patrimonial cité,
    which a municipality declares over its own territory. Québec City has four declared sites; Gatineau
    has cited ones; Lévis has neither over its historic cores.
# ---- Part 10 additions (Montréal) ----
- term: shoebox
  term_fr: maison de type « shoebox »
  definition_en: >-
    A one-storey, flat-roofed, small urban house on a rectangular plan set end-on to the street, its
    door at the centre of the façade between two symmetrical windows, usually in brick with a cornice
    or parapet as its crown, and often a front galerie under a marquise. The name is about the box, not
    the shoe: Villeray–Saint-Michel–Parc-Extension's 2019 guide says the appellation refers to a
    rectangular volume evoking a shoebox. Two things make it unlike anything else on this site. It was
    built to be built on: the flat roof is there « pour permettre de futures expansions
    architecturales », so the finished house is the first storey of an unfinished one. And the earliest
    generations were self-built — « des constructions modestes réalisées à faible coût par leurs
    propriétaires à partir des matériaux disponibles » — which no other type here can claim. It appears
    at the start of the twentieth century and is built in phases down to the 1960s. Rosemont–La
    Petite-Patrie treats it as one type; Villeray–Saint-Michel–Parc-Extension splits it in two, an
    early-twentieth-century shoebox and a mid-century one that borrows bungalow traits. That is a real
    typological disagreement between two boroughs of one city, not a difference of wording.
- term: uniplex
  term_fr: uniplex
  definition_en: >-
    A coined name for the single-dwelling members of the plex family — a plex-shaped building with one
    dwelling in it, sometimes with a second in the basement. It is not standard Québec usage: the
    conventional series starts at duplex for two dwellings, and a one-dwelling building is an
    habitation unifamiliale. It is recorded here because the research behind this part reports
    Villeray–Saint-Michel–Parc-Extension proposing it for its shoebox family, and because the site's
    canonical id for that form carries it. Treat it as a proposal, not as a term of art: the borough's
    own published typology, règlement 01-283-124, Annexe F, files these buildings under 1.0 Maisons
    unifamiliales and does not use the word.
- term: maison de ville
  term_fr: maison de ville
  definition_en: >-
    A false friend, and one of the sharpest on this site. The English town house is an old party-wall
    house on a narrow deep lot in a dense street — what Québec sources would call a maison en rangée or
    a maison urbaine. The Sud-Ouest's maison de ville, type 1.5 of the Patri-Arch typo-morphological
    study, is almost its opposite: a two-storey single-family house under a pitched gable or hipped
    roof, semi-detached or attached, built from the 1960s and 1970s onward out of redevelopment
    projects in La Petite-Bourgogne and under Opération 20 000 logements. It sits behind a front
    setback of five to eight metres with hedges, trees and a parking space, often has an internal
    garage reached by a ramp, wears asphalt shingle, and has a sober façade with almost no ornament.
    The study says plainly that these ensembles are « en rupture avec les développements urbains
    traditionnels ». So the phrase names a suburban product inserted into an old fabric, not the old
    fabric itself. Read the type number, not the words.
- term: Verdun
  term_fr: Verdun
  definition_en: >-
    A disambiguation rather than a building term, and worth one line because the two are easy to
    collide in a search. Verdun here is the Montréal borough — a separate city from 1907 to 2002,
    third-largest in Québec in the 1920s — whose heritage sectors are coded 21.E.n in the Ville de
    Montréal's Évaluation du patrimoine urbain. Verdun in the Meuse, in France, is a different place
    with a heritage instrument of its own: a site patrimonial remarquable classed by arrêté of 13
    April 2022. Nothing on this site refers to the French commune.
